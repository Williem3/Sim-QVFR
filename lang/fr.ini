en = In Two-loop the focus density ({density}) follows from Periphery resolution and the focus size. Focus density, sharpening and object detail are set in Quad View Foveated Rendering.
fr = En Two-loop, la densité de focus ({density}) découle de la Résolution de la périphérie et de la taille du focus. Densité de focus, netteté et détail des objets se règlent en Quad View Foveated Rendering.
en = Quad View Foveated Rendering
fr = Quad View Foveated Rendering
en = Percent of the headset’s {width} × {height} per eye; the periphery and the focus are set apart.
fr = Pourcentage des {width} × {height} par œil du casque ; périphérie et focus se règlent séparément.
en = Percent of the headset’s resolution; pixel sizes appear after the first launch.
fr = Pourcentage de la résolution du casque ; les tailles en pixels apparaissent après le premier lancement.
en = Changes apply while you drive, inside the game’s own render size: the focus and the periphery share it, so a large focus at a high Focus density leaves less room for the periphery.
fr = Les changements s’appliquent en roulant, dans la taille de rendu du jeu : focus et périphérie se la partagent, donc un grand focus à forte Densité de focus laisse moins de place à la périphérie.
en = This launch allows up to Periphery resolution {periphery} and Focus density {density} at this focus size. Higher applies at the next launch.
fr = Ce lancement permet jusqu’à {periphery} en Résolution de la périphérie et {density} en Densité de focus à cette taille de focus. Au-delà, cela s’applique au prochain lancement.
en = Live changes go down from what you launch with, and back up to it: launch with your highest settings, then lower them in the headset.
fr = Les changements en direct descendent depuis vos réglages de lancement, et remontent jusqu’à eux : lancez avec vos réglages les plus hauts, puis baissez-les dans le casque.
en = In the headset, Auto-fit to headset rate sets these and the focus size to fill your GPU’s frame budget while you drive (Right starts it, Left undoes it).
fr = Dans le casque, « Ajuster à la fréquence du casque » règle ceux-ci et la taille du focus pour remplir le budget d’image de votre GPU en roulant (Droite le lance, Gauche l’annule).
