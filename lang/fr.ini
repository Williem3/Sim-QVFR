en = With the runtime composing the views (Pimax, Varjo), the focus area shows only inside its own focus region; past it, the outer resolution shows. Make the runtime's focus area larger (Pimax Play, Varjo Base), or Sim-QVFR's no larger than it, in Resolution.
fr = Quand le runtime compose les vues (Pimax, Varjo), la zone de focus n’apparaît que dans sa propre région de focus ; au-delà, c’est la résolution extérieure. Agrandissez la zone de focus du runtime (Pimax Play, Varjo Base), ou réduisez celle de Sim-QVFR à sa taille, dans Résolution.
