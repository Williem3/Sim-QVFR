; src/launcher/ui/help.cpp
en = Rendering method
fr = Méthode de rendu
en = Quad View Foveated Rendering draws the outer and focus views in one game frame: the lightest on the CPU, and the one with every feature. Two-loop (legacy) draws two whole game frames per headset frame: about twice the CPU work per frame, and no frame generation.
fr = Quad View Foveated Rendering dessine les vues extérieures et de focus en une seule image du jeu : la plus légère pour le CPU, et celle qui a toutes les fonctions. Two-loop (ancienne méthode) dessine deux images complètes du jeu par image du casque : environ deux fois plus de travail CPU par image, et pas de génération d’images.
en = Foveated mode
fr = Mode fovéal
en = Eye tracked: the sharp area follows your eyes, so it can be small and dense; it needs a headset with eye tracking. Fixed: the area stays in the centre, so make it larger, since your eyes move off it.
fr = Suivi des yeux : la zone nette suit vos yeux, elle peut donc être petite et dense ; il faut un casque avec suivi oculaire. Fixe : la zone reste au centre, agrandissez-la donc, car vos yeux en sortent.
en = Periphery resolution
fr = Résolution de la périphérie
en = The wide view around the focus area, a share of the headset’s recommended resolution. It covers most of the view but you see it with your side vision, so it is the first to lower: it saves GPU time and VRAM roughly with its pixels. The preview’s Pixels per frame shows the total.
fr = La vue large autour de la zone de focus, en part de la résolution recommandée du casque. Elle couvre l’essentiel de la vue mais vous la voyez en vision latérale : c’est la première à baisser. Elle économise du temps GPU et de la VRAM à peu près en proportion de ses pixels. Pixels par image dans l’aperçu montre le total.
en = Focus density
fr = Densité de focus
en = Pixel density inside the focus area, a share of the headset’s native density. Above 100% it renders more pixels than the headset shows where you look: sharper text and edges. Its cost grows with the area’s size, so a small area can take a high density cheaply. Dragging moves it in 5% steps; the arrow keys move it by 1%.
fr = Densité de pixels dans la zone de focus, en part de la densité native du casque. Au-delà de 100 %, elle rend plus de pixels que le casque n’en affiche là où vous regardez : texte et bords plus nets. Son coût croît avec la taille de la zone : une petite zone peut prendre une forte densité à peu de frais. Le glisser la déplace par pas de 5 % ; les flèches, de 1 %.
en = Object detail
fr = Détail des objets
en = How detailed trees and objects are, and how far away they are still drawn. At 100% they are as sharp in the focus region as its pixel density shows them; lower settings move toward the game’s own detail for the periphery resolution. It costs CPU, not GPU: more detail means more objects for X-Plane’s main thread to prepare every frame, often what limits the frame rate with QVFR. Lower it if frames stutter in dense scenery; the focus region shows coarser trees.
fr = Le niveau de détail des arbres et objets, et jusqu’à quelle distance ils sont dessinés. À 100 %, ils sont aussi nets dans la région de focus que sa densité de pixels le permet ; plus bas, on se rapproche du détail du jeu pour la résolution de la périphérie. Cela coûte du CPU, pas du GPU : plus de détail, c’est plus d’objets à préparer à chaque image pour le thread principal d’X-Plane, souvent ce qui limite la fréquence d’images avec QVFR. Baissez-le si les images saccadent dans les décors denses ; la région de focus montre alors des arbres plus grossiers.
en = For a player who sees with one eye. The eye you choose shows black in the headset, and the game draws no focus view for it, renders only a few pixels of its scene and skips DLSS on it, so the GPU does much less. The game still prepares that eye’s frame, so the CPU saves little. With both eyes seeing, a black eye is uncomfortable: leave it at None.
fr = Pour un joueur qui voit d’un seul œil. L’œil choisi s’affiche en noir dans le casque, et le jeu ne dessine pas de vue de focus pour lui, n’en rend que quelques pixels et saute le DLSS : le GPU travaille beaucoup moins. Le jeu prépare quand même l’image de cet œil, le CPU économise donc peu. Si vous voyez des deux yeux, un œil noir est inconfortable : laissez sur Aucun.
en = Sharpening
fr = Netteté
en = Crisper edges and text in the focus area; too much makes it shimmer. Raise it a little if the view looks soft (0% is off); it costs a little GPU time and changes while you drive. How: AMD FidelityFX Contrast Adaptive Sharpening, applied as Sim-QVFR resamples the focus view for the headset. Each pixel is sharpened by how much contrast room it has, so soft detail gains the most and edges already sharp gain little. The percentage is CAS’s own sharpness, as other CAS sharpeners show it: any setting above 0% already sharpens. Only the focus area is sharpened, fading out across its feather so its edge stays even: your side vision sees shimmer more than detail. 0% is off; it changes while you drive.
fr = Bords et texte plus nets dans la zone de focus ; trop, et l’image scintille. Montez-la un peu si la vue paraît floue (0 % = désactivé) ; elle coûte un peu de temps GPU et change pendant que vous roulez. Comment : AMD FidelityFX Contrast Adaptive Sharpening, appliqué quand Sim-QVFR rééchantillonne la vue de focus pour le casque. Chaque pixel est accentué selon la marge de contraste dont il dispose : les détails flous gagnent le plus, les bords déjà nets peu. Le pourcentage est la netteté propre de CAS, comme l’affichent les autres outils CAS : tout réglage au-dessus de 0 % accentue déjà. Seule la zone de focus est accentuée, avec une transition sur son fondu pour que son bord reste uniforme : votre vision latérale perçoit le scintillement plus que le détail. 0 % = désactivé ; elle change pendant que vous roulez.
en = Night car lighting
fr = Éclairage de nuit des voitures
en = Makes the cars look lit at night instead of flat: LMU lights the paint with a flat wash from the floodlights. Sim-QVFR relights each car after the game draws it, before the game's own post-processing: highlights where the floodlights and headlights reflect off the paint, shading in creases and under the car, and the effects below. The rest of the scene is untouched. It costs about 0.5 to 1 ms of GPU time with everything on. The switch takes effect at the next launch; the values and effects change while you drive.
fr = Fait paraître les voitures éclairées la nuit plutôt que plates : LMU éclaire la peinture avec un voile uniforme des projecteurs. Sim-QVFR rééclaire chaque voiture après que le jeu l’a dessinée, avant le post-traitement du jeu : des brillances là où projecteurs et phares se reflètent sur la peinture, de l’ombrage dans les creux et sous la voiture, et les effets ci-dessous. Le reste de la scène n’est pas touché. Cela coûte environ 0,5 à 1 ms de GPU avec tout activé. L’interrupteur s’applique au prochain lancement ; les valeurs et les effets changent pendant que vous roulez.
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High. The switches below stay as you set them. Low takes about a third less GPU time than High and looks a little grainier; the periphery always runs one step below the focus area, where it's least seen.
fr = Le niveau de finesse des effets : moins d’échantillons et de pas pour les ombres, l’occlusion et le lissage en Faible, tous en Élevé. Les interrupteurs ci-dessous restent comme vous les avez réglés. Faible prend environ un tiers de temps GPU de moins qu’Élevé et paraît un peu plus granuleux ; la périphérie tourne toujours un cran en dessous de la zone de focus, là où elle se voit le moins.
en = Fill light
fr = Lumière d’appoint
en = How much of the game's flat floodlight wash stays on the cars. Lower makes the shading and highlights stand out more; 100% keeps the game's brightness.
fr = La part du voile uniforme des projecteurs du jeu qui reste sur les voitures. Plus bas, l’ombrage et les brillances ressortent davantage ; 100 % garde la luminosité du jeu.
en = Ambient occlusion
fr = Occlusion ambiante
en = Darkens creases, wheel arches and the underside, where light reaches less. 0% is off.
fr = Assombrit les creux, les passages de roue et le dessous, où la lumière arrive moins. 0 % = désactivé.
en = Highlights
fr = Brillances
en = The strength of the floodlights' and headlights' reflections on the paint. 0% is off; above 100% is brighter than the lights would make it.
fr = La force des reflets des projecteurs et des phares sur la peinture. 0 % = désactivé ; au-delà de 100 %, c’est plus lumineux que ne le feraient les lumières.
en = Paint gloss
fr = Brillant de la peinture
en = How glossy the lacquer is: higher gives smaller, sharper highlights, lower broad soft ones.
fr = La brillance du vernis : plus haut donne des brillances plus petites et plus nettes, plus bas de larges et douces.
en = Smoothing
fr = Lissage
en = Smooths the surface direction over this distance where the game's own normals aren't available, which hides faceted highlights on low-polygon parts. About 15 cm suits most cars; 0 is off.
fr = Lisse la direction de la surface sur cette distance là où les normales du jeu ne sont pas disponibles, ce qui masque les brillances à facettes sur les pièces à faible nombre de polygones. Environ 15 cm convient à la plupart des voitures ; 0 = désactivé.
en = Floodlight shadows
fr = Ombres des projecteurs
en = A part of a car hidden from a floodlight, behind a wing or another car, loses that light and its highlight.
fr = Une partie de voiture cachée d’un projecteur, derrière un aileron ou une autre voiture, perd cette lumière et sa brillance.
en = Paint detail
fr = Détail de peinture
en = Uses the paint's fine surface detail, orange peel and the carbon weave, in the highlights.
fr = Utilise dans les brillances le fin détail de surface de la peinture, la peau d’orange et la trame du carbone.
en = Lacquer reflections
fr = Reflets du vernis
en = Mirrors what's around a car in its paint, strongest at shallow angles. Only what's on screen can be reflected, and only where both eyes can see it, so both eyes show the same.
fr = Reflète l’environnement de la voiture dans sa peinture, surtout sous les angles rasants. Seul ce qui est à l’écran peut être reflété, et seulement là où les deux yeux le voient, pour que les deux yeux montrent la même chose.
en = Headlight highlights
fr = Brillances des phares
en = Other cars' headlights, and yours in the mirrors, shine on the paint as the floodlights do.
fr = Les phares des autres voitures, et les vôtres dans les rétroviseurs, éclairent la peinture comme les projecteurs.
en = Shadows on the ground
fr = Ombres au sol
en = Darkens the track and walls under and beside the cars, and casts soft floodlight shadows, so the cars sit on the ground.
fr = Assombrit la piste et les murs sous et à côté des voitures, et projette de douces ombres des projecteurs, pour que les voitures reposent sur le sol.
en = Night vision color
fr = Couleur vision nocturne
en = As eyes do at night, dark areas lose their colour and turn slightly blue while lit areas keep theirs. A matter of taste, off by default.
fr = Comme les yeux la nuit, les zones sombres perdent leur couleur et virent légèrement au bleu tandis que les zones éclairées gardent la leur. Affaire de goût, désactivé par défaut.
en = Color correction
fr = Correction des couleurs
en = Adjusts the picture in the headset: exposure, brightness, contrast and saturation, for a game that looks too dark, washed out or dull in your headset. Sim-QVFR applies it as it composes the views, the periphery and the focus area alike, so the focus area never stands out; it costs almost no GPU time and changes while you drive. Menus and loading screens show as the game draws them. Off, or every value at 0, leaves the picture as it was.
fr = Ajuste l’image dans le casque : exposition, luminosité, contraste et saturation, pour un jeu qui paraît trop sombre, délavé ou terne dans votre casque. Sim-QVFR l’applique en composant les vues, périphérie et zone de focus pareillement, si bien que la zone de focus ne ressort jamais ; cela ne coûte presque pas de GPU et change pendant que vous roulez. Les menus et écrans de chargement s’affichent comme le jeu les dessine. Désactivée, ou avec toutes les valeurs à 0, l’image reste comme elle était.
en = Exposure
fr = Exposition
en = Scales all of the light, in stops (EV): +1.0 EV is twice as bright, -1.0 EV half, up to 3 stops either way. Highlights brighten with the rest and can clip, so raise it a little at a time; Brightness lifts the darks without touching them.
fr = Met toute la lumière à l’échelle, en diaphs (EV) : +1,0 EV est deux fois plus clair, -1,0 EV deux fois moins, jusqu’à 3 diaphs dans chaque sens. Les hautes lumières s’éclaircissent avec le reste et peuvent brûler, alors montez-la petit à petit ; la luminosité relève les sombres sans les toucher.
en = Brightness
fr = Luminosité
en = Lightens or darkens the mid tones and shadows while black stays black and white stays white, so an OLED headset keeps its deep blacks: raise it to see into dark cockpits and night stints, lower it for a richer, darker picture.
fr = Éclaircit ou assombrit les tons moyens et les ombres, le noir restant noir et le blanc restant blanc, si bien qu’un casque OLED garde ses noirs profonds : montez-la pour voir dans les cockpits sombres et les relais de nuit, baissez-la pour une image plus riche et plus sombre.
en = Contrast
fr = Contraste
en = Spreads the picture’s tones away from mid grey (above 0) or draws them towards it (below 0), as a gentle S-curve: black and white stay where they are and colours keep their hue. More contrast gives deeper shadows and brighter highlights; less shows more detail in both.
fr = Écarte les tons de l’image du gris moyen (au-dessus de 0) ou les en rapproche (en dessous de 0), en douce courbe en S : le noir et le blanc restent en place et les couleurs gardent leur teinte. Plus de contraste donne des ombres plus profondes et des hautes lumières plus vives ; moins montre plus de détail dans les deux.
en = Saturation
fr = Saturation
en = How strong the colours are: above 0 more vivid, below 0 more muted, -100% grey. Brightness is kept as each colour changes.
fr = L’intensité des couleurs : au-dessus de 0 plus vives, en dessous de 0 plus ternes, -100 % gris. La luminosité est conservée pendant que chaque couleur change.
en = Accent brightness
fr = Luminosité de l’accent
en = How light or dark the game’s colour is. The wheel picks its hue and how strong it is; the launcher keeps its text and edges readable in light and dark mode.
fr = La clarté de la couleur du jeu. La roue choisit sa teinte et son intensité ; le lanceur garde texte et bords lisibles en mode clair comme sombre.
en = Focus width
fr = Largeur du focus
en = The focus area’s width, a share of the view. Wider hides the edge between sharp and soft better; its pixels cost density × width × height, so a wide area at a high density costs the most. It changes while you drive; wider than the game started with (at your density) renders less dense until the next launch.
fr = La largeur de la zone de focus, en part de la vue. Plus large, elle masque mieux la limite entre net et flou ; ses pixels coûtent densité × largeur × hauteur, donc une zone large à forte densité coûte le plus. Elle change pendant que vous roulez ; plus large qu’au démarrage du jeu (à votre densité), le rendu est moins dense jusqu’au prochain lancement.
en = Focus height
fr = Hauteur du focus
en = The focus area’s height, a share of the view. Taller covers more of the dash and mirrors; it costs pixels as the width does. Taller than the game started with (at your density) renders less dense until the next launch.
fr = La hauteur de la zone de focus, en part de la vue. Plus haute, elle couvre davantage le tableau de bord et les rétroviseurs ; elle coûte des pixels comme la largeur. Plus haute qu’au démarrage du jeu (à votre densité), le rendu est moins dense jusqu’au prochain lancement.
en = Corner radius
fr = Rayon des coins
en = Rounds the focus area’s corners, so its edge is harder to spot. No cost: the area renders as a rectangle either way.
fr = Arrondit les coins de la zone de focus, pour que son bord se remarque moins. Aucun coût : la zone est rendue en rectangle de toute façon.
en = Feather
fr = Fondu
en = The band where the focus area blends into the outer view. Wider hides the edge better; no measurable cost.
fr = La bande où la zone de focus se fond dans la vue extérieure. Plus large, elle masque mieux le bord ; aucun coût mesurable.
en = Gaze dead-zone
fr = Zone morte du regard
en = How far your eyes move before the focus area follows. A little keeps it still against eye-tracker noise; too much makes it lag when you look around. No GPU cost.
fr = De combien vos yeux bougent avant que la zone de focus suive. Un peu la stabilise contre le bruit du suivi oculaire ; trop la fait traîner quand vous regardez autour. Aucun coût GPU.
en = Gaze offset
fr = Décalage du regard
en = Moves the eye-tracked focus area up or down, in degrees, for a tracker that sits a little off. No cost.
fr = Monte ou descend la zone de focus suivie par les yeux, en degrés, pour un capteur légèrement décalé. Aucun coût.
en = Vertical position
fr = Position verticale
en = Moves the fixed focus area up or down, in degrees: towards the dash and mirrors, or the road. No cost.
fr = Monte ou descend la zone de focus fixe, en degrés : vers le tableau de bord et les rétroviseurs, ou vers la route. Aucun coût.
en = Crop the view
fr = Recadrer la vue
en = Cuts the edges a helmet or the lens hides before the game renders them. It saves GPU time and VRAM with the pixels cut; the headset shows black there.
fr = Coupe les bords qu’un casque de pilote ou la lentille cache, avant que le jeu ne les rende. Économise du temps GPU et de la VRAM selon les pixels coupés ; le casque y affiche du noir.
en = Top
fr = Haut
en = How much of the top of each eye’s view the game doesn’t render. Saves pixels in proportion.
fr = La part du haut de la vue de chaque œil que le jeu ne rend pas. Économise des pixels en proportion.
en = Bottom
fr = Bas
en = How much of the bottom of each eye’s view the game doesn’t render. Saves pixels in proportion.
fr = La part du bas de la vue de chaque œil que le jeu ne rend pas. Économise des pixels en proportion.
en = Outer side (temple)
fr = Côté extérieur (tempe)
en = How much of each eye’s temple side the game doesn’t render. Saves pixels in proportion.
fr = La part du côté tempe de chaque œil que le jeu ne rend pas. Économise des pixels en proportion.
en = Inner side (nose)
fr = Côté intérieur (nez)
en = How much of each eye’s nose side the game doesn’t render; the other eye still sees most of it. Saves pixels in proportion.
fr = La part du côté nez de chaque œil que le jeu ne rend pas ; l’autre œil en voit encore l’essentiel. Économise des pixels en proportion.
en = Show a helmet
fr = Afficher un casque de pilote
en = Draws a helmet’s visor opening round the view, lit by the scene, in a layer of its own. It costs the headset a layer to composite; nothing for the game.
fr = Dessine l’ouverture de visière d’un casque de pilote autour de la vue, éclairée par la scène, dans sa propre couche. Cela coûte au casque une couche à composer ; rien pour le jeu.
en = Road focus
fr = Focus sur la route
en = For fixed foveation. The focus area renders in full detail only along the road ahead (Road width either side of it and 3.5 m above it, following its hills and bends) and in your own car: the wheel, dash, displays and mirrors inside the focus area stay sharp. Trees, grandstands, hills and the sky beside and above the road come from the periphery’s image; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. It’s off while the focus follows your eyes. Turn it off if something beside the road looks softer than you want. Changes while you drive.
fr = Pour la fovéation fixe. La zone de focus n’est rendue en pleine définition que le long de la route devant vous (la largeur de la route de chaque côté et 3,5 m au-dessus, en suivant ses bosses et ses virages) et dans votre propre voiture : le volant, le tableau de bord, les écrans et les rétroviseurs dans la zone de focus restent nets. Les arbres, les tribunes, les collines et le ciel à côté et au-dessus de la route viennent de l’image de la périphérie ; là où vous regardez en conduisant, vous ne devriez voir aucune différence. Cela économise du temps GPU, davantage avec une zone de focus plus grande. Il est désactivé tant que le focus suit vos yeux. Désactivez-le si quelque chose au bord de la route vous paraît trop doux. Change pendant que vous roulez.
en = Road width
fr = Largeur de la route
en = How far either side of the road’s centre stays in full detail with Road focus on. Lower keeps just the track sharp and saves the most; higher brings the kerbs, run-off and barriers into the focus area and saves less. 10 m suits most circuits. Changes while you drive.
fr = Jusqu’où, de chaque côté du milieu de la route, la pleine définition reste avec le focus sur la route activé. Plus bas, seule la piste reste nette et l’économie est maximale ; plus haut, les vibreurs, les dégagements et les rails entrent dans la zone de focus et l’économie diminue. 10 m conviennent à la plupart des circuits. Change pendant que vous roulez.
en = Cockpit preset
fr = Préréglage cockpit
en = The focus area’s shape, size and position Road focus sets when you switch it on, or at once when you pick the other one here. A: a large cockpit shape over the windscreen, dash and wheel. B: a smaller one moved down to the road and the dash. Adjust either afterwards as you like; your own shape, size and position come back when you switch Road focus off. When the headset composes the views itself, the size stays inside its own focus region and the position doesn’t apply.
fr = La forme, la taille et la position de la zone de focus que le focus sur la route applique quand vous l’activez, ou aussitôt quand vous choisissez l’autre ici. A : une grande forme de cockpit sur le pare-brise, le tableau de bord et le volant. B : une plus petite, descendue vers la route et le tableau de bord. Ajustez-les ensuite comme vous voulez ; votre propre forme, taille et position reviennent quand vous désactivez le focus sur la route. Quand le casque compose lui-même les vues, la taille reste dans sa propre zone de focus et la position ne s’applique pas.
en = Road edge blend
fr = Fondu des bords de la route
en = How softly Road focus’s full detail fades into the periphery at its edges: this many metres near you, wider in proportion far away so distant edges fade too. Raise it if you notice where the sharp area ends; 0 is a hard edge. Changes while you drive.
fr = La douceur avec laquelle la pleine définition du focus sur la route se fond dans la périphérie à ses bords : autant de mètres près de vous, plus large en proportion au loin pour que les bords lointains se fondent aussi. Augmentez-le si vous voyez où la zone nette s’arrête ; 0 donne un bord net. Change pendant que vous roulez.
en = Show Road focus area
fr = Montrer la zone du focus sur la route
en = Tints blue, in the headset, everything Road focus takes from the periphery, so you can see exactly what stays in full detail (untinted) as you drive. Road focus works as usual meanwhile. For setting up; turn it off to drive.
fr = Teinte en bleu, dans le casque, tout ce que le focus sur la route prend de la périphérie, pour voir exactement ce qui reste en pleine définition (non teinté) pendant que vous roulez. Le focus sur la route fonctionne normalement pendant ce temps. Pour le réglage ; désactivez-le pour rouler.
en = Road height
fr = Hauteur de la route
en = How high above the road stays in full detail with Road focus on. Lower keeps just the road and the cars sharp and saves the most; higher brings signs, gantries and the grandstands’ lower rows into the focus area and saves less. 3.5 m suits most circuits. Changes while you drive.
fr = Jusqu’à quelle hauteur au-dessus de la route la pleine définition reste avec le focus sur la route activé. Plus bas, seuls la route et les voitures restent nets et l’économie est maximale ; plus haut, les panneaux, les portiques et les premiers rangs des tribunes entrent dans la zone de focus et l’économie diminue. 3,5 m conviennent à la plupart des circuits. Change pendant que vous roulez.
en = Show focus outline
fr = Afficher le contour du focus
en = Draws the focus area’s edge, to see where it is and how it follows your eyes. For setting up; turn it off to drive.
fr = Dessine le bord de la zone de focus, pour voir où elle est et comment elle suit vos yeux. Pour le réglage ; désactivez-le pour rouler.
en = Use Cheeky Foveated DLSS
fr = Utiliser Cheeky Foveated DLSS
en = Runs Cheeky Foveated DLSS inside the game, for the DLSS options below. Needs an NVIDIA RTX GPU, DLSS on in the game, and Cheeky’s download. Applies at the next launch.
fr = Exécute Cheeky Foveated DLSS dans le jeu, pour les options DLSS ci-dessous. Nécessite un GPU NVIDIA RTX, le DLSS activé dans le jeu et le téléchargement de Cheeky. S’applique au prochain lancement.
en = Cheaper outer views
fr = Vues extérieures allégées
en = The outer views get Cheeky’s DLAA at a lower resolution instead of the game’s DLSS: GPU time saved on the views you see least.
fr = Les vues extérieures reçoivent le DLAA de Cheeky à plus basse résolution au lieu du DLSS du jeu : du temps GPU économisé sur les vues que vous voyez le moins.
en = Outer DLAA scale
fr = Échelle DLAA extérieure
en = The resolution of that cheaper pass. Lower saves more GPU time and softens the side view.
fr = La résolution de cette passe allégée. Plus basse, elle économise plus de temps GPU et adoucit la vue latérale.
en = Focus supersampling
fr = Suréchantillonnage du focus
en = Renders the focus views above their size before DLSS: a sharper centre, for more GPU time.
fr = Rend les vues de focus au-dessus de leur taille avant le DLSS : un centre plus net, pour plus de temps GPU.
en = Frame generation
fr = Génération d’images
en = Cheeky’s DLSS frame generation adds frames between the game’s: smoother motion when the game can’t hold the refresh rate, for some GPU time and latency. Turn OpenXR Toolkit’s Turbo mode off with it, and run no other frame generator.
fr = La génération d’images DLSS de Cheeky ajoute des images entre celles du jeu : un mouvement plus fluide quand le jeu ne tient pas la fréquence de rafraîchissement, contre un peu de temps GPU et de latence. Désactivez alors le mode Turbo d’OpenXR Toolkit, et n’utilisez aucun autre générateur d’images.
en = Center region
fr = Région centrale
en = The part of the view frame generation makes at full quality (it follows your eyes when eye tracked). Larger looks better and costs more GPU time.
fr = La partie de la vue que la génération d’images produit en pleine qualité (elle suit vos yeux avec le suivi oculaire). Plus grande, c’est plus beau et plus coûteux en GPU.
en = Load order
fr = Ordre de chargement
en = Nearest the game first. Each launch loads these below the Sim-QVFR layer in this order; a layer off in Windows can still be loaded for the game alone. Locked switches keep the mod and the game working.
fr = La plus proche du jeu en premier. Chaque lancement les charge sous la couche Sim-QVFR dans cet ordre ; une couche désactivée dans Windows peut quand même être chargée pour ce jeu seul. Les interrupteurs verrouillés assurent le fonctionnement du mod et du jeu.
en = Describe the problem
fr = Décrivez le problème
en = Zips the logs and the game’s crash reports from those sessions (names and account IDs taken out) into the logs folder, then opens a new issue on GitHub with what you wrote, your settings, the last session and your PC filled in. Add the steps there, and drag in the zip (it shows below) and any screenshots.
fr = Compresse les journaux et les rapports de plantage du jeu de ces sessions (noms et identifiants de compte retirés) dans le dossier des journaux, puis ouvre un nouveau ticket sur GitHub avec votre texte, vos réglages, la dernière session et votre PC déjà remplis. Ajoutez-y les étapes, et glissez-y le zip (il apparaît ci-dessous) et vos captures d’écran.
en = Busiest threads
fr = Threads les plus chargés
en = Each thread is a share of ONE core. A thread near 100% can hold the frame rate back even when Windows shows the whole CPU at 15%; a thread that spins by design looks busy whatever limits it.
fr = Chaque thread est une part d’UN seul cœur. Un thread proche de 100 % peut freiner la fréquence d’images même quand Windows affiche le CPU entier à 15 % ; un thread qui tourne en boucle par conception paraît occupé quoi qu’il arrive.
en = Frame rate
fr = Fréquence d’images
en = The last session’s average against the headset’s refresh rate, the frame rate it asks for. Below it, the runtime fills the gaps (motion smoothing or reprojection), which shows as wobble on moving edges.
fr = La moyenne de la dernière session face à la fréquence de rafraîchissement du casque, celle qu’il demande. En dessous, le runtime comble les trous (lissage de mouvement ou reprojection), ce qui se voit comme des ondulations sur les bords en mouvement.
en = Slow frames
fr = Images lentes
en = How long your slowest frames take: lower is smoother. One frame in ten took at least this long (the 90th percentile). Above the frame’s budget (1000 ms divided by the headset’s refresh rate: 11.1 ms at 90 Hz) those frames miss the headset, and you feel stutter even when the average frame rate looks fine.
fr = La durée de vos images les plus lentes : plus bas, c’est plus fluide. Une image sur dix a pris au moins ce temps (le 90e centile). Au-delà du budget d’une image (1000 ms divisé par la fréquence du casque : 11,1 ms à 90 Hz), ces images ratent le casque, et vous sentez des saccades même si la moyenne semble bonne.
en = Limited by
fr = Limité par
en = What held the frame back most of the time: the game’s render thread on the CPU, the GPU, or nothing (the headset’s refresh). Lowering resolution helps only when the GPU limits it.
fr = Ce qui a freiné l’image la plupart du temps : le thread de rendu du jeu sur le CPU, le GPU, ou rien (le rafraîchissement du casque). Baisser la résolution n’aide que si le GPU limite.
en = Previous session
fr = Session précédente
en = The session before the last one for this game, and the settings changed in between, so you can see what a change did. A change while you drive (here or in the headset menu) starts a new stint, kept as its own entry; each covers the whole stint, with the moments the headset menu was open left out. Compare runs on the same track and car for a fair difference.
fr = L’avant-dernière session de ce jeu, et les réglages modifiés entre-temps, pour voir l’effet d’un changement. Un changement en roulant (ici ou dans le menu du casque) démarre un nouveau relais, gardé comme entrée à part ; chacune couvre tout le relais, sans les moments où le menu du casque était ouvert. Comparez sur le même circuit et la même voiture pour une différence juste.
en = Run with anti-cheat
fr = Lancer avec l’anti-triche
en = Starts the game through its anti-cheat (Easy Anti-Cheat), as Steam does, with Sim-QVFR running, so you can join online servers. Sim-QVFR runs inside the game, and the anti-cheat may kick you or ban your account for it. Sim-QVFR and its developer aren’t responsible for kicks or bans: turning it on asks you to accept that risk. Off starts the game without its anti-cheat, for offline sessions only.
fr = Démarre le jeu via son anti-triche (Easy Anti-Cheat), comme le fait Steam, avec Sim-QVFR actif, pour rejoindre des serveurs en ligne. Sim-QVFR tourne dans le jeu, et l’anti-triche peut vous exclure ou bannir votre compte pour cela. Sim-QVFR et son développeur ne sont pas responsables des exclusions ou bannissements : l’activer vous demande d’accepter ce risque. Désactivé, le jeu démarre sans anti-triche, pour les sessions hors ligne uniquement.
en = Layers for
fr = Couches pour
en = Launches from here: the VR add-ons (OpenXR layers) a launch from this launcher loads, below Sim-QVFR, in an order of its own; nothing else changes. Every app: Windows’ own list, which every other app uses (and the game started from Steam), saved in the registry when you apply, with a backup in the logs folder first.
fr = Lancements d’ici : les modules VR (couches OpenXR) qu’un lancement depuis ce lanceur charge, sous Sim-QVFR, dans son propre ordre ; rien d’autre ne change. Toutes les apps : la liste de Windows, utilisée par toutes les autres apps (et le jeu lancé depuis Steam), enregistrée dans le registre quand vous appliquez, avec d’abord une sauvegarde dans le dossier des journaux.
en = CPU capture
fr = Capture CPU
en = At the next launch, the CPU capture hotkey (Ctrl+Alt+C) while driving records for 20 s where the game’s busiest threads spend their time, into a cpu-profile file in the logs folder. The headset menu shows when it starts and ends; the game may stutter slightly while it records.
fr = Au prochain lancement, le raccourci de capture CPU (Ctrl+Alt+C) en roulant enregistre pendant 20 s où les threads les plus chargés du jeu passent leur temps, dans un fichier cpu-profile du dossier des journaux. Le menu du casque indique le début et la fin ; le jeu peut saccader un peu pendant l’enregistrement.
en = Frame capture
fr = Capture d’image
en = Saves the game’s own image and the composed output, as PNG files in the captures folder inside the logs folder. Each press saves one more frame, to compare the views where something looks wrong. In X-Plane 12, Assetto Corsa Competizione and Le Mans Ultimate.
fr = Enregistre l’image du jeu et la sortie composée, en fichiers PNG dans le dossier captures du dossier des journaux. Chaque appui enregistre une image de plus, pour comparer les vues là où quelque chose cloche. Dans X-Plane 12, Assetto Corsa Competizione et Le Mans Ultimate.
en = Next launch without QVFR
fr = Prochain lancement sans QVFR
en = Starts the game once with its own two views and QVFR off, still measuring, so Diagnostics can compare the same race with and without QVFR. It turns itself off after that launch; the next one has QVFR again. The performance overlay works in it, the headset menu does not.
fr = Démarre le jeu une fois avec ses deux vues d’origine et QVFR désactivé, en mesurant toujours, pour que Diagnostic compare la même course avec et sans QVFR. Il se désactive après ce lancement ; le suivant a de nouveau QVFR. L’overlay de performances y fonctionne, pas le menu du casque.
en = Detailed logs
fr = Journaux détaillés
en = Normal logs say what Sim-QVFR set up, decided and measured. Detailed logs add every step behind that, for a bug report when the developer asks for one. They last three launches and then turn themselves off, so the logs stay small. Send them with Report an issue, or Save the logs as a zip.
fr = Les journaux normaux disent ce que Sim-QVFR a mis en place, décidé et mesuré. Les journaux détaillés ajoutent chaque étape derrière, pour un rapport de bug quand le développeur en demande un. Ils durent trois lancements puis se désactivent, pour que les journaux restent légers. Envoyez-les avec Signaler un problème, ou Enregistrer les journaux en zip.
en = Logs folder
fr = Dossier des journaux
en = Each launch adds a session log and a small run folder. The launcher keeps the newest 30 sessions and removes older ones at each launch, and the newest 10 CPU captures. Frame captures and game image dumps stay until you clear them: Clear captures moves them to the Recycle Bin.
fr = Chaque lancement ajoute un journal de session et un petit dossier d’exécution. Le lanceur garde les 30 sessions les plus récentes et supprime les plus anciennes à chaque lancement, ainsi que les 10 captures CPU les plus récentes. Les captures d’image et les dumps d’image du jeu restent jusqu’à ce que vous les effaciez : Effacer les captures les met à la Corbeille.
en = Presets for eye tracked foveation
fr = Préréglages pour la fovéation avec suivi des yeux
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Eye tracked, the area follows your eyes, so it can be small and very sharp. They set the resolution only and keep everything else.
fr = Des points de départ qui mettent les pixels au centre : vues extérieures basses et zone de focus dense. Avec suivi des yeux, la zone suit votre regard, elle peut donc être petite et très nette. Ils ne règlent que la résolution et gardent tout le reste.
en = Presets for fixed foveation
fr = Préréglages pour la fovéation fixe
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Fixed, your eyes move off the centre, so the area is larger and a little less dense. They set the resolution only and keep everything else.
fr = Des points de départ qui mettent les pixels au centre : vues extérieures basses et zone de focus dense. En fixe, vos yeux quittent le centre, la zone est donc plus grande et un peu moins dense. Ils ne règlent que la résolution et gardent tout le reste.
en = Your profiles
fr = Vos profils
en = A profile holds every setting of the picture: resolution, foveation and the focus overlay, and where the game has them the view crop, the helmet and Foveated DLSS. Not the menu’s and overlay’s places, the hotkeys or the OpenXR layers. Share copies one as a line of text to paste in a chat; Paste adds one from the clipboard. The headset menu’s Profile line switches between them while you drive.
fr = Un profil contient tous les réglages de l’image : résolution, fovéation et contour du focus, et selon le jeu le recadrage de la vue, le casque de pilote et le Foveated DLSS. Pas la position du menu et de l’overlay, ni les raccourcis ou les couches OpenXR. Partager en copie un en une ligne de texte à coller dans un chat ; Coller en ajoute un depuis le presse-papiers. La ligne Profil du menu du casque passe de l’un à l’autre en roulant.
en = A key’s first press also opens the menu. A wheel’s directions act only while the menu shows, so a switch the game also uses doesn’t open it: use Open or close first.
fr = Le premier appui d’une touche ouvre aussi le menu. Les directions du volant n’agissent que menu affiché, pour qu’un bouton aussi utilisé par le jeu ne l’ouvre pas : utilisez d’abord Ouvrir ou fermer.
en = Keys work while the game window has focus; wheel, button box and controller buttons work whenever the game runs.
fr = Les touches fonctionnent quand la fenêtre du jeu est au premier plan ; les boutons du volant, de la button box et de la manette, tant que le jeu tourne.
en = Field of view crop
fr = Recadrage du champ de vision
en = The outer view keeps its sharpness and the focus region its size. Changes reach a running game at once; with DLSS on, or with less crop than at launch, the pixel count follows at the next launch.
fr = La vue extérieure garde sa netteté et la région de focus sa taille. Les changements atteignent aussitôt le jeu en cours ; avec le DLSS activé, ou moins de recadrage qu’au lancement, le nombre de pixels suit au prochain lancement.
en = Helmet overlay
fr = Casque de pilote
en = Built in, the visor opening follows the crop (Rim and Corners). Your own helmet: top.png, bottom.png and visor.png with alpha in the helmet folder next to the layer; the log suggests the crop that matches them.
fr = Intégré, l’ouverture de la visière suit le recadrage (Bord et Coins). Votre propre casque : top.png, bottom.png et visor.png avec alpha dans le dossier helmet à côté de la couche ; le journal suggère le recadrage qui leur correspond.
en = Focus shape
fr = Forme du focus
en = Each corner moves toward the middle of the focus region, percent of its width (in) or height (down, up). Pull the top corners in for a trapezoid: more of the dash sharp, less of the far field. The focus view still renders the whole box, so the cost stays the same.
fr = Chaque coin se rapproche du milieu de la région de focus, en pourcentage de sa largeur (vers l’intérieur) ou de sa hauteur (bas, haut). Rentrez les coins du haut pour un trapèze : plus de tableau de bord net, moins de lointain. La vue de focus rend toujours tout le rectangle, le coût reste donc le même.
en = Cheeky Foveated DLSS
fr = Cheeky Foveated DLSS
en = No Cheeky loader goes in the game folder: Sim-QVFR loads Cheeky’s runtime into the game itself.
fr = Aucun chargeur Cheeky ne va dans le dossier du jeu : Sim-QVFR charge lui-même le runtime de Cheeky dans le jeu.
en = Frame generation (experimental)
fr = Génération d’images (expérimentale)
en = Outside the center region frames are warped with the game’s motion. Lower scales use less GPU time and memory. With an eye-tracked focus (the Foveation card) the region follows your eyes too, through Cheeky’s OpenXR layer.
fr = Hors de la région centrale, les images sont déformées selon le mouvement du jeu. Des échelles plus basses consomment moins de temps GPU et de mémoire. Avec un focus suivi par les yeux (carte Fovéation), la région suit aussi votre regard, via la couche OpenXR de Cheeky.
en = The settings menu stays 0.8 m in front of your head, wherever you look.
fr = Le menu des réglages reste à 0,8 m devant votre tête, où que vous regardiez.
en = Use DLSS
fr = Utiliser le DLSS
en = Sim-QVFR evaluates NVIDIA’s DLSS on each view, with depth and motion it works out from the game’s own frames, before the game’s post-processing. Needs an NVIDIA RTX graphics card. Sim-QVFR includes NVIDIA’s nvngx_dlss.dll; Choose… takes another (a newer one from a game), Use included goes back.
fr = Sim-QVFR applique le DLSS de NVIDIA à chaque vue, avec la profondeur et le mouvement qu’il déduit des images du jeu, avant le post-traitement du jeu. Nécessite une carte graphique NVIDIA RTX. Sim-QVFR inclut le nvngx_dlss.dll de NVIDIA ; Choisir… en prend un autre (un plus récent issu d’un jeu), Utiliser celui fourni revient au sien.
en = Use FSR
fr = Utiliser le FSR
en = Experimental. On a PC without an NVIDIA RTX graphics card, Sim-QVFR evaluates AMD FSR on each view in DLSS’s place, with the same depth and motion: FSR 4 where AMD’s software offers it for your card (Radeon RX 9000, and newer drivers on RX 7000 and 6000), FSR 3.1 elsewhere. Sim-QVFR includes AMD’s FSR files. Tested only as FSR 3.1 on an NVIDIA card so far: tell us how it runs on yours.
fr = Expérimental. Sur un PC sans carte graphique NVIDIA RTX, Sim-QVFR applique le FSR d’AMD à chaque vue à la place du DLSS, avec la même profondeur et le même mouvement : FSR 4 là où le logiciel d’AMD le propose pour votre carte (Radeon RX 9000, et pilotes récents sur RX 7000 et 6000), FSR 3.1 ailleurs. Sim-QVFR inclut les fichiers FSR d’AMD. Testé pour l’instant uniquement en FSR 3.1 sur une carte NVIDIA : dites-nous comment il tourne chez vous.
en = Periphery preset
fr = Préréglage de la périphérie
en = Steadier or cheaper DLSS outside the focus area. K: a steadier picture, at a higher cost. F: about half the cost, a little more flicker on edges. With eye tracking you rarely look there, so F is usually fine; with a fixed focus, K.
fr = Un DLSS plus stable ou moins coûteux hors de la zone de focus. K : image plus stable, pour un coût plus élevé. F : environ moitié moins cher, un peu plus de scintillement sur les bords. Avec le suivi oculaire, vous y regardez rarement, F suffit donc en général ; avec un focus fixe, K.
en = Texture sharpening
fr = Netteté des textures
en = DLSS rebuilds detail from frames drawn at a lower resolution, so textures are best sampled a step sharper while it runs. Sim-QVFR does that through copies of the game’s shaders, in the focus area alone or in the periphery too. Measured gains are modest (most in the periphery and on distant textures). Off at launch, nothing is installed for it; turned on then, it starts at the next launch. Fine patterns may shimmer: then a step lower.
fr = Le DLSS reconstruit le détail à partir d’images dessinées à plus basse résolution : mieux vaut alors échantillonner les textures un cran plus net. Sim-QVFR le fait via des copies des shaders du jeu, dans la zone de focus seule ou aussi en périphérie. Les gains mesurés sont modestes (surtout en périphérie et sur les textures lointaines). Désactivé au lancement, rien n’est installé pour cela ; activé ensuite, il démarre au prochain lancement. Les motifs fins peuvent scintiller : descendez alors d’un cran.
en = Updates
fr = Mises à jour
en = Install downloads the release from GitHub, checks it against the SHA-256 GitHub gives, replaces the program files and restarts the launcher; your settings, profiles and changed files stay, and the version you had is kept in the update folder. Download opens the release’s page instead.
fr = Installer télécharge la version depuis GitHub, la vérifie avec le SHA-256 donné par GitHub, remplace les fichiers du programme et redémarre le lanceur ; vos réglages, profils et fichiers modifiés restent, et la version précédente est gardée dans le dossier update. Télécharger ouvre plutôt la page de la version.
en = These settings reach the game while it runs, as soon as you change them. Without the game running, they apply when it starts.
fr = Ces réglages atteignent le jeu en cours dès que vous les changez. Si le jeu n’est pas lancé, ils s’appliquent à son démarrage.
en = Lowering it reaches a running game at once, and so does raising it back up to what the game started with. Above that, it takes effect at the next launch. With DLSS on in the game, the views keep their launch sizes until the next launch.
fr = Une baisse atteint aussitôt le jeu en cours, tout comme une remontée jusqu’à la valeur de démarrage du jeu. Au-delà, elle prend effet au prochain lancement. Avec le DLSS activé dans le jeu, les vues gardent leur taille de lancement jusqu’au prochain lancement.
en = These settings take effect the next time the game starts from the launcher. A running game keeps what it started with.
fr = Ces réglages prennent effet au prochain démarrage du jeu depuis le lanceur. Un jeu en cours garde ceux de son démarrage.
en = The local time on a small card in the headset, apart from the performance overlay: on or off and moved live, here or from the headset menu. It costs next to nothing; it redraws once a minute.
fr = L’heure locale sur une petite carte dans le casque, à part de l’overlay de performances : activée, désactivée et déplacée en direct, ici ou depuis le menu du casque. Elle ne coûte presque rien ; elle se redessine une fois par minute.
en = The performance overlay in the headset: frame rate, CPU and GPU time and what limits the frame. A little CPU time while it shows.
fr = L’overlay de performances dans le casque : fréquence d’images, temps CPU et GPU et ce qui limite l’image. Un peu de temps CPU tant qu’il est affiché.
en = Shape
fr = Forme
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom shape: an outline of up to 10 points you draw on the preview (click the area to add a point, drag one to move it, right-click one to remove it); trace your windscreen, say, then place it with Vertical and Horizontal position. To hide the area’s edge, raise Feather.
fr = La forme de la zone nette. Rectangle : arrondi par le Rayon des coins. Forme personnalisée : un contour de jusqu’à 10 points que vous dessinez sur l’aperçu (cliquez dans la zone pour ajouter un point, faites-le glisser pour le déplacer, clic droit pour le retirer) ; tracez votre pare-brise, par exemple, puis placez-le avec Position verticale et Position horizontale. Pour masquer le bord de la zone, augmentez le Fondu.
en = Outline color
fr = Couleur du contour
en = The outline’s colour in the headset. It shows while Show focus outline is on.
fr = La couleur du contour dans le casque. Il s’affiche tant que Afficher le contour du focus est activé.
en = nvngx_dlss.dll
fr = nvngx_dlss.dll
en = The DLSS Sim-QVFR uses: the one it includes (NVIDIA’s), or another you choose, a newer one from a game, say (DLSS 310 or newer). Use included goes back. Applies at the next launch.
fr = Le DLSS qu’utilise Sim-QVFR : celui qu’il inclut (celui de NVIDIA), ou un autre de votre choix, par exemple un plus récent issu d’un jeu (DLSS 310 ou plus récent). Utiliser celui fourni revient au sien. S’applique au prochain lancement.
en = Focus views
fr = Vues de focus
en = DLAA draws them at their size. Ultra quality, Quality, Balanced and Performance draw them at 77, 67, 58 or 50% each way and upscale them: less GPU time, softer distant textures. DLSS has no ultra quality model of its own: 77% runs its quality one.
fr = Le DLAA les dessine à leur taille. Qualité ultra, Qualité, Équilibré et Performances les dessinent à 77, 67, 58 ou 50 % dans chaque sens puis les agrandissent : moins de temps GPU, textures lointaines plus floues. Le DLSS n’a pas de modèle qualité ultra : 77 % utilise son modèle qualité.
en = Focus preset
fr = Préréglage du focus
en = The DLSS preset for the sharp focus views. With Sim-QVFR’s DLSS, Default is NVIDIA’s choice for the mode: K, and M at Performance, which costs more. With Cheeky, Game default keeps the game’s.
fr = Le préréglage DLSS des vues de focus nettes. Avec le DLSS de Sim-QVFR, Par défaut est le choix de NVIDIA pour le mode : K, et M en Performances, qui coûte plus. Avec Cheeky, Celui du jeu garde celui du jeu.
en = Other cars’ motion
fr = Mouvement des autres voitures
en = Gives DLSS each other car’s own motion, so cars passing, alongside or ahead stay clean instead of smearing. Turn it off for more headroom: in a field of cars it costs about 0.5 ms of CPU and 0.2 to 0.5 ms of GPU a frame. Applies at the next launch, with DLSS on at launch; with DLSS off it costs nothing.
fr = Fournit au DLSS le mouvement propre de chaque autre voiture, pour que les voitures qui doublent, à côté ou devant restent nettes au lieu de baver. Désactivez-le pour plus de marge : dans un peloton, il coûte environ 0,5 ms de CPU et 0,2 à 0,5 ms de GPU par image. S’applique au prochain lancement, avec le DLSS activé au lancement ; sans DLSS, il ne coûte rien.
en = nvngx_dlssnr.dll
fr = nvngx_dlssnr.dll
en = NVIDIA’s DLSS neural rendering runtime. Sim-QVFR includes none: it is NVIDIA’s, and comes only with games that ship DLSS-NR. Choose the one in such a game’s folder. Applies at the next launch.
fr = Le runtime de rendu neuronal DLSS de NVIDIA. Sim-QVFR n’en inclut aucun : il appartient à NVIDIA, et n’est fourni qu’avec les jeux qui intègrent DLSS-NR. Choisissez celui du dossier d’un tel jeu. S’applique au prochain lancement.
en = Use DLSS-NR
fr = Utiliser DLSS-NR
en = NVIDIA’s DLSS neural rendering on the views: its model reworks lighting and materials from the picture, its depth and its motion. Experimental, and heavy: about 2 ms of GPU time and 130 MB of video memory for every million pixels it works on, per view (RTX 5070 Ti). It turns itself off if frames fall under 10 a second with it on.
fr = Le rendu neuronal DLSS de NVIDIA sur les vues : son modèle retravaille éclairage et matériaux à partir de l’image, de sa profondeur et de son mouvement. Expérimental, et lourd : environ 2 ms de temps GPU et 130 MB de mémoire vidéo par million de pixels traités, par vue (RTX 5070 Ti). Il se désactive si les images tombent sous 10 par seconde avec lui.
en = Intensity
fr = Intensité
en = How much of the model’s change you get: 0% is the picture as it came.
fr = La part du changement du modèle que vous obtenez : 0 % = l’image d’origine.
en = Style
fr = Style
en = The look the model aims for.
fr = Le rendu visé par le modèle.
en = Preset
fr = Préréglage
en = The model: A is the original, B a faster one in newer DLLs (310.9.16 on). Default is the DLL’s own choice. A change rebuilds DLSS-NR: a short stutter.
fr = Le modèle : A est l’original, B un plus rapide dans les DLL récentes (à partir de 310.9.16). Par défaut est le choix de la DLL. Un changement reconstruit DLSS-NR : une courte saccade.
en = Local tone
fr = Tonalité locale
en = The strength of the model’s local contrast and lighting changes.
fr = La force des changements de contraste local et d’éclairage du modèle.
en = Local structure
fr = Structure locale
en = The strength of the model’s changes to fine structure.
fr = La force des changements du modèle sur les structures fines.
en = Auto mask
fr = Masque auto
en = Lets the model find what it treats differently (skin) by itself.
fr = Laisse le modèle trouver seul ce qu’il traite différemment (la peau).
en = Runs
fr = S’exécute
en = After DLSS works on the finished, anti-aliased views. Before DLSS works on the views as drawn, before anti-aliasing and upscaling: fewer pixels when the focus views are upscaled, and DLSS then smooths its result.
fr = Après le DLSS : traite les vues finies et anticrénelées. Avant le DLSS : traite les vues telles que dessinées, avant anticrénelage et mise à l’échelle : moins de pixels quand les vues de focus sont agrandies, et le DLSS lisse ensuite son résultat.
en = Focus working size
fr = Taille de travail du focus
en = What the model works at, a share of the focus view. Lower costs less; the picture keeps its own detail.
fr = La taille à laquelle travaille le modèle, en part de la vue de focus. Plus bas coûte moins ; l’image garde son propre détail.
en = Working size limit
fr = Limite de taille de travail
en = The most one view’s model works on, in megapixels, whatever the sizes. Each megapixel costs about 2 ms of GPU time and 130 MB of video memory, per view.
fr = Le maximum que traite le modèle pour une vue, en mégapixels, quelles que soient les tailles. Chaque mégapixel coûte environ 2 ms de temps GPU et 130 MB de mémoire vidéo, par vue.
en = Edge blend
fr = Fondu des bords
en = The band over which the processed area fades into what isn’t processed around it.
fr = La bande sur laquelle la zone traitée se fond dans ce qui ne l’est pas autour.
en = Periphery too
fr = Périphérie aussi
en = Off, only the focus views are processed: where you look. On, the periphery too, at its own working size and coverage. It adds about 2 ms of GPU time per eye at least, however small you make it.
fr = Désactivé, seules les vues de focus sont traitées : là où vous regardez. Activé, la périphérie aussi, à sa propre taille de travail et couverture. Cela ajoute au moins 2 ms de temps GPU par œil, aussi petite soit-elle.
en = Periphery working size
fr = Taille de travail de la périphérie
en = As the focus working size, for the periphery.
fr = Comme la taille de travail du focus, pour la périphérie.
en = Periphery covered
fr = Périphérie couverte
en = How much of each eye’s view the model covers, around the focus area.
fr = La part de la vue de chaque œil que couvre le modèle, autour de la zone de focus.
en = Foveated DLSS
fr = Foveated DLSS
en = Off leaves the game’s own DLSS on every view.
fr = Désactivé laisse le DLSS du jeu sur toutes les vues.
en = Outer preset
fr = Préréglage extérieur
en = The DLSS preset of the outer views’ own pass (Cheaper outer views).
fr = Le préréglage DLSS de la passe propre aux vues extérieures (Vues extérieures allégées).
en = Fix motion-vector blur
fr = Corriger le flou des vecteurs
en = Cheeky’s workaround for smearing with some presets. Adds GPU work.
fr = Le correctif de Cheeky contre les traînées avec certains préréglages. Ajoute du travail GPU.
en = DLSS-NR
fr = DLSS-NR
en = NVIDIA’s DLSS-NR (DLSS 5) on the focus views. Needs nvngx_dlssnr.dll next to the game.
fr = DLSS-NR (DLSS 5) de NVIDIA sur les vues de focus. Nécessite nvngx_dlssnr.dll à côté du jeu.
en = DLSS-NR passes
fr = Passes DLSS-NR
en = Each extra DLSS-NR pass costs about one more NR evaluation.
fr = Chaque passe DLSS-NR en plus coûte environ une évaluation NR de plus.
en = Multiplier
fr = Multiplicateur
en = Frames shown per frame the game renders: 2x adds one generated frame between each two of the game’s.
fr = Images affichées par image rendue par le jeu : 2x ajoute une image générée entre deux images du jeu.
en = Center FG scale
fr = Échelle FG centrale
en = Frame generation’s resolution in the center region. Lower uses less GPU time and memory.
fr = La résolution de la génération d’images dans la région centrale. Plus basse, elle consomme moins de temps GPU et de mémoire.
en = Periphery FG scale
fr = Échelle FG périphérie
en = Frame generation’s resolution around the center region. Lower uses less GPU time and memory.
fr = La résolution de la génération d’images autour de la région centrale. Plus basse, elle consomme moins de temps GPU et de mémoire.
en = Release game
fr = Libérer le jeu
en = When the game starts its next frame. Never: CPU and GPU overlap (most frames). Capture: after the GPU finishes. Generated: after the generated frame.
fr = Quand le jeu démarre son image suivante. Jamais : CPU et GPU se chevauchent (le plus d’images). Capture : après la fin du GPU. Générée : après l’image générée.
en = Show the center region
fr = Afficher la région centrale
en = Outlines the region in the headset, to check that it follows your eyes.
fr = Entoure la région dans le casque, pour vérifier qu’elle suit vos yeux.
en = Rim
fr = Bord
en = How far the helmet’s padding reaches into the view.
fr = Jusqu’où le rembourrage du casque de pilote entre dans la vue.
en = Corners
fr = Coins
en = Rounds the helmet’s visor opening.
fr = Arrondit l’ouverture de la visière du casque de pilote.
en = Lighting
fr = Éclairage
en = How much the scene lights the helmet.
fr = À quel point la scène éclaire le casque de pilote.
en = Visor
fr = Visière
en = Your own images only: closed, half or open. Ctrl+Alt+V in the game steps it.
fr = Vos propres images uniquement : fermée, mi-ouverte ou ouverte. Ctrl+Alt+V en jeu la fait passer de l’une à l’autre.
en = Depth
fr = Profondeur
en = Your own images only: how far in front of your eyes, in cm. 0 is far away, with no depth.
fr = Vos propres images uniquement : à quelle distance devant vos yeux, en cm. 0 = au loin, sans profondeur.
en = Detail
fr = Détail
en = Your own images only: Detail (4096) is sharper, Performance (2048) costs less GPU time and memory.
fr = Vos propres images uniquement : Détail (4096) est plus net, Performances (2048) coûte moins de temps GPU et de mémoire.
en = Degrees right of straight ahead. Negative is left. Drag it in Placement, or move it in the headset.
fr = Degrés à droite du regard droit devant. Négatif = à gauche. Faites-le glisser dans Position, ou déplacez-le dans le casque.
en = Degrees above eye level. Negative is below. Drag it in Placement, or move it in the headset.
fr = Degrés au-dessus du niveau des yeux. Négatif = en dessous. Faites-le glisser dans Position, ou déplacez-le dans le casque.
en = How wide it is, in degrees of your view.
fr = Sa largeur, en degrés de votre champ de vision.
en = A line under the headset menu with the in-game hotkeys (overlay, visor, CPU capture) and their wheel buttons, as set in Hotkeys. Also on the menu’s Headset page.
fr = Une ligne sous le menu du casque avec les raccourcis en jeu (overlay, visière, capture CPU) et leurs boutons du volant, tels que réglés dans Raccourcis. Aussi sur la page Casque du menu.
en = Open or close
fr = Ouvrir ou fermer
en = Opens the headset menu, or closes it.
fr = Ouvre ou ferme le menu du casque.
en = Up
fr = Haut
en = Selects the line above in the headset menu.
fr = Sélectionne la ligne du dessus dans le menu du casque.
en = Down
fr = Bas
en = Selects the line below in the headset menu.
fr = Sélectionne la ligne du dessous dans le menu du casque.
en = Left
fr = Gauche
en = Lowers the selected value in the headset menu.
fr = Baisse la valeur sélectionnée dans le menu du casque.
en = Right
fr = Droite
en = Raises the selected value in the headset menu.
fr = Augmente la valeur sélectionnée dans le menu du casque.
en = Overlay
fr = Overlay
en = Turns the performance overlay on or off.
fr = Active ou désactive l’overlay de performances.
en = Helmet visor
fr = Visière du casque
en = Steps the helmet’s visor: closed, half, open.
fr = Change la visière du casque de pilote : fermée, mi-ouverte, ouverte.
en = Helmet images
fr = Images du casque
en = Your own helmet: top.png, bottom.png and visor.png in the helmet folder next to the layer. Size and Height place them (degrees of view, and above straight ahead).
fr = Votre propre casque : top.png, bottom.png et visor.png dans le dossier helmet à côté de la couche. Taille et Hauteur les placent (degrés de vision, et au-dessus du regard droit devant).
en = From the periphery
fr = Depuis la périphérie

