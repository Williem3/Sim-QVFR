fr = Bas droit, haut
en = Custom corners pulls each corner of the focus area in, e.g. the top ones for a trapezoid
fr = Coins personnalisés rentre chaque coin de la zone de focus, p. ex. ceux du haut pour un trapèze
en = The cut corners aren't rendered: the shape saves pixels too
fr = Les coins coupés ne sont pas rendus : la forme économise aussi des pixels
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High. The switches below stay as you set them. Low costs about half the GPU time of High and looks a little grainier; the periphery always runs one step below the focus area, where it's least seen.
fr = Le niveau de finesse des effets : moins d’échantillons et de pas pour les ombres, l’occlusion et le lissage en Faible, tous en Élevé. Les interrupteurs ci-dessous restent comme vous les avez réglés. Faible coûte environ la moitié du temps GPU d’Élevé et paraît un peu plus granuleux ; la périphérie tourne toujours un cran en dessous de la zone de focus, là où elle se voit le moins.
en = Quality sets how finely each effect is worked out, not which are on: Low costs about half the GPU time of High. Night car lighting itself starts at the next launch; everything else changes while you drive.
fr = La qualité règle la finesse de chaque effet, pas lesquels sont actifs : Faible coûte environ la moitié du temps GPU d’Élevé. L’éclairage de nuit des voitures lui-même démarre au prochain lancement ; tout le reste change pendant que vous roulez.
en = Sets the switches below by their GPU cost: Low keeps paint detail, lacquer reflections and headlight highlights, Medium adds shadows on the ground, High adds floodlight shadows. Night vision color isn't part of it. Changing any switch yourself shows no preset selected.
fr = Règle les interrupteurs ci-dessous selon leur coût GPU : Faible garde le détail de peinture, les reflets du vernis et les brillances des phares, Moyen ajoute les ombres au sol, Élevé ajoute les ombres des projecteurs. La couleur vision nocturne n’en fait pas partie. Si vous changez un interrupteur vous-même, aucun préréglage n’est sélectionné.
en = Custom: the switches below don’t match a preset.
fr = Personnalisé : les interrupteurs ci-dessous ne correspondent à aucun préréglage.
en = Low, Medium and High set the switches by their GPU cost; night vision is left as you set it. Night car lighting itself starts at the next launch; everything else changes while you drive.
fr = Faible, Moyen et Élevé règlent les interrupteurs selon leur coût GPU ; la vision nocturne reste comme vous l’avez réglée. L’éclairage de nuit lui-même démarre au prochain lancement ; tout le reste change pendant que vous roulez.
