en = Relights the cars at night: highlights from the floodlights and headlights, shading in the creases.
fr = Rééclaire les voitures la nuit : brillances des projecteurs et des phares, ombrage dans les creux.
en = Parts of a car hidden from a floodlight lose its light and highlight.
fr = Les parties d’une voiture cachées d’un projecteur perdent sa lumière et sa brillance.
en = The paint’s orange peel and the carbon’s weave in the highlights.
fr = La peau d’orange de la peinture et la trame du carbone dans les brillances.
