fr = Les ombres des voitures sur la piste et les murs autour d’elles.
en = The dark loses its colour and turns a little blue, as eyes see at night.
fr = Le sombre perd sa couleur et vire un peu au bleu, comme les yeux voient la nuit.
en = Quality sets how finely each effect is worked out, not which are on: Low takes about a third less GPU time than High. Night car lighting itself starts at the next launch; everything else changes while you drive.
fr = La qualité règle la finesse de chaque effet, pas lesquels sont actifs : Faible prend environ un tiers de temps GPU de moins qu’Élevé. L’éclairage de nuit des voitures lui-même démarre au prochain lancement ; tout le reste change pendant que vous roulez.
