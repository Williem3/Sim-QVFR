; No longer in Sim-QVFR (kept to reuse; ignored where the English isn't shown any more):
en = The focus area renders in full detail only along the road ahead: about 10 m either side of the road and 3.5 m above it, following its hills and bends. Trees, grandstands, hills and the sky beside and above that come from the periphery’s image, as does the cockpit; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. Turn it off if something beside the road looks softer than you want. Changes while you drive.
fr = La zone de focus n’est rendue en pleine définition que le long de la route devant vous : environ 10 m de chaque côté de la route et 3,5 m au-dessus, en suivant ses bosses et ses virages. Les arbres, les tribunes, les collines et le ciel à côté et au-dessus viennent de l’image de la périphérie, tout comme le cockpit ; là où vous regardez en conduisant, vous ne devriez voir aucune différence. Cela économise du temps GPU, davantage avec une zone de focus plus grande. Désactivez-le si quelque chose au bord de la route vous paraît trop doux. Change pendant que vous roulez.
en = DLAA on the road only
fr = DLAA sur la route seulement
en = With Road focus and Sim-QVFR’s DLSS on: the focus area’s DLAA runs only over the rows the road covers, the rest takes the periphery’s DLAA. It saves more GPU time. Turn it off if you see a soft strip above or below the road for a moment when you look up or down quickly. Changes while you drive.
fr = Avec le focus sur la route et le DLSS de Sim-QVFR activés : le DLAA de la zone de focus ne passe que sur les lignes que couvre la route, le reste prend le DLAA de la périphérie. Cela économise encore du temps GPU. Désactivez-le si vous voyez un instant une bande douce au-dessus ou en dessous de la route quand vous levez ou baissez vite les yeux. Change pendant que vous roulez.
en = Full detail along the road ahead; the scenery beside and above it from the periphery.
fr = Pleine définition le long de la route devant vous ; le décor à côté et au-dessus vient de la périphérie.
en = With Sim-QVFR’s DLSS on: the focus area’s DLAA over the road’s rows alone.
fr = Avec le DLSS de Sim-QVFR activé : le DLAA de la zone de focus sur les seules lignes de la route.
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom corners: each corner moved in on its own; pull the top corners in for a trapezoid, more of the dash sharp at the same cost. To hide the area’s edge, raise Feather.
fr = La forme de la zone nette. Rectangle : arrondi par Rayon des coins. Coins personnalisés : chaque coin rentré séparément ; rentrez les coins du haut pour un trapèze, plus de tableau de bord net pour le même coût. Pour masquer le bord de la zone, augmentez Fondu.
en = Custom corners
fr = Coins personnalisés
en = Top left in
fr = Haut gauche, intérieur
en = Top right in
fr = Haut droit, intérieur
en = Bottom left in
fr = Bas gauche, intérieur
en = Bottom right in
