fr = Au démarrage, le lanceur peut demander à GitHub la dernière version de Sim-QVFR et vous prévenir quand il y en a une. Rien d’autre n’est envoyé, et rien ne se télécharge tout seul. Vous pouvez changer cela dans À propos.
