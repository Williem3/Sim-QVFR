en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High. The switches below stay as you set them. Low costs about half the GPU time of High and looks a little grainier; the periphery always runs one step below the focus area, where it's least seen.
pt-BR = O quanto os efeitos são calculados em detalhe: menos amostras e passos para as sombras, a oclusão e a suavização em Baixa, todos em Alta. As chaves abaixo ficam como você as deixou. Baixa custa cerca de metade do tempo de GPU de Alta e fica um pouco mais granulada; a periferia sempre roda um nível abaixo da área de foco, onde menos se nota.
en = Quality sets how finely each effect is worked out, not which are on: Low costs about half the GPU time of High. Night car lighting itself starts at the next launch; everything else changes while you drive.
pt-BR = A qualidade define o quanto cada efeito é calculado em detalhe, não quais estão ligados: Baixa custa cerca de metade do tempo de GPU de Alta. A iluminação noturna dos carros em si começa no próximo lançamento; todo o resto muda enquanto você dirige.
en = Sets the switches below by their GPU cost: Low keeps paint detail, lacquer reflections and headlight highlights, Medium adds shadows on the ground, High adds floodlight shadows. Night vision color isn't part of it. Changing any switch yourself shows no preset selected.
pt-BR = Ajusta as chaves abaixo pelo custo de GPU: Baixa mantém o detalhe da pintura, os reflexos do verniz e os brilhos dos faróis, Média acrescenta as sombras no chão, Alta acrescenta as sombras dos refletores. A cor da visão noturna não faz parte. Se você mudar uma chave por conta própria, nenhuma predefinição fica selecionada.
en = Custom: the switches below don’t match a preset.
pt-BR = Personalizado: as chaves abaixo não correspondem a uma predefinição.
en = Low, Medium and High set the switches by their GPU cost; night vision is left as you set it. Night car lighting itself starts at the next launch; everything else changes while you drive.
pt-BR = Baixa, Média e Alta ajustam as chaves pelo custo de GPU; a visão noturna fica como você a definiu. A iluminação noturna em si começa no próximo início; todo o resto muda enquanto você pilota.
