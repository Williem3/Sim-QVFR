; No longer in Sim-QVFR (kept to reuse; ignored where the English isn't shown any more):
en = The focus area renders in full detail only along the road ahead: about 10 m either side of the road and 3.5 m above it, following its hills and bends. Trees, grandstands, hills and the sky beside and above that come from the periphery’s image, as does the cockpit; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. Turn it off if something beside the road looks softer than you want. Changes while you drive.
pt-BR = A área de foco é renderizada com todo o detalhe apenas ao longo da pista à sua frente: cerca de 10 m de cada lado da pista e 3,5 m acima dela, acompanhando as subidas e as curvas. Árvores, arquibancadas, morros e o céu ao lado e acima vêm da imagem da periferia, assim como o cockpit; onde você olha enquanto dirige, não deve ver diferença. Economiza tempo de GPU, mais com uma área de foco maior. Desligue se algo ao lado da pista parecer mais suave do que você quer. Muda enquanto você dirige.
en = DLAA on the road only
pt-BR = DLAA só na pista
en = With Road focus and Sim-QVFR’s DLSS on: the focus area’s DLAA runs only over the rows the road covers, the rest takes the periphery’s DLAA. It saves more GPU time. Turn it off if you see a soft strip above or below the road for a moment when you look up or down quickly. Changes while you drive.
pt-BR = Com o foco na pista e o DLSS do Sim-QVFR ligados: o DLAA da área de foco roda só nas linhas que a pista ocupa; o resto usa o DLAA da periferia. Economiza ainda mais tempo de GPU. Desligue se você vir por um instante uma faixa suave acima ou abaixo da pista ao olhar rápido para cima ou para baixo. Muda enquanto você dirige.
en = Full detail along the road ahead; the scenery beside and above it from the periphery.
pt-BR = Todo o detalhe ao longo da pista à frente; o cenário ao lado e acima vem da periferia.
en = With Sim-QVFR’s DLSS on: the focus area’s DLAA over the road’s rows alone.
pt-BR = Com o DLSS do Sim-QVFR ligado: o DLAA da área de foco só nas linhas da pista.
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom corners: each corner moved in on its own; pull the top corners in for a trapezoid, more of the dash sharp at the same cost. To hide the area’s edge, raise Feather.
pt-BR = A forma da área nítida. Retângulo: arredondado por Raio dos cantos. Cantos personalizados: cada canto movido para dentro separadamente; puxe os cantos de cima para um trapézio, mais do painel nítido pelo mesmo custo. Para esconder a borda da área, aumente a Suavização.
