en = Only the game’s own threads move: no Windows setting or other program changes. It applies on CPUs with 6 or more cores and two threads per core, and stays off if another tool (such as Process Lasso) already set the game’s CPU sets or affinity. Try it on and watch your frames; the headset menu’s Game page changes it too.
pt-BR = Só as threads do próprio jogo mudam: nenhuma configuração do Windows nem outro programa é alterado. Vale em CPUs com 6 ou mais núcleos e duas threads por núcleo, e fica desligado se outra ferramenta (como o Process Lasso) já definiu os conjuntos de CPU ou a afinidade do jogo. Ligue e observe seus quadros; a página Jogo do menu do headset também o altera.
en = Turbo mode
pt-BR = Modo Turbo
en = On: the game doesn’t wait for the headset at the start of each frame. It starts its next frame’s work while the headset runtime waits for its display slot, for more frames when the CPU limits them.
pt-BR = Ligado: o jogo não espera o headset no início de cada quadro. Ele começa o trabalho do próximo quadro enquanto o runtime do headset espera a vez de exibir, para mais quadros quando a CPU os limita.
en = Off (the default): the game waits for the headset at the start of each frame, as it normally does.
pt-BR = Desligado (o padrão): o jogo espera o headset no início de cada quadro, como normalmente faz.
en = Turbo mode stays off while Cheeky’s frame generation is on: the game can crash with both.
pt-BR = O modo Turbo fica desligado enquanto a geração de quadros do Cheeky estiver ligada: o jogo pode travar com os dois.
en = Don’t turn on OpenXR Toolkit’s Turbo mode as well: one is enough. It may add a little latency; try it on and watch your frames. The headset menu’s Game page changes it too.
pt-BR = Não ligue também o modo Turbo do OpenXR Toolkit: um basta. Pode somar um pouco de latência; teste ligado e observe seus quadros. A página Jogo do menu do headset também o altera.

