; src/launcher/ui/help.cpp
en = Rendering method
pt-BR = Método de renderização
en = Quad View Foveated Rendering draws the outer and focus views in one game frame: the lightest on the CPU, and the one with every feature. Two-loop (legacy) draws two whole game frames per headset frame: about twice the CPU work per frame, and no frame generation.
pt-BR = O Quad View Foveated Rendering desenha as vistas externas e de foco em um único quadro do jogo: o mais leve para a CPU, e o que tem todos os recursos. O Two-loop (legado) desenha dois quadros inteiros do jogo por quadro do headset: cerca do dobro do trabalho de CPU por quadro, e sem geração de quadros.
en = Foveated mode
pt-BR = Modo foveado
en = Eye tracked: the sharp area follows your eyes, so it can be small and dense; it needs a headset with eye tracking. Fixed: the area stays in the centre, so make it larger, since your eyes move off it.
pt-BR = Com rastreamento ocular: a área nítida segue seus olhos, então pode ser pequena e densa; precisa de um headset com rastreamento ocular. Fixo: a área fica no centro, então deixe-a maior, já que seus olhos saem dela.
en = Periphery resolution
pt-BR = Resolução da periferia
en = The wide view around the focus area, a share of the headset’s recommended resolution. It covers most of the view but you see it with your side vision, so it is the first to lower: it saves GPU time and VRAM roughly with its pixels. The preview’s Pixels per frame shows the total.
pt-BR = A vista ampla em volta da área de foco, uma fração da resolução recomendada do headset. Ela cobre a maior parte da vista, mas você a vê com a visão lateral, então é a primeira a baixar: economiza tempo de GPU e VRAM mais ou menos na proporção dos pixels. Pixels por quadro, na prévia, mostra o total.
en = Focus density
pt-BR = Densidade de foco
en = Pixel density inside the focus area, a share of the headset’s native density. Above 100% it renders more pixels than the headset shows where you look: sharper text and edges. Its cost grows with the area’s size, so a small area can take a high density cheaply. Dragging moves it in 5% steps; the arrow keys move it by 1%.
pt-BR = Densidade de pixels dentro da área de foco, uma fração da densidade nativa do headset. Acima de 100%, renderiza mais pixels do que o headset mostra onde você olha: texto e bordas mais nítidos. O custo cresce com o tamanho da área, então uma área pequena aguenta uma densidade alta a baixo custo. Arrastar move em passos de 5%; as setas movem 1%.
en = Object detail
pt-BR = Detalhe de objetos
en = How detailed trees and objects are, and how far away they are still drawn. At 100% they are as sharp in the focus region as its pixel density shows them; lower settings move toward the game’s own detail for the periphery resolution. It costs CPU, not GPU: more detail means more objects for X-Plane’s main thread to prepare every frame, often what limits the frame rate with QVFR. Lower it if frames stutter in dense scenery; the focus region shows coarser trees.
pt-BR = Quão detalhados são árvores e objetos, e até que distância ainda são desenhados. Em 100%, eles ficam tão nítidos na região de foco quanto a densidade de pixels dela os mostra; valores menores se aproximam do detalhe do próprio jogo para a resolução da periferia. Custa CPU, não GPU: mais detalhe significa mais objetos para a thread principal do X-Plane preparar a cada quadro, muitas vezes o que limita a taxa de quadros com QVFR. Baixe se os quadros engasgarem em cenários densos; a região de foco mostra árvores mais grosseiras.
en = For a player who sees with one eye. The eye you choose shows black in the headset, and the game draws no focus view for it, renders only a few pixels of its scene and skips DLSS on it, so the GPU does much less. The game still prepares that eye’s frame, so the CPU saves little. With both eyes seeing, a black eye is uncomfortable: leave it at None.
pt-BR = Para quem enxerga com um olho só. O olho que você escolher fica preto no headset, e o jogo não desenha vista de foco para ele, renderiza só alguns pixels da cena dele e pula o DLSS nele, então a GPU trabalha bem menos. O jogo ainda prepara o quadro desse olho, então a CPU economiza pouco. Com os dois olhos enxergando, um olho preto é desconfortável: deixe em Nenhum.
en = Sharpening
pt-BR = Nitidez
en = Crisper edges and text in the focus area; too much makes it shimmer. Raise it a little if the view looks soft (0% is off); it costs a little GPU time and changes while you drive. How: AMD FidelityFX Contrast Adaptive Sharpening, applied as Sim-QVFR resamples the focus view for the headset. Each pixel is sharpened by how much contrast room it has, so soft detail gains the most and edges already sharp gain little. The percentage is CAS’s own sharpness, as other CAS sharpeners show it: any setting above 0% already sharpens. Only the focus area is sharpened, fading out across its feather so its edge stays even: your side vision sees shimmer more than detail. 0% is off; it changes while you drive.
pt-BR = Bordas e texto mais nítidos na área de foco; demais faz cintilar. Aumente um pouco se a vista parecer suave (0% é desligado); custa um pouco de tempo de GPU e muda enquanto você pilota. Como: AMD FidelityFX Contrast Adaptive Sharpening, aplicado quando o Sim-QVFR reamostra a vista de foco para o headset. Cada pixel ganha nitidez conforme a margem de contraste que tem, então detalhes suaves ganham mais e bordas já nítidas ganham pouco. A porcentagem é a nitidez do próprio CAS, como outros filtros CAS a mostram: qualquer valor acima de 0% já aumenta a nitidez. Só a área de foco ganha nitidez, que some ao longo da suavização para a borda ficar uniforme: a visão lateral percebe mais a cintilação do que o detalhe. 0% é desligado; muda enquanto você pilota.
en = Periphery texture match
pt-BR = Igualar texturas da periferia
en = Makes fences, nets and other see-through surfaces look the same in your side vision as in the focus area. At the periphery’s lower resolution the game blends them into a light solid shade, so the focus area looked darker behind them. At 100% the periphery reads its textures at the same detail level as the focus area; lower it if distant textures shimmer in your side vision. 0% is off (the game’s own); it changes while you drive.
pt-BR = Faz cercas, redes e outras superfícies vazadas parecerem iguais na visão lateral e na área de foco. Na resolução mais baixa da periferia, o jogo as funde em um tom claro e sólido, e por isso a área de foco parecia mais escura atrás delas. Em 100% a periferia lê as texturas no mesmo nível de detalhe da área de foco; diminua se texturas distantes cintilarem na visão lateral. 0% é desligado (como no jogo); muda enquanto você pilota.
en = Game Lighting Enhancement
pt-BR = Iluminação do jogo aprimorada
en = Adds highlights and shading to the cars at night. Sim-QVFR relights each car after the game draws it, before the game's own post-processing: highlights where the floodlights and headlights reflect off the paint, shading in creases and under the car, and the effects below. The rest of the scene is untouched. Measured on an RTX 5070 Ti with everything on at High: about 1 ms of GPU time in a quiet scene, 2 to 3.7 ms in race traffic, and 0.4 to 0.9 ms of CPU time; none of the switches below adds measurable CPU time. The switch takes effect at the next launch; the values and effects change while you drive.
pt-BR = Adiciona brilhos e sombreamento aos carros à noite. Sim-QVFR reilumina cada carro depois que o jogo o desenha, antes do pós-processamento do próprio jogo: brilhos onde refletores e faróis se refletem na pintura, sombreamento nas dobras e sob o carro, e os efeitos abaixo. O resto da cena não é tocado. Medido em uma RTX 5070 Ti com tudo ligado em Alta: cerca de 1 ms de GPU em uma cena tranquila, de 2 a 3,7 ms no tráfego de corrida e de 0,4 a 0,9 ms de CPU; nenhuma das chaves abaixo adiciona tempo de CPU mensurável. A chave vale a partir do próximo início; os valores e os efeitos mudam enquanto você pilota.
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High; the reflections keep all theirs at every tier. The switches below stay as you set them, and the periphery always runs one step below the focus area, where it's least seen. Measured in a night race on an RTX 5070 Ti with everything on: High 1.35 to 1.55 ms of GPU time, Medium 1.10 to 1.30 ms, Low 1.00 to 1.10 ms, a quarter to a third less than High. In testing Low looked a little grainier than High, its floodlight shadows almost unchanged.
pt-BR = O quanto os efeitos são calculados em detalhe: menos amostras e passos para as sombras, a oclusão e a suavização em Baixa, todos em Alta; os reflexos mantêm todos os seus em todos os níveis. As chaves abaixo ficam como você as deixou, e a periferia sempre roda um nível abaixo da área de foco, onde menos se nota. Medido em uma corrida noturna em uma RTX 5070 Ti com tudo ligado: Alta de 1,35 a 1,55 ms de GPU, Média de 1,10 a 1,30 ms, Baixa de 1,00 a 1,10 ms, de um quarto a um terço a menos que Alta. Nos testes, Baixa pareceu um pouco mais granulada que Alta, com as sombras dos refletores quase iguais.
en = Fill light
pt-BR = Luz de preenchimento
en = How much of the game's own floodlight lighting stays on the cars. Lower makes the shading and highlights stand out more; 100% keeps the game's brightness. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
pt-BR = Quanto da iluminação dos holofotes do próprio jogo permanece nos carros. Mais baixo faz o sombreamento e os brilhos se destacarem mais; 100% mantém o brilho do jogo. Faz parte da reiluminação básica, cerca de 0,4 ms de GPU em uma cena tranquila e 1 ms no tráfego de corrida (medido em Alta em uma RTX 5070 Ti), e custa o mesmo em qualquer valor.
en = Ambient occlusion
pt-BR = Oclusão de ambiente
en = Darkens creases, wheel arches and the underside, where light reaches less. 0% is off. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
pt-BR = Escurece dobras, caixas de roda e a parte de baixo, onde chega menos luz. 0% é desligado. Faz parte da reiluminação básica, cerca de 0,4 ms de GPU em uma cena tranquila e 1 ms no tráfego de corrida (medido em Alta em uma RTX 5070 Ti), e custa o mesmo em qualquer valor.
en = Highlights
pt-BR = Brilhos
en = The strength of the floodlights' and headlights' reflections on the paint. 0% is off; above 100% is brighter than the lights would make it. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
pt-BR = A intensidade dos reflexos de refletores e faróis na pintura. 0% é desligado; acima de 100% é mais brilhante do que as luzes fariam. Faz parte da reiluminação básica, cerca de 0,4 ms de GPU em uma cena tranquila e 1 ms no tráfego de corrida (medido em Alta em uma RTX 5070 Ti), e custa o mesmo em qualquer valor.
en = Paint gloss
pt-BR = Brilho da pintura
en = How glossy the lacquer is: higher gives smaller, sharper highlights, lower broad soft ones. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
pt-BR = Quão brilhante é o verniz: mais alto dá brilhos menores e mais nítidos, mais baixo brilhos amplos e suaves. Faz parte da reiluminação básica, cerca de 0,4 ms de GPU em uma cena tranquila e 1 ms no tráfego de corrida (medido em Alta em uma RTX 5070 Ti), e custa o mesmo em qualquer valor.
en = Smoothing
pt-BR = Suavização
en = Smooths the surface direction over this distance where the game's own normals aren't available, which hides faceted highlights on low-polygon parts. About 15 cm suits most cars; 0 is off.
pt-BR = Suaviza a direção da superfície nessa distância onde as normais do próprio jogo não estão disponíveis, o que esconde brilhos facetados em peças com poucos polígonos. Cerca de 15 cm serve para a maioria dos carros; 0 é desligado.
en = Floodlight shadows
pt-BR = Sombras dos refletores
en = A part of a car hidden from a floodlight, behind a wing or another car, loses that light and its highlight. Measured at High on an RTX 5070 Ti: about 0.2 ms of GPU time in a quiet scene, 0.5 ms in race traffic.
pt-BR = Uma parte de um carro escondida de um refletor, atrás de uma asa ou de outro carro, perde essa luz e o seu brilho. Medido em Alta em uma RTX 5070 Ti: cerca de 0,2 ms de GPU em uma cena tranquila, 0,5 ms no tráfego de corrida.
en = Paint detail
pt-BR = Detalhe da pintura
en = Uses the paint's fine surface detail, orange peel and the carbon weave, in the highlights. Measured at High on an RTX 5070 Ti: about 0.1 ms of GPU time in race traffic, too little to measure in a quiet scene.
pt-BR = Usa nos brilhos o detalhe fino da superfície da pintura, a casca de laranja e a trama do carbono. Medido em Alta em uma RTX 5070 Ti: cerca de 0,1 ms de GPU no tráfego de corrida, pouco demais para medir em uma cena tranquila.
en = Lacquer reflections
pt-BR = Reflexos do verniz
en = Mirrors what's around a car in its paint, strongest at shallow angles. Only what's on screen can be reflected, and only where both eyes can see it, so both eyes show the same. Measured on an RTX 5070 Ti: about 0.02 ms of GPU time in a quiet scene, 0.15 ms in race traffic.
pt-BR = Espelha na pintura o que está ao redor do carro, mais forte em ângulos rasantes. Só dá para refletir o que está na tela e só onde os dois olhos veem, para que os dois olhos mostrem o mesmo. Medido em uma RTX 5070 Ti: cerca de 0,02 ms de GPU em uma cena tranquila, 0,15 ms no tráfego de corrida.
en = Headlight highlights
pt-BR = Brilhos dos faróis
en = Other cars' headlights, and yours in the mirrors, shine on the paint as the floodlights do. Measured on an RTX 5070 Ti: about 0.03 to 0.05 ms of GPU time.
pt-BR = Os faróis de outros carros, e os seus nos retrovisores, iluminam a pintura como os refletores. Medido em uma RTX 5070 Ti: cerca de 0,03 a 0,05 ms de GPU.
en = Shadows on the ground
pt-BR = Sombras no chão
en = Darkens the track and walls under and beside the cars, and casts soft floodlight shadows, so the cars sit on the ground. Measured at High on an RTX 5070 Ti: about 0.2 ms of GPU time in a quiet scene, 0.55 ms in race traffic.
pt-BR = Escurece a pista e os muros sob e ao lado dos carros, e projeta sombras suaves dos refletores, para os carros assentarem no chão. Medido em Alta em uma RTX 5070 Ti: cerca de 0,2 ms de GPU em uma cena tranquila, 0,55 ms no tráfego de corrida.
en = Night vision color
pt-BR = Cor da visão noturna
en = As eyes do at night, dark areas lose their colour and turn slightly blue while lit areas keep theirs. A matter of taste, off by default. Measured on an RTX 5070 Ti: about 0.03 ms of GPU time.
pt-BR = Como os olhos à noite, as áreas escuras perdem a cor e ficam levemente azuis, enquanto as iluminadas mantêm a sua. Questão de gosto, desligado por padrão. Medido em uma RTX 5070 Ti: cerca de 0,03 ms de GPU.
en = Color correction
pt-BR = Correção de cor
en = Adjusts the picture in the headset: exposure, brightness, contrast and saturation, for a game that looks too dark, washed out or dull in your headset. Sim-QVFR applies it as it composes the views, the periphery and the focus area alike, so the focus area never stands out; it costs almost no GPU time and changes while you drive. Menus and loading screens show as the game draws them. Off, or every value at 0, leaves the picture as it was.
pt-BR = Ajusta a imagem no headset: exposição, brilho, contraste e saturação, para um jogo que parece escuro demais, desbotado ou sem vida no seu headset. O Sim-QVFR aplica ao compor as vistas, igualmente na periferia e na área de foco, então a área de foco nunca se destaca; custa quase nada de GPU e muda enquanto você pilota. Menus e telas de carregamento aparecem como o jogo os desenha. Desligada, ou com todos os valores em 0, a imagem fica como estava.
en = Exposure
pt-BR = Exposição
en = Scales all of the light, in stops (EV): +1.0 EV is twice as bright, -1.0 EV half, up to 3 stops either way. Highlights brighten with the rest and can clip, so raise it a little at a time; Brightness lifts the darks without touching them.
pt-BR = Escala toda a luz, em stops (EV): +1,0 EV é duas vezes mais claro, -1,0 EV metade, até 3 stops para cada lado. As altas luzes clareiam junto com o resto e podem estourar, então aumente aos poucos; o brilho levanta os escuros sem mexer neles.
en = Brightness
pt-BR = Brilho
en = Lightens or darkens the mid tones and shadows while black stays black and white stays white, so an OLED headset keeps its deep blacks: raise it to see into dark cockpits and night stints, lower it for a richer, darker picture.
pt-BR = Clareia ou escurece os tons médios e as sombras enquanto o preto continua preto e o branco continua branco, então um headset OLED mantém seus pretos profundos: aumente para enxergar em cockpits escuros e stints noturnos, diminua para uma imagem mais rica e escura.
en = Contrast
pt-BR = Contraste
en = Spreads the picture’s tones away from mid grey (above 0) or draws them towards it (below 0), as a gentle S-curve: black and white stay where they are and colours keep their hue. More contrast gives deeper shadows and brighter highlights; less shows more detail in both.
pt-BR = Afasta os tons da imagem do cinza médio (acima de 0) ou os aproxima dele (abaixo de 0), como uma curva em S suave: preto e branco ficam onde estão e as cores mantêm o tom. Mais contraste dá sombras mais profundas e brilhos mais intensos; menos mostra mais detalhe em ambos.
en = Saturation
pt-BR = Saturação
en = How strong the colours are: above 0 more vivid, below 0 more muted, -100% grey. Brightness is kept as each colour changes.
pt-BR = Quão fortes são as cores: acima de 0 mais vivas, abaixo de 0 mais apagadas, -100% cinza. O brilho é mantido enquanto cada cor muda.
en = Accent brightness
pt-BR = Brilho do destaque
en = How light or dark the game’s colour is. The wheel picks its hue and how strong it is; the launcher keeps its text and edges readable in light and dark mode.
pt-BR = Quão clara ou escura é a cor do jogo. A roda escolhe o tom e a intensidade; o launcher mantém textos e bordas legíveis nos modos claro e escuro.
en = Focus width
pt-BR = Largura do foco
en = The focus area’s width, a share of the view. Wider hides the edge between sharp and soft better; its pixels cost density × width × height, so a wide area at a high density costs the most. It changes while you drive; wider than the game started with (at your density) renders less dense until the next launch.
pt-BR = A largura da área de foco, uma fração da vista. Mais larga esconde melhor a borda entre nítido e suave; os pixels custam densidade × largura × altura, então uma área larga com densidade alta é a que mais custa. Muda enquanto você pilota; mais larga do que no início do jogo (na sua densidade) renderiza com menos densidade até o próximo início.
en = Focus height
pt-BR = Altura do foco
en = The focus area’s height, a share of the view. Taller covers more of the dash and mirrors; it costs pixels as the width does. Taller than the game started with (at your density) renders less dense until the next launch.
pt-BR = A altura da área de foco, uma fração da vista. Mais alta cobre mais do painel e dos retrovisores; custa pixels como a largura. Mais alta do que no início do jogo (na sua densidade) renderiza com menos densidade até o próximo início.
en = Corner radius
pt-BR = Raio dos cantos
en = Rounds the focus area’s corners, so its edge is harder to spot. No cost: the area renders as a rectangle either way.
pt-BR = Arredonda os cantos da área de foco, para a borda ficar menos visível. Sem custo: a área é renderizada como retângulo de qualquer forma.
en = Feather
pt-BR = Suavização
en = The band where the focus area blends into the outer view. Wider hides the edge better; no measurable cost.
pt-BR = A faixa onde a área de foco se mistura com a vista externa. Mais larga esconde melhor a borda; sem custo mensurável.
en = Gaze dead-zone
pt-BR = Zona morta do olhar
en = How far your eyes move before the focus area follows. A little keeps it still against eye-tracker noise; too much makes it lag when you look around. No GPU cost.
pt-BR = Quanto seus olhos se movem antes de a área de foco acompanhar. Um pouco a mantém parada contra o ruído do rastreador ocular; demais a deixa atrasada quando você olha em volta. Sem custo de GPU.
en = Gaze offset
pt-BR = Ajuste do olhar
en = Moves the eye-tracked focus area up or down, in degrees, for a tracker that sits a little off. No cost.
pt-BR = Move a área de foco com rastreamento ocular para cima ou para baixo, em graus, para um rastreador um pouco desalinhado. Sem custo.
en = Vertical position
pt-BR = Posição vertical
en = Moves the fixed focus area up or down, in degrees: towards the dash and mirrors, or the road. No cost.
pt-BR = Move a área de foco fixa para cima ou para baixo, em graus: em direção ao painel e retrovisores, ou à pista. Sem custo.
en = Crop the view
pt-BR = Recortar a vista
en = Cuts the edges a helmet or the lens hides before the game renders them. It saves GPU time and VRAM with the pixels cut; the headset shows black there.
pt-BR = Corta as bordas que um capacete ou a lente escondem antes de o jogo renderizá-las. Economiza tempo de GPU e VRAM conforme os pixels cortados; o headset mostra preto ali.
en = Top
pt-BR = Cima
en = How much of the top of each eye’s view the game doesn’t render. Saves pixels in proportion.
pt-BR = Quanto do topo da vista de cada olho o jogo não renderiza. Economiza pixels na mesma proporção.
en = Bottom
pt-BR = Baixo
en = How much of the bottom of each eye’s view the game doesn’t render. Saves pixels in proportion.
pt-BR = Quanto da parte de baixo da vista de cada olho o jogo não renderiza. Economiza pixels na mesma proporção.
en = Outer side (temple)
pt-BR = Lado externo (têmpora)
en = How much of each eye’s temple side the game doesn’t render. Saves pixels in proportion.
pt-BR = Quanto do lado da têmpora de cada olho o jogo não renderiza. Economiza pixels na mesma proporção.
en = Inner side (nose)
pt-BR = Lado interno (nariz)
en = How much of each eye’s nose side the game doesn’t render; the other eye still sees most of it. Saves pixels in proportion.
pt-BR = Quanto do lado do nariz de cada olho o jogo não renderiza; o outro olho ainda vê a maior parte. Economiza pixels na mesma proporção.
en = Show a helmet
pt-BR = Mostrar um capacete
en = Draws a helmet’s visor opening round the view, lit by the scene, in a layer of its own. It costs the headset a layer to composite; nothing for the game.
pt-BR = Desenha a abertura da viseira de um capacete em volta da vista, iluminada pela cena, em uma camada própria. Custa ao headset uma camada para compor; nada para o jogo.
en = Road focus
pt-BR = Foco na pista
en = For fixed foveation. The focus area renders in full detail only along the road ahead (Road width either side of it and 3.5 m above it, following its hills and bends) and in your own car: the wheel, dash, displays and mirrors inside the focus area stay sharp. Trees, grandstands, hills and the sky beside and above the road come from the periphery’s image; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. It’s off while the focus follows your eyes. Turn it off if something beside the road looks softer than you want. Changes while you drive.
pt-BR = Para foveação fixa. A área de foco é renderizada com todo o detalhe apenas ao longo da pista à sua frente (a largura da pista de cada lado e 3,5 m acima dela, acompanhando as subidas e as curvas) e no seu próprio carro: o volante, o painel, as telas e os retrovisores dentro da área de foco continuam nítidos. Árvores, arquibancadas, morros e o céu ao lado e acima da pista vêm da imagem da periferia; onde você olha enquanto dirige, não deve ver diferença. Economiza tempo de GPU, mais com uma área de foco maior. Fica desligado enquanto o foco segue seus olhos. Desligue se algo ao lado da pista parecer mais suave do que você quer. Muda enquanto você dirige.
en = Road width
pt-BR = Largura da pista
en = How far either side of the road’s centre stays in full detail with Road focus on. Lower keeps just the track sharp and saves the most; higher brings the kerbs, run-off and barriers into the focus area and saves less. 10 m suits most circuits. Changes while you drive.
pt-BR = Até onde, de cada lado do centro da pista, fica o detalhe total com o foco na pista ligado. Mais baixo deixa nítida só a pista e economiza mais; mais alto traz as zebras, as áreas de escape e as barreiras para a área de foco e economiza menos. 10 m servem para a maioria dos circuitos. Muda enquanto você dirige.
en = Cockpit preset
pt-BR = Predefinição de cockpit
en = The focus area’s shape, size and position Road focus sets when you switch it on, or at once when you pick the other one here. A: a large cockpit shape over the windscreen, dash and wheel. B: a smaller one moved down to the road and the dash. Adjust either afterwards as you like; your own shape, size and position come back when you switch Road focus off. When the headset composes the views itself, the size stays inside its own focus region and the position doesn’t apply.
pt-BR = A forma, o tamanho e a posição da área de foco que o foco na pista aplica ao ser ligado, ou na hora quando você escolhe a outra aqui. A: uma forma de cockpit grande sobre o para-brisa, o painel e o volante. B: uma menor, descida para a pista e o painel. Ajuste qualquer uma depois como quiser; sua própria forma, tamanho e posição voltam quando você desliga o foco na pista. Quando o headset compõe as vistas sozinho, o tamanho fica dentro da própria região de foco dele e a posição não se aplica.
en = Road widening
pt-BR = Alargamento da pista
en = How much Road focus’s sharp road widens with distance, in degrees either side, so a bend curving away far ahead (Eau Rouge, a hairpin, the pit exit) stays in full detail. Lower saves more, but a far bend can turn soft; higher catches tighter bends and brings more of the far scenery into the focus area, saving less. 15° suits most circuits. Changes while you drive.
pt-BR = Quanto a pista nítida do foco na pista se alarga com a distância, em graus de cada lado, para que uma curva que se afasta lá na frente (Eau Rouge, um grampo, a saída dos boxes) fique com detalhe total. Mais baixo economiza mais, mas uma curva distante pode ficar borrada; mais alto pega curvas mais fechadas e traz mais da paisagem distante para a área de foco, então economiza menos. 15° servem para a maioria dos circuitos. Muda enquanto você dirige.
en = Road edge blend
pt-BR = Transição da borda da pista
en = How softly Road focus’s full detail fades into the periphery at its edges: this many metres near you, wider in proportion far away so distant edges fade too. Raise it if you notice where the sharp area ends; 0 is a hard edge. Changes while you drive.
pt-BR = O quanto o detalhe total do foco na pista se mistura suavemente com a periferia nas bordas: tantos metros perto de você, mais largo em proporção ao longe para que as bordas distantes também se misturem. Aumente se notar onde a área nítida termina; 0 é uma borda dura. Muda enquanto você dirige.
en = Show Road focus area
pt-BR = Mostrar a área do foco na pista
en = Tints blue, in the headset, everything Road focus takes from the periphery, so you can see exactly what stays in full detail (untinted) as you drive. Road focus works as usual meanwhile. For setting up; turn it off to drive.
pt-BR = Pinta de azul, no headset, tudo o que o foco na pista tira da periferia, para você ver exatamente o que fica com todo o detalhe (sem cor) enquanto dirige. O foco na pista funciona normalmente enquanto isso. Para ajustar; desligue para dirigir.
en = Road height
pt-BR = Altura da pista
en = How high above the road stays in full detail with Road focus on. Lower keeps just the road and the cars sharp and saves the most; higher brings signs, gantries and the grandstands’ lower rows into the focus area and saves less. 3.5 m suits most circuits. Changes while you drive.
pt-BR = Até que altura acima da pista fica o detalhe total com o foco na pista ligado. Mais baixo deixa nítidos só a pista e os carros e economiza mais; mais alto traz placas, pórticos e as primeiras fileiras das arquibancadas para a área de foco e economiza menos. 3,5 m servem para a maioria dos circuitos. Muda enquanto você dirige.
en = Show focus outline
pt-BR = Mostrar contorno do foco
en = Draws the focus area’s edge, to see where it is and how it follows your eyes. For setting up; turn it off to drive.
pt-BR = Desenha a borda da área de foco, para ver onde ela está e como segue seus olhos. Para ajustes; desligue para pilotar.
en = Use Cheeky Foveated DLSS
pt-BR = Usar Cheeky Foveated DLSS
en = Runs Cheeky Foveated DLSS inside the game, for the DLSS options below. Needs an NVIDIA RTX GPU, DLSS on in the game, and Cheeky’s download. Applies at the next launch.
pt-BR = Roda o Cheeky Foveated DLSS dentro do jogo, para as opções de DLSS abaixo. Precisa de uma GPU NVIDIA RTX, DLSS ligado no jogo e o download do Cheeky. Vale no próximo início.
en = Cheaper outer views
pt-BR = Vistas externas mais leves
en = The outer views get Cheeky’s DLAA at a lower resolution instead of the game’s DLSS: GPU time saved on the views you see least.
pt-BR = As vistas externas recebem o DLAA do Cheeky em resolução menor em vez do DLSS do jogo: tempo de GPU economizado nas vistas que você menos vê.
en = Outer DLAA scale
pt-BR = Escala do DLAA externo
en = The resolution of that cheaper pass. Lower saves more GPU time and softens the side view.
pt-BR = A resolução desse passe mais leve. Menor economiza mais tempo de GPU e suaviza a vista lateral.
en = Focus supersampling
pt-BR = Supersampling do foco
en = Renders the focus views above their size before DLSS: a sharper centre, for more GPU time.
pt-BR = Renderiza as vistas de foco acima do tamanho delas antes do DLSS: centro mais nítido, por mais tempo de GPU.
en = Frame generation
pt-BR = Geração de quadros
en = Cheeky’s DLSS frame generation adds frames between the game’s: smoother motion when the game can’t hold the refresh rate, for some GPU time and latency. Turn OpenXR Toolkit’s Turbo mode off with it, and run no other frame generator.
pt-BR = A geração de quadros DLSS do Cheeky adiciona quadros entre os do jogo: movimento mais suave quando o jogo não segura a taxa de atualização, por algum tempo de GPU e latência. Desligue o modo Turbo do OpenXR Toolkit junto, e não use outro gerador de quadros.
en = Center region
pt-BR = Região central
en = The part of the view frame generation makes at full quality (it follows your eyes when eye tracked). Larger looks better and costs more GPU time.
pt-BR = A parte da vista que a geração de quadros faz em qualidade total (segue seus olhos com rastreamento ocular). Maior fica melhor e custa mais tempo de GPU.
en = Load order
pt-BR = Ordem de carregamento
en = Nearest the game first. Each launch loads these below the Sim-QVFR layer in this order; a layer off in Windows can still be loaded for the game alone. Locked switches keep the mod and the game working.
pt-BR = Mais perto do jogo primeiro. Cada início carrega estas abaixo da camada do Sim-QVFR nesta ordem; uma camada desligada no Windows ainda pode ser carregada só para o jogo. Chaves travadas mantêm o mod e o jogo funcionando.
en = Describe the problem
pt-BR = Descreva o problema
en = Zips the logs and the game’s crash reports from those sessions (names and account IDs taken out) into the logs folder, then opens a new issue on GitHub with what you wrote, your settings, the last session and your PC filled in. Add the steps there, and drag in the zip (it shows below) and any screenshots.
pt-BR = Compacta os logs e os relatórios de travamento do jogo dessas sessões (sem nomes e IDs de conta) na pasta de logs e abre uma nova issue no GitHub com o que você escreveu, suas configurações, a última sessão e seu PC já preenchidos. Adicione os passos lá e arraste o zip (ele aparece abaixo) e as capturas de tela.
en = Busiest threads
pt-BR = Threads mais ocupadas
en = Each thread is a share of ONE core. A thread near 100% can hold the frame rate back even when Windows shows the whole CPU at 15%; a thread that spins by design looks busy whatever limits it.
pt-BR = Cada thread é uma fração de UM núcleo. Uma thread perto de 100% pode segurar a taxa de quadros mesmo quando o Windows mostra a CPU inteira em 15%; uma thread que gira de propósito parece ocupada seja o que for que a limite.
en = Frame rate
pt-BR = Taxa de quadros
en = The last session’s average against the headset’s refresh rate, the frame rate it asks for. Below it, the runtime fills the gaps (motion smoothing or reprojection), which shows as wobble on moving edges.
pt-BR = A média da última sessão contra a taxa de atualização do headset, a taxa de quadros que ele pede. Abaixo dela, o runtime preenche as lacunas (suavização de movimento ou reprojeção), o que aparece como tremor nas bordas em movimento.
en = Slow frames
pt-BR = Quadros lentos
en = How long your slowest frames take: lower is smoother. One frame in ten took at least this long (the 90th percentile). Above the frame’s budget (1000 ms divided by the headset’s refresh rate: 11.1 ms at 90 Hz) those frames miss the headset, and you feel stutter even when the average frame rate looks fine.
pt-BR = Quanto tempo levam seus quadros mais lentos: menor é mais suave. Um quadro em cada dez levou pelo menos isso (o percentil 90). Acima do tempo do quadro (1000 ms divididos pela taxa de atualização do headset: 11,1 ms a 90 Hz), esses quadros perdem o headset, e você sente engasgos mesmo quando a média parece boa.
en = Limited by
pt-BR = Limitado por
en = What held the frame back most of the time: the game’s render thread on the CPU, the GPU, or nothing (the headset’s refresh). Lowering resolution helps only when the GPU limits it.
pt-BR = O que mais segurou o quadro: a thread de renderização do jogo na CPU, a GPU, ou nada (a atualização do headset). Baixar a resolução só ajuda quando a GPU é o limite.
en = Previous session
pt-BR = Sessão anterior
en = The session before the last one for this game, and the settings changed in between, so you can see what a change did. A change while you drive (here or in the headset menu) starts a new stint, kept as its own entry; each covers the whole stint, with the moments the headset menu was open left out. Compare runs on the same track and car for a fair difference.
pt-BR = A sessão antes da última neste jogo, e as configurações mudadas entre elas, para você ver o que uma mudança fez. Uma mudança enquanto você pilota (aqui ou no menu do headset) inicia um novo stint, guardado como entrada própria; cada uma cobre o stint inteiro, sem os momentos em que o menu do headset estava aberto. Compare voltas na mesma pista e carro para uma diferença justa.
en = Run with anti-cheat
pt-BR = Rodar com anti-cheat
en = Starts the game through its anti-cheat (Easy Anti-Cheat), as Steam does, with Sim-QVFR running, so you can join online servers. Sim-QVFR runs inside the game, and the anti-cheat may kick you or ban your account for it. Sim-QVFR and its developer aren’t responsible for kicks or bans: turning it on asks you to accept that risk. Off starts the game without its anti-cheat, for offline sessions only.
pt-BR = Inicia o jogo pelo anti-cheat dele (Easy Anti-Cheat), como a Steam faz, com o Sim-QVFR rodando, para você entrar em servidores online. O Sim-QVFR roda dentro do jogo, e o anti-cheat pode te expulsar ou banir sua conta por isso. O Sim-QVFR e seu desenvolvedor não se responsabilizam por expulsões ou banimentos: ligar esta opção pede que você aceite esse risco. Desligado inicia o jogo sem o anti-cheat, somente para sessões offline.
en = Layers for
pt-BR = Camadas para
en = Launches from here: the VR add-ons (OpenXR layers) a launch from this launcher loads, below Sim-QVFR, in an order of its own; nothing else changes. Every app: Windows’ own list, which every other app uses (and the game started from Steam), saved in the registry when you apply, with a backup in the logs folder first.
pt-BR = Inícios por aqui: os complementos de VR (camadas OpenXR) que um início por este launcher carrega, abaixo do Sim-QVFR, em ordem própria; nada mais muda. Todos os apps: a lista do próprio Windows, que todos os outros apps usam (e o jogo iniciado pela Steam), salva no registro ao aplicar, com um backup na pasta de logs antes.
en = CPU capture
pt-BR = Captura de CPU
en = At the next launch, the CPU capture hotkey (Ctrl+Alt+C) while driving records for 20 s where the game’s busiest threads spend their time, into a cpu-profile file in the logs folder. The headset menu shows when it starts and ends; the game may stutter slightly while it records.
pt-BR = No próximo início, o atalho de captura de CPU (Ctrl+Alt+C) enquanto você pilota grava por 20 s onde as threads mais ocupadas do jogo gastam o tempo, em um arquivo cpu-profile na pasta de logs. O menu do headset mostra quando começa e termina; o jogo pode engasgar um pouco durante a gravação.
en = Frame capture
pt-BR = Captura de quadro
en = Saves the game’s own image and the composed output, as PNG files in the captures folder inside the logs folder. Each press saves one more frame, to compare the views where something looks wrong. In X-Plane 12, Assetto Corsa Competizione and Le Mans Ultimate.
pt-BR = Salva a imagem do próprio jogo e a saída composta, como arquivos PNG na pasta captures dentro da pasta de logs. Cada toque salva mais um quadro, para comparar as vistas onde algo parece errado. No X-Plane 12, Assetto Corsa Competizione e Le Mans Ultimate.
en = Next launch without QVFR
pt-BR = Próximo início sem QVFR
en = Starts the game once with its own two views and QVFR off, still measuring, so Diagnostics can compare the same race with and without QVFR. It turns itself off after that launch; the next one has QVFR again. The performance overlay works in it, the headset menu does not.
pt-BR = Inicia o jogo uma vez com as duas vistas dele e o QVFR desligado, ainda medindo, para o Diagnóstico comparar a mesma corrida com e sem QVFR. Ele se desliga sozinho após esse início; o seguinte volta a ter QVFR. O overlay de desempenho funciona nele, o menu do headset não.
en = Detailed logs
pt-BR = Logs detalhados
en = Normal logs say what Sim-QVFR set up, decided and measured. Detailed logs add every step behind that, for a bug report when the developer asks for one. They last three launches and then turn themselves off, so the logs stay small. Send them with Report an issue, or Save the logs as a zip.
pt-BR = Os logs normais dizem o que o Sim-QVFR configurou, decidiu e mediu. Os logs detalhados adicionam cada passo por trás disso, para um relatório de bug quando o desenvolvedor pedir. Eles duram três inícios e depois se desligam, para os logs ficarem pequenos. Envie-os com Relatar um problema, ou Salvar os logs como zip.
en = Logs folder
pt-BR = Pasta de logs
en = Each launch adds a session log and a small run folder. The launcher keeps the newest 30 sessions and removes older ones at each launch, and the newest 10 CPU captures. Frame captures and game image dumps stay until you clear them: Clear captures moves them to the Recycle Bin.
pt-BR = Cada início adiciona um log de sessão e uma pequena pasta de execução. O launcher mantém as 30 sessões mais recentes e remove as mais antigas a cada início, e as 10 capturas de CPU mais recentes. Capturas de quadro e dumps de imagem do jogo ficam até você limpá-los: Limpar capturas os move para a Lixeira.
en = Presets for eye tracked foveation
pt-BR = Predefinições para foveação com rastreamento ocular
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Eye tracked, the area follows your eyes, so it can be small and very sharp. They set the resolution only and keep everything else.
pt-BR = Pontos de partida que colocam os pixels no centro: vistas externas baixas e uma área de foco densa. Com rastreamento ocular, a área segue seus olhos, então pode ser pequena e bem nítida. Elas definem só a resolução e mantêm todo o resto.
en = Presets for fixed foveation
pt-BR = Predefinições para foveação fixa
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Fixed, your eyes move off the centre, so the area is larger and a little less dense. They set the resolution only and keep everything else.
pt-BR = Pontos de partida que colocam os pixels no centro: vistas externas baixas e uma área de foco densa. Com foco fixo, seus olhos saem do centro, então a área é maior e um pouco menos densa. Elas definem só a resolução e mantêm todo o resto.
en = Your profiles
pt-BR = Seus perfis
en = A profile holds every setting of the picture: resolution, foveation and the focus overlay, and where the game has them the view crop, the helmet and Foveated DLSS. Not the menu’s and overlay’s places, the hotkeys or the OpenXR layers. Share copies one as a line of text to paste in a chat; Paste adds one from the clipboard. The headset menu’s Profile line switches between them while you drive.
pt-BR = Um perfil guarda todas as configurações da imagem: resolução, foveação e o contorno do foco, e, onde o jogo os tem, o recorte da vista, o capacete e o Foveated DLSS. Não as posições do menu e do overlay, os atalhos nem as camadas OpenXR. Compartilhar copia um como linha de texto para colar num chat; Colar adiciona um da área de transferência. A linha Perfil do menu do headset troca entre eles enquanto você pilota.
en = A key’s first press also opens the menu. A wheel’s directions act only while the menu shows, so a switch the game also uses doesn’t open it: use Open or close first.
pt-BR = O primeiro toque de uma tecla também abre o menu. As direções do volante só agem enquanto o menu aparece, então um botão que o jogo também usa não o abre: use Abrir ou fechar primeiro.
en = Keys work while the game window has focus; wheel, button box and controller buttons work whenever the game runs.
pt-BR = As teclas funcionam enquanto a janela do jogo está em foco; botões de volante, button box e controle funcionam sempre que o jogo está rodando.
en = Field of view crop
pt-BR = Recorte do campo de visão
en = The outer view keeps its sharpness and the focus region its size. Changes reach a running game at once; with DLSS on, or with less crop than at launch, the pixel count follows at the next launch.
pt-BR = A vista externa mantém a nitidez e a região de foco, o tamanho. As mudanças chegam a um jogo em execução na hora; com DLSS ligado, ou com menos recorte que no início, a contagem de pixels acompanha no próximo início.
en = Helmet overlay
pt-BR = Overlay de capacete
en = Built in, the visor opening follows the crop (Rim and Corners). Your own helmet: top.png, bottom.png and visor.png with alpha in the helmet folder next to the layer; the log suggests the crop that matches them.
pt-BR = No embutido, a abertura da viseira segue o recorte (Borda e Cantos). Seu próprio capacete: top.png, bottom.png e visor.png com alfa na pasta helmet ao lado da camada; o log sugere o recorte que combina com eles.
en = Focus shape
pt-BR = Forma do foco
en = Each corner moves toward the middle of the focus region, percent of its width (in) or height (down, up). Pull the top corners in for a trapezoid: more of the dash sharp, less of the far field. The focus view still renders the whole box, so the cost stays the same.
pt-BR = Cada canto se move em direção ao meio da região de foco, em porcentagem da largura (para dentro) ou altura (para baixo, para cima). Puxe os cantos de cima para dentro para um trapézio: mais do painel nítido, menos do campo distante. A vista de foco ainda renderiza o retângulo inteiro, então o custo é o mesmo.
en = Cheeky Foveated DLSS
pt-BR = Cheeky Foveated DLSS
en = No Cheeky loader goes in the game folder: Sim-QVFR loads Cheeky’s runtime into the game itself.
pt-BR = Nenhum carregador do Cheeky vai na pasta do jogo: o Sim-QVFR carrega o runtime do Cheeky no próprio jogo.
en = Frame generation (experimental)
pt-BR = Geração de quadros (experimental)
en = Outside the center region frames are warped with the game’s motion. Lower scales use less GPU time and memory. With an eye-tracked focus (the Foveation card) the region follows your eyes too, through Cheeky’s OpenXR layer.
pt-BR = Fora da região central, os quadros são deformados com o movimento do jogo. Escalas menores usam menos tempo de GPU e memória. Com foco com rastreamento ocular (o cartão Foveação), a região também segue seus olhos, pela camada OpenXR do Cheeky.
en = The settings menu stays 0.8 m in front of your head, wherever you look.
pt-BR = O menu de configurações fica 0,8 m à frente da sua cabeça, para onde quer que você olhe.
en = Use DLSS
pt-BR = Usar DLSS
en = Sim-QVFR evaluates NVIDIA’s DLSS on each view, with depth and motion it works out from the game’s own frames, before the game’s post-processing. Needs an NVIDIA RTX graphics card. Sim-QVFR includes NVIDIA’s nvngx_dlss.dll; Choose… takes another (a newer one from a game), Use included goes back.
pt-BR = O Sim-QVFR aplica o DLSS da NVIDIA em cada vista, com profundidade e movimento que calcula a partir dos próprios quadros do jogo, antes do pós-processamento do jogo. Precisa de uma placa de vídeo NVIDIA RTX. O Sim-QVFR inclui o nvngx_dlss.dll da NVIDIA; Escolher… usa outro (um mais novo de algum jogo), Usar incluído volta.
en = Use FSR
pt-BR = Usar FSR
en = Experimental. On a PC without an NVIDIA RTX graphics card, Sim-QVFR evaluates AMD FSR on each view in DLSS’s place, with the same depth and motion: FSR 4 where AMD’s software offers it for your card (Radeon RX 9000, and newer drivers on RX 7000 and 6000), FSR 3.1 elsewhere. Sim-QVFR includes AMD’s FSR files. Tested only as FSR 3.1 on an NVIDIA card so far: tell us how it runs on yours.
pt-BR = Experimental. Em um PC sem placa de vídeo NVIDIA RTX, o Sim-QVFR aplica o AMD FSR em cada vista no lugar do DLSS, com a mesma profundidade e movimento: FSR 4 onde o software da AMD o oferece para sua placa (Radeon RX 9000, e drivers mais novos nas RX 7000 e 6000), FSR 3.1 nas outras. O Sim-QVFR inclui os arquivos do FSR da AMD. Testado até agora só como FSR 3.1 em uma placa NVIDIA: conte pra gente como roda na sua.
en = Periphery preset
pt-BR = Predefinição da periferia
en = Steadier or cheaper DLSS outside the focus area. K: a steadier picture, at a higher cost. F: about half the cost, a little more flicker on edges. With eye tracking you rarely look there, so F is usually fine; with a fixed focus, K.
pt-BR = DLSS mais estável ou mais leve fora da área de foco. K: imagem mais estável, com custo maior. F: cerca de metade do custo, um pouco mais de cintilação nas bordas. Com rastreamento ocular você quase não olha ali, então F costuma bastar; com foco fixo, K.
en = Texture sharpening
pt-BR = Nitidez de texturas
en = DLSS rebuilds detail from frames drawn at a lower resolution, so textures are best sampled a step sharper while it runs. Sim-QVFR does that through copies of the game’s shaders, in the focus area alone or in the periphery too. Measured gains are modest (most in the periphery and on distant textures). Off at launch, nothing is installed for it; turned on then, it starts at the next launch. Fine patterns may shimmer: then a step lower.
pt-BR = O DLSS reconstrói detalhes a partir de quadros desenhados em resolução menor, então as texturas ficam melhores amostradas um passo mais nítidas enquanto ele roda. O Sim-QVFR faz isso por cópias dos shaders do jogo, só na área de foco ou também na periferia. Os ganhos medidos são modestos (mais na periferia e em texturas distantes). Desligado no início, nada é instalado para isso; ligado depois, começa no próximo início. Padrões finos podem cintilar: aí use um passo abaixo.
en = Updates
pt-BR = Atualizações
en = Install downloads the release from GitHub, checks it against the SHA-256 GitHub gives, replaces the program files and restarts the launcher; your settings, profiles and changed files stay, and the version you had is kept in the update folder. Download opens the release’s page instead.
pt-BR = Instalar baixa a versão do GitHub, confere com o SHA-256 que o GitHub informa, substitui os arquivos do programa e reinicia o launcher; suas configurações, perfis e arquivos alterados ficam, e a versão que você tinha é guardada na pasta update. Baixar abre a página da versão.
en = These settings reach the game while it runs, as soon as you change them. Without the game running, they apply when it starts.
pt-BR = Estas configurações chegam ao jogo enquanto ele roda, assim que você as muda. Sem o jogo aberto, valem quando ele iniciar.
en = Lowering it reaches a running game at once, and so does raising it back up to what the game started with. Above that, it takes effect at the next launch. With DLSS on in the game, the views keep their launch sizes until the next launch.
pt-BR = Baixar chega a um jogo em execução na hora, e voltar a subir até o valor com que o jogo iniciou também. Acima disso, vale no próximo início. Com DLSS ligado no jogo, as vistas mantêm os tamanhos do início até o próximo início.
en = These settings take effect the next time the game starts from the launcher. A running game keeps what it started with.
pt-BR = Estas configurações valem no próximo início do jogo pelo launcher. Um jogo em execução mantém o que tinha ao iniciar.
en = The local time on a small card in the headset, apart from the performance overlay: on or off and moved live, here or from the headset menu. It costs next to nothing; it redraws once a minute.
pt-BR = A hora local em um pequeno cartão no headset, separado do overlay de desempenho: liga, desliga e se move na hora, aqui ou pelo menu do headset. Custa quase nada; redesenha uma vez por minuto.
en = The performance overlay in the headset: frame rate, CPU and GPU time and what limits the frame. A little CPU time while it shows.
pt-BR = O overlay de desempenho no headset: taxa de quadros, tempo de CPU e GPU e o que limita o quadro. Um pouco de tempo de CPU enquanto aparece.
en = Shape
pt-BR = Forma
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom shape: an outline of up to 10 points you draw on the preview (click the area to add a point, drag one to move it, right-click one to remove it); trace your windscreen, say, then place it with Vertical and Horizontal position. To hide the area’s edge, raise Feather.
pt-BR = A forma da área nítida. Retângulo: arredondado pelo Raio dos cantos. Forma personalizada: um contorno de até 10 pontos que você desenha na prévia (clique na área para adicionar um ponto, arraste-o para movê-lo, clique com o botão direito para removê-lo); contorne seu para-brisa, por exemplo, e posicione-o com Posição vertical e Posição horizontal. Para esconder a borda da área, aumente a Suavização.
en = Outline color
pt-BR = Cor do contorno
en = The outline’s colour in the headset. It shows while Show focus outline is on.
pt-BR = A cor do contorno no headset. Aparece enquanto Mostrar contorno do foco estiver ligado.
en = nvngx_dlss.dll
pt-BR = nvngx_dlss.dll
en = The DLSS Sim-QVFR uses: the one it includes (NVIDIA’s), or another you choose, a newer one from a game, say (DLSS 310 or newer). Use included goes back. Applies at the next launch.
pt-BR = O DLSS que o Sim-QVFR usa: o incluído (da NVIDIA), ou outro que você escolher, por exemplo um mais novo de algum jogo (DLSS 310 ou mais novo). Usar incluído volta. Vale no próximo início.
en = Focus views
pt-BR = Vistas de foco
en = DLAA draws them at their size. Ultra quality, Quality, Balanced and Performance draw them at 77, 67, 58 or 50% each way and upscale them: less GPU time, softer distant textures. DLSS has no ultra quality model of its own: 77% runs its quality one.
pt-BR = O DLAA as desenha no tamanho delas. Ultra qualidade, Qualidade, Equilibrado e Desempenho as desenham a 77, 67, 58 ou 50% em cada direção e fazem upscale: menos tempo de GPU, texturas distantes mais suaves. O DLSS não tem modelo de ultra qualidade próprio: 77% usa o de qualidade.
en = Focus preset
pt-BR = Predefinição do foco
en = The DLSS preset for the sharp focus views. With Sim-QVFR’s DLSS, Default is NVIDIA’s choice for the mode: K, and M at Performance, which costs more. With Cheeky, Game default keeps the game’s.
pt-BR = A predefinição de DLSS para as vistas de foco nítidas. Com o DLSS do Sim-QVFR, Padrão é a escolha da NVIDIA para o modo: K, e M em Desempenho, que custa mais. Com o Cheeky, Padrão do jogo mantém a do jogo.
en = Other cars’ motion
pt-BR = Movimento dos outros carros
en = Gives DLSS each other car’s own motion, so cars passing, alongside or ahead stay clean instead of smearing. Turn it off for more headroom: in a field of cars it costs about 0.5 ms of CPU and 0.2 to 0.5 ms of GPU a frame. Applies at the next launch, with DLSS on at launch; with DLSS off it costs nothing.
pt-BR = Passa ao DLSS o movimento próprio de cada outro carro, para carros ultrapassando, ao lado ou à frente ficarem limpos em vez de borrados. Desligue para ter mais folga: num grid cheio custa cerca de 0,5 ms de CPU e 0,2 a 0,5 ms de GPU por quadro. Vale no próximo início, com DLSS ligado no início; com DLSS desligado não custa nada.
en = nvngx_dlssnr.dll
pt-BR = nvngx_dlssnr.dll
en = NVIDIA’s DLSS neural rendering runtime. Sim-QVFR includes none: it is NVIDIA’s, and comes only with games that ship DLSS-NR. Choose the one in such a game’s folder. Applies at the next launch.
pt-BR = O runtime de renderização neural DLSS da NVIDIA. O Sim-QVFR não inclui nenhum: é da NVIDIA e vem só com jogos que trazem DLSS-NR. Escolha o que está na pasta de um desses jogos. Vale no próximo início.
en = Use DLSS-NR
pt-BR = Usar DLSS-NR
en = NVIDIA’s DLSS neural rendering on the views: its model reworks lighting and materials from the picture, its depth and its motion. Experimental, and heavy: about 2 ms of GPU time and 130 MB of video memory for every million pixels it works on, per view (RTX 5070 Ti). It turns itself off if frames fall under 10 a second with it on.
pt-BR = A renderização neural DLSS da NVIDIA nas vistas: o modelo dela refaz iluminação e materiais a partir da imagem, da profundidade e do movimento. Experimental, e pesado: cerca de 2 ms de GPU e 130 MB de memória de vídeo para cada milhão de pixels processados, por vista (RTX 5070 Ti). Ele se desliga sozinho se os quadros caírem abaixo de 10 por segundo com ele ligado.
en = Intensity
pt-BR = Intensidade
en = How much of the model’s change you get: 0% is the picture as it came.
pt-BR = Quanto da mudança do modelo você recebe: 0% é a imagem como veio.
en = Style
pt-BR = Estilo
en = The look the model aims for.
pt-BR = O visual que o modelo busca.
en = Preset
pt-BR = Predefinição
en = The model: A is the original, B a faster one in newer DLLs (310.9.16 on). Default is the DLL’s own choice. A change rebuilds DLSS-NR: a short stutter.
pt-BR = O modelo: A é o original, B um mais rápido em DLLs mais novas (310.9.16 em diante). Padrão é a escolha da própria DLL. Uma mudança reconstrói o DLSS-NR: um engasgo curto.
en = Local tone
pt-BR = Tom local
en = The strength of the model’s local contrast and lighting changes.
pt-BR = A força das mudanças de contraste local e iluminação do modelo.
en = Local structure
pt-BR = Estrutura local
en = The strength of the model’s changes to fine structure.
pt-BR = A força das mudanças do modelo nas estruturas finas.
en = Auto mask
pt-BR = Máscara automática
en = Lets the model find what it treats differently (skin) by itself.
pt-BR = Deixa o modelo achar sozinho o que trata de forma diferente (pele).
en = Runs
pt-BR = Roda
en = After DLSS works on the finished, anti-aliased views. Before DLSS works on the views as drawn, before anti-aliasing and upscaling: fewer pixels when the focus views are upscaled, and DLSS then smooths its result.
pt-BR = Após o DLSS processa as vistas prontas, com anti-aliasing. Antes do DLSS processa as vistas como desenhadas, antes do anti-aliasing e do upscale: menos pixels quando as vistas de foco passam por upscale, e o DLSS então suaviza o resultado.
en = Focus working size
pt-BR = Tamanho de trabalho do foco
en = What the model works at, a share of the focus view. Lower costs less; the picture keeps its own detail.
pt-BR = Em que tamanho o modelo trabalha, uma fração da vista de foco. Menor custa menos; a imagem mantém o próprio detalhe.
en = Working size limit
pt-BR = Limite de tamanho de trabalho
en = The most one view’s model works on, in megapixels, whatever the sizes. Each megapixel costs about 2 ms of GPU time and 130 MB of video memory, per view.
pt-BR = O máximo que o modelo processa por vista, em megapixels, sejam quais forem os tamanhos. Cada megapixel custa cerca de 2 ms de GPU e 130 MB de memória de vídeo, por vista.
en = Edge blend
pt-BR = Mistura da borda
en = The band over which the processed area fades into what isn’t processed around it.
pt-BR = A faixa em que a área processada se mistura com o que não é processado em volta.
en = Periphery too
pt-BR = Periferia também
en = Off, only the focus views are processed: where you look. On, the periphery too, at its own working size and coverage. It adds about 2 ms of GPU time per eye at least, however small you make it.
pt-BR = Desligado, só as vistas de foco são processadas: onde você olha. Ligado, a periferia também, com tamanho de trabalho e cobertura próprios. Adiciona pelo menos cerca de 2 ms de GPU por olho, por menor que você a deixe.
en = Periphery working size
pt-BR = Tamanho de trabalho da periferia
en = As the focus working size, for the periphery.
pt-BR = Como o tamanho de trabalho do foco, para a periferia.
en = Periphery covered
pt-BR = Cobertura da periferia
en = How much of each eye’s view the model covers, around the focus area.
pt-BR = Quanto da vista de cada olho o modelo cobre, em volta da área de foco.
en = Foveated DLSS
pt-BR = Foveated DLSS
en = Off leaves the game’s own DLSS on every view.
pt-BR = Desligado deixa o próprio DLSS do jogo em todas as vistas.
en = Outer preset
pt-BR = Predefinição externa
en = The DLSS preset of the outer views’ own pass (Cheaper outer views).
pt-BR = A predefinição de DLSS do passe próprio das vistas externas (Vistas externas mais leves).
en = Fix motion-vector blur
pt-BR = Corrigir borrão de vetores de movimento
en = Cheeky’s workaround for smearing with some presets. Adds GPU work.
pt-BR = Solução do Cheeky para borrões com algumas predefinições. Adiciona trabalho à GPU.
en = DLSS-NR
pt-BR = DLSS-NR
en = NVIDIA’s DLSS-NR (DLSS 5) on the focus views. Needs nvngx_dlssnr.dll next to the game.
pt-BR = O DLSS-NR (DLSS 5) da NVIDIA nas vistas de foco. Precisa do nvngx_dlssnr.dll ao lado do jogo.
en = DLSS-NR passes
pt-BR = Passes de DLSS-NR
en = Each extra DLSS-NR pass costs about one more NR evaluation.
pt-BR = Cada passe extra de DLSS-NR custa cerca de uma avaliação de NR a mais.
en = Multiplier
pt-BR = Multiplicador
en = Frames shown per frame the game renders: 2x adds one generated frame between each two of the game’s.
pt-BR = Quadros mostrados por quadro que o jogo renderiza: 2x adiciona um quadro gerado entre cada dois do jogo.
en = Center FG scale
pt-BR = Escala de FG central
en = Frame generation’s resolution in the center region. Lower uses less GPU time and memory.
pt-BR = A resolução da geração de quadros na região central. Menor usa menos tempo de GPU e memória.
en = Periphery FG scale
pt-BR = Escala de FG da periferia
en = Frame generation’s resolution around the center region. Lower uses less GPU time and memory.
pt-BR = A resolução da geração de quadros em volta da região central. Menor usa menos tempo de GPU e memória.
en = Release game
pt-BR = Liberar o jogo
en = When the game starts its next frame. Never: CPU and GPU overlap (most frames). Capture: after the GPU finishes. Generated: after the generated frame.
pt-BR = Quando o jogo começa o próximo quadro. Nunca: CPU e GPU se sobrepõem (maioria dos quadros). Captura: depois que a GPU termina. Gerado: depois do quadro gerado.
en = Show the center region
pt-BR = Mostrar a região central
en = Outlines the region in the headset, to check that it follows your eyes.
pt-BR = Contorna a região no headset, para conferir que ela segue seus olhos.
en = Rim
pt-BR = Borda
en = How far the helmet’s padding reaches into the view.
pt-BR = Até onde o acolchoado do capacete entra na vista.
en = Corners
pt-BR = Cantos
en = Rounds the helmet’s visor opening.
pt-BR = Arredonda a abertura da viseira do capacete.
en = Lighting
pt-BR = Iluminação
en = How much the scene lights the helmet.
pt-BR = Quanto a cena ilumina o capacete.
en = Visor
pt-BR = Viseira
en = Your own images only: closed, half or open. Ctrl+Alt+V in the game steps it.
pt-BR = Só imagens próprias: fechada, meio ou aberta. Ctrl+Alt+V no jogo alterna.
en = Depth
pt-BR = Profundidade
en = Your own images only: how far in front of your eyes, in cm. 0 is far away, with no depth.
pt-BR = Só imagens próprias: a que distância à frente dos olhos, em cm. 0 é longe, sem profundidade.
en = Your own images only: Detail (4096) is sharper, Performance (2048) costs less GPU time and memory.
pt-BR = Só imagens próprias: Detalhe (4096) é mais nítido, Desempenho (2048) custa menos tempo de GPU e memória.
en = Degrees right of straight ahead. Negative is left. Drag it in Placement, or move it in the headset.
pt-BR = Graus à direita da frente. Negativo é à esquerda. Arraste em Posição, ou mova no headset.
en = Degrees above eye level. Negative is below. Drag it in Placement, or move it in the headset.
pt-BR = Graus acima do nível dos olhos. Negativo é abaixo. Arraste em Posição, ou mova no headset.
en = How wide it is, in degrees of your view.
pt-BR = A largura, em graus da sua visão.
en = A line under the headset menu with the in-game hotkeys (overlay, visor, CPU capture) and their wheel buttons, as set in Hotkeys. Also on the menu’s Headset page.
pt-BR = Uma linha abaixo do menu do headset com os atalhos no jogo (overlay, viseira, captura de CPU) e os botões do volante, como definidos em Atalhos. Também na página Headset do menu.
en = Open or close
pt-BR = Abrir ou fechar
en = Opens the headset menu, or closes it.
pt-BR = Abre o menu do headset, ou o fecha.
en = Up
pt-BR = Cima
en = Selects the line above in the headset menu.
pt-BR = Seleciona a linha de cima no menu do headset.
en = Down
pt-BR = Baixo
