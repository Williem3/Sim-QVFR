pt-BR = Aumenta o valor selecionado no menu do headset.
en = Overlay
pt-BR = Overlay
en = Turns the performance overlay on or off.
pt-BR = Liga ou desliga o overlay de desempenho.
en = Helmet visor
pt-BR = Viseira do capacete
en = Steps the helmet’s visor: closed, half, open.
pt-BR = Alterna a viseira do capacete: fechada, meio, aberta.
en = Helmet images
pt-BR = Imagens do capacete
en = Your own helmet: top.png, bottom.png and visor.png in the helmet folder next to the layer. Size and Height place them (degrees of view, and above straight ahead).
pt-BR = Seu próprio capacete: top.png, bottom.png e visor.png na pasta helmet ao lado da camada. Tamanho e Altura os posicionam (graus de visão, e acima da frente).
