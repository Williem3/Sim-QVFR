en = On: the game thread that finishes each frame runs alone on one core, and the game’s other threads (its physics among them) use the rest, so none slows it down by sharing that core.
pt-BR = Ligado: a thread do jogo que finaliza cada quadro roda sozinha em um núcleo, e as outras threads do jogo (a física entre elas) usam o resto, então nenhuma a atrasa dividindo esse núcleo.
