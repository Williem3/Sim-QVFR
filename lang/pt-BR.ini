pt-BR = A área de foco ({width}% × {height}%) é maior que a região de foco do próprio runtime ({runtime_width}% × {runtime_height}%)
en = With the runtime composing the views (Pimax, Varjo), the focus area shows only inside its own focus region; past it, the outer resolution shows. Make the runtime's focus area larger (Pimax Play, Varjo Base), or Sim-QVFR's no larger than it, in Resolution.
pt-BR = Com o runtime compondo as vistas (Pimax, Varjo), a área de foco só aparece dentro da região de foco dele; fora dela, aparece a resolução externa. Aumente a área de foco do runtime (Pimax Play, Varjo Base), ou deixe a do Sim-QVFR no máximo do mesmo tamanho, em Resolução.
en = VRAM was nearly full ({percent}% of what Windows allows the game)
pt-BR = A VRAM ficou quase cheia ({percent}% do que o Windows permite ao jogo)
en = Stutter and hitches follow when it runs out. Lower the outer resolution or the focus density, or the game's texture quality.
pt-BR = Quando ela acaba, vêm engasgos e travadinhas. Baixe a resolução externa ou a densidade de foco, ou a qualidade de texturas do jogo.
en = OpenXR Toolkit is loaded under Sim-QVFR
pt-BR = O OpenXR Toolkit está carregado abaixo do Sim-QVFR
en = It adds about 0.8 ms to every frame's submission. If you don't use it for this game, switch it off in OpenXR layers.
pt-BR = Ele adiciona cerca de 0,8 ms ao envio de cada quadro. Se você não o usa neste jogo, desligue-o em Camadas OpenXR.
en = The GPU was busy all the time ({percent}%)
pt-BR = A GPU ficou ocupada o tempo todo ({percent}%)
en = This is the GPU's limit. Lower the outer resolution or the focus density, or the game's graphics settings.
pt-BR = Este é o limite da GPU. Baixe a resolução externa ou a densidade de foco, ou as configurações gráficas do jogo.
en = The game's CPU work limited the frame rate
pt-BR = O trabalho de CPU do jogo limitou a taxa de quadros
en = QVFR lowers the GPU's work, not the CPU's. Lower the game's CPU-heavy settings (opponents, mirrors, shadows).
pt-BR = O QVFR reduz o trabalho da GPU, não o da CPU. Baixe as configurações do jogo que pesam na CPU (adversários, retrovisores, sombras).
en = The headset runtime ran the game at half rate for {percent}% of the session
pt-BR = O runtime do headset rodou o jogo a meia taxa em {percent}% da sessão
en = When frames come close to the budget, the runtime's motion smoothing halves the frame rate for a few seconds (Varjo does this). Turn motion smoothing off in the runtime's software (Varjo Base) to compare, and give the CPU room: lower the game's CPU-heavy settings (opponents, mirrors, shadows).
pt-BR = Quando os quadros chegam perto do limite de tempo, a suavização de movimento do runtime corta a taxa de quadros pela metade por alguns segundos (o Varjo faz isso). Desligue a suavização de movimento no software do runtime (Varjo Base) para comparar e dê folga à CPU: baixe as configurações do jogo que pesam na CPU (adversários, retrovisores, sombras).
en = {percent}% of frames were late with neither the CPU nor the GPU full
pt-BR = {percent}% dos quadros atrasaram sem a CPU nem a GPU estarem cheias
en = Often something else in the chain: another OpenXR layer, an overlay, or the runtime's motion smoothing. Try with them off.
pt-BR = Muitas vezes é outra coisa na cadeia: outra camada OpenXR, um overlay ou a suavização de movimento do runtime. Teste com eles desligados.

