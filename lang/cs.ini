en = No key
cs = Žádná klávesa
en = Press a button…
cs = Stiskni tlačítko…
en = No button
cs = Žádné tlačítko
en = Click, then press the keys: Esc cancels, Delete clears it.
cs = Klikni a pak stiskni klávesy: Esc ruší, Delete maže.
en = On {device}. Click, then press another.
cs = Na zařízení {device}. Klikni a stiskni jiné.
en = Click, then press a wheel or controller button.
cs = Klikni a pak stiskni tlačítko volantu nebo ovladače.
en = Hotkeys
cs = Klávesové zkratky
en = Keyboard
cs = Klávesnice
en = Wheel
cs = Volant
en = To open the headset menu from your wheel, click No button beside Open or close, then press the button on your wheel.
cs = Chceš-li menu v headsetu otevírat z volantu, klikni na Žádné tlačítko vedle Otevřít/zavřít a pak stiskni tlačítko na volantu.
en = In the game
cs = Ve hře

; src/launcher/ui/help.cpp
en = Foveated mode
cs = Režim foveace
en = Eye tracked: the sharp area follows your eyes, so it can be small and dense; it needs a headset with eye tracking. Fixed: the area stays in the centre, so make it larger, since your eyes move off it.
cs = Se sledováním očí: ostrá oblast sleduje tvé oči, takže může být malá a hustá; potřebuje headset se sledováním očí. Pevná: oblast zůstává uprostřed, tak ji zvětši, protože oči z ní uhýbají.
en = Periphery resolution
cs = Rozlišení periferie
en = The wide view around the focus area, a share of the headset’s recommended resolution. It covers most of the view but you see it with your side vision, so it is the first to lower: it saves GPU time and VRAM roughly with its pixels. The preview’s Pixels per frame shows the total.
cs = Široký pohled kolem oblasti ostrosti, podíl doporučeného rozlišení headsetu. Pokrývá většinu pohledu, ale vidíš ho periferním viděním, takže se snižuje jako první: šetří čas GPU i VRAM zhruba úměrně svým pixelům. Pixely na snímek v náhledu ukazují součet.
en = Focus density
cs = Hustota ostrosti
en = Pixel density inside the focus area, a share of the headset’s native density. Above 100% it renders more pixels than the headset shows where you look: sharper text and edges. Its cost grows with the area’s size, so a small area can take a high density cheaply. Dragging moves it in 5% steps; the arrow keys move it by 1%.
cs = Hustota pixelů uvnitř oblasti ostrosti, podíl nativní hustoty headsetu. Nad 100 % vykresluje víc pixelů, než headset ukáže tam, kam se díváš: ostřejší text a hrany. Její cena roste s velikostí oblasti, takže malá oblast unese vysokou hustotu levně. Tažení ji mění po 5 %, šipky po 1 %.
en = Object detail
cs = Detail objektů
en = How detailed trees and objects are, and how far away they are still drawn. At 100% they are as sharp in the focus region as its pixel density shows them; lower settings move toward the game’s own detail for the periphery resolution. It costs CPU, not GPU: more detail means more objects for X-Plane’s main thread to prepare every frame, often what limits the frame rate with QVFR. Lower it if frames stutter in dense scenery; the focus region shows coarser trees.
cs = Jak detailní jsou stromy a objekty a do jaké vzdálenosti se ještě kreslí. Na 100 % jsou v oblasti ostrosti tak ostré, jak je její hustota pixelů ukáže; nižší hodnoty se blíží vlastnímu detailu hry pro rozlišení periferie. Stojí CPU, ne GPU: víc detailu znamená víc objektů, které hlavní vlákno X-Plane musí každý snímek připravit, a to s QVFR často omezuje snímkovou frekvenci. Sniž ho, pokud se snímky v husté scenérii zasekávají; oblast ostrosti pak ukáže hrubší stromy.
en = For a player who sees with one eye. The eye you choose shows black in the headset, and the game draws no focus view for it, renders only a few pixels of its scene and skips DLSS on it, so the GPU does much less. The game still prepares that eye’s frame, so the CPU saves little. With both eyes seeing, a black eye is uncomfortable: leave it at None.
cs = Pro hráče, který vidí jedním okem. Zvolené oko je v headsetu černé a hra pro něj nekreslí pohled ostrosti, vykreslí jen pár pixelů jeho scény a vynechá na něm DLSS, takže GPU dělá mnohem méně. Hra ale snímek pro to oko stále připravuje, takže CPU ušetří málo. Když vidíš oběma očima, je černé oko nepříjemné: nech Žádné.
en = Sharpening
cs = Doostření
en = Crisper edges and text in the focus area; too much makes it shimmer. Raise it a little if the view looks soft (0% is off); it costs a little GPU time and changes while you drive. How: AMD FidelityFX Contrast Adaptive Sharpening, applied as Sim-QVFR resamples the focus view for the headset. Each pixel is sharpened by how much contrast room it has, so soft detail gains the most and edges already sharp gain little. The percentage is CAS’s own sharpness, as other CAS sharpeners show it: any setting above 0% already sharpens. Only the focus area is sharpened, fading out across its feather so its edge stays even: your side vision sees shimmer more than detail. 0% is off; it changes while you drive.
cs = Ostřejší hrany a text v oblasti ostrosti; příliš mnoho způsobí mihotání. Trochu ho zvyš, pokud pohled vypadá měkce (0 % je vypnuto); stojí trochu času GPU a mění se za jízdy. Jak: AMD FidelityFX Contrast Adaptive Sharpening, použité ve chvíli, kdy Sim-QVFR převzorkuje pohled ostrosti pro headset. Každý pixel se doostří podle toho, kolik má prostoru v kontrastu, takže nejvíc získají jemné detaily a už ostré hrany jen málo. Procento je vlastní ostrost CAS, jak ji ukazují jiné doostřovače CAS: každá hodnota nad 0 % už doostřuje. Doostřuje se jen oblast ostrosti, s náběhem přes její prolnutí, aby okraj zůstal rovnoměrný: periferní vidění vnímá mihotání víc než detail. 0 % je vypnuto; mění se za jízdy.
en = Periphery texture match
cs = Sladění textur periferie
en = Makes fences, nets and other see-through surfaces look the same in your side vision as in the focus area. At the periphery’s lower resolution the game blends them into a light solid shade, so the focus area looked darker behind them. At 100% the periphery reads its textures at the same detail level as the focus area; lower it if distant textures shimmer in your side vision. 0% is off (the game’s own); it changes while you drive.
cs = Ploty, sítě a další průhledné povrchy vypadají v periferním vidění stejně jako v oblasti ostrosti. Při nižším rozlišení periferie je hra slévá do světlého plného odstínu, takže oblast ostrosti za nimi vypadala tmavší. Při 100 % čte periferie textury ve stejné úrovni detailu jako oblast ostrosti; sniž hodnotu, pokud se vzdálené textury v periferním vidění mihotají. 0 % je vypnuto (jako ve hře); mění se za jízdy.
en = Game Lighting Enhancement
cs = Vylepšení osvětlení hry
en = Adds highlights and shading to the cars at night. Sim-QVFR relights each car after the game draws it, before the game's own post-processing: highlights where the floodlights and headlights reflect off the paint, shading in creases and under the car, and the effects below. The rest of the scene is untouched. Measured on an RTX 5070 Ti with everything on at High: about 1 ms of GPU time in a quiet scene, 2 to 3.7 ms in race traffic, and 0.4 to 0.9 ms of CPU time; none of the switches below adds measurable CPU time. The switch takes effect at the next launch; the values and effects change while you drive.
cs = Přidá autům v noci odlesky a stínování. Sim-QVFR každé auto znovu osvětlí poté, co ho hra vykreslí, před vlastním následným zpracováním hry: odlesky tam, kde se reflektory a světlomety odrážejí v laku, stínování v záhybech a pod autem a níže uvedené efekty. Zbytek scény zůstane nedotčen. Naměřeno na RTX 5070 Ti se vším zapnutým na Vysoké: asi 1 ms času GPU v klidné scéně, 2 až 3,7 ms v závodním provozu a 0,4 až 0,9 ms času CPU; žádný z přepínačů níže nepřidává měřitelný čas CPU. Přepínač se uplatní při příštím spuštění; hodnoty a efekty se mění za jízdy.
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High; the reflections keep all theirs at every tier. The switches below stay as you set them, and the periphery always runs one step below the focus area, where it's least seen. Measured in a night race on an RTX 5070 Ti with everything on: High 1.35 to 1.55 ms of GPU time, Medium 1.10 to 1.30 ms, Low 1.00 to 1.10 ms, a quarter to a third less than High. In testing Low looked a little grainier than High, its floodlight shadows almost unchanged.
cs = Jak jemně se efekty počítají: na Nízké méně vzorků a kroků pro stíny, zastínění a vyhlazení, na Vysoké všechny; odrazy si na každém stupni ponechají všechny své. Přepínače níže zůstanou, jak je nastavíte, a periferie vždy běží o stupeň níž než oblast fokusu, kde je nejméně vidět. Naměřeno v nočním závodě na RTX 5070 Ti se vším zapnutým: Vysoká 1,35 až 1,55 ms času GPU, Střední 1,10 až 1,30 ms, Nízká 1,00 až 1,10 ms, o čtvrtinu až třetinu méně než Vysoká. V testech vypadala Nízká o něco zrnitěji než Vysoká, stíny od reflektorů téměř beze změny.
en = Fill light
cs = Výplňové světlo
en = How much of the game's own floodlight lighting stays on the cars. Lower makes the shading and highlights stand out more; 100% keeps the game's brightness. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
cs = Kolik z vlastního osvětlení hry od reflektorů zůstane na autech. Nižší hodnota zvýrazní stínování a odlesky; 100 % ponechá jas hry. Je součástí základního přesvětlení, asi 0,4 ms času GPU v klidné scéně a 1 ms v závodním provozu (naměřeno na Vysoké na RTX 5070 Ti), a stojí stejně při jakékoli hodnotě.
en = Ambient occlusion
cs = Ambientní okluze
en = Darkens creases, wheel arches and the underside, where light reaches less. 0% is off. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
cs = Ztmaví záhyby, podběhy kol a spodek auta, kam dopadá méně světla. 0 % je vypnuto. Je součástí základního přesvětlení, asi 0,4 ms času GPU v klidné scéně a 1 ms v závodním provozu (naměřeno na Vysoké na RTX 5070 Ti), a stojí stejně při jakékoli hodnotě.
en = Highlights
cs = Odlesky
en = The strength of the floodlights' and headlights' reflections on the paint. 0% is off; above 100% is brighter than the lights would make it. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
cs = Síla odrazů reflektorů a světlometů v laku. 0 % je vypnuto; nad 100 % je jasnější, než by udělala samotná světla. Je součástí základního přesvětlení, asi 0,4 ms času GPU v klidné scéně a 1 ms v závodním provozu (naměřeno na Vysoké na RTX 5070 Ti), a stojí stejně při jakékoli hodnotě.
en = Paint gloss
cs = Lesk laku
en = How glossy the lacquer is: higher gives smaller, sharper highlights, lower broad soft ones. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
cs = Jak lesklý je lak: vyšší dává menší, ostřejší odlesky, nižší široké a měkké. Je součástí základního přesvětlení, asi 0,4 ms času GPU v klidné scéně a 1 ms v závodním provozu (naměřeno na Vysoké na RTX 5070 Ti), a stojí stejně při jakékoli hodnotě.
en = Smoothing
cs = Vyhlazení
en = Smooths the surface direction over this distance where the game's own normals aren't available, which hides faceted highlights on low-polygon parts. About 15 cm suits most cars; 0 is off.
cs = Vyhladí směr povrchu na této vzdálenosti tam, kde nejsou k dispozici vlastní normály hry, a skryje tak hranaté odlesky na dílech s málem polygonů. Asi 15 cm se hodí pro většinu aut; 0 je vypnuto.
en = Floodlight shadows
cs = Stíny reflektorů
en = A part of a car hidden from a floodlight, behind a wing or another car, loses that light and its highlight. Measured at High on an RTX 5070 Ti: about 0.2 ms of GPU time in a quiet scene, 0.5 ms in race traffic.
cs = Část auta skrytá před reflektorem, za křídlem nebo jiným autem, přijde o toto světlo i o jeho odlesk. Naměřeno na Vysoké na RTX 5070 Ti: asi 0,2 ms času GPU v klidné scéně, 0,5 ms v závodním provozu.
en = Paint detail
cs = Detail laku
en = Uses the paint's fine surface detail, orange peel and the carbon weave, in the highlights. Measured at High on an RTX 5070 Ti: about 0.1 ms of GPU time in race traffic, too little to measure in a quiet scene.
cs = V odleskách používá jemný detail povrchu laku, pomerančovou kůru a vazbu karbonu. Naměřeno na Vysoké na RTX 5070 Ti: asi 0,1 ms času GPU v závodním provozu, v klidné scéně příliš málo na změření.
en = Lacquer reflections
cs = Odrazy laku
en = Mirrors what's around a car in its paint, strongest at shallow angles. Only what's on screen can be reflected, and only where both eyes can see it, so both eyes show the same. Measured on an RTX 5070 Ti: about 0.02 ms of GPU time in a quiet scene, 0.15 ms in race traffic.
cs = Zrcadlí v laku okolí auta, nejsilněji pod malými úhly. Odrazit lze jen to, co je na obrazovce, a jen tam, kde to vidí obě oči, aby obě oči ukazovaly totéž. Naměřeno na RTX 5070 Ti: asi 0,02 ms času GPU v klidné scéně, 0,15 ms v závodním provozu.
en = Headlight highlights
cs = Odlesky světlometů
en = Other cars' headlights, and yours in the mirrors, shine on the paint as the floodlights do. Measured on an RTX 5070 Ti: about 0.03 to 0.05 ms of GPU time.
cs = Světlomety jiných aut, a tvoje v zrcátkách, svítí na lak jako reflektory. Naměřeno na RTX 5070 Ti: asi 0,03 až 0,05 ms času GPU.
en = Shadows on the ground
cs = Stíny na zemi
en = Darkens the track and walls under and beside the cars, and casts soft floodlight shadows, so the cars sit on the ground. Measured at High on an RTX 5070 Ti: about 0.2 ms of GPU time in a quiet scene, 0.55 ms in race traffic.
cs = Ztmaví trať a zdi pod auty a vedle nich a vrhá měkké stíny od reflektorů, aby auta stála na zemi. Naměřeno na Vysoké na RTX 5070 Ti: asi 0,2 ms času GPU v klidné scéně, 0,55 ms v závodním provozu.
en = Night vision color
cs = Barva nočního vidění
en = As eyes do at night, dark areas lose their colour and turn slightly blue while lit areas keep theirs. A matter of taste, off by default. Measured on an RTX 5070 Ti: about 0.03 ms of GPU time.
cs = Stejně jako oči v noci ztrácejí tmavé oblasti barvu a mírně modrají, zatímco osvětlené si ji drží. Věc vkusu, ve výchozím stavu vypnuto. Naměřeno na RTX 5070 Ti: asi 0,03 ms času GPU.
en = Color correction
cs = Korekce barev
en = Adjusts the picture in the headset: exposure, brightness, contrast and saturation, for a game that looks too dark, washed out or dull in your headset. Sim-QVFR applies it as it composes the views, the periphery and the focus area alike, so the focus area never stands out; it costs almost no GPU time and changes while you drive. Menus and loading screens show as the game draws them. Off, or every value at 0, leaves the picture as it was.
cs = Upraví obraz v headsetu: expozici, jas, kontrast a sytost, pro hru, která ti v headsetu připadá příliš tmavá, vybledlá nebo fádní. Sim-QVFR ji použije při skládání pohledů, na periferii i oblast ostrosti stejně, takže oblast ostrosti nikdy nevyčnívá; stojí skoro žádný čas GPU a mění se za jízdy. Nabídky a načítací obrazovky se zobrazí tak, jak je hra vykreslí. Vypnuto, nebo všechny hodnoty na 0, nechá obraz tak, jak byl.
en = Exposure
cs = Expozice
en = Scales all of the light, in stops (EV): +1.0 EV is twice as bright, -1.0 EV half, up to 3 stops either way. Highlights brighten with the rest and can clip, so raise it a little at a time; Brightness lifts the darks without touching them.
cs = Škáluje veškeré světlo, ve stopách (EV): +1,0 EV je dvakrát jasnější, -1,0 EV poloviční, až 3 stopy na každou stranu. Světla se zesvětlují spolu se zbytkem a mohou přepálit, proto zvyšuj po troškách; Jas zvedá tmavé tóny, aniž by se jich dotkl.
en = Brightness
cs = Jas
en = Lightens or darkens the mid tones and shadows while black stays black and white stays white, so an OLED headset keeps its deep blacks: raise it to see into dark cockpits and night stints, lower it for a richer, darker picture.
cs = Zesvětlí nebo ztmaví střední tóny a stíny, zatímco černá zůstane černá a bílá bílá, takže headset s OLED si drží hluboké černé: zvyš pro výhled do tmavých kokpitů a nočních úseků, sniž pro sytější, tmavší obraz.
en = Contrast
cs = Kontrast
en = Spreads the picture’s tones away from mid grey (above 0) or draws them towards it (below 0), as a gentle S-curve: black and white stay where they are and colours keep their hue. More contrast gives deeper shadows and brighter highlights; less shows more detail in both.
cs = Roztáhne tóny obrazu od středně šedé (nad 0) nebo je k ní přitáhne (pod 0), jako jemná S-křivka: černá a bílá zůstanou, kde jsou, a barvy si drží odstín. Víc kontrastu dává hlubší stíny a jasnější světla; míň ukazuje víc detailu v obojím.
en = Saturation
cs = Sytost
en = How strong the colours are: above 0 more vivid, below 0 more muted, -100% grey. Brightness is kept as each colour changes.
cs = Jak silné jsou barvy: nad 0 živější, pod 0 tlumenější, -100 % šedá. Jas zůstává zachován, jak se každá barva mění.
en = Accent brightness
cs = Jas akcentu
en = How light or dark the game’s colour is. The wheel picks its hue and how strong it is; the launcher keeps its text and edges readable in light and dark mode.
cs = Jak světlá nebo tmavá je barva hry. Kolo barev volí její odstín a sytost; spouštěč udrží text a okraje čitelné ve světlém i tmavém režimu.
en = Focus width
cs = Šířka ostrosti
en = The focus area’s width, a share of the view. Wider hides the edge between sharp and soft better; its pixels cost density × width × height, so a wide area at a high density costs the most. It changes while you drive; wider than the game started with (at your density) renders less dense until the next launch.
cs = Šířka oblasti ostrosti, podíl pohledu. Širší lépe skryje hranici mezi ostrým a měkkým; její pixely stojí hustota × šířka × výška, takže široká oblast s vysokou hustotou stojí nejvíc. Mění se za jízdy; širší, než s jakou hra začala (při tvé hustotě), se vykresluje méně hustě až do příštího spuštění.
en = Focus height
cs = Výška ostrosti
en = The focus area’s height, a share of the view. Taller covers more of the dash and mirrors; it costs pixels as the width does. Taller than the game started with (at your density) renders less dense until the next launch.
cs = Výška oblasti ostrosti, podíl pohledu. Vyšší pokryje víc palubní desky a zrcátek; stojí pixely stejně jako šířka. Vyšší, než s jakou hra začala (při tvé hustotě), se vykresluje méně hustě až do příštího spuštění.
en = Corner radius
cs = Zaoblení rohů
en = Rounds the focus area’s corners, so its edge is harder to spot. No cost: the area renders as a rectangle either way.
cs = Zaoblí rohy oblasti ostrosti, aby byl její okraj hůř vidět. Bez ceny: oblast se tak jako tak vykresluje jako obdélník.
en = Feather
cs = Prolnutí
en = The band where the focus area blends into the outer view. Wider hides the edge better; no measurable cost.
cs = Pás, kde oblast ostrosti přechází do vnějšího pohledu. Širší lépe skryje okraj; bez měřitelné ceny.
en = Regulate focus density
cs = 
en = Takes Focus density down 1% at a time while the GPU time per frame stays over Lower above, and back up while it stays under Raise below. The density you set is the most it uses; it is never written over. It stops at 50%.
cs = 
en = Regulate periphery resolution
cs = 
en = Takes Periphery resolution down 1% at a time while the GPU time per frame stays over Lower above, and back up while it stays under Raise below. The resolution you set is the most it uses; it is never written over. It stops at 20%.
cs = 
en = Lower above
cs = 
en = The GPU time per frame, in ms, over which the regulator lowers what it regulates. It is the time the layer measures on the GPU for the eye passes (the log’s scene span), not the overlay’s GPU number. At 90 Hz a frame has 11.1 ms; frames start to miss a little under that, so 10 ms is a start.
cs = 
en = Raise below
cs = 
en = The GPU time per frame, in ms, under which the regulator raises what it regulates again. Keep it a ms or more under Lower above, so it does not go up and down: between the two limits nothing changes.
cs = 
en = Frames before lowering
cs = 
en = How many frames in a row must run over Lower above before the regulator takes a 1% step down (1-50). Keep it low to react quickly: at 90 Hz, 10 frames is about a tenth of a second per step. A frame under Raise below starts the count again.
cs = 
en = Frames before raising
cs = 
en = How many frames in a row must run under Raise below before the regulator takes a 1% step back up (50-300). Keep it high to come back slowly: at 90 Hz, 300 frames is about three seconds per step. A frame over Lower above starts the count again.
cs = 
en = Gaze dead-zone
cs = Mrtvá zóna pohledu
en = How far your eyes move before the focus area follows. A little keeps it still against eye-tracker noise; too much makes it lag when you look around. No GPU cost.
cs = Jak daleko se tvé oči pohnou, než je oblast ostrosti následuje. Trocha ji drží v klidu proti šumu sledovače; příliš mnoho způsobí zpoždění, když se rozhlížíš. Bez ceny pro GPU.
en = Gaze offset
cs = Posun pohledu
en = Moves the eye-tracked focus area up or down, in degrees, for a tracker that sits a little off. No cost.
cs = Posune oblast ostrosti sledovanou očima nahoru nebo dolů, ve stupních, pro sledovač, který sedí trochu mimo. Bez ceny.
en = Vertical position
cs = Svislá poloha
en = Moves the fixed focus area up or down, in degrees: towards the dash and mirrors, or the road. No cost.
cs = Posune pevnou oblast ostrosti nahoru nebo dolů, ve stupních: k palubní desce a zrcátkům, nebo k silnici. Bez ceny.
en = Crop the view
cs = Oříznout pohled
en = Cuts the edges a helmet or the lens hides before the game renders them. It saves GPU time and VRAM with the pixels cut; the headset shows black there.
cs = Odřízne okraje, které skryje přilba nebo čočka, dřív než je hra vykreslí. Šetří čas GPU i VRAM úměrně odříznutým pixelům; headset tam ukazuje černou.
en = Top
cs = Nahoře
en = How much of the top of each eye’s view the game doesn’t render. Saves pixels in proportion.
cs = Kolik z horní části pohledu každého oka hra nevykreslí. Šetří pixely úměrně.
en = Bottom
cs = Dole
en = How much of the bottom of each eye’s view the game doesn’t render. Saves pixels in proportion.
cs = Kolik ze spodní části pohledu každého oka hra nevykreslí. Šetří pixely úměrně.
en = Outer side (temple)
cs = Vnější strana (spánek)
en = How much of each eye’s temple side the game doesn’t render. Saves pixels in proportion.
cs = Kolik ze strany spánku u každého oka hra nevykreslí. Šetří pixely úměrně.
en = Inner side (nose)
cs = Vnitřní strana (nos)
en = How much of each eye’s nose side the game doesn’t render; the other eye still sees most of it. Saves pixels in proportion.
cs = Kolik ze strany nosu u každého oka hra nevykreslí; druhé oko z toho většinu stále vidí. Šetří pixely úměrně.
en = Show a helmet
cs = Zobrazit přilbu
en = Draws a helmet’s visor opening round the view, lit by the scene, in a layer of its own. It costs the headset a layer to composite; nothing for the game.
cs = Kreslí kolem pohledu otvor hledí přilby, osvětlený scénou, ve vlastní vrstvě. Headset musí složit jednu vrstvu navíc; hru to nestojí nic.
en = Road focus
cs = Ostrost na silnici
en = For fixed foveation. The focus area renders in full detail only along the road ahead (Road width either side of it and 3.5 m above it, following its hills and bends) and in your own car: the wheel, dash, displays and mirrors inside the focus area stay sharp. Trees, grandstands, hills and the sky beside and above the road come from the periphery’s image; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. It’s off while the focus follows your eyes. Turn it off if something beside the road looks softer than you want. Changes while you drive.
cs = Pro pevnou foveaci. Oblast fokusu se vykresluje v plných detailech jen podél silnice před vámi (šířka silnice na obě strany a 3,5 m nad ní, podle jejích horizontů a zatáček) a ve vašem vlastním autě: volant, palubní deska, displeje a zrcátka v oblasti fokusu zůstávají ostré. Stromy, tribuny, kopce a obloha vedle silnice a nad ní pocházejí z obrazu periferie; tam, kam se při jízdě díváte, byste rozdíl vidět neměli. Šetří čas GPU, tím víc, čím větší je oblast fokusu. Je vypnutá, dokud fokus sleduje vaše oči. Vypněte ji, pokud vám něco vedle silnice připadá příliš měkké. Mění se za jízdy.
en = Road width
cs = Šířka silnice
en = How far either side of the road’s centre stays in full detail with Road focus on. Lower keeps just the track sharp and saves the most; higher brings the kerbs, run-off and barriers into the focus area and saves less. 10 m suits most circuits. Changes while you drive.
cs = Jak daleko na obě strany od středu silnice zůstávají plné detaily se zapnutou ostrostí na silnici. Méně nechá ostrou jen trať a ušetří nejvíc; víc přenese do oblasti fokusu obrubníky, únikové zóny a svodidla a ušetří méně. 10 m se hodí pro většinu tratí. Mění se za jízdy.
en = Cockpit preset
cs = Předvolba kokpitu
en = The focus area’s shape, size and position Road focus sets when you switch it on, or at once when you pick the other one here. A: a large cockpit shape over the windscreen, dash and wheel. B: a smaller one moved down to the road and the dash. Adjust either afterwards as you like; your own shape, size and position come back when you switch Road focus off. When the headset composes the views itself, the size stays inside its own focus region and the position doesn’t apply.
cs = Tvar, velikost a poloha oblasti fokusu, které ostrost na silnici nastaví při zapnutí, nebo hned, když tu zvolíte druhou. A: velký tvar kokpitu přes čelní sklo, palubní desku a volant. B: menší, posunutý dolů na silnici a palubní desku. Potom kterýkoli upravte podle sebe; váš vlastní tvar, velikost a poloha se vrátí, když ostrost na silnici vypnete. Když headset skládá pohledy sám, velikost zůstane v jeho vlastní oblasti fokusu a poloha neplatí.
en = Road widening
cs = Rozšiřování silnice
en = How much Road focus’s sharp road widens with distance, in degrees either side, so a bend curving away far ahead (Eau Rouge, a hairpin, the pit exit) stays in full detail. Lower saves more, but a far bend can turn soft; higher catches tighter bends and brings more of the far scenery into the focus area, saving less. 15° suits most circuits. Changes while you drive.
cs = Jak moc se ostrá silnice při ostrosti na silnici rozšiřuje se vzdáleností, ve stupních na každou stranu, aby zatáčka uhýbající daleko vpředu (Eau Rouge, vracečka, výjezd z boxů) zůstala v plných detailech. Méně ušetří víc, ale vzdálená zatáčka může být rozmazaná; víc zachytí ostřejší zatáčky a přenese do oblasti fokusu víc vzdálené krajiny, takže ušetří méně. 15° se hodí pro většinu tratí. Mění se za jízdy.
en = Road edge blend
cs = Přechod okraje silnice
en = How softly Road focus’s full detail fades into the periphery at its edges: this many metres near you, wider in proportion far away so distant edges fade too. Raise it if you notice where the sharp area ends; 0 is a hard edge. Changes while you drive.
cs = Jak měkce plné detaily ostrosti na silnici přecházejí na okrajích do periferie: tolik metrů blízko vás, v dálce úměrně šířeji, aby se rozplývaly i vzdálené okraje. Zvyšte ho, pokud vidíte, kde ostrá oblast končí; 0 je ostrá hrana. Mění se za jízdy.
en = Show Road focus area
cs = Zobrazit oblast ostrosti na silnici
en = Tints blue, in the headset, everything Road focus takes from the periphery, so you can see exactly what stays in full detail (untinted) as you drive. Road focus works as usual meanwhile. For setting up; turn it off to drive.
cs = Obarví v headsetu modře vše, co ostrost na silnici bere z periferie, abyste za jízdy viděli přesně, co zůstává v plných detailech (neobarvené). Ostrost na silnici mezitím funguje jako obvykle. Pro nastavení; na jízdu ji vypněte.
en = Road height
cs = Výška silnice
en = How high above the road stays in full detail with Road focus on. Lower keeps just the road and the cars sharp and saves the most; higher brings signs, gantries and the grandstands’ lower rows into the focus area and saves less. 3.5 m suits most circuits. Changes while you drive.
cs = Jak vysoko nad silnicí zůstávají plné detaily se zapnutou ostrostí na silnici. Méně nechá ostrou jen silnici a auta a ušetří nejvíc; víc přenese do oblasti fokusu značky, portály a spodní řady tribun a ušetří méně. 3,5 m se hodí pro většinu tratí. Mění se za jízdy.
en = Show focus outline
cs = Zobrazit obrys ostrosti
en = Draws the focus area’s edge, to see where it is and how it follows your eyes. For setting up; turn it off to drive.
cs = Kreslí okraj oblasti ostrosti, abys viděl, kde je a jak sleduje tvé oči. Pro nastavování; na jízdu ho vypni.
en = Use Cheeky Foveated DLSS
cs = Použít Cheeky Foveated DLSS
en = Runs Cheeky Foveated DLSS inside the game, for the DLSS options below. Needs an NVIDIA RTX GPU, DLSS on in the game, and Cheeky’s download. Applies at the next launch.
cs = Spustí Cheeky Foveated DLSS uvnitř hry, pro možnosti DLSS níže. Potřebuje GPU NVIDIA RTX, zapnuté DLSS ve hře a stažený Cheeky. Uplatní se při příštím spuštění.
en = Cheaper outer views
cs = Levnější vnější pohledy
en = The outer views get Cheeky’s DLAA at a lower resolution instead of the game’s DLSS: GPU time saved on the views you see least.
cs = Vnější pohledy dostanou místo DLSS hry DLAA od Cheeky v nižším rozlišení: ušetřený čas GPU na pohledech, které vidíš nejméně.
en = Outer DLAA scale
cs = Měřítko vnějšího DLAA
en = The resolution of that cheaper pass. Lower saves more GPU time and softens the side view.
cs = Rozlišení tohoto levnějšího průchodu. Nižší ušetří víc času GPU a změkčí boční pohled.
en = Focus supersampling
cs = Supersampling ostrosti
en = Renders the focus views above their size before DLSS: a sharper centre, for more GPU time.
cs = Vykreslí pohledy ostrosti nad jejich velikost před DLSS: ostřejší střed za víc času GPU.
en = Frame generation
cs = Generování snímků
en = Cheeky’s DLSS frame generation adds frames between the game’s: smoother motion when the game can’t hold the refresh rate, for some GPU time and latency. Turn OpenXR Toolkit’s Turbo mode off with it, and run no other frame generator.
cs = Generování snímků DLSS od Cheeky přidává snímky mezi snímky hry: plynulejší pohyb, když hra neudrží obnovovací frekvenci, za trochu času GPU a latence. Vypni s ním režim Turbo v OpenXR Toolkit a nepoužívej žádný jiný generátor snímků.
en = Center region
cs = Středová oblast
en = The part of the view frame generation makes at full quality (it follows your eyes when eye tracked). Larger looks better and costs more GPU time.
cs = Část pohledu, kterou generování snímků vytváří v plné kvalitě (se sledováním očí sleduje tvé oči). Větší vypadá lépe a stojí víc času GPU.
en = Load order
cs = Pořadí načítání
en = Nearest the game first. Each launch loads these below the Sim-QVFR layer in this order; a layer off in Windows can still be loaded for the game alone. Locked switches keep the mod and the game working.
cs = Nejblíž hře jako první. Každé spuštění je načte pod vrstvu Sim-QVFR v tomto pořadí; vrstvu vypnutou ve Windows lze stále načíst jen pro hru. Zamčené přepínače udržují mod i hru funkční.
en = Describe the problem
cs = Popiš problém
en = Zips the logs and the game’s crash reports from those sessions (names and account IDs taken out) into the logs folder, then opens a new issue on GitHub with what you wrote, your settings, the last session and your PC filled in. Add the steps there, and drag in the zip (it shows below) and any screenshots.
cs = Zabalí logy a hlášení o pádech hry z těch relací (bez jmen a ID účtů) do zipu ve složce logů a pak otevře nový issue na GitHubu s tím, co jsi napsal, tvým nastavením, poslední relací a údaji o tvém PC. Doplň tam kroky a přetáhni do něj zip (ukáže se níže) a případné snímky obrazovky.
en = Busiest threads
cs = Nejvytíženější vlákna
en = Each thread is a share of ONE core. A thread near 100% can hold the frame rate back even when Windows shows the whole CPU at 15%; a thread that spins by design looks busy whatever limits it.
cs = Každé vlákno je podíl JEDNOHO jádra. Vlákno blízko 100 % může brzdit snímkovou frekvenci, i když Windows ukazuje celé CPU na 15 %; vlákno, které záměrně točí smyčku, vypadá vytížené bez ohledu na to, co ho omezuje.
en = Frame rate
cs = Snímková frekvence
en = The last session’s average against the headset’s refresh rate, the frame rate it asks for. Below it, the runtime fills the gaps (motion smoothing or reprojection), which shows as wobble on moving edges.
cs = Průměr poslední relace proti obnovovací frekvenci headsetu, snímkové frekvenci, kterou žádá. Pod ní runtime doplňuje mezery (vyhlazování pohybu nebo reprojekce), což se projeví vlněním na pohyblivých hranách.
en = Slow frames
cs = Pomalé snímky
en = How long your slowest frames take: lower is smoother. One frame in ten took at least this long (the 90th percentile). Above the frame’s budget (1000 ms divided by the headset’s refresh rate: 11.1 ms at 90 Hz) those frames miss the headset, and you feel stutter even when the average frame rate looks fine.
cs = Jak dlouho trvají tvé nejpomalejší snímky: méně je plynulejší. Jeden snímek z deseti trval aspoň takhle dlouho (90. percentil). Nad rozpočtem snímku (1000 ms děleno obnovovací frekvencí headsetu: 11,1 ms při 90 Hz) tyto snímky headset nestihnou a cítíš zasekávání, i když průměrná snímková frekvence vypadá dobře.
en = Limited by
cs = Omezeno
en = What held the frame back most of the time: the game’s render thread on the CPU, the GPU, or nothing (the headset’s refresh). Lowering resolution helps only when the GPU limits it.
cs = Co snímek nejčastěji brzdilo: vykreslovací vlákno hry na CPU, GPU, nebo nic (obnovovací frekvence headsetu). Snížení rozlišení pomůže, jen když omezuje GPU.
en = Previous session
cs = Předchozí relace
en = The session before the last one for this game, and the settings changed in between, so you can see what a change did. A change while you drive (here or in the headset menu) starts a new stint, kept as its own entry; each covers the whole stint, with the moments the headset menu was open left out. Compare runs on the same track and car for a fair difference.
cs = Relace před poslední pro tuto hru a nastavení změněná mezitím, abys viděl, co změna udělala. Změna za jízdy (zde nebo v menu v headsetu) začne nový stint, uložený jako vlastní záznam; každý pokrývá celý stint, bez chvil, kdy bylo menu v headsetu otevřené. Pro férové srovnání porovnávej jízdy na stejné trati se stejným autem.
en = Run with anti-cheat
cs = Spustit s anti-cheatem
en = Starts the game through its anti-cheat (Easy Anti-Cheat), as Steam does, with Sim-QVFR running, so you can join online servers. Sim-QVFR runs inside the game, and the anti-cheat may kick you or ban your account for it. Sim-QVFR and its developer aren’t responsible for kicks or bans: turning it on asks you to accept that risk. Off starts the game without its anti-cheat, for offline sessions only.
cs = Spustí hru přes její anti-cheat (Easy Anti-Cheat), jako to dělá Steam, se spuštěným Sim-QVFR, abys mohl na online servery. Sim-QVFR běží uvnitř hry a anti-cheat tě za to může vyhodit nebo zablokovat tvůj účet. Sim-QVFR ani jeho vývojář neodpovídají za vyhození ani zákazy: zapnutí tě požádá, abys toto riziko přijal. Vypnuto spustí hru bez anti-cheatu, jen pro offline relace.
en = Layers for
cs = Vrstvy pro
en = Launches from here: the VR add-ons (OpenXR layers) a launch from this launcher loads, below Sim-QVFR, in an order of its own; nothing else changes. Every app: Windows’ own list, which every other app uses (and the game started from Steam), saved in the registry when you apply, with a backup in the logs folder first.
cs = Spuštění odsud: VR doplňky (vrstvy OpenXR), které načte spuštění z tohoto spouštěče, pod Sim-QVFR, ve vlastním pořadí; nic jiného se nemění. Každá aplikace: vlastní seznam Windows, který používá každá jiná aplikace (i hra spuštěná ze Steamu), uložený do registru, když dáš Použít, s předchozí zálohou ve složce logů.
en = CPU capture
cs = Zachycení CPU
en = At the next launch, the CPU capture hotkey (Ctrl+Alt+C) while driving records for 20 s where the game’s busiest threads spend their time, into a cpu-profile file in the logs folder. The headset menu shows when it starts and ends; the game may stutter slightly while it records.
cs = Při příštím spuštění klávesová zkratka zachycení CPU (Ctrl+Alt+C) za jízdy zaznamená na 20 s, kde nejvytíženější vlákna hry tráví čas, do souboru cpu-profile ve složce logů. Menu v headsetu ukáže začátek a konec; během záznamu se hra může mírně zasekávat.
en = Frame capture
cs = Zachycení snímku
en = Saves the game’s own image and the composed output, as PNG files in the captures folder inside the logs folder. Each press saves one more frame, to compare the views where something looks wrong. In X-Plane 12, Assetto Corsa Competizione and Le Mans Ultimate.
cs = Uloží vlastní obraz hry a složený výstup jako soubory PNG do složky captures ve složce logů. Každé stisknutí uloží další snímek, abys mohl porovnat pohledy tam, kde něco vypadá špatně. V X-Plane 12, Assetto Corsa Competizione a Le Mans Ultimate.
en = Next launch without QVFR
cs = Příští spuštění bez QVFR
en = Starts the game once with its own two views and QVFR off, still measuring, so Diagnostics can compare the same race with and without QVFR. It turns itself off after that launch; the next one has QVFR again. The performance overlay works in it, the headset menu does not.
cs = Spustí hru jednou s jejími vlastními dvěma pohledy a vypnutým QVFR, ale stále s měřením, aby Diagnostika mohla porovnat stejný závod s QVFR a bez něj. Po tom spuštění se samo vypne; další spuštění má QVFR zase. Překryv výkonu v něm funguje, menu v headsetu ne.
en = Detailed logs
cs = Podrobné logy
en = Normal logs say what Sim-QVFR set up, decided and measured. Detailed logs add every step behind that, for a bug report when the developer asks for one. They last three launches and then turn themselves off, so the logs stay small. Send them with Report an issue, or Save the logs as a zip.
cs = Běžné logy říkají, co Sim-QVFR nastavil, rozhodl a naměřil. Podrobné logy přidají každý krok za tím, pro hlášení chyby, když o ně vývojář požádá. Vydrží tři spuštění a pak se samy vypnou, aby logy zůstaly malé. Pošli je přes Nahlásit problém, nebo použij Uložit logy jako zip.
en = Logs folder
cs = Složka logů
en = Each launch adds a session log and a small run folder. The launcher keeps the newest 30 sessions and removes older ones at each launch, and the newest 10 CPU captures. Frame captures and game image dumps stay until you clear them: Clear captures moves them to the Recycle Bin.
cs = Každé spuštění přidá log relace a malou složku běhu. Spouštěč drží 30 nejnovějších relací a starší při každém spuštění odstraní, a 10 nejnovějších zachycení CPU. Zachycení snímků a výpisy obrazu hry zůstanou, dokud je nevymažeš: Vymazat zachycení je přesune do koše.
en = Presets for eye tracked foveation
cs = Předvolby pro foveaci se sledováním očí
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Eye tracked, the area follows your eyes, so it can be small and very sharp. They set the resolution only and keep everything else.
cs = Výchozí body, které dávají pixely do středu: nízké vnější pohledy a hustá oblast ostrosti. Se sledováním očí oblast sleduje tvé oči, takže může být malá a velmi ostrá. Nastavují jen rozlišení a vše ostatní ponechají.
en = Presets for fixed foveation
cs = Předvolby pro pevnou foveaci
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Fixed, your eyes move off the centre, so the area is larger and a little less dense. They set the resolution only and keep everything else.
cs = Výchozí body, které dávají pixely do středu: nízké vnější pohledy a hustá oblast ostrosti. Při pevné foveaci oči uhýbají ze středu, takže oblast je větší a o něco méně hustá. Nastavují jen rozlišení a vše ostatní ponechají.
en = Your profiles
cs = Tvé profily
en = A profile holds every setting of the picture: resolution, foveation and the focus overlay, and where the game has them the view crop, the helmet and Foveated DLSS. Not the menu’s and overlay’s places, the hotkeys or the OpenXR layers. Share copies one as a line of text to paste in a chat; Paste adds one from the clipboard. The headset menu’s Profile line switches between them while you drive.
cs = Profil obsahuje každé nastavení obrazu: rozlišení, foveaci a překryv ostrosti, a tam, kde je hra má, oříznutí pohledu, přilbu a Foveated DLSS. Ne umístění menu a překryvu, klávesové zkratky ani vrstvy OpenXR. Sdílet zkopíruje profil jako řádek textu k vložení do chatu; Vložit přidá profil ze schránky. Řádek Profil v menu v headsetu mezi nimi přepíná za jízdy.
en = A key’s first press also opens the menu. A wheel’s directions act only while the menu shows, so a switch the game also uses doesn’t open it: use Open or close first.
cs = První stisk klávesy také otevře menu. Směry na volantu fungují, jen když je menu zobrazené, takže přepínač, který používá i hra, ho neotevře: použij nejdřív Otevřít/zavřít.
en = Keys work while the game window has focus; wheel, button box and controller buttons work whenever the game runs.
cs = Klávesy fungují, když má okno hry fokus; tlačítka volantu, button boxu a ovladače fungují, kdykoli hra běží.
en = Field of view crop
cs = Oříznutí zorného pole
en = The outer view keeps its sharpness and the focus region its size. Changes reach a running game at once; with DLSS on, or with less crop than at launch, the pixel count follows at the next launch.
cs = Vnější pohled si zachová ostrost a oblast ostrosti svou velikost. Změny se do běžící hry dostanou hned; se zapnutým DLSS nebo s menším oříznutím než při spuštění se počet pixelů přizpůsobí při příštím spuštění.
en = Helmet overlay
cs = Překryv přilby
en = Built in, the visor opening follows the crop (Rim and Corners). Your own helmet: top.png, bottom.png and visor.png with alpha in the helmet folder next to the layer; the log suggests the crop that matches them.
cs = Vestavěná: otvor hledí sleduje oříznutí (Lem a Rohy). Vlastní přilba: top.png, bottom.png a visor.png s alfa kanálem ve složce helmet vedle vrstvy; log navrhne oříznutí, které k nim sedí.
en = Focus shape
cs = Tvar ostrosti
en = Each corner moves toward the middle of the focus region, percent of its width (in) or height (down, up). Pull the top corners in for a trapezoid: more of the dash sharp, less of the far field. The focus view still renders the whole box, so the cost stays the same.
cs = Každý roh se posouvá ke středu oblasti ostrosti, v procentech její šířky (dovnitř) nebo výšky (dolů, nahoru). Přitáhni horní rohy dovnitř pro lichoběžník: víc palubní desky ostře, méně dálky. Pohled ostrosti stále vykresluje celý obdélník, takže cena zůstává stejná.
en = Cheeky Foveated DLSS
cs = Cheeky Foveated DLSS
en = No Cheeky loader goes in the game folder: Sim-QVFR loads Cheeky’s runtime into the game itself.
cs = Do složky hry nepatří žádný zavaděč Cheeky: Sim-QVFR načte runtime Cheeky do hry sám.
en = Frame generation (experimental)
cs = Generování snímků (experimentální)
en = Outside the center region frames are warped with the game’s motion. Lower scales use less GPU time and memory. With an eye-tracked focus (the Foveation card) the region follows your eyes too, through Cheeky’s OpenXR layer.
cs = Mimo středovou oblast se snímky deformují podle pohybu ve hře. Nižší měřítka spotřebují méně času GPU a paměti. S ostrostí sledovanou očima (karta Foveace) sleduje oblast tvé oči také, přes vrstvu OpenXR od Cheeky.
en = The settings menu stays 0.8 m in front of your head, wherever you look.
cs = Menu nastavení zůstává 0,8 m před tvou hlavou, ať se díváš kamkoli.
en = Use DLSS
cs = Použít DLSS
en = Sim-QVFR evaluates NVIDIA’s DLSS on each view, with depth and motion it works out from the game’s own frames, before the game’s post-processing. Needs an NVIDIA RTX graphics card. Sim-QVFR includes NVIDIA’s nvngx_dlss.dll; Choose… takes another (a newer one from a game), Use included goes back.
cs = Sim-QVFR spouští NVIDIA DLSS na každém pohledu, s hloubkou a pohybem, které si odvodí z vlastních snímků hry, ještě před postprocesingem hry. Potřebuje grafickou kartu NVIDIA RTX. Sim-QVFR obsahuje nvngx_dlss.dll od NVIDIA; Vybrat… vezme jiný (novější z nějaké hry), Použít přiložený se vrátí zpět.
en = Use FSR
cs = Použít FSR
en = Experimental. On a PC without an NVIDIA RTX graphics card, Sim-QVFR evaluates AMD FSR on each view in DLSS’s place, with the same depth and motion: FSR 4 where AMD’s software offers it for your card (Radeon RX 9000, and newer drivers on RX 7000 and 6000), FSR 3.1 elsewhere. Sim-QVFR includes AMD’s FSR files. Tested only as FSR 3.1 on an NVIDIA card so far: tell us how it runs on yours.
cs = Experimentální. Na PC bez grafické karty NVIDIA RTX spouští Sim-QVFR na každém pohledu místo DLSS AMD FSR, se stejnou hloubkou a pohybem: FSR 4 tam, kde ho software AMD pro tvou kartu nabízí (Radeon RX 9000 a s novějšími ovladači RX 7000 a 6000), jinde FSR 3.1. Sim-QVFR obsahuje soubory AMD FSR. Zatím testováno jen jako FSR 3.1 na kartě NVIDIA: dej nám vědět, jak běží na té tvé.
en = Periphery preset
cs = Předvolba periferie
en = Steadier or cheaper DLSS outside the focus area. K: a steadier picture, at a higher cost. F: about half the cost, a little more flicker on edges. With eye tracking you rarely look there, so F is usually fine; with a fixed focus, K.
cs = Stabilnější nebo levnější DLSS mimo oblast ostrosti. K: stabilnější obraz za vyšší cenu. F: zhruba poloviční cena, o něco víc blikání na hranách. Se sledováním očí se tam díváš jen zřídka, takže F obvykle stačí; s pevnou ostrostí K.
en = Texture sharpening
cs = Doostření textur
en = DLSS rebuilds detail from frames drawn at a lower resolution, so textures are best sampled a step sharper while it runs. Sim-QVFR does that through copies of the game’s shaders, in the focus area alone or in the periphery too. Measured gains are modest (most in the periphery and on distant textures). Off at launch, nothing is installed for it; turned on then, it starts at the next launch. Fine patterns may shimmer: then a step lower.
cs = DLSS skládá detail ze snímků kreslených v nižším rozlišení, takže je nejlepší textury během něj vzorkovat o stupeň ostřeji. Sim-QVFR to dělá přes kopie shaderů hry, jen v oblasti ostrosti, nebo i v periferii. Naměřené zisky jsou skromné (nejvíc v periferii a na vzdálených texturách). Když je při spuštění vypnuté, nic se pro něj neinstaluje; zapnuté potom začne fungovat při příštím spuštění. Jemné vzory se mohou mihotat: pak o stupeň níž.
en = Light glow
cs = Záře světel
en = At night DLSS takes very bright lights (distant headlights, floodlights) for noise and smooths them away, so the game’s bloom fades. Light glow lowers the exposure DLSS works at, so it keeps them: some at Low, more at High. Nothing is added to the picture, so the lights don’t flicker or smear. Very bright edges may get a faint halo: then Low or Off. NVIDIA DLSS only. Experimental.
cs = V noci DLSS považuje velmi jasná světla (vzdálené světlomety, reflektory) za šum a vyhladí je, takže záře hry zeslábne. Záře světel snižuje expozici, se kterou DLSS pracuje, aby je zachovalo: trochu při volbě Nízká, víc při Vysoká. Do obrazu se nic nepřidává, takže světla neblikají ani se nerozmazávají. Velmi jasné hrany mohou mít slabou svatozář: pak Nízká nebo Vypnuto. Jen NVIDIA DLSS. Experimentální.
en = Updates
cs = Aktualizace
en = Install downloads the release from GitHub, checks it against the SHA-256 GitHub gives, replaces the program files and restarts the launcher; your settings, profiles and changed files stay, and the version you had is kept in the update folder. Download opens the release’s page instead.
cs = Instalovat stáhne vydání z GitHubu, ověří ho podle SHA-256, které GitHub uvádí, nahradí soubory programu a restartuje spouštěč; tvá nastavení, profily a změněné soubory zůstanou a dosavadní verze se uloží do složky update. Stáhnout místo toho otevře stránku vydání.
en = These settings reach the game while it runs, as soon as you change them. Without the game running, they apply when it starts.
cs = Tato nastavení se dostanou do běžící hry, jakmile je změníš. Když hra neběží, uplatní se při jejím spuštění.
en = Lowering it reaches a running game at once, and so does raising it back up to what the game started with. Above that, it takes effect at the next launch. With DLSS on in the game, the views keep their launch sizes until the next launch.
cs = Snížení se do běžící hry dostane hned, stejně jako zvýšení zpět na hodnotu, se kterou hra začala. Nad ni se projeví při příštím spuštění. Se zapnutým DLSS ve hře si pohledy drží velikosti ze spuštění až do příštího spuštění.
en = These settings take effect the next time the game starts from the launcher. A running game keeps what it started with.
cs = Tato nastavení se projeví při příštím spuštění hry ze spouštěče. Běžící hra si ponechá to, s čím začala.
en = The local time on a small card in the headset, apart from the performance overlay: on or off and moved live, here or from the headset menu. It costs next to nothing; it redraws once a minute.
cs = Místní čas na malé kartě v headsetu, odděleně od překryvu výkonu: zapnutí, vypnutí i přesun naživo, zde nebo z menu v headsetu. Nestojí skoro nic; překresluje se jednou za minutu.
en = The performance overlay in the headset: frame rate, CPU and GPU time and what limits the frame. A little CPU time while it shows.
cs = Překryv výkonu v headsetu: snímková frekvence, čas CPU a GPU a co omezuje snímek. Trochu času CPU, dokud je zobrazený.
en = Shape
cs = Tvar
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom shape: an outline of up to 10 points you draw on the preview (click the area to add a point, drag one to move it, right-click one to remove it); trace your windscreen, say, then place it with Vertical and Horizontal position. To hide the area’s edge, raise Feather.
cs = Tvar ostré oblasti. Obdélník: zaoblený podle Zaoblení rohů. Vlastní tvar: obrys až z 10 bodů, který nakreslíte v náhledu (kliknutím do oblasti přidáte bod, tažením ho posunete, pravým kliknutím odeberete); obkreslete třeba čelní sklo a pak ho umístěte Svislou a Vodorovnou polohou. Okraj oblasti skryjete zvýšením Prolnutí.
en = Outline color
cs = Barva obrysu
en = The outline’s colour in the headset. It shows while Show focus outline is on.
cs = Barva obrysu v headsetu. Ukazuje se, když je zapnuté Zobrazit obrys ostrosti.
en = nvngx_dlss.dll
cs = nvngx_dlss.dll
en = The DLSS Sim-QVFR uses: the one it includes (NVIDIA’s), or another you choose, a newer one from a game, say (DLSS 310 or newer). Use included goes back. Applies at the next launch.
cs = DLSS, které Sim-QVFR používá: přiložené (od NVIDIA), nebo jiné, které vybereš, třeba novější z nějaké hry (DLSS 310 nebo novější). Použít přiložený se vrátí zpět. Uplatní se při příštím spuštění.
en = Focus views
cs = Pohledy ostrosti
en = DLAA draws them at their size. Ultra quality, Quality, Balanced and Performance draw them at 77, 67, 58 or 50% each way and upscale them: less GPU time, softer distant textures. DLSS has no ultra quality model of its own: 77% runs its quality one.
cs = DLAA je kreslí v jejich velikosti. Ultra kvalita, Kvalita, Vyvážené a Výkon je kreslí na 77, 67, 58 nebo 50 % v každém směru a zvětšují je: méně času GPU, měkčí vzdálené textury. DLSS nemá vlastní model ultra kvality: 77 % používá model kvality.
en = Focus preset
cs = Předvolba ostrosti
en = The DLSS preset for the sharp focus views. With Sim-QVFR’s DLSS, Default is NVIDIA’s choice for the mode: K, and M at Performance, which costs more. With Cheeky, Game default keeps the game’s.
cs = Předvolba DLSS pro ostré pohledy ostrosti. S DLSS od Sim-QVFR je Výchozí volba NVIDIA pro daný režim: K, a M při Výkonu, které stojí víc. S Cheeky ponechá Výchozí ve hře předvolbu hry.
en = Other cars’ motion
cs = Pohyb ostatních aut
en = Gives DLSS each other car’s own motion, so cars passing, alongside or ahead stay clean instead of smearing. Turn it off for more headroom: in a field of cars it costs about 0.5 ms of CPU and 0.2 to 0.5 ms of GPU a frame. Applies at the next launch, with DLSS on at launch; with DLSS off it costs nothing.
cs = Dá DLSS vlastní pohyb každého dalšího auta, takže auta, která předjíždějí, jedou vedle nebo před tebou, zůstanou čistá a nerozmazávají se. Vypni pro víc rezervy: v poli aut to stojí asi 0,5 ms CPU a 0,2 až 0,5 ms GPU na snímek. Uplatní se při příštím spuštění, se zapnutým DLSS při spuštění; s vypnutým DLSS nestojí nic.
en = nvngx_dlssnr.dll
cs = nvngx_dlssnr.dll
en = NVIDIA’s DLSS neural rendering runtime. Sim-QVFR includes none: it is NVIDIA’s, and comes only with games that ship DLSS-NR. Choose the one in such a game’s folder. Applies at the next launch.
cs = Runtime neurálního vykreslování DLSS od NVIDIA. Sim-QVFR žádný neobsahuje: patří NVIDIA a dodává se jen s hrami, které mají DLSS-NR. Vyber ten ze složky takové hry. Uplatní se při příštím spuštění.
en = Use DLSS-NR
cs = Použít DLSS-NR
en = NVIDIA’s DLSS neural rendering on the views: its model reworks lighting and materials from the picture, its depth and its motion. Experimental, and heavy: about 2 ms of GPU time and 130 MB of video memory for every million pixels it works on, per view (RTX 5070 Ti). It turns itself off if frames fall under 10 a second with it on.
cs = Neurální vykreslování DLSS od NVIDIA na pohledech: jeho model přepracuje osvětlení a materiály z obrazu, jeho hloubky a pohybu. Experimentální a náročné: asi 2 ms času GPU a 130 MB videopaměti na každý milion zpracovaných pixelů, na pohled (RTX 5070 Ti). Samo se vypne, pokud s ním snímková frekvence klesne pod 10 za sekundu.
en = Intensity
cs = Intenzita
en = How much of the model’s change you get: 0% is the picture as it came.
cs = Kolik ze změny modelu dostaneš: 0 % je obraz tak, jak přišel.
en = Style
cs = Styl
en = The look the model aims for.
cs = Vzhled, o který model usiluje.
en = Preset
cs = Předvolba
en = The model: A is the original, B a faster one in newer DLLs (310.9.16 on). Default is the DLL’s own choice. A change rebuilds DLSS-NR: a short stutter.
cs = Model: A je původní, B rychlejší v novějších DLL (od 310.9.16). Výchozí je volba samotné DLL. Změna znovu sestaví DLSS-NR: krátké zaseknutí.
en = Local tone
cs = Místní tón
en = The strength of the model’s local contrast and lighting changes.
cs = Síla změn místního kontrastu a osvětlení modelem.
en = Local structure
cs = Místní struktura
en = The strength of the model’s changes to fine structure.
cs = Síla změn jemné struktury modelem.
en = Auto mask
cs = Automatická maska
en = Lets the model find what it treats differently (skin) by itself.
cs = Nechá model, ať sám najde, co zpracovává jinak (kůži).
en = Runs
cs = Běží
en = After DLSS works on the finished, anti-aliased views. Before DLSS works on the views as drawn, before anti-aliasing and upscaling: fewer pixels when the focus views are upscaled, and DLSS then smooths its result.
cs = Po DLSS pracuje na hotových, vyhlazených pohledech. Před DLSS pracuje na pohledech tak, jak jsou nakreslené, před vyhlazením a zvětšením: méně pixelů, když se pohledy ostrosti zvětšují, a DLSS pak jeho výsledek vyhladí.
en = Focus working size
cs = Pracovní velikost ostrosti
en = What the model works at, a share of the focus view. Lower costs less; the picture keeps its own detail.
cs = V jaké velikosti model pracuje, jako podíl pohledu ostrosti. Nižší stojí méně; obraz si zachová vlastní detail.
en = Working size limit
cs = Limit pracovní velikosti
en = The most one view’s model works on, in megapixels, whatever the sizes. Each megapixel costs about 2 ms of GPU time and 130 MB of video memory, per view.
cs = Nejvíc, na čem model jednoho pohledu pracuje, v megapixelech, bez ohledu na velikosti. Každý megapixel stojí asi 2 ms času GPU a 130 MB videopaměti, na pohled.
en = Edge blend
cs = Prolnutí okraje
en = The band over which the processed area fades into what isn’t processed around it.
cs = Pás, ve kterém zpracovaná oblast přechází do nezpracovaného okolí.
en = Periphery too
cs = I periferie
en = Off, only the focus views are processed: where you look. On, the periphery too, at its own working size and coverage. It adds about 2 ms of GPU time per eye at least, however small you make it.
cs = Vypnuto: zpracují se jen pohledy ostrosti, tam, kam se díváš. Zapnuto: i periferie, ve vlastní pracovní velikosti a pokrytí. Přidá nejméně asi 2 ms času GPU na oko, ať ji uděláš jakkoli malou.
en = Periphery working size
cs = Pracovní velikost periferie
en = As the focus working size, for the periphery.
cs = Jako pracovní velikost ostrosti, pro periferii.
en = Periphery covered
cs = Pokrytí periferie
en = How much of each eye’s view the model covers, around the focus area.
cs = Kolik z pohledu každého oka model pokryje, kolem oblasti ostrosti.
en = Foveated DLSS
cs = Foveated DLSS
en = Off leaves the game’s own DLSS on every view.
cs = Vypnuto ponechá vlastní DLSS hry na každém pohledu.
en = Outer preset
cs = Vnější předvolba
en = The DLSS preset of the outer views’ own pass (Cheaper outer views).
cs = Předvolba DLSS vlastního průchodu vnějších pohledů (Levnější vnější pohledy).
en = Fix motion-vector blur
cs = Opravit rozmazání pohybových vektorů
en = Cheeky’s workaround for smearing with some presets. Adds GPU work.
cs = Obejití rozmazávání u některých předvoleb od Cheeky. Přidá práci GPU.
en = DLSS-NR
cs = DLSS-NR
en = NVIDIA’s DLSS-NR (DLSS 5) on the focus views. Needs nvngx_dlssnr.dll next to the game.
cs = DLSS-NR (DLSS 5) od NVIDIA na pohledech ostrosti. Potřebuje nvngx_dlssnr.dll vedle hry.
en = DLSS-NR passes
cs = Průchody DLSS-NR
en = Each extra DLSS-NR pass costs about one more NR evaluation.
cs = Každý další průchod DLSS-NR stojí asi o jedno vyhodnocení NR víc.
en = Multiplier
cs = Násobič
en = Frames shown per frame the game renders: 2x adds one generated frame between each two of the game’s.
cs = Snímky zobrazené na každý snímek vykreslený hrou: 2x přidá jeden generovaný snímek mezi každé dva snímky hry.
en = Center FG scale
cs = Měřítko FG ve středu
en = Frame generation’s resolution in the center region. Lower uses less GPU time and memory.
cs = Rozlišení generování snímků ve středové oblasti. Nižší spotřebuje méně času GPU a paměti.
en = Periphery FG scale
cs = Měřítko FG v periferii
en = Frame generation’s resolution around the center region. Lower uses less GPU time and memory.
cs = Rozlišení generování snímků kolem středové oblasti. Nižší spotřebuje méně času GPU a paměti.
en = Release game
cs = Uvolnit hru
en = When the game starts its next frame. Never: CPU and GPU overlap (most frames). Capture: after the GPU finishes. Generated: after the generated frame.
cs = Kdy hra začne další snímek. Nikdy: CPU a GPU se překrývají (většina snímků). Zachycení: po dokončení práce GPU. Generovaný: po generovaném snímku.
en = Show the center region
cs = Zobrazit středovou oblast
en = Outlines the region in the headset, to check that it follows your eyes.
cs = Ohraničí oblast v headsetu, abys ověřil, že sleduje tvé oči.
en = Rim
cs = Lem
en = How far the helmet’s padding reaches into the view.
cs = Jak daleko polstrování přilby zasahuje do pohledu.
en = Corners
cs = Rohy
en = Rounds the helmet’s visor opening.
cs = Zaoblí otvor hledí přilby.
en = Lighting
cs = Osvětlení
en = How much the scene lights the helmet.
cs = Jak moc scéna přilbu osvětluje.
en = Visor
cs = Hledí
en = Your own images only: closed, half or open. Ctrl+Alt+V in the game steps it.
cs = Jen vlastní obrázky: zavřené, napůl nebo otevřené. Ctrl+Alt+V ve hře ho přepíná.
en = Depth
cs = Hloubka
en = Your own images only: how far in front of your eyes, in cm. 0 is far away, with no depth.
cs = Jen vlastní obrázky: jak daleko před tvýma očima, v cm. 0 je daleko, bez hloubky.
en = Your own images only: Detail (4096) is sharper, Performance (2048) costs less GPU time and memory.
cs = Jen vlastní obrázky: Detail (4096) je ostřejší, Výkon (2048) stojí méně času GPU a paměti.
en = Degrees right of straight ahead. Negative is left. Drag it in Placement, or move it in the headset.
cs = Stupně vpravo od přímého směru. Záporné je vlevo. Přetáhni ho v Umístění, nebo ho přesuň v headsetu.
en = Degrees above eye level. Negative is below. Drag it in Placement, or move it in the headset.
cs = Stupně nad úrovní očí. Záporné je pod. Přetáhni ho v Umístění, nebo ho přesuň v headsetu.
en = How wide it is, in degrees of your view.
cs = Jak je široký, ve stupních tvého zorného pole.
en = A line under the headset menu with the in-game hotkeys (overlay, visor, CPU capture) and their wheel buttons, as set in Hotkeys. Also on the menu’s Headset page.
cs = Řádek pod menu v headsetu s klávesovými zkratkami ve hře (překryv, hledí, zachycení CPU) a jejich tlačítky na volantu, jak jsou nastavené v Klávesových zkratkách. Také na stránce Headset v menu.
en = Open or close
cs = Otevřít/zavřít
en = Opens the headset menu, or closes it.
cs = Otevře menu v headsetu, nebo ho zavře.
en = Up
cs = Nahoru
en = Selects the line above in the headset menu.
cs = Vybere řádek výš v menu v headsetu.
en = Down
cs = Dolů
en = Selects the line below in the headset menu.
cs = Vybere řádek níž v menu v headsetu.
en = Left
cs = Vlevo
en = Lowers the selected value in the headset menu.
cs = Sníží vybranou hodnotu v menu v headsetu.
en = Right
cs = Vpravo
en = Raises the selected value in the headset menu.
cs = Zvýší vybranou hodnotu v menu v headsetu.
en = Overlay
cs = Překryv
en = Turns the performance overlay on or off.
cs = Zapne nebo vypne překryv výkonu.
en = Helmet visor
cs = Hledí přilby
en = Steps the helmet’s visor: closed, half, open.
cs = Přepíná hledí přilby: zavřené, napůl, otevřené.
en = Helmet images
cs = Obrázky přilby
en = Your own helmet: top.png, bottom.png and visor.png in the helmet folder next to the layer. Size and Height place them (degrees of view, and above straight ahead).
cs = Vlastní přilba: top.png, bottom.png a visor.png ve složce helmet vedle vrstvy. Velikost a Výška je umístí (stupně zorného pole a výška nad přímým směrem).
en = From the periphery
cs = Z periferie

