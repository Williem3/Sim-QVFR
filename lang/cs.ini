cs = Oříznutí a přilba jsou k dispozici v Quad View Foveated Rendering.
en = Two-loop renders each headset frame twice. Switch to Quad View Foveated Rendering; Two-loop won’t be offered again.
cs = Two-loop vykresluje každý snímek headsetu dvakrát. Přepni na Quad View Foveated Rendering; Two-loop už nebude znovu nabídnut.
en = The focus view is drawn in Quad View Foveated Rendering.
cs = Pohled ostrosti se kreslí v Quad View Foveated Rendering.
en = Foveation applied live · resolution and method at the next launch
cs = Foveace použita živě · rozlišení a metoda při příštím spuštění
en = Two-loop Foveated Interlaced (legacy)
cs = Two-loop Foveated Interlaced (starší)
en = Headset menu · Two-loop (legacy)
cs = Menu v headsetu · Two-loop (starší)
en = The focus area renders in full detail only along the road ahead: about 10 m either side of the road and 3.5 m above it, following its hills and bends. Trees, grandstands, hills and the sky beside and above that come from the periphery’s image, as does the cockpit; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. Turn it off if something beside the road looks softer than you want. Changes while you drive.
cs = Oblast fokusu se vykresluje v plných detailech jen podél silnice před vámi: asi 10 m po obou stranách silnice a 3,5 m nad ní, podle jejích horizontů a zatáček. Stromy, tribuny, kopce a obloha vedle a nad tím pocházejí z obrazu periferie, stejně jako kokpit; tam, kam se při jízdě díváte, byste rozdíl vidět neměli. Šetří čas GPU, tím víc, čím větší je oblast fokusu. Vypněte to, pokud vám něco vedle silnice připadá příliš měkké. Mění se za jízdy.
en = DLAA on the road only
cs = DLAA jen na silnici
en = With Road focus and Sim-QVFR’s DLSS on: the focus area’s DLAA runs only over the rows the road covers, the rest takes the periphery’s DLAA. It saves more GPU time. Turn it off if you see a soft strip above or below the road for a moment when you look up or down quickly. Changes while you drive.
cs = Se zapnutou ostrostí na silnici a DLSS od Sim-QVFR: DLAA oblasti fokusu běží jen přes řádky, které silnice zabírá, zbytek přebírá DLAA periferie. Šetří ještě víc času GPU. Vypněte to, pokud při rychlém pohledu nahoru nebo dolů na okamžik vidíte měkký pruh nad silnicí nebo pod ní. Mění se za jízdy.
en = Full detail along the road ahead; the scenery beside and above it from the periphery.
cs = Plné detaily podél silnice před vámi; okolí vedle a nad ní z periferie.
en = With Sim-QVFR’s DLSS on: the focus area’s DLAA over the road’s rows alone.
cs = Se zapnutým DLSS od Sim-QVFR: DLAA oblasti fokusu jen přes řádky silnice.
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom corners: each corner moved in on its own; pull the top corners in for a trapezoid, more of the dash sharp at the same cost. To hide the area’s edge, raise Feather.
cs = Tvar ostré oblasti. Obdélník: zaoblený podle Zaoblení rohů. Vlastní rohy: každý roh posunutý dovnitř zvlášť; přitáhni horní rohy pro lichoběžník, víc palubní desky ostře za stejnou cenu. Chceš-li skrýt okraj oblasti, zvyš Prolnutí.
