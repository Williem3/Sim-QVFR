en = Rendering method
cs = Metoda vykreslování
en = Quad View Foveated Rendering draws the outer and focus views in one game frame: the lightest on the CPU, and the one with every feature. Two-loop (legacy) draws two whole game frames per headset frame: about twice the CPU work per frame, and no frame generation.
cs = Quad View Foveated Rendering vykreslí vnější pohledy i pohledy ostrosti v jednom herním snímku: nejšetrnější k CPU a jediná se všemi funkcemi. Two-loop (starší) vykreslí na každý snímek headsetu dva celé herní snímky: zhruba dvojnásobná práce CPU na snímek a žádné generování snímků.
en = Two-loop
cs = Two-loop
en = In Quad View Foveated Rendering only
cs = Jen v Quad View Foveated Rendering
en = Legacy method (Two-loop)
cs = Starší metoda (Two-loop)
en = Available in Quad View Foveated Rendering.
cs = K dispozici v Quad View Foveated Rendering.
en = In Two-loop the focus density ({density}) follows from Periphery resolution and the focus size. Focus density, sharpening and object detail are set in Quad View Foveated Rendering.
cs = V Two-loop vyplývá hustota ostrosti ({density}) z Rozlišení periferie a velikosti ostrosti. Hustota ostrosti, doostření a detail objektů se nastavují v Quad View Foveated Rendering.
