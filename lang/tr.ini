tr = VRAM bittiğinde takılmalar ve duraksamalar olur. Dış çözünürlüğü, odak yoğunluğunu ya da oyunun doku kalitesini düşür.
en = OpenXR Toolkit is loaded under Sim-QVFR
tr = OpenXR Toolkit, Sim-QVFR altında yüklü
en = It adds about 0.8 ms to every frame's submission. If you don't use it for this game, switch it off in OpenXR layers.
tr = Her karenin gönderimine yaklaşık 0,8 ms ekler. Bu oyun için kullanmıyorsan OpenXR katmanlarında kapat.
en = The GPU was busy all the time ({percent}%)
tr = GPU sürekli meşguldü (%{percent})
en = This is the GPU's limit. Lower the outer resolution or the focus density, or the game's graphics settings.
tr = Bu, GPU’nun sınırı. Dış çözünürlüğü, odak yoğunluğunu ya da oyunun grafik ayarlarını düşür.
en = The game's CPU work limited the frame rate
tr = Kare hızını oyunun CPU işi sınırladı
en = QVFR lowers the GPU's work, not the CPU's. Lower the game's CPU-heavy settings (opponents, mirrors, shadows).
tr = QVFR, CPU’nun değil GPU’nun işini azaltır. Oyunun CPU’yu yoran ayarlarını düşür (rakipler, aynalar, gölgeler).
en = The headset runtime ran the game at half rate for {percent}% of the session
tr = Başlık çalışma zamanı oyunu oturumun %{percent} kadarında yarı hızda çalıştırdı
en = When frames come close to the budget, the runtime's motion smoothing halves the frame rate for a few seconds (Varjo does this). Turn motion smoothing off in the runtime's software (Varjo Base) to compare, and give the CPU room: lower the game's CPU-heavy settings (opponents, mirrors, shadows).
tr = Kareler bütçeye yaklaştığında çalışma zamanının hareket yumuşatması kare hızını birkaç saniyeliğine yarıya indirir (Varjo bunu yapar). Karşılaştırmak için hareket yumuşatmayı çalışma zamanının yazılımında (Varjo Base) kapat ve CPU’ya pay bırak: oyunun CPU’yu yoran ayarlarını düşür (rakipler, aynalar, gölgeler).
en = {percent}% of frames were late with neither the CPU nor the GPU full
tr = Karelerin %{percent} kadarı, ne CPU ne GPU doluyken geç kaldı
en = Often something else in the chain: another OpenXR layer, an overlay, or the runtime's motion smoothing. Try with them off.
tr = Çoğu zaman zincirdeki başka bir şey: başka bir OpenXR katmanı, bir overlay ya da çalışma zamanının hareket yumuşatması. Bunları kapatıp dene.

