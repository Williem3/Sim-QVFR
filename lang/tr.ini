; src/launcher/ui/help.cpp
en = Rendering method
tr = İşleme yöntemi
en = Quad View Foveated Rendering draws the outer and focus views in one game frame: the lightest on the CPU, and the one with every feature. Two-loop (legacy) draws two whole game frames per headset frame: about twice the CPU work per frame, and no frame generation.
tr = Quad View Foveated Rendering dış ve odak görünümlerini tek bir oyun karesinde çizer: CPU’ya en hafif gelen ve tüm özellikleri olan yöntem. Two-loop (eski) her başlık karesi için iki tam oyun karesi çizer: kare başına yaklaşık iki kat CPU işi ve kare üretimi yok.
en = Foveated mode
tr = Foveal mod
en = Eye tracked: the sharp area follows your eyes, so it can be small and dense; it needs a headset with eye tracking. Fixed: the area stays in the centre, so make it larger, since your eyes move off it.
tr = Göz takipli: keskin alan gözlerini izler, bu yüzden küçük ve yoğun olabilir; göz takipli bir başlık gerekir. Sabit: alan ortada kalır; gözlerin ondan kaydığı için onu daha büyük yap.
en = Periphery resolution
tr = Çevre çözünürlüğü
en = The wide view around the focus area, a share of the headset’s recommended resolution. It covers most of the view but you see it with your side vision, so it is the first to lower: it saves GPU time and VRAM roughly with its pixels. The preview’s Pixels per frame shows the total.
tr = Odak alanının etrafındaki geniş görünüm; başlığın önerilen çözünürlüğünün bir payı. Görüntünün çoğunu kaplar ama onu yan görüşünle görürsün, bu yüzden ilk düşürülecek olan budur: pikselleriyle aşağı yukarı orantılı GPU süresi ve VRAM kazandırır. Önizlemedeki Kare başına piksel toplamı gösterir.
en = Focus density
tr = Odak yoğunluğu
en = Pixel density inside the focus area, a share of the headset’s native density. Above 100% it renders more pixels than the headset shows where you look: sharper text and edges. Its cost grows with the area’s size, so a small area can take a high density cheaply. Dragging moves it in 5% steps; the arrow keys move it by 1%.
tr = Odak alanının içindeki piksel yoğunluğu; başlığın doğal yoğunluğunun bir payı. %100’ün üstünde, baktığın yerde başlığın gösterdiğinden fazla piksel işler: daha keskin yazılar ve kenarlar. Maliyeti alanın boyutuyla artar, bu yüzden küçük bir alan yüksek yoğunluğu ucuza alabilir. Sürüklemek %5, ok tuşları %1 adımlarla değiştirir.
en = Object detail
tr = Nesne ayrıntısı
en = How detailed trees and objects are, and how far away they are still drawn. At 100% they are as sharp in the focus region as its pixel density shows them; lower settings move toward the game’s own detail for the periphery resolution. It costs CPU, not GPU: more detail means more objects for X-Plane’s main thread to prepare every frame, often what limits the frame rate with QVFR. Lower it if frames stutter in dense scenery; the focus region shows coarser trees.
tr = Ağaçların ve nesnelerin ne kadar ayrıntılı olduğu ve ne kadar uzaktan hâlâ çizildikleri. %100’de odak bölgesinde, piksel yoğunluğunun gösterdiği kadar keskindirler; düşük ayarlar oyunun çevre çözünürlüğü için kullandığı kendi ayrıntısına yaklaşır. GPU değil CPU harcar: daha fazla ayrıntı, X-Plane ana iş parçacığının her karede hazırlayacağı daha fazla nesne demektir; QVFR ile kare hızını çoğu zaman bu sınırlar. Yoğun manzarada kareler takılırsa düşür; odak bölgesinde ağaçlar daha kaba görünür.
en = For a player who sees with one eye. The eye you choose shows black in the headset, and the game draws no focus view for it, renders only a few pixels of its scene and skips DLSS on it, so the GPU does much less. The game still prepares that eye’s frame, so the CPU saves little. With both eyes seeing, a black eye is uncomfortable: leave it at None.
tr = Tek gözle gören oyuncular için. Seçtiğin göz başlıkta siyah görünür; oyun onun için odak görünümü çizmez, sahnesinin yalnızca birkaç pikselini işler ve DLSS’i atlar, böylece GPU çok daha az çalışır. Oyun o gözün karesini yine hazırlar, bu yüzden CPU tasarrufu azdır. İki gözle görüyorsan siyah bir göz rahatsız eder: Yok olarak bırak.
en = Sharpening
tr = Keskinleştirme
en = Crisper edges and text in the focus area; too much makes it shimmer. Raise it a little if the view looks soft (0% is off); it costs a little GPU time and changes while you drive. How: AMD FidelityFX Contrast Adaptive Sharpening, applied as Sim-QVFR resamples the focus view for the headset. Each pixel is sharpened by how much contrast room it has, so soft detail gains the most and edges already sharp gain little. The percentage is CAS’s own sharpness, as other CAS sharpeners show it: any setting above 0% already sharpens. Only the focus area is sharpened, fading out across its feather so its edge stays even: your side vision sees shimmer more than detail. 0% is off; it changes while you drive.
tr = Odak alanında daha net kenarlar ve yazılar; fazlası titreşim yapar. Görüntü yumuşak görünüyorsa biraz artır (%0 kapalı); biraz GPU süresi harcar ve sürerken değişir. Nasıl: AMD FidelityFX Contrast Adaptive Sharpening, Sim-QVFR odak görünümünü başlık için yeniden örneklerken uygulanır. Her piksel, ne kadar kontrast payı olduğuna göre keskinleştirilir; böylece yumuşak ayrıntı en çok, zaten keskin kenarlar az kazanır. Yüzde, diğer CAS keskinleştiricilerinin gösterdiği gibi CAS’in kendi keskinlik değeridir: %0’ın üstündeki her ayar zaten keskinleştirir. Yalnızca odak alanı keskinleştirilir ve kenarı düzgün kalsın diye yumuşatma bandı boyunca azalır: yan görüşün titreşimi ayrıntıdan daha çok fark eder. %0 kapalı; sürerken değişir.
en = Color correction
tr = 
en = Adjusts the picture in the headset: exposure, brightness, contrast and saturation, for a game that looks too dark, washed out or dull in your headset. Sim-QVFR applies it as it composes the views, the periphery and the focus area alike, so the focus area never stands out; it costs almost no GPU time and changes while you drive. Menus and loading screens show as the game draws them. Off, or every value at 0, leaves the picture as it was.
tr = 
en = Exposure
tr = 
en = Scales all of the light, in stops (EV): +1.0 EV is twice as bright, -1.0 EV half, up to 3 stops either way. Highlights brighten with the rest and can clip, so raise it a little at a time; Brightness lifts the darks without touching them.
tr = 
en = Brightness
tr = Parlaklık
en = Lightens or darkens the mid tones and shadows while black stays black and white stays white, so an OLED headset keeps its deep blacks: raise it to see into dark cockpits and night stints, lower it for a richer, darker picture.
tr = 
en = Contrast
tr = 
en = Spreads the picture’s tones away from mid grey (above 0) or draws them towards it (below 0), as a gentle S-curve: black and white stay where they are and colours keep their hue. More contrast gives deeper shadows and brighter highlights; less shows more detail in both.
tr = 
en = Saturation
tr = 
en = How strong the colours are: above 0 more vivid, below 0 more muted, -100% grey. Brightness is kept as each colour changes.
tr = 
en = Accent brightness
tr = 
en = How light or dark the game’s colour is. The wheel picks its hue and how strong it is; the launcher keeps its text and edges readable in light and dark mode.
tr = Oyunun renginin ne kadar açık ya da koyu olduğu. Renk çarkı tonunu ve ne kadar güçlü olduğunu seçer; başlatıcı yazılarını ve kenarlarını açık ve koyu modda okunur tutar.
en = Focus width
tr = Odak genişliği
en = The focus area’s width, a share of the view. Wider hides the edge between sharp and soft better; its pixels cost density × width × height, so a wide area at a high density costs the most. It changes while you drive; wider than the game started with (at your density) renders less dense until the next launch.
tr = Odak alanının genişliği, görüntünün bir payı. Daha geniş alan keskin ile yumuşak arasındaki sınırı daha iyi gizler; pikselleri yoğunluk × genişlik × yükseklik kadar tutar, bu yüzden yüksek yoğunlukta geniş bir alan en pahalısıdır. Sürerken değişir; oyunun başladığından daha geniş (senin yoğunluğunda) bir alan sonraki başlatmaya kadar daha düşük yoğunlukta işlenir.
en = Focus height
tr = Odak yüksekliği
en = The focus area’s height, a share of the view. Taller covers more of the dash and mirrors; it costs pixels as the width does. Taller than the game started with (at your density) renders less dense until the next launch.
tr = Odak alanının yüksekliği, görüntünün bir payı. Daha uzun alan gösterge panelinin ve aynaların daha fazlasını kaplar; genişlik gibi piksel tutar. Oyunun başladığından daha uzun (senin yoğunluğunda) bir alan sonraki başlatmaya kadar daha düşük yoğunlukta işlenir.
en = Corner radius
tr = Köşe yarıçapı
en = Rounds the focus area’s corners, so its edge is harder to spot. No cost: the area renders as a rectangle either way.
tr = Odak alanının köşelerini yuvarlar, böylece kenarı daha zor fark edilir. Maliyeti yok: alan her durumda dikdörtgen olarak işlenir.
en = Feather
tr = Yumuşatma
en = The band where the focus area blends into the outer view. Wider hides the edge better; no measurable cost.
tr = Odak alanının dış görünüme karıştığı bant. Daha geniş bant kenarı daha iyi gizler; ölçülebilir maliyeti yok.
en = Gaze dead-zone
tr = Bakış ölü bölgesi
en = How far your eyes move before the focus area follows. A little keeps it still against eye-tracker noise; too much makes it lag when you look around. No GPU cost.
tr = Odak alanı takip etmeden önce gözlerinin ne kadar hareket edeceği. Biraz ölü bölge onu göz izleyici gürültüsüne karşı sabit tutar; fazlası etrafa bakarken gecikmesine yol açar. GPU maliyeti yok.
en = Gaze offset
tr = Bakış kayması
en = Moves the eye-tracked focus area up or down, in degrees, for a tracker that sits a little off. No cost.
tr = Göz takipli odak alanını derece cinsinden yukarı ya da aşağı kaydırır; biraz kaymış oturan bir izleyici için. Maliyeti yok.
en = Vertical position
tr = Dikey konum
en = Moves the fixed focus area up or down, in degrees: towards the dash and mirrors, or the road. No cost.
tr = Sabit odak alanını derece cinsinden yukarı ya da aşağı kaydırır: gösterge paneline ve aynalara ya da yola doğru. Maliyeti yok.
en = Crop the view
tr = Görüntüyü kırp
en = Cuts the edges a helmet or the lens hides before the game renders them. It saves GPU time and VRAM with the pixels cut; the headset shows black there.
tr = Kaskın ya da lensin gizlediği kenarları oyun işlemeden önce keser. Kesilen piksellerle orantılı GPU süresi ve VRAM kazandırır; başlık orada siyah gösterir.
en = Top
tr = Üst
en = How much of the top of each eye’s view the game doesn’t render. Saves pixels in proportion.
tr = Her gözün görüntüsünün üst kısmının ne kadarını oyunun işlemediği. Orantılı piksel kazandırır.
en = Bottom
tr = Alt
en = How much of the bottom of each eye’s view the game doesn’t render. Saves pixels in proportion.
tr = Her gözün görüntüsünün alt kısmının ne kadarını oyunun işlemediği. Orantılı piksel kazandırır.
en = Outer side (temple)
tr = Dış taraf (şakak)
en = How much of each eye’s temple side the game doesn’t render. Saves pixels in proportion.
tr = Her gözün şakak tarafının ne kadarını oyunun işlemediği. Orantılı piksel kazandırır.
en = Inner side (nose)
tr = İç taraf (burun)
en = How much of each eye’s nose side the game doesn’t render; the other eye still sees most of it. Saves pixels in proportion.
tr = Her gözün burun tarafının ne kadarını oyunun işlemediği; diğer göz yine çoğunu görür. Orantılı piksel kazandırır.
en = Show a helmet
tr = Kask göster
en = Draws a helmet’s visor opening round the view, lit by the scene, in a layer of its own. It costs the headset a layer to composite; nothing for the game.
tr = Görüntünün çevresine, sahneyle aydınlatılan bir kask vizör açıklığını kendi katmanında çizer. Başlığa birleştirilecek bir katman maliyeti var; oyuna maliyeti yok.
en = Show focus outline
tr = Odak sınırını göster
en = Draws the focus area’s edge, to see where it is and how it follows your eyes. For setting up; turn it off to drive.
tr = Odak alanının kenarını çizer; nerede olduğunu ve gözlerini nasıl izlediğini görmek için. Ayar yapmak içindir; sürerken kapat.
en = Use Cheeky Foveated DLSS
tr = Cheeky Foveated DLSS kullan
en = Runs Cheeky Foveated DLSS inside the game, for the DLSS options below. Needs an NVIDIA RTX GPU, DLSS on in the game, and Cheeky’s download. Applies at the next launch.
tr = Aşağıdaki DLSS seçenekleri için Cheeky Foveated DLSS’i oyunun içinde çalıştırır. NVIDIA RTX GPU, oyunda açık DLSS ve Cheeky’nin indirmesi gerekir. Sonraki başlatmada uygulanır.
en = Cheaper outer views
tr = Daha hafif dış görünümler
en = The outer views get Cheeky’s DLAA at a lower resolution instead of the game’s DLSS: GPU time saved on the views you see least.
tr = Dış görünümler oyunun DLSS’i yerine daha düşük çözünürlükte Cheeky’nin DLAA’sını alır: en az gördüğün görünümlerde GPU süresi kazanılır.
en = Outer DLAA scale
tr = Dış DLAA ölçeği
en = The resolution of that cheaper pass. Lower saves more GPU time and softens the side view.
tr = Bu daha hafif geçişin çözünürlüğü. Düşük değer daha çok GPU süresi kazandırır ve yan görüntüyü yumuşatır.
en = Focus supersampling
tr = Odak süper örnekleme
en = Renders the focus views above their size before DLSS: a sharper centre, for more GPU time.
tr = Odak görünümlerini DLSS’ten önce boyutlarının üstünde işler: daha fazla GPU süresi karşılığında daha keskin bir merkez.
en = Frame generation
tr = Kare üretimi
en = Cheeky’s DLSS frame generation adds frames between the game’s: smoother motion when the game can’t hold the refresh rate, for some GPU time and latency. Turn OpenXR Toolkit’s Turbo mode off with it, and run no other frame generator.
tr = Cheeky’nin DLSS kare üretimi oyunun kareleri arasına kare ekler: oyun yenileme hızını tutturamadığında daha akıcı hareket, karşılığında biraz GPU süresi ve gecikme. Bununla birlikte OpenXR Toolkit’in Turbo modunu kapat ve başka kare üretici çalıştırma.
en = Center region
tr = Merkez bölge
en = The part of the view frame generation makes at full quality (it follows your eyes when eye tracked). Larger looks better and costs more GPU time.
tr = Kare üretiminin tam kalitede yaptığı görüntü kısmı (göz takipliyken gözlerini izler). Daha büyüğü daha iyi görünür ve daha fazla GPU süresi harcar.
en = Load order
tr = Yükleme sırası
en = Nearest the game first. Each launch loads these below the Sim-QVFR layer in this order; a layer off in Windows can still be loaded for the game alone. Locked switches keep the mod and the game working.
tr = Oyuna en yakın olan ilk sırada. Her başlatma bunları Sim-QVFR katmanının altına bu sırayla yükler; Windows’ta kapalı bir katman yine de yalnızca oyun için yüklenebilir. Kilitli anahtarlar modu ve oyunu çalışır tutar.
en = Describe the problem
tr = Sorunu anlat
en = Zips the logs and the game’s crash reports from those sessions (names and account IDs taken out) into the logs folder, then opens a new issue on GitHub with what you wrote, your settings, the last session and your PC filled in. Add the steps there, and drag in the zip (it shows below) and any screenshots.
tr = Günlükleri ve oyunun o oturumlardaki çökme raporlarını (adlar ve hesap kimlikleri çıkarılmış olarak) günlükler klasörüne zipler, sonra GitHub’da yazdıklarınla, ayarlarınla, son oturumla ve PC bilgilerinle doldurulmuş yeni bir sorun kaydı açar. Adımları oraya ekle; zip’i (aşağıda görünür) ve ekran görüntülerini de sürükle.
en = Busiest threads
tr = En yoğun iş parçacıkları
en = Each thread is a share of ONE core. A thread near 100% can hold the frame rate back even when Windows shows the whole CPU at 15%; a thread that spins by design looks busy whatever limits it.
tr = Her iş parçacığı TEK bir çekirdeğin payıdır. %100’e yakın bir iş parçacığı, Windows tüm CPU’yu %15’te gösterse bile kare hızını kısıtlayabilir; tasarımı gereği dönen (spin) bir iş parçacığı, onu ne sınırlarsa sınırlasın meşgul görünür.
en = Frame rate
tr = Kare hızı
en = The last session’s average against the headset’s refresh rate, the frame rate it asks for. Below it, the runtime fills the gaps (motion smoothing or reprojection), which shows as wobble on moving edges.
tr = Son oturumun ortalaması, başlığın yenileme hızına, yani istediği kare hızına karşı. Bunun altında çalışma zamanı boşlukları doldurur (hareket yumuşatma ya da yeniden yansıtma); bu, hareketli kenarlarda dalgalanma olarak görünür.
en = Slow frames
tr = Yavaş kareler
en = How long your slowest frames take: lower is smoother. One frame in ten took at least this long (the 90th percentile). Above the frame’s budget (1000 ms divided by the headset’s refresh rate: 11.1 ms at 90 Hz) those frames miss the headset, and you feel stutter even when the average frame rate looks fine.
tr = En yavaş karelerinin ne kadar sürdüğü: düşük olan daha akıcıdır. Her on kareden biri en az bu kadar sürdü (90. yüzdelik). Kare bütçesinin üstünde (1000 ms bölü başlığın yenileme hızı: 90 Hz’de 11,1 ms) bu kareler başlığa yetişmez ve ortalama kare hızı iyi görünse bile takılma hissedersin.
en = Limited by
tr = Sınırlayan
en = What held the frame back most of the time: the game’s render thread on the CPU, the GPU, or nothing (the headset’s refresh). Lowering resolution helps only when the GPU limits it.
tr = Kareyi çoğu zaman neyin tuttuğu: CPU’da oyunun işleme iş parçacığı, GPU ya da hiçbir şey (başlığın yenilemesi). Çözünürlüğü düşürmek yalnızca GPU sınırladığında işe yarar.
en = Previous session
tr = Önceki oturum
en = The session before the last one for this game, and the settings changed in between, so you can see what a change did. A change while you drive (here or in the headset menu) starts a new stint, kept as its own entry; each covers the whole stint, with the moments the headset menu was open left out. Compare runs on the same track and car for a fair difference.
tr = Bu oyun için sondan bir önceki oturum ve arada değişen ayarlar; böylece bir değişikliğin ne yaptığını görebilirsin. Sürerken yapılan bir değişiklik (burada ya da başlık menüsünde) yeni bir stint başlatır ve ayrı bir kayıt olarak tutulur; her kayıt bütün stinti kapsar, başlık menüsünün açık olduğu anlar hariç. Adil bir fark için aynı pist ve araçla yapılan sürüşleri karşılaştır.
en = Run with anti-cheat
tr = Anti-hile ile çalıştır
en = Starts the game through its anti-cheat (Easy Anti-Cheat), as Steam does, with Sim-QVFR running, so you can join online servers. Sim-QVFR runs inside the game, and the anti-cheat may kick you or ban your account for it. Sim-QVFR and its developer aren’t responsible for kicks or bans: turning it on asks you to accept that risk. Off starts the game without its anti-cheat, for offline sessions only.
tr = Oyunu Steam gibi anti-hilesi (Easy Anti-Cheat) üzerinden, Sim-QVFR çalışırken başlatır; böylece çevrimiçi sunuculara katılabilirsin. Sim-QVFR oyunun içinde çalışır ve anti-hile bu yüzden seni atabilir ya da hesabını yasaklayabilir. Sim-QVFR ve geliştiricisi atılmalardan ya da yasaklardan sorumlu değildir: açmak, bu riski kabul etmeni ister. Kapalıyken oyun anti-hilesi olmadan başlar, yalnızca çevrimdışı oturumlar için.
en = Layers for
tr = Katman kapsamı
en = Launches from here: the VR add-ons (OpenXR layers) a launch from this launcher loads, below Sim-QVFR, in an order of its own; nothing else changes. Every app: Windows’ own list, which every other app uses (and the game started from Steam), saved in the registry when you apply, with a backup in the logs folder first.
tr = Buradan başlatmalar: bu başlatıcıdan yapılan bir başlatmanın Sim-QVFR altında, kendine ait bir sırayla yüklediği VR eklentileri (OpenXR katmanları); başka hiçbir şey değişmez. Her uygulama: Windows’un, diğer tüm uygulamaların (ve Steam’den başlatılan oyunun) kullandığı kendi listesi; uyguladığında kayıt defterine kaydedilir, önce günlükler klasörüne bir yedek alınır.
en = CPU capture
tr = CPU yakalama
en = At the next launch, the CPU capture hotkey (Ctrl+Alt+C) while driving records for 20 s where the game’s busiest threads spend their time, into a cpu-profile file in the logs folder. The headset menu shows when it starts and ends; the game may stutter slightly while it records.
tr = Sonraki başlatmada, sürerken CPU yakalama kısayolu (Ctrl+Alt+C) oyunun en yoğun iş parçacıklarının zamanını nerede harcadığını 20 sn boyunca günlükler klasöründeki bir cpu-profile dosyasına kaydeder. Başlık menüsü ne zaman başlayıp bittiğini gösterir; kayıt sırasında oyun hafifçe takılabilir.
en = Frame capture
tr = Kare yakalama
en = Saves the game’s own image and the composed output, as PNG files in the captures folder inside the logs folder. Each press saves one more frame, to compare the views where something looks wrong. In X-Plane 12, Assetto Corsa Competizione and Le Mans Ultimate.
tr = Oyunun kendi görüntüsünü ve birleştirilmiş çıktıyı, günlükler klasörünün içindeki captures klasörüne PNG dosyaları olarak kaydeder. Her basış bir kare daha kaydeder; bir şey yanlış göründüğünde görünümleri karşılaştırmak için. X-Plane 12, Assetto Corsa Competizione ve Le Mans Ultimate için.
en = Next launch without QVFR
tr = Sonraki başlatma QVFR olmadan
en = Starts the game once with its own two views and QVFR off, still measuring, so Diagnostics can compare the same race with and without QVFR. It turns itself off after that launch; the next one has QVFR again. The performance overlay works in it, the headset menu does not.
tr = Oyunu bir kez kendi iki görünümüyle ve QVFR kapalı olarak, ölçmeye devam ederek başlatır; böylece Tanılama aynı yarışı QVFR ile ve QVFR olmadan karşılaştırabilir. O başlatmadan sonra kendini kapatır; sonraki başlatmada QVFR yine açıktır. Performans katmanı bu modda çalışır, başlık menüsü çalışmaz.
en = Detailed logs
tr = Ayrıntılı günlükler
en = Normal logs say what Sim-QVFR set up, decided and measured. Detailed logs add every step behind that, for a bug report when the developer asks for one. They last three launches and then turn themselves off, so the logs stay small. Send them with Report an issue, or Save the logs as a zip.
tr = Normal günlükler Sim-QVFR’nin neyi kurduğunu, neye karar verdiğini ve neyi ölçtüğünü söyler. Ayrıntılı günlükler bunun arkasındaki her adımı ekler; geliştirici istediğinde hata raporu için. Üç başlatma sürer, sonra kendini kapatır; böylece günlükler küçük kalır. Bunları Sorun bildir ile gönder ya da Günlükleri zip olarak kaydet.
en = Logs folder
tr = Günlükler klasörü
en = Each launch adds a session log and a small run folder. The launcher keeps the newest 30 sessions and removes older ones at each launch, and the newest 10 CPU captures. Frame captures and game image dumps stay until you clear them: Clear captures moves them to the Recycle Bin.
tr = Her başlatma bir oturum günlüğü ve küçük bir çalışma klasörü ekler. Başlatıcı en yeni 30 oturumu tutar ve her başlatmada eskilerini siler; en yeni 10 CPU yakalamasını da tutar. Kare yakalamaları ve oyun görüntü dökümleri sen temizleyene kadar kalır: Yakalamaları temizle onları Geri Dönüşüm Kutusu’na taşır.
en = Presets for eye tracked foveation
tr = Göz takipli foveasyon için ön ayarlar
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Eye tracked, the area follows your eyes, so it can be small and very sharp. They set the resolution only and keep everything else.
tr = Pikselleri merkeze koyan başlangıç noktaları: düşük dış görünümler ve yoğun bir odak alanı. Göz takipliyken alan gözlerini izler, bu yüzden küçük ve çok keskin olabilir. Yalnızca çözünürlüğü ayarlar, diğer her şeyi korurlar.
en = Presets for fixed foveation
tr = Sabit foveasyon için ön ayarlar
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Fixed, your eyes move off the centre, so the area is larger and a little less dense. They set the resolution only and keep everything else.
tr = Pikselleri merkeze koyan başlangıç noktaları: düşük dış görünümler ve yoğun bir odak alanı. Sabitken gözlerin merkezden kayar, bu yüzden alan daha büyük ve biraz daha az yoğundur. Yalnızca çözünürlüğü ayarlar, diğer her şeyi korurlar.
en = Your profiles
tr = Profillerin
en = A profile holds every setting of the picture: resolution, foveation and the focus overlay, and where the game has them the view crop, the helmet and Foveated DLSS. Not the menu’s and overlay’s places, the hotkeys or the OpenXR layers. Share copies one as a line of text to paste in a chat; Paste adds one from the clipboard. The headset menu’s Profile line switches between them while you drive.
tr = Bir profil görüntünün tüm ayarlarını tutar: çözünürlük, foveasyon ve odak sınırı; oyunda varsa görüntü kırpma, kask ve Foveated DLSS. Menünün ve performans katmanının konumları, kısayol tuşları ya da OpenXR katmanları dahil değildir. Paylaş, bir profili sohbete yapıştırmak için tek satırlık metin olarak kopyalar; Yapıştır panodan bir profil ekler. Başlık menüsünün Profil satırı sürerken aralarında geçiş yapar.
en = A key’s first press also opens the menu. A wheel’s directions act only while the menu shows, so a switch the game also uses doesn’t open it: use Open or close first.
tr = Bir tuşa ilk basış menüyü de açar. Direksiyonun yön düğmeleri yalnızca menü görünürken çalışır, böylece oyunun da kullandığı bir düğme menüyü açmaz: önce Aç veya kapat kullan.
en = Keys work while the game window has focus; wheel, button box and controller buttons work whenever the game runs.
tr = Tuşlar oyun penceresi odaktayken çalışır; direksiyon, düğme kutusu ve kumanda düğmeleri oyun çalıştığı sürece çalışır.
en = Field of view crop
tr = Görüş alanı kırpma
en = The outer view keeps its sharpness and the focus region its size. Changes reach a running game at once; with DLSS on, or with less crop than at launch, the pixel count follows at the next launch.
tr = Dış görünüm keskinliğini, odak bölgesi boyutunu korur. Değişiklikler çalışan oyuna hemen ulaşır; DLSS açıkken ya da başlatmadakinden daha az kırpmayla piksel sayısı sonraki başlatmada güncellenir.
en = Helmet overlay
tr = Kask katmanı
en = Built in, the visor opening follows the crop (Rim and Corners). Your own helmet: top.png, bottom.png and visor.png with alpha in the helmet folder next to the layer; the log suggests the crop that matches them.
tr = Yerleşik kaskta vizör açıklığı kırpmayı izler (Kenar ve Köşeler). Kendi kaskın: katmanın yanındaki helmet klasörüne alfa kanallı top.png, bottom.png ve visor.png; günlük bunlara uyan kırpmayı önerir.
en = Focus shape
tr = Odak şekli
en = Each corner moves toward the middle of the focus region, percent of its width (in) or height (down, up). Pull the top corners in for a trapezoid: more of the dash sharp, less of the far field. The focus view still renders the whole box, so the cost stays the same.
tr = Her köşe odak bölgesinin ortasına doğru hareket eder; genişliğinin (içe) ya da yüksekliğinin (aşağı, yukarı) yüzdesi olarak. Yamuk için üst köşeleri içe çek: gösterge panelinin daha fazlası keskin, uzak alanın daha azı. Odak görünümü yine tüm kutuyu işler, bu yüzden maliyet aynı kalır.
en = Cheeky Foveated DLSS
tr = Cheeky Foveated DLSS
en = No Cheeky loader goes in the game folder: Sim-QVFR loads Cheeky’s runtime into the game itself.
tr = Oyun klasörüne Cheeky yükleyicisi konmaz: Sim-QVFR, Cheeky’nin çalışma zamanını oyunun içine kendisi yükler.
en = Frame generation (experimental)
tr = Kare üretimi (deneysel)
en = Outside the center region frames are warped with the game’s motion. Lower scales use less GPU time and memory. With an eye-tracked focus (the Foveation card) the region follows your eyes too, through Cheeky’s OpenXR layer.
tr = Merkez bölgenin dışında kareler oyunun hareketiyle bükülür. Düşük ölçekler daha az GPU süresi ve bellek kullanır. Göz takipli odakla (Foveasyon kartı) bölge de Cheeky’nin OpenXR katmanı aracılığıyla gözlerini izler.
en = The settings menu stays 0.8 m in front of your head, wherever you look.
tr = Ayarlar menüsü, nereye bakarsan bak başının 0,8 m önünde kalır.
en = Use DLSS
tr = DLSS kullan
en = Sim-QVFR evaluates NVIDIA’s DLSS on each view, with depth and motion it works out from the game’s own frames, before the game’s post-processing. Needs an NVIDIA RTX graphics card. Sim-QVFR includes NVIDIA’s nvngx_dlss.dll; Choose… takes another (a newer one from a game), Use included goes back.
tr = Sim-QVFR, NVIDIA’nın DLSS’ini her görünümde, oyunun kendi karelerinden çıkardığı derinlik ve hareketle, oyunun son işlemesinden önce çalıştırır. NVIDIA RTX ekran kartı gerekir. Sim-QVFR, NVIDIA’nın nvngx_dlss.dll dosyasını içerir; Seç… başka bir dosya alır (bir oyundan daha yeni olanı), Dahil olanı kullan geri döner.
en = Use FSR
tr = FSR kullan
en = Experimental. On a PC without an NVIDIA RTX graphics card, Sim-QVFR evaluates AMD FSR on each view in DLSS’s place, with the same depth and motion: FSR 4 where AMD’s software offers it for your card (Radeon RX 9000, and newer drivers on RX 7000 and 6000), FSR 3.1 elsewhere. Sim-QVFR includes AMD’s FSR files. Tested only as FSR 3.1 on an NVIDIA card so far: tell us how it runs on yours.
tr = Deneysel. NVIDIA RTX ekran kartı olmayan bir PC’de Sim-QVFR, DLSS’in yerine her görünümde aynı derinlik ve hareketle AMD FSR kullanır: AMD’nin yazılımı kartın için sunuyorsa FSR 4 (Radeon RX 9000 ve yeni sürücülerle RX 7000 ve 6000), diğerlerinde FSR 3.1. Sim-QVFR, AMD’nin FSR dosyalarını içerir. Şimdiye kadar yalnızca bir NVIDIA kartında FSR 3.1 olarak test edildi: seninkinde nasıl çalıştığını bize anlat.
en = Periphery preset
tr = Çevre ön ayarı
en = Steadier or cheaper DLSS outside the focus area. K: a steadier picture, at a higher cost. F: about half the cost, a little more flicker on edges. With eye tracking you rarely look there, so F is usually fine; with a fixed focus, K.
tr = Odak alanının dışında daha kararlı ya da daha hafif DLSS. K: daha kararlı görüntü, daha yüksek maliyetle. F: yaklaşık yarı maliyet, kenarlarda biraz daha fazla titreme. Göz takibiyle oraya nadiren bakarsın, bu yüzden F genellikle yeterlidir; sabit odakla K.
en = Texture sharpening
tr = Doku keskinleştirme
en = DLSS rebuilds detail from frames drawn at a lower resolution, so textures are best sampled a step sharper while it runs. Sim-QVFR does that through copies of the game’s shaders, in the focus area alone or in the periphery too. Measured gains are modest (most in the periphery and on distant textures). Off at launch, nothing is installed for it; turned on then, it starts at the next launch. Fine patterns may shimmer: then a step lower.
tr = DLSS ayrıntıyı daha düşük çözünürlükte çizilmiş karelerden yeniden kurar, bu yüzden o çalışırken dokular bir adım daha keskin örneklenmelidir. Sim-QVFR bunu oyunun gölgelendiricilerinin kopyalarıyla, yalnızca odak alanında ya da çevrede de yapar. Ölçülen kazançlar mütevazı (en çok çevrede ve uzak dokularda). Başlatmada kapalıysa onun için hiçbir şey kurulmaz; sonra açılırsa sonraki başlatmada başlar. İnce desenler titreyebilir: o zaman bir adım düşür.
en = Updates
tr = Güncellemeler
en = Install downloads the release from GitHub, checks it against the SHA-256 GitHub gives, replaces the program files and restarts the launcher; your settings, profiles and changed files stay, and the version you had is kept in the update folder. Download opens the release’s page instead.
tr = Yükle, sürümü GitHub’dan indirir, GitHub’ın verdiği SHA-256 ile denetler, program dosyalarını değiştirir ve başlatıcıyı yeniden başlatır; ayarların, profillerin ve değiştirdiğin dosyalar kalır, önceki sürümün update klasöründe tutulur. İndir ise sürümün sayfasını açar.
en = These settings reach the game while it runs, as soon as you change them. Without the game running, they apply when it starts.
tr = Bu ayarlar oyun çalışırken, değiştirir değiştirmez oyuna ulaşır. Oyun çalışmıyorsa başladığında uygulanır.
en = Lowering it reaches a running game at once, and so does raising it back up to what the game started with. Above that, it takes effect at the next launch. With DLSS on in the game, the views keep their launch sizes until the next launch.
tr = Düşürmek çalışan oyuna hemen ulaşır; oyunun başladığı değere kadar geri yükseltmek de öyle. Bunun üstü sonraki başlatmada etkili olur. Oyunda DLSS açıkken görünümler sonraki başlatmaya kadar başlatma boyutlarını korur.
en = These settings take effect the next time the game starts from the launcher. A running game keeps what it started with.
tr = Bu ayarlar oyun başlatıcıdan bir sonraki başladığında etkili olur. Çalışan bir oyun başladığı ayarları korur.
en = The local time on a small card in the headset, apart from the performance overlay: on or off and moved live, here or from the headset menu. It costs next to nothing; it redraws once a minute.
tr = Başlıkta, performans katmanından ayrı küçük bir kartta yerel saat: açılır, kapanır ve burada ya da başlık menüsünden anında taşınır. Neredeyse hiçbir maliyeti yok; dakikada bir yeniden çizilir.
en = The performance overlay in the headset: frame rate, CPU and GPU time and what limits the frame. A little CPU time while it shows.
tr = Başlıktaki performans katmanı: kare hızı, CPU ve GPU süresi ve kareyi neyin sınırladığı. Görünürken biraz CPU süresi harcar.
en = Shape
tr = Şekil
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom corners: each corner moved in on its own; pull the top corners in for a trapezoid, more of the dash sharp at the same cost. To hide the area’s edge, raise Feather.
tr = Keskin alanın şekli. Dikdörtgen: Köşe yarıçapı ile yuvarlatılır. Özel köşeler: her köşe ayrı ayrı içe taşınır; yamuk için üst köşeleri içe çek, aynı maliyetle gösterge panelinin daha fazlası keskin olur. Alanın kenarını gizlemek için Yumuşatma’yı artır.
en = Outline color
tr = Sınır rengi
en = The outline’s colour in the headset. It shows while Show focus outline is on.
tr = Sınırın başlıktaki rengi. Odak sınırını göster açıkken görünür.
en = nvngx_dlss.dll
tr = nvngx_dlss.dll
en = The DLSS Sim-QVFR uses: the one it includes (NVIDIA’s), or another you choose, a newer one from a game, say (DLSS 310 or newer). Use included goes back. Applies at the next launch.
tr = Sim-QVFR’nin kullandığı DLSS: içerdiği (NVIDIA’nın) ya da seçtiğin başka biri, örneğin bir oyundan daha yeni olanı (DLSS 310 veya daha yenisi). Dahil olanı kullan geri döner. Sonraki başlatmada uygulanır.
en = Focus views
tr = Odak görünümleri
en = DLAA draws them at their size. Ultra quality, Quality, Balanced and Performance draw them at 77, 67, 58 or 50% each way and upscale them: less GPU time, softer distant textures. DLSS has no ultra quality model of its own: 77% runs its quality one.
tr = DLAA onları kendi boyutlarında çizer. Ultra kalite, Kalite, Dengeli ve Performans onları her yönde %77, 67, 58 ya da 50 oranında çizip büyütür: daha az GPU süresi, daha yumuşak uzak dokular. DLSS’in kendine ait ultra kalite modeli yok: %77 onun kalite modelini çalıştırır.
en = Focus preset
tr = Odak ön ayarı
en = The DLSS preset for the sharp focus views. With Sim-QVFR’s DLSS, Default is NVIDIA’s choice for the mode: K, and M at Performance, which costs more. With Cheeky, Game default keeps the game’s.
tr = Keskin odak görünümleri için DLSS ön ayarı. Sim-QVFR’nin DLSS’iyle Varsayılan, NVIDIA’nın mod için seçimidir: K, Performans’ta ise daha pahalı olan M. Cheeky ile Oyun varsayılanı oyununkini korur.
en = Other cars’ motion
tr = Diğer araçların hareketi
en = Gives DLSS each other car’s own motion, so cars passing, alongside or ahead stay clean instead of smearing. Turn it off for more headroom: in a field of cars it costs about 0.5 ms of CPU and 0.2 to 0.5 ms of GPU a frame. Applies at the next launch, with DLSS on at launch; with DLSS off it costs nothing.
tr = DLSS’e diğer her aracın kendi hareketini verir; böylece geçen, yanındaki ya da öndeki araçlar bulanıklaşmadan temiz kalır. Daha fazla pay için kapat: araç dolu bir pistte kare başına yaklaşık 0,5 ms CPU ve 0,2 ile 0,5 ms GPU harcar. Başlatmada DLSS açıksa sonraki başlatmada uygulanır; DLSS kapalıyken maliyeti yoktur.
en = nvngx_dlssnr.dll
tr = nvngx_dlssnr.dll
en = NVIDIA’s DLSS neural rendering runtime. Sim-QVFR includes none: it is NVIDIA’s, and comes only with games that ship DLSS-NR. Choose the one in such a game’s folder. Applies at the next launch.
tr = NVIDIA’nın DLSS nöral işleme çalışma zamanı. Sim-QVFR bunu içermez: NVIDIA’ya aittir ve yalnızca DLSS-NR içeren oyunlarla gelir. Böyle bir oyunun klasöründekini seç. Sonraki başlatmada uygulanır.
en = Use DLSS-NR
tr = DLSS-NR kullan
en = NVIDIA’s DLSS neural rendering on the views: its model reworks lighting and materials from the picture, its depth and its motion. Experimental, and heavy: about 2 ms of GPU time and 130 MB of video memory for every million pixels it works on, per view (RTX 5070 Ti). It turns itself off if frames fall under 10 a second with it on.
tr = Görünümlerde NVIDIA’nın DLSS nöral işlemesi: modeli aydınlatmayı ve malzemeleri görüntüden, derinliğinden ve hareketinden yeniden işler. Deneysel ve ağır: işlediği her milyon piksel için görünüm başına yaklaşık 2 ms GPU süresi ve 130 MB video belleği (RTX 5070 Ti). Açıkken kareler saniyede 10’un altına düşerse kendini kapatır.
en = Intensity
tr = Şiddet
en = How much of the model’s change you get: 0% is the picture as it came.
tr = Modelin değişikliğinden ne kadar aldığın: %0 görüntünün geldiği hâlidir.
en = Style
tr = Stil
en = The look the model aims for.
tr = Modelin hedeflediği görünüm.
en = Preset
tr = Ön ayar
en = The model: A is the original, B a faster one in newer DLLs (310.9.16 on). Default is the DLL’s own choice. A change rebuilds DLSS-NR: a short stutter.
tr = Model: A orijinal, B yeni DLL’lerde (310.9.16 ve sonrası) daha hızlı olanı. Varsayılan, DLL’in kendi seçimidir. Bir değişiklik DLSS-NR’yi yeniden kurar: kısa bir takılma.
en = Local tone
tr = Yerel ton
en = The strength of the model’s local contrast and lighting changes.
tr = Modelin yerel kontrast ve aydınlatma değişikliklerinin gücü.
en = Local structure
tr = Yerel yapı
en = The strength of the model’s changes to fine structure.
tr = Modelin ince yapıdaki değişikliklerinin gücü.
en = Auto mask
tr = Otomatik maske
en = Lets the model find what it treats differently (skin) by itself.
tr = Modelin farklı ele aldığı şeyleri (cilt) kendisi bulmasını sağlar.
en = Runs
tr = Çalışma sırası
en = After DLSS works on the finished, anti-aliased views. Before DLSS works on the views as drawn, before anti-aliasing and upscaling: fewer pixels when the focus views are upscaled, and DLSS then smooths its result.
tr = DLSS’ten sonra: bitmiş, kenar yumuşatılmış görünümlerde çalışır. DLSS’ten önce: görünümlerde çizildikleri gibi, kenar yumuşatma ve büyütmeden önce çalışır; odak görünümleri büyütülüyorsa daha az piksel işler, DLSS de sonucunu yumuşatır.
en = Focus working size
tr = Odak çalışma boyutu
en = What the model works at, a share of the focus view. Lower costs less; the picture keeps its own detail.
tr = Modelin çalıştığı boyut, odak görünümünün bir payı. Düşük olan daha az harcar; görüntü kendi ayrıntısını korur.
en = Working size limit
tr = Çalışma boyutu sınırı
en = The most one view’s model works on, in megapixels, whatever the sizes. Each megapixel costs about 2 ms of GPU time and 130 MB of video memory, per view.
tr = Boyutlar ne olursa olsun, bir görünümün modelinin en fazla işlediği megapiksel. Her megapiksel görünüm başına yaklaşık 2 ms GPU süresi ve 130 MB video belleği harcar.
en = Edge blend
tr = Kenar geçişi
en = The band over which the processed area fades into what isn’t processed around it.
tr = İşlenen alanın, çevresindeki işlenmeyen kısma karıştığı bant.
en = Periphery too
tr = Çevrede de
en = Off, only the focus views are processed: where you look. On, the periphery too, at its own working size and coverage. It adds about 2 ms of GPU time per eye at least, however small you make it.
tr = Kapalıyken yalnızca odak görünümleri işlenir: baktığın yer. Açıkken çevre de kendi çalışma boyutu ve kapsamıyla işlenir. Ne kadar küçük yaparsan yap, göz başına en az yaklaşık 2 ms GPU süresi ekler.
en = Periphery working size
tr = Çevre çalışma boyutu
en = As the focus working size, for the periphery.
tr = Odak çalışma boyutu gibi, çevre için.
en = Periphery covered
tr = Çevre kapsamı
en = How much of each eye’s view the model covers, around the focus area.
tr = Modelin, odak alanı çevresinde her gözün görüntüsünün ne kadarını kapsadığı.
en = Foveated DLSS
tr = Foveated DLSS
en = Off leaves the game’s own DLSS on every view.
tr = Kapalıyken her görünümde oyunun kendi DLSS’i kalır.
en = Outer preset
tr = Dış ön ayar
en = The DLSS preset of the outer views’ own pass (Cheaper outer views).
tr = Dış görünümlerin kendi geçişinin DLSS ön ayarı (Daha hafif dış görünümler).
en = Fix motion-vector blur
tr = Hareket vektörü bulanıklığını düzelt
en = Cheeky’s workaround for smearing with some presets. Adds GPU work.
tr = Cheeky’nin bazı ön ayarlardaki bulanıklaşma için geçici çözümü. GPU işi ekler.
en = DLSS-NR
tr = DLSS-NR
en = NVIDIA’s DLSS-NR (DLSS 5) on the focus views. Needs nvngx_dlssnr.dll next to the game.
tr = Odak görünümlerinde NVIDIA’nın DLSS-NR’si (DLSS 5). Oyunun yanında nvngx_dlssnr.dll gerekir.
en = DLSS-NR passes
tr = DLSS-NR geçişleri
en = Each extra DLSS-NR pass costs about one more NR evaluation.
tr = Her ek DLSS-NR geçişi yaklaşık bir NR değerlendirmesi daha harcar.
en = Multiplier
tr = Çarpan
en = Frames shown per frame the game renders: 2x adds one generated frame between each two of the game’s.
tr = Oyunun işlediği her kare başına gösterilen kare: 2x, oyunun her iki karesi arasına bir üretilmiş kare ekler.
en = Center FG scale
tr = Merkez FG ölçeği
en = Frame generation’s resolution in the center region. Lower uses less GPU time and memory.
tr = Kare üretiminin merkez bölgedeki çözünürlüğü. Düşük olan daha az GPU süresi ve bellek kullanır.
en = Periphery FG scale
tr = Çevre FG ölçeği
en = Frame generation’s resolution around the center region. Lower uses less GPU time and memory.
tr = Kare üretiminin merkez bölge çevresindeki çözünürlüğü. Düşük olan daha az GPU süresi ve bellek kullanır.
en = Release game
tr = Oyunu serbest bırak
en = When the game starts its next frame. Never: CPU and GPU overlap (most frames). Capture: after the GPU finishes. Generated: after the generated frame.
tr = Oyunun bir sonraki karesine ne zaman başlayacağı. Asla: CPU ve GPU örtüşür (çoğu kare). Yakalama: GPU bitirdikten sonra. Üretilen: üretilmiş kareden sonra.
en = Show the center region
tr = Merkez bölgeyi göster
en = Outlines the region in the headset, to check that it follows your eyes.
tr = Bölgenin gözlerini izlediğini denetlemek için onu başlıkta çerçeveler.
en = Rim
tr = Kenar
en = How far the helmet’s padding reaches into the view.
tr = Kaskın dolgusunun görüntüye ne kadar uzandığı.
en = Corners
tr = Köşeler
en = Rounds the helmet’s visor opening.
tr = Kaskın vizör açıklığını yuvarlar.
en = Lighting
tr = Aydınlatma
en = How much the scene lights the helmet.
tr = Sahnenin kaskı ne kadar aydınlattığı.
en = Visor
tr = Vizör
en = Your own images only: closed, half or open. Ctrl+Alt+V in the game steps it.
tr = Yalnızca kendi görsellerin: kapalı, yarım ya da açık. Oyunda Ctrl+Alt+V sırayla değiştirir.
en = Depth
tr = Derinlik
en = Your own images only: how far in front of your eyes, in cm. 0 is far away, with no depth.
tr = Yalnızca kendi görsellerin: gözlerinin ne kadar önünde, cm cinsinden. 0, derinliksiz olarak uzakta demektir.
en = Detail
tr = Ayrıntı
en = Your own images only: Detail (4096) is sharper, Performance (2048) costs less GPU time and memory.
tr = Yalnızca kendi görsellerin: Ayrıntı (4096) daha keskin, Performans (2048) daha az GPU süresi ve bellek harcar.
en = Degrees right of straight ahead. Negative is left. Drag it in Placement, or move it in the headset.
tr = Tam karşının sağına doğru derece. Negatif değer soldur. Yerleşim içinde sürükle ya da başlıkta taşı.
en = Degrees above eye level. Negative is below. Drag it in Placement, or move it in the headset.
tr = Göz hizasının üstünde derece. Negatif değer aşağıdır. Yerleşim içinde sürükle ya da başlıkta taşı.
en = How wide it is, in degrees of your view.
tr = Görüşünün derecesi cinsinden ne kadar geniş olduğu.
en = A line under the headset menu with the in-game hotkeys (overlay, visor, CPU capture) and their wheel buttons, as set in Hotkeys. Also on the menu’s Headset page.
tr = Başlık menüsünün altında, oyun içi kısayol tuşlarını (katman, vizör, CPU yakalama) ve Kısayol tuşları’nda ayarlanan direksiyon düğmelerini gösteren bir satır. Menünün Başlık sayfasında da var.
en = Open or close
tr = Aç veya kapat
en = Opens the headset menu, or closes it.
tr = Başlık menüsünü açar ya da kapatır.
en = Up
tr = Yukarı
en = Selects the line above in the headset menu.
tr = Başlık menüsünde üstteki satırı seçer.
en = Down
tr = Aşağı
en = Selects the line below in the headset menu.
tr = Başlık menüsünde alttaki satırı seçer.
en = Left
tr = Sol
en = Lowers the selected value in the headset menu.
tr = Başlık menüsünde seçili değeri düşürür.
en = Right
tr = Sağ
en = Raises the selected value in the headset menu.
tr = Başlık menüsünde seçili değeri artırır.
en = Overlay
tr = Katman
en = Turns the performance overlay on or off.
tr = Performans katmanını açar ya da kapatır.
en = Helmet visor
tr = Kask vizörü
en = Steps the helmet’s visor: closed, half, open.
tr = Kaskın vizörünü değiştirir: kapalı, yarım, açık.
en = Helmet images
tr = Kask görselleri
en = Your own helmet: top.png, bottom.png and visor.png in the helmet folder next to the layer. Size and Height place them (degrees of view, and above straight ahead).
tr = Kendi kaskın: katmanın yanındaki helmet klasöründe top.png, bottom.png ve visor.png. Boyut ve Yükseklik onları yerleştirir (görüş derecesi ve tam karşının üstü).

