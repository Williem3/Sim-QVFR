; src/launcher/ui/help.cpp
en = Rendering method
pl = Metoda renderowania
en = Quad View Foveated Rendering draws the outer and focus views in one game frame: the lightest on the CPU, and the one with every feature. Two-loop (legacy) draws two whole game frames per headset frame: about twice the CPU work per frame, and no frame generation.
pl = Quad View Foveated Rendering rysuje widoki zewnętrzne i widoki ostrości w jednej klatce gry: najlżej dla CPU i ze wszystkimi funkcjami. Two-loop (starsza) rysuje dwie całe klatki gry na klatkę gogli: mniej więcej dwa razy więcej pracy CPU na klatkę i bez generowania klatek.
en = Foveated mode
pl = Tryb foveacji
en = Eye tracked: the sharp area follows your eyes, so it can be small and dense; it needs a headset with eye tracking. Fixed: the area stays in the centre, so make it larger, since your eyes move off it.
pl = Śledzony wzrokiem: ostry obszar podąża za twoimi oczami, więc może być mały i gęsty; wymaga gogli ze śledzeniem wzroku. Stały: obszar zostaje na środku, więc zrób go większym, bo oczy z niego uciekają.
en = Periphery resolution
pl = Rozdzielczość peryferii
en = The wide view around the focus area, a share of the headset’s recommended resolution. It covers most of the view but you see it with your side vision, so it is the first to lower: it saves GPU time and VRAM roughly with its pixels. The preview’s Pixels per frame shows the total.
pl = Szeroki widok wokół obszaru ostrości, jako część zalecanej rozdzielczości gogli. Zajmuje większość widoku, ale widzisz go kątem oka, więc obniża się go w pierwszej kolejności: oszczędza czas GPU i VRAM mniej więcej proporcjonalnie do pikseli. Piksele na klatkę w podglądzie pokazują sumę.
en = Focus density
pl = Gęstość ostrości
en = Pixel density inside the focus area, a share of the headset’s native density. Above 100% it renders more pixels than the headset shows where you look: sharper text and edges. Its cost grows with the area’s size, so a small area can take a high density cheaply. Dragging moves it in 5% steps; the arrow keys move it by 1%.
pl = Gęstość pikseli w obszarze ostrości, jako część natywnej gęstości gogli. Powyżej 100% renderuje więcej pikseli, niż gogle pokazują tam, gdzie patrzysz: ostrzejszy tekst i krawędzie. Koszt rośnie z rozmiarem obszaru, więc mały obszar może tanio mieć wysoką gęstość. Przeciąganie zmienia ją co 5%, strzałki co 1%.
en = Object detail
pl = Szczegółowość obiektów
en = How detailed trees and objects are, and how far away they are still drawn. At 100% they are as sharp in the focus region as its pixel density shows them; lower settings move toward the game’s own detail for the periphery resolution. It costs CPU, not GPU: more detail means more objects for X-Plane’s main thread to prepare every frame, often what limits the frame rate with QVFR. Lower it if frames stutter in dense scenery; the focus region shows coarser trees.
pl = Jak szczegółowe są drzewa i obiekty i jak daleko są jeszcze rysowane. Przy 100% są w obszarze ostrości tak ostre, jak pozwala jego gęstość pikseli; niższe wartości zbliżają się do szczegółowości gry dla rozdzielczości peryferii. Kosztuje CPU, nie GPU: więcej szczegółów to więcej obiektów, które główny wątek X-Plane musi przygotować w każdej klatce, a to często ogranicza liczbę klatek z QVFR. Obniż ją, jeśli klatki się zacinają w gęstej scenerii; w obszarze ostrości drzewa będą prostsze.
en = For a player who sees with one eye. The eye you choose shows black in the headset, and the game draws no focus view for it, renders only a few pixels of its scene and skips DLSS on it, so the GPU does much less. The game still prepares that eye’s frame, so the CPU saves little. With both eyes seeing, a black eye is uncomfortable: leave it at None.
pl = Dla gracza, który widzi jednym okiem. Wybrane oko jest czarne w goglach, a gra nie rysuje dla niego widoku ostrości, renderuje tylko kilka pikseli jego sceny i pomija dla niego DLSS, więc GPU ma dużo mniej pracy. Gra nadal przygotowuje klatkę tego oka, więc CPU oszczędza niewiele. Gdy widzisz obojgiem oczu, czarne oko jest niekomfortowe: zostaw Brak.
en = Sharpening
pl = Wyostrzanie
en = Crisper edges and text in the focus area; too much makes it shimmer. Raise it a little if the view looks soft (0% is off); it costs a little GPU time and changes while you drive. How: AMD FidelityFX Contrast Adaptive Sharpening, applied as Sim-QVFR resamples the focus view for the headset. Each pixel is sharpened by how much contrast room it has, so soft detail gains the most and edges already sharp gain little. The percentage is CAS’s own sharpness, as other CAS sharpeners show it: any setting above 0% already sharpens. Only the focus area is sharpened, fading out across its feather so its edge stays even: your side vision sees shimmer more than detail. 0% is off; it changes while you drive.
pl = Wyraźniejsze krawędzie i tekst w obszarze ostrości; za dużo powoduje migotanie. Zwiększ trochę, jeśli obraz wygląda miękko (0% to wyłączone); kosztuje trochę czasu GPU i zmienia się w trakcie jazdy. Jak: AMD FidelityFX Contrast Adaptive Sharpening, stosowane, gdy Sim-QVFR przeskalowuje widok ostrości dla gogli. Każdy piksel jest wyostrzany według zapasu kontrastu, więc miękkie detale zyskują najwięcej, a już ostre krawędzie niewiele. Procent to własna ostrość CAS, tak jak pokazują ją inne narzędzia CAS: każda wartość powyżej 0% już wyostrza. Wyostrzany jest tylko obszar ostrości, z zanikaniem w strefie wygładzenia krawędzi, by jego brzeg był równy: kąt oka widzi migotanie bardziej niż detale. 0% to wyłączone; zmienia się w trakcie jazdy.
en = Night car lighting
pl = Nocne oświetlenie aut
en = Adds highlights and shading to the cars at night. Sim-QVFR relights each car after the game draws it, before the game's own post-processing: highlights where the floodlights and headlights reflect off the paint, shading in creases and under the car, and the effects below. The rest of the scene is untouched. It costs about 0.5 to 1 ms of GPU time with everything on. The switch takes effect at the next launch; the values and effects change while you drive.
pl = Dodaje autom nocą odblaski i cieniowanie. Sim-QVFR oświetla każde auto na nowo po tym, jak gra je narysuje, przed własnym postprocessingiem gry: połyski tam, gdzie reflektory toru i światła auta odbijają się w lakierze, cieniowanie w załamaniach i pod autem oraz efekty poniżej. Reszta sceny pozostaje nietknięta. Przy wszystkim włączonym kosztuje około 0,5 do 1 ms czasu GPU. Przełącznik działa od następnego uruchomienia; wartości i efekty zmieniają się podczas jazdy.
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High. The switches below stay as you set them. Low takes about a third less GPU time than High and looks a little grainier; the periphery always runs one step below the focus area, where it's least seen.
pl = Jak dokładnie liczone są efekty: na Niskiej mniej próbek i kroków dla cieni, okluzji i wygładzania, na Wysokiej wszystkie. Przełączniki poniżej zostają tak, jak je ustawisz. Niska zajmuje mniej więcej o jedną trzecią mniej czasu GPU niż Wysoka i wygląda nieco ziarniściej; peryferia zawsze działają o stopień niżej niż obszar ostrości, gdzie najmniej je widać.
en = Fill light
pl = Światło wypełniające
en = How much of the game's own floodlight lighting stays on the cars. Lower makes the shading and highlights stand out more; 100% keeps the game's brightness.
pl = Ile własnego oświetlenia gry z reflektorów zostaje na autach. Niżej cieniowanie i połyski mocniej się wyróżniają; 100% zachowuje jasność gry.
en = Ambient occlusion
pl = Okluzja otoczenia
en = Darkens creases, wheel arches and the underside, where light reaches less. 0% is off.
pl = Przyciemnia załamania, nadkola i spód auta, gdzie dociera mniej światła. 0% to wyłączone.
en = Highlights
pl = Połyski
en = The strength of the floodlights' and headlights' reflections on the paint. 0% is off; above 100% is brighter than the lights would make it.
pl = Siła odbić reflektorów toru i świateł aut w lakierze. 0% to wyłączone; powyżej 100% jest jaśniej, niż dałyby same światła.
en = Paint gloss
pl = Połysk lakieru
en = How glossy the lacquer is: higher gives smaller, sharper highlights, lower broad soft ones.
pl = Jak błyszczący jest lakier: wyżej daje mniejsze, ostrzejsze połyski, niżej szerokie i miękkie.
en = Smoothing
pl = Wygładzanie
en = Smooths the surface direction over this distance where the game's own normals aren't available, which hides faceted highlights on low-polygon parts. About 15 cm suits most cars; 0 is off.
pl = Wygładza kierunek powierzchni na tym dystansie tam, gdzie nie ma własnych normalnych gry, co ukrywa fasetowane połyski na elementach o niewielu poligonach. Około 15 cm pasuje do większości aut; 0 to wyłączone.
en = Floodlight shadows
pl = Cienie reflektorów
en = A part of a car hidden from a floodlight, behind a wing or another car, loses that light and its highlight.
pl = Część auta ukryta przed reflektorem, za skrzydłem lub innym autem, traci to światło i jego połysk.
en = Paint detail
pl = Detal lakieru
en = Uses the paint's fine surface detail, orange peel and the carbon weave, in the highlights.
pl = W połyskach używa drobnego detalu powierzchni lakieru, skórki pomarańczy i splotu karbonu.
en = Lacquer reflections
pl = Odbicia lakieru
en = Mirrors what's around a car in its paint, strongest at shallow angles. Only what's on screen can be reflected, and only where both eyes can see it, so both eyes show the same.
pl = Odbija w lakierze otoczenie auta, najmocniej pod płytkimi kątami. Odbić można tylko to, co jest na ekranie, i tylko tam, gdzie widzą to oba oczy, żeby oba oczy pokazywały to samo.
en = Headlight highlights
pl = Połyski świateł
en = Other cars' headlights, and yours in the mirrors, shine on the paint as the floodlights do.
pl = Światła innych aut, a w lusterkach twoje, świecą na lakier tak jak reflektory toru.
en = Shadows on the ground
pl = Cienie na podłożu
en = Darkens the track and walls under and beside the cars, and casts soft floodlight shadows, so the cars sit on the ground.
pl = Przyciemnia tor i ściany pod autami i obok nich oraz rzuca miękkie cienie reflektorów, żeby auta stały na podłożu.
en = Night vision color
pl = Kolor widzenia nocnego
en = As eyes do at night, dark areas lose their colour and turn slightly blue while lit areas keep theirs. A matter of taste, off by default.
pl = Jak oczy w nocy, ciemne obszary tracą kolor i lekko niebieszczeją, a oświetlone zachowują swój. Kwestia gustu, domyślnie wyłączone.
en = Color correction
pl = Korekcja kolorów
en = Adjusts the picture in the headset: exposure, brightness, contrast and saturation, for a game that looks too dark, washed out or dull in your headset. Sim-QVFR applies it as it composes the views, the periphery and the focus area alike, so the focus area never stands out; it costs almost no GPU time and changes while you drive. Menus and loading screens show as the game draws them. Off, or every value at 0, leaves the picture as it was.
pl = Dostosowuje obraz w goglach: ekspozycję, jasność, kontrast i nasycenie, dla gry, która w twoich goglach wygląda na zbyt ciemną, wyblakłą lub mdłą. Sim-QVFR stosuje ją przy składaniu widoków, na peryferiach i obszarze ostrości jednakowo, więc obszar ostrości nigdy się nie wyróżnia; kosztuje prawie zero czasu GPU i zmienia się podczas jazdy. Menu i ekrany ładowania pokazują się tak, jak rysuje je gra. Wyłączona albo z każdą wartością na 0 zostawia obraz bez zmian.
en = Exposure
pl = Ekspozycja
en = Scales all of the light, in stops (EV): +1.0 EV is twice as bright, -1.0 EV half, up to 3 stops either way. Highlights brighten with the rest and can clip, so raise it a little at a time; Brightness lifts the darks without touching them.
pl = Skaluje całe światło, w działkach (EV): +1,0 EV to dwa razy jaśniej, -1,0 EV o połowę ciemniej, do 3 działek w każdą stronę. Światła rozjaśniają się razem z resztą i mogą się przepalić, więc podnoś po trochu; Jasność unosi ciemne tony, nie ruszając ich.
en = Brightness
pl = Jasność
en = Lightens or darkens the mid tones and shadows while black stays black and white stays white, so an OLED headset keeps its deep blacks: raise it to see into dark cockpits and night stints, lower it for a richer, darker picture.
pl = Rozjaśnia lub przyciemnia półcienie i cienie, a czerń zostaje czernią i biel bielą, więc gogle OLED zachowują głęboką czerń: podnieś, by widzieć w ciemnych kokpitach i na nocnych zmianach, obniż dla bogatszego, ciemniejszego obrazu.
en = Contrast
pl = Kontrast
en = Spreads the picture’s tones away from mid grey (above 0) or draws them towards it (below 0), as a gentle S-curve: black and white stay where they are and colours keep their hue. More contrast gives deeper shadows and brighter highlights; less shows more detail in both.
pl = Rozsuwa tony obrazu od średniej szarości (powyżej 0) albo przyciąga je do niej (poniżej 0), jak łagodna krzywa S: czerń i biel zostają na miejscu, a kolory zachowują odcień. Więcej kontrastu daje głębsze cienie i jaśniejsze światła; mniej pokazuje więcej detali w obu.
en = Saturation
pl = Nasycenie
en = How strong the colours are: above 0 more vivid, below 0 more muted, -100% grey. Brightness is kept as each colour changes.
pl = Jak intensywne są kolory: powyżej 0 żywsze, poniżej 0 bardziej stonowane, -100% szarość. Jasność jest zachowana, gdy zmienia się każdy kolor.
en = Accent brightness
pl = Jasność akcentu
en = How light or dark the game’s colour is. The wheel picks its hue and how strong it is; the launcher keeps its text and edges readable in light and dark mode.
pl = Jak jasny lub ciemny jest kolor gry. Koło wybiera odcień i jego intensywność; launcher dba o czytelność tekstu i krawędzi w trybie jasnym i ciemnym.
en = Focus width
pl = Szerokość ostrości
en = The focus area’s width, a share of the view. Wider hides the edge between sharp and soft better; its pixels cost density × width × height, so a wide area at a high density costs the most. It changes while you drive; wider than the game started with (at your density) renders less dense until the next launch.
pl = Szerokość obszaru ostrości, jako część widoku. Szerszy lepiej ukrywa granicę między ostrym a miękkim; jego piksele kosztują gęstość × szerokość × wysokość, więc szeroki obszar przy dużej gęstości kosztuje najwięcej. Zmienia się w trakcie jazdy; szerszy niż przy starcie gry (przy twojej gęstości) renderuje się z mniejszą gęstością do następnego uruchomienia.
en = Focus height
pl = Wysokość ostrości
en = The focus area’s height, a share of the view. Taller covers more of the dash and mirrors; it costs pixels as the width does. Taller than the game started with (at your density) renders less dense until the next launch.
pl = Wysokość obszaru ostrości, jako część widoku. Wyższy obejmuje więcej deski rozdzielczej i lusterek; kosztuje piksele tak jak szerokość. Wyższy niż przy starcie gry (przy twojej gęstości) renderuje się z mniejszą gęstością do następnego uruchomienia.
en = Corner radius
pl = Promień narożników
en = Rounds the focus area’s corners, so its edge is harder to spot. No cost: the area renders as a rectangle either way.
pl = Zaokrągla narożniki obszaru ostrości, by jego brzeg był mniej widoczny. Bez kosztu: obszar i tak renderuje się jako prostokąt.
en = Feather
pl = Wygładzenie krawędzi
en = The band where the focus area blends into the outer view. Wider hides the edge better; no measurable cost.
pl = Pas, w którym obszar ostrości przechodzi w widok zewnętrzny. Szerszy lepiej ukrywa brzeg; bez mierzalnego kosztu.
en = Gaze dead-zone
pl = Martwa strefa wzroku
en = How far your eyes move before the focus area follows. A little keeps it still against eye-tracker noise; too much makes it lag when you look around. No GPU cost.
pl = Jak daleko muszą przesunąć się oczy, zanim obszar ostrości za nimi podąży. Trochę trzyma go nieruchomo mimo szumu eye trackera; za dużo sprawia, że się spóźnia, gdy się rozglądasz. Bez kosztu GPU.
en = Gaze offset
pl = Przesunięcie wzroku
en = Moves the eye-tracked focus area up or down, in degrees, for a tracker that sits a little off. No cost.
pl = Przesuwa śledzony wzrokiem obszar ostrości w górę lub w dół, w stopniach, dla trackera, który jest lekko przesunięty. Bez kosztu.
en = Vertical position
pl = Położenie w pionie
en = Moves the fixed focus area up or down, in degrees: towards the dash and mirrors, or the road. No cost.
pl = Przesuwa stały obszar ostrości w górę lub w dół, w stopniach: w stronę deski i lusterek albo drogi. Bez kosztu.
en = Crop the view
pl = Przycinanie widoku
en = Cuts the edges a helmet or the lens hides before the game renders them. It saves GPU time and VRAM with the pixels cut; the headset shows black there.
pl = Obcina krawędzie zasłonięte przez kask lub soczewkę, zanim gra je wyrenderuje. Oszczędza czas GPU i VRAM proporcjonalnie do obciętych pikseli; gogle pokazują tam czerń.
en = Top
pl = Góra
en = How much of the top of each eye’s view the game doesn’t render. Saves pixels in proportion.
pl = Jaką część góry widoku każdego oka gra pomija w renderowaniu. Oszczędza piksele proporcjonalnie.
en = Bottom
pl = Dół
en = How much of the bottom of each eye’s view the game doesn’t render. Saves pixels in proportion.
pl = Jaką część dołu widoku każdego oka gra pomija w renderowaniu. Oszczędza piksele proporcjonalnie.
en = Outer side (temple)
pl = Strona zewnętrzna (skroń)
en = How much of each eye’s temple side the game doesn’t render. Saves pixels in proportion.
pl = Jaką część strony skroniowej każdego oka gra pomija w renderowaniu. Oszczędza piksele proporcjonalnie.
en = Inner side (nose)
pl = Strona wewnętrzna (nos)
en = How much of each eye’s nose side the game doesn’t render; the other eye still sees most of it. Saves pixels in proportion.
pl = Jaką część strony nosowej każdego oka gra pomija w renderowaniu; drugie oko i tak widzi większość tego obszaru. Oszczędza piksele proporcjonalnie.
en = Show a helmet
pl = Pokaż kask
en = Draws a helmet’s visor opening round the view, lit by the scene, in a layer of its own. It costs the headset a layer to composite; nothing for the game.
pl = Rysuje otwór wizjera kasku wokół widoku, oświetlony przez scenę, na osobnej warstwie. Kosztuje gogle jedną warstwę do złożenia; grę nic.
en = Road focus
pl = Ostrość na drodze
en = For fixed foveation. The focus area renders in full detail only along the road ahead (Road width either side of it and 3.5 m above it, following its hills and bends) and in your own car: the wheel, dash, displays and mirrors inside the focus area stay sharp. Trees, grandstands, hills and the sky beside and above the road come from the periphery’s image; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. It’s off while the focus follows your eyes. Turn it off if something beside the road looks softer than you want. Changes while you drive.
pl = Dla stałej foweacji. Obszar ostrości jest renderowany w pełnej szczegółowości tylko wzdłuż drogi przed tobą (szerokość drogi po obu stronach i 3,5 m nad nią, zgodnie z jej wzniesieniami i zakrętami) oraz w twoim własnym aucie: kierownica, deska rozdzielcza, wyświetlacze i lusterka w obszarze ostrości pozostają ostre. Drzewa, trybuny, wzgórza i niebo obok drogi i nad nią pochodzą z obrazu peryferii; tam, gdzie patrzysz podczas jazdy, nie powinieneś widzieć różnicy. Oszczędza czas GPU, tym więcej, im większy obszar ostrości. Jest wyłączona, gdy ostrość podąża za twoim wzrokiem. Wyłącz, jeśli coś obok drogi wygląda dla ciebie zbyt miękko. Zmienia się w trakcie jazdy.
en = Road width
pl = Szerokość drogi
en = How far either side of the road’s centre stays in full detail with Road focus on. Lower keeps just the track sharp and saves the most; higher brings the kerbs, run-off and barriers into the focus area and saves less. 10 m suits most circuits. Changes while you drive.
pl = Jak daleko po obu stronach środka drogi zostaje pełna szczegółowość przy włączonej ostrości na drodze. Mniej zostawia ostry tylko tor i oszczędza najwięcej; więcej wciąga do obszaru ostrości tarki, pobocza i bariery i oszczędza mniej. 10 m pasuje do większości torów. Zmienia się w trakcie jazdy.
en = Cockpit preset
pl = Ustawienie kokpitu
en = The focus area’s shape, size and position Road focus sets when you switch it on, or at once when you pick the other one here. A: a large cockpit shape over the windscreen, dash and wheel. B: a smaller one moved down to the road and the dash. Adjust either afterwards as you like; your own shape, size and position come back when you switch Road focus off. When the headset composes the views itself, the size stays inside its own focus region and the position doesn’t apply.
pl = Kształt, rozmiar i położenie obszaru ostrości, które ostrość na drodze ustawia po włączeniu albo od razu, gdy wybierzesz tu drugie. A: duży kształt kokpitu obejmujący szybę, deskę rozdzielczą i kierownicę. B: mniejszy, przesunięty w dół na drogę i deskę. Potem dopasuj dowolne z nich; twój własny kształt, rozmiar i położenie wracają po wyłączeniu ostrości na drodze. Gdy gogle same składają widoki, rozmiar zostaje w ich własnym obszarze ostrości, a położenie nie działa.
en = Road edge blend
pl = Przejście na krawędzi drogi
en = How softly Road focus’s full detail fades into the periphery at its edges: this many metres near you, wider in proportion far away so distant edges fade too. Raise it if you notice where the sharp area ends; 0 is a hard edge. Changes while you drive.
pl = Jak łagodnie pełna szczegółowość ostrości na drodze przechodzi w peryferia na jej krawędziach: tyle metrów blisko ciebie, proporcjonalnie szerzej w oddali, by dalekie krawędzie też się rozmywały. Zwiększ, jeśli widzisz, gdzie kończy się ostry obszar; 0 to ostra krawędź. Zmienia się w trakcie jazdy.
en = Show Road focus area
pl = Pokaż obszar ostrości na drodze
en = Tints blue, in the headset, everything Road focus takes from the periphery, so you can see exactly what stays in full detail (untinted) as you drive. Road focus works as usual meanwhile. For setting up; turn it off to drive.
pl = Barwi na niebiesko w goglach wszystko, co ostrość na drodze bierze z peryferii, abyś podczas jazdy widział dokładnie, co zostaje w pełnej szczegółowości (bez barwienia). Ostrość na drodze działa w tym czasie normalnie. Do ustawiania; wyłącz do jazdy.
en = Road height
pl = Wysokość drogi
en = How high above the road stays in full detail with Road focus on. Lower keeps just the road and the cars sharp and saves the most; higher brings signs, gantries and the grandstands’ lower rows into the focus area and saves less. 3.5 m suits most circuits. Changes while you drive.
pl = Jak wysoko nad drogą zostaje pełna szczegółowość przy włączonej ostrości na drodze. Mniej zostawia ostre tylko drogę i auta i oszczędza najwięcej; więcej wciąga do obszaru ostrości znaki, bramownice i dolne rzędy trybun i oszczędza mniej. 3,5 m pasuje do większości torów. Zmienia się w trakcie jazdy.
en = Show focus outline
pl = Pokaż obrys ostrości
en = Draws the focus area’s edge, to see where it is and how it follows your eyes. For setting up; turn it off to drive.
pl = Rysuje brzeg obszaru ostrości, by widzieć, gdzie jest i jak podąża za oczami. Do konfiguracji; wyłącz go do jazdy.
en = Use Cheeky Foveated DLSS
pl = Użyj Cheeky Foveated DLSS
en = Runs Cheeky Foveated DLSS inside the game, for the DLSS options below. Needs an NVIDIA RTX GPU, DLSS on in the game, and Cheeky’s download. Applies at the next launch.
pl = Uruchamia Cheeky Foveated DLSS w grze, dla opcji DLSS poniżej. Wymaga GPU NVIDIA RTX, włączonego DLSS w grze i pakietu Cheeky. Działa od następnego uruchomienia.
en = Cheaper outer views
pl = Tańsze widoki zewnętrzne
en = The outer views get Cheeky’s DLAA at a lower resolution instead of the game’s DLSS: GPU time saved on the views you see least.
pl = Widoki zewnętrzne dostają DLAA od Cheeky w niższej rozdzielczości zamiast DLSS gry: oszczędność czasu GPU na widokach, które widzisz najmniej.
en = Outer DLAA scale
pl = Skala DLAA zewnętrznego
en = The resolution of that cheaper pass. Lower saves more GPU time and softens the side view.
pl = Rozdzielczość tego tańszego przebiegu. Niższa oszczędza więcej czasu GPU i zmiękcza widok boczny.
en = Focus supersampling
pl = Supersampling ostrości
en = Renders the focus views above their size before DLSS: a sharper centre, for more GPU time.
pl = Renderuje widoki ostrości powyżej ich rozmiaru przed DLSS: ostrzejszy środek kosztem czasu GPU.
en = Frame generation
pl = Generowanie klatek
en = Cheeky’s DLSS frame generation adds frames between the game’s: smoother motion when the game can’t hold the refresh rate, for some GPU time and latency. Turn OpenXR Toolkit’s Turbo mode off with it, and run no other frame generator.
pl = Generowanie klatek DLSS od Cheeky dodaje klatki między klatkami gry: płynniejszy ruch, gdy gra nie utrzymuje częstotliwości odświeżania, kosztem trochę czasu GPU i opóźnienia. Wyłącz przy tym tryb Turbo w OpenXR Toolkit i nie używaj innego generatora klatek.
en = Center region
pl = Obszar środkowy
en = The part of the view frame generation makes at full quality (it follows your eyes when eye tracked). Larger looks better and costs more GPU time.
pl = Część widoku, którą generowanie klatek tworzy w pełnej jakości (przy śledzeniu wzroku podąża za oczami). Większy wygląda lepiej i kosztuje więcej czasu GPU.
en = Load order
pl = Kolejność wczytywania
en = Nearest the game first. Each launch loads these below the Sim-QVFR layer in this order; a layer off in Windows can still be loaded for the game alone. Locked switches keep the mod and the game working.
pl = Najbliżej gry na górze. Każde uruchomienie wczytuje je pod warstwą Sim-QVFR w tej kolejności; warstwa wyłączona w Windows może nadal być wczytana tylko dla gry. Zablokowane przełączniki dbają o to, by mod i gra działały.
en = Describe the problem
pl = Opisz problem
en = Zips the logs and the game’s crash reports from those sessions (names and account IDs taken out) into the logs folder, then opens a new issue on GitHub with what you wrote, your settings, the last session and your PC filled in. Add the steps there, and drag in the zip (it shows below) and any screenshots.
pl = Pakuje do zip logi i raporty awarii gry z tych sesji (bez nazw i identyfikatorów kont) w folderze logów, a potem otwiera nowe zgłoszenie na GitHubie z twoim opisem, twoimi ustawieniami, ostatnią sesją i danymi PC. Dopisz tam kroki i przeciągnij plik zip (pokaże się poniżej) oraz zrzuty ekranu.
en = Busiest threads
pl = Najbardziej zajęte wątki
en = Each thread is a share of ONE core. A thread near 100% can hold the frame rate back even when Windows shows the whole CPU at 15%; a thread that spins by design looks busy whatever limits it.
pl = Każdy wątek to część JEDNEGO rdzenia. Wątek bliski 100% może ograniczać liczbę klatek, nawet gdy Windows pokazuje cały CPU na 15%; wątek, który z założenia aktywnie czeka, wygląda na zajęty niezależnie od tego, co go ogranicza.
en = Frame rate
pl = Liczba klatek
en = The last session’s average against the headset’s refresh rate, the frame rate it asks for. Below it, the runtime fills the gaps (motion smoothing or reprojection), which shows as wobble on moving edges.
pl = Średnia z ostatniej sesji wobec częstotliwości odświeżania gogli, czyli liczby klatek, której oczekują. Poniżej niej runtime wypełnia luki (wygładzanie ruchu lub reprojekcja), co widać jako drganie ruchomych krawędzi.
en = Slow frames
pl = Wolne klatki
en = How long your slowest frames take: lower is smoother. One frame in ten took at least this long (the 90th percentile). Above the frame’s budget (1000 ms divided by the headset’s refresh rate: 11.1 ms at 90 Hz) those frames miss the headset, and you feel stutter even when the average frame rate looks fine.
pl = Ile trwają twoje najwolniejsze klatki: mniej znaczy płynniej. Jedna klatka na dziesięć trwała co najmniej tyle (90. percentyl). Powyżej budżetu klatki (1000 ms podzielone przez częstotliwość odświeżania gogli: 11,1 ms przy 90 Hz) te klatki nie trafiają do gogli i czujesz zacięcia, nawet gdy średnia liczba klatek wygląda dobrze.
en = Limited by
pl = Ograniczenie
en = What held the frame back most of the time: the game’s render thread on the CPU, the GPU, or nothing (the headset’s refresh). Lowering resolution helps only when the GPU limits it.
pl = Co najczęściej wstrzymywało klatkę: wątek renderowania gry na CPU, GPU albo nic (odświeżanie gogli). Obniżanie rozdzielczości pomaga tylko wtedy, gdy ogranicza GPU.
en = Previous session
pl = Poprzednia sesja
en = The session before the last one for this game, and the settings changed in between, so you can see what a change did. A change while you drive (here or in the headset menu) starts a new stint, kept as its own entry; each covers the whole stint, with the moments the headset menu was open left out. Compare runs on the same track and car for a fair difference.
pl = Sesja przed ostatnią dla tej gry i ustawienia zmienione pomiędzy, by widzieć, co dała zmiana. Zmiana w trakcie jazdy (tutaj lub w menu w goglach) zaczyna nowy stint, zapisany jako osobny wpis; każdy obejmuje cały stint, bez momentów, gdy było otwarte menu w goglach. Dla uczciwego porównania porównuj przejazdy na tym samym torze i tym samym samochodzie.
en = Run with anti-cheat
pl = Uruchom z anti-cheatem
en = Starts the game through its anti-cheat (Easy Anti-Cheat), as Steam does, with Sim-QVFR running, so you can join online servers. Sim-QVFR runs inside the game, and the anti-cheat may kick you or ban your account for it. Sim-QVFR and its developer aren’t responsible for kicks or bans: turning it on asks you to accept that risk. Off starts the game without its anti-cheat, for offline sessions only.
pl = Uruchamia grę przez jej anti-cheat (Easy Anti-Cheat), jak robi to Steam, z działającym Sim-QVFR, by można było dołączać do serwerów online. Sim-QVFR działa wewnątrz gry, a anti-cheat może cię za to wyrzucić lub zbanować konto. Sim-QVFR i jego twórca nie odpowiadają za wyrzucenia ani bany: włączenie wymaga zaakceptowania tego ryzyka. Wyłączone uruchamia grę bez anti-cheata, tylko do sesji offline.
en = Layers for
pl = Warstwy dla
en = Launches from here: the VR add-ons (OpenXR layers) a launch from this launcher loads, below Sim-QVFR, in an order of its own; nothing else changes. Every app: Windows’ own list, which every other app uses (and the game started from Steam), saved in the registry when you apply, with a backup in the logs folder first.
pl = Uruchomienia stąd: dodatki VR (warstwy OpenXR), które wczytuje uruchomienie z tego launchera, pod Sim-QVFR, we własnej kolejności; nic innego się nie zmienia. Każda aplikacja: lista Windows, której używają wszystkie inne aplikacje (i gra uruchomiona ze Steam), zapisywana w rejestrze przy zastosowaniu, z wcześniejszą kopią zapasową w folderze logów.
en = CPU capture
pl = Przechwytywanie CPU
en = At the next launch, the CPU capture hotkey (Ctrl+Alt+C) while driving records for 20 s where the game’s busiest threads spend their time, into a cpu-profile file in the logs folder. The headset menu shows when it starts and ends; the game may stutter slightly while it records.
pl = Od następnego uruchomienia skrót przechwytywania CPU (Ctrl+Alt+C) w trakcie jazdy przez 20 s zapisuje, na co najbardziej zajęte wątki gry poświęcają czas, do pliku cpu-profile w folderze logów. Menu w goglach pokazuje początek i koniec; gra może lekko się zacinać podczas zapisu.
en = Frame capture
pl = Przechwytywanie klatek
en = Saves the game’s own image and the composed output, as PNG files in the captures folder inside the logs folder. Each press saves one more frame, to compare the views where something looks wrong. In X-Plane 12, Assetto Corsa Competizione and Le Mans Ultimate.
pl = Zapisuje obraz samej gry i złożony obraz wyjściowy jako pliki PNG w folderze captures w folderze logów. Każde naciśnięcie zapisuje kolejną klatkę, by porównać widoki tam, gdzie coś wygląda źle. W X-Plane 12, Assetto Corsa Competizione i Le Mans Ultimate.
en = Next launch without QVFR
pl = Następne uruchomienie bez QVFR
en = Starts the game once with its own two views and QVFR off, still measuring, so Diagnostics can compare the same race with and without QVFR. It turns itself off after that launch; the next one has QVFR again. The performance overlay works in it, the headset menu does not.
pl = Uruchamia grę raz z jej własnymi dwoma widokami i wyłączonym QVFR, nadal mierząc, by Diagnostyka mogła porównać ten sam wyścig z QVFR i bez. Po tym uruchomieniu wyłącza się samo; następne znów ma QVFR. Nakładka wydajności w nim działa, menu w goglach nie.
en = Detailed logs
pl = Szczegółowe logi
en = Normal logs say what Sim-QVFR set up, decided and measured. Detailed logs add every step behind that, for a bug report when the developer asks for one. They last three launches and then turn themselves off, so the logs stay small. Send them with Report an issue, or Save the logs as a zip.
pl = Zwykłe logi mówią, co Sim-QVFR skonfigurował, zdecydował i zmierzył. Szczegółowe logi dodają każdy krok za tym, do zgłoszenia błędu, gdy poprosi o to twórca. Działają przez trzy uruchomienia i potem same się wyłączają, by logi były małe. Wyślij je przez Zgłoś problem albo Zapisz logi jako zip.
en = Logs folder
pl = Folder logów
en = Each launch adds a session log and a small run folder. The launcher keeps the newest 30 sessions and removes older ones at each launch, and the newest 10 CPU captures. Frame captures and game image dumps stay until you clear them: Clear captures moves them to the Recycle Bin.
pl = Każde uruchomienie dodaje log sesji i mały folder przejazdu. Launcher trzyma 30 najnowszych sesji i przy każdym uruchomieniu usuwa starsze, oraz 10 najnowszych przechwyceń CPU. Przechwycone klatki i zrzuty obrazu gry zostają, dopóki ich nie usuniesz: Wyczyść przechwycenia przenosi je do Kosza.
en = Presets for eye tracked foveation
pl = Ustawienia wstępne dla foveacji ze śledzeniem wzroku
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Eye tracked, the area follows your eyes, so it can be small and very sharp. They set the resolution only and keep everything else.
pl = Punkty wyjścia, które skupiają piksele w środku: niskie widoki zewnętrzne i gęsty obszar ostrości. Przy śledzeniu wzroku obszar podąża za oczami, więc może być mały i bardzo ostry. Ustawiają tylko rozdzielczość, resztę zostawiają.
en = Presets for fixed foveation
pl = Ustawienia wstępne dla stałej foveacji
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Fixed, your eyes move off the centre, so the area is larger and a little less dense. They set the resolution only and keep everything else.
pl = Punkty wyjścia, które skupiają piksele w środku: niskie widoki zewnętrzne i gęsty obszar ostrości. Przy stałej foveacji oczy uciekają ze środka, więc obszar jest większy i nieco mniej gęsty. Ustawiają tylko rozdzielczość, resztę zostawiają.
en = Your profiles
pl = Twoje profile
en = A profile holds every setting of the picture: resolution, foveation and the focus overlay, and where the game has them the view crop, the helmet and Foveated DLSS. Not the menu’s and overlay’s places, the hotkeys or the OpenXR layers. Share copies one as a line of text to paste in a chat; Paste adds one from the clipboard. The headset menu’s Profile line switches between them while you drive.
pl = Profil zawiera wszystkie ustawienia obrazu: rozdzielczość, foveację i obrys ostrości, a tam, gdzie gra je ma, przycinanie widoku, kask i Foveated DLSS. Nie położenie menu i nakładki, skróty klawiszowe ani warstwy OpenXR. Udostępnij kopiuje profil jako wiersz tekstu do wklejenia na czacie; Wklej dodaje profil ze schowka. Wiersz Profil w menu w goglach przełącza między nimi w trakcie jazdy.
en = A key’s first press also opens the menu. A wheel’s directions act only while the menu shows, so a switch the game also uses doesn’t open it: use Open or close first.
pl = Pierwsze naciśnięcie klawisza też otwiera menu. Kierunki na kierownicy działają tylko, gdy menu jest widoczne, więc przełącznik używany też przez grę go nie otworzy: najpierw użyj Otwórz lub zamknij.
en = Keys work while the game window has focus; wheel, button box and controller buttons work whenever the game runs.
pl = Klawisze działają, gdy okno gry jest aktywne; przyciski kierownicy, button boxa i kontrolera działają zawsze, gdy gra działa.
en = Field of view crop
pl = Przycinanie pola widzenia
en = The outer view keeps its sharpness and the focus region its size. Changes reach a running game at once; with DLSS on, or with less crop than at launch, the pixel count follows at the next launch.
pl = Widok zewnętrzny zachowuje ostrość, a obszar ostrości swój rozmiar. Zmiany docierają do działającej gry od razu; z włączonym DLSS albo przy mniejszym przycięciu niż przy starcie liczba pikseli dostosuje się przy następnym uruchomieniu.
en = Helmet overlay
pl = Nakładka kasku
en = Built in, the visor opening follows the crop (Rim and Corners). Your own helmet: top.png, bottom.png and visor.png with alpha in the helmet folder next to the layer; the log suggests the crop that matches them.
pl = Wbudowany: otwór wizjera podąża za przycięciem (Obrzeże i Narożniki). Twój własny kask: top.png, bottom.png i visor.png z kanałem alfa w folderze helmet obok warstwy; log podpowiada pasujące do nich przycięcie.
en = Focus shape
pl = Kształt ostrości
en = Each corner moves toward the middle of the focus region, percent of its width (in) or height (down, up). Pull the top corners in for a trapezoid: more of the dash sharp, less of the far field. The focus view still renders the whole box, so the cost stays the same.
pl = Każdy narożnik przesuwa się w stronę środka obszaru ostrości, w procentach jego szerokości (do środka) lub wysokości (w dół, w górę). Przyciągnij górne narożniki do środka, by uzyskać trapez: więcej ostrej deski, mniej dalekiego planu. Widok ostrości nadal renderuje cały prostokąt, więc koszt się nie zmienia.
en = Cheeky Foveated DLSS
pl = Cheeky Foveated DLSS
en = No Cheeky loader goes in the game folder: Sim-QVFR loads Cheeky’s runtime into the game itself.
pl = Do folderu gry nie trafia loader Cheeky: Sim-QVFR sam wczytuje runtime Cheeky do gry.
en = Frame generation (experimental)
pl = Generowanie klatek (eksperymentalne)
en = Outside the center region frames are warped with the game’s motion. Lower scales use less GPU time and memory. With an eye-tracked focus (the Foveation card) the region follows your eyes too, through Cheeky’s OpenXR layer.
pl = Poza obszarem środkowym klatki są przekształcane zgodnie z ruchem w grze. Niższe skale zużywają mniej czasu GPU i pamięci. Z ostrością śledzoną wzrokiem (karta Foveacja) obszar też podąża za oczami, przez warstwę OpenXR Cheeky.
en = The settings menu stays 0.8 m in front of your head, wherever you look.
pl = Menu ustawień zostaje 0,8 m przed twoją głową, gdziekolwiek patrzysz.
en = Use DLSS
pl = Użyj DLSS
en = Sim-QVFR evaluates NVIDIA’s DLSS on each view, with depth and motion it works out from the game’s own frames, before the game’s post-processing. Needs an NVIDIA RTX graphics card. Sim-QVFR includes NVIDIA’s nvngx_dlss.dll; Choose… takes another (a newer one from a game), Use included goes back.
pl = Sim-QVFR stosuje DLSS od NVIDIA na każdym widoku, z głębią i ruchem wyliczonymi z klatek samej gry, przed postprocessingiem gry. Wymaga karty graficznej NVIDIA RTX. Sim-QVFR zawiera nvngx_dlss.dll od NVIDIA; Wybierz… bierze inny (nowszy z gry), Użyj dołączonego wraca do dołączonego.
en = Use FSR
pl = Użyj FSR
en = Experimental. On a PC without an NVIDIA RTX graphics card, Sim-QVFR evaluates AMD FSR on each view in DLSS’s place, with the same depth and motion: FSR 4 where AMD’s software offers it for your card (Radeon RX 9000, and newer drivers on RX 7000 and 6000), FSR 3.1 elsewhere. Sim-QVFR includes AMD’s FSR files. Tested only as FSR 3.1 on an NVIDIA card so far: tell us how it runs on yours.
pl = Eksperymentalne. Na PC bez karty NVIDIA RTX Sim-QVFR stosuje AMD FSR na każdym widoku zamiast DLSS, z tą samą głębią i ruchem: FSR 4 tam, gdzie oprogramowanie AMD je oferuje dla twojej karty (Radeon RX 9000 oraz nowsze sterowniki na RX 7000 i 6000), w pozostałych przypadkach FSR 3.1. Sim-QVFR zawiera pliki FSR od AMD. Na razie testowane tylko jako FSR 3.1 na karcie NVIDIA: daj znać, jak działa u ciebie.
en = Periphery preset
pl = Ustawienie peryferii
en = Steadier or cheaper DLSS outside the focus area. K: a steadier picture, at a higher cost. F: about half the cost, a little more flicker on edges. With eye tracking you rarely look there, so F is usually fine; with a fixed focus, K.
pl = Stabilniejsze lub tańsze DLSS poza obszarem ostrości. K: stabilniejszy obraz, za wyższą cenę. F: mniej więcej połowa kosztu, trochę więcej migotania na krawędziach. Przy śledzeniu wzroku rzadko tam patrzysz, więc F zwykle wystarczy; przy stałej ostrości K.
en = Texture sharpening
pl = Wyostrzanie tekstur
en = DLSS rebuilds detail from frames drawn at a lower resolution, so textures are best sampled a step sharper while it runs. Sim-QVFR does that through copies of the game’s shaders, in the focus area alone or in the periphery too. Measured gains are modest (most in the periphery and on distant textures). Off at launch, nothing is installed for it; turned on then, it starts at the next launch. Fine patterns may shimmer: then a step lower.
pl = DLSS odtwarza detale z klatek rysowanych w niższej rozdzielczości, więc tekstury najlepiej próbkować o stopień ostrzej, gdy działa. Sim-QVFR robi to przez kopie shaderów gry, tylko w obszarze ostrości albo także w peryferiach. Zmierzone zyski są umiarkowane (najwięcej w peryferiach i na dalekich teksturach). Wyłączone przy starcie: nic nie jest dla niego instalowane; włączone wtedy działa od następnego uruchomienia. Drobne wzory mogą migotać: wtedy stopień niżej.
en = Updates
pl = Aktualizacje
en = Install downloads the release from GitHub, checks it against the SHA-256 GitHub gives, replaces the program files and restarts the launcher; your settings, profiles and changed files stay, and the version you had is kept in the update folder. Download opens the release’s page instead.
pl = Zainstaluj pobiera wydanie z GitHuba, sprawdza je z sumą SHA-256 podaną przez GitHub, zastępuje pliki programu i restartuje launcher; twoje ustawienia, profile i zmienione pliki zostają, a dotychczasowa wersja jest zachowana w folderze update. Pobierz zamiast tego otwiera stronę wydania.
en = These settings reach the game while it runs, as soon as you change them. Without the game running, they apply when it starts.
pl = Te ustawienia docierają do działającej gry od razu po zmianie. Bez działającej gry zostaną zastosowane przy jej starcie.
en = Lowering it reaches a running game at once, and so does raising it back up to what the game started with. Above that, it takes effect at the next launch. With DLSS on in the game, the views keep their launch sizes until the next launch.
pl = Obniżenie dociera do działającej gry od razu, podobnie jak podniesienie z powrotem do wartości z jej startu. Powyżej tego działa od następnego uruchomienia. Z DLSS włączonym w grze widoki zachowują rozmiary ze startu do następnego uruchomienia.
en = These settings take effect the next time the game starts from the launcher. A running game keeps what it started with.
pl = Te ustawienia działają od następnego startu gry z launchera. Działająca gra zachowuje to, z czym wystartowała.
en = The local time on a small card in the headset, apart from the performance overlay: on or off and moved live, here or from the headset menu. It costs next to nothing; it redraws once a minute.
pl = Czas lokalny na małej karcie w goglach, niezależnej od nakładki wydajności: włączany, wyłączany i przesuwany na żywo, tutaj lub z menu w goglach. Kosztuje prawie nic; odświeża się raz na minutę.
en = The performance overlay in the headset: frame rate, CPU and GPU time and what limits the frame. A little CPU time while it shows.
pl = Nakładka wydajności w goglach: liczba klatek, czas CPU i GPU oraz co ogranicza klatkę. Trochę czasu CPU, gdy jest widoczna.
en = Shape
pl = Kształt
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom shape: an outline of up to 10 points you draw on the preview (click the area to add a point, drag one to move it, right-click one to remove it); trace your windscreen, say, then place it with Vertical and Horizontal position. To hide the area’s edge, raise Feather.
pl = Kształt ostrego obszaru. Prostokąt: zaokrąglony Promieniem narożników. Własny kształt: obrys z maksymalnie 10 punktów, który rysujesz na podglądzie (kliknij obszar, aby dodać punkt, przeciągnij, aby go przesunąć, kliknij prawym, aby usunąć); obrysuj np. przednią szybę, a potem ustaw ją Położeniem w pionie i w poziomie. Aby ukryć krawędź obszaru, zwiększ Wygładzenie krawędzi.
en = Outline color
pl = Kolor obrysu
en = The outline’s colour in the headset. It shows while Show focus outline is on.
pl = Kolor obrysu w goglach. Widać go, gdy jest włączone Pokaż obrys ostrości.
en = nvngx_dlss.dll
pl = nvngx_dlss.dll
en = The DLSS Sim-QVFR uses: the one it includes (NVIDIA’s), or another you choose, a newer one from a game, say (DLSS 310 or newer). Use included goes back. Applies at the next launch.
pl = DLSS używane przez Sim-QVFR: dołączone (od NVIDIA) albo inne, które wybierzesz, np. nowsze z gry (DLSS 310 lub nowsze). Użyj dołączonego wraca do niego. Działa od następnego uruchomienia.
en = Focus views
pl = Widoki ostrości
en = DLAA draws them at their size. Ultra quality, Quality, Balanced and Performance draw them at 77, 67, 58 or 50% each way and upscale them: less GPU time, softer distant textures. DLSS has no ultra quality model of its own: 77% runs its quality one.
pl = DLAA rysuje je w ich rozmiarze. Ultra jakość, Jakość, Zrównoważony i Wydajność rysują je w 77, 67, 58 lub 50% w każdym kierunku i skalują w górę: mniej czasu GPU, miększe dalekie tekstury. DLSS nie ma własnego modelu ultra jakości: 77% używa modelu jakości.
en = Focus preset
pl = Ustawienie ostrości
en = The DLSS preset for the sharp focus views. With Sim-QVFR’s DLSS, Default is NVIDIA’s choice for the mode: K, and M at Performance, which costs more. With Cheeky, Game default keeps the game’s.
pl = Ustawienie wstępne DLSS dla ostrych widoków ostrości. Z DLSS od Sim-QVFR Domyślny to wybór NVIDIA dla trybu: K, a M przy Wydajności, co kosztuje więcej. Z Cheeky Domyślny gry zachowuje ustawienie gry.
en = Other cars’ motion
pl = Ruch innych aut
en = Gives DLSS each other car’s own motion, so cars passing, alongside or ahead stay clean instead of smearing. Turn it off for more headroom: in a field of cars it costs about 0.5 ms of CPU and 0.2 to 0.5 ms of GPU a frame. Applies at the next launch, with DLSS on at launch; with DLSS off it costs nothing.
pl = Przekazuje DLSS własny ruch każdego innego auta, więc auta wyprzedzające, obok lub przed tobą są czyste zamiast rozmazanych. Wyłącz dla większego zapasu: w stawce aut kosztuje ok. 0,5 ms CPU i 0,2 do 0,5 ms GPU na klatkę. Działa od następnego uruchomienia, z DLSS włączonym przy starcie; z wyłączonym DLSS nic nie kosztuje.
en = nvngx_dlssnr.dll
pl = nvngx_dlssnr.dll
en = NVIDIA’s DLSS neural rendering runtime. Sim-QVFR includes none: it is NVIDIA’s, and comes only with games that ship DLSS-NR. Choose the one in such a game’s folder. Applies at the next launch.
pl = Runtime neuronowego renderowania DLSS od NVIDIA. Sim-QVFR go nie zawiera: należy do NVIDIA i jest tylko w grach z DLSS-NR. Wybierz ten z folderu takiej gry. Działa od następnego uruchomienia.
en = Use DLSS-NR
pl = Użyj DLSS-NR
en = NVIDIA’s DLSS neural rendering on the views: its model reworks lighting and materials from the picture, its depth and its motion. Experimental, and heavy: about 2 ms of GPU time and 130 MB of video memory for every million pixels it works on, per view (RTX 5070 Ti). It turns itself off if frames fall under 10 a second with it on.
pl = Neuronowe renderowanie DLSS od NVIDIA na widokach: jego model przerabia oświetlenie i materiały na podstawie obrazu, jego głębi i ruchu. Eksperymentalne i ciężkie: ok. 2 ms czasu GPU i 130 MB pamięci wideo na każdy milion przetwarzanych pikseli, na widok (RTX 5070 Ti). Wyłącza się samo, jeśli z nim klatki spadną poniżej 10 na sekundę.
en = Intensity
pl = Intensywność
en = How much of the model’s change you get: 0% is the picture as it came.
pl = Ile zmian modelu dostajesz: 0% to obraz bez zmian.
en = Style
pl = Styl
en = The look the model aims for.
pl = Wygląd, do którego dąży model.
en = Preset
pl = Ustawienie
en = The model: A is the original, B a faster one in newer DLLs (310.9.16 on). Default is the DLL’s own choice. A change rebuilds DLSS-NR: a short stutter.
pl = Model: A to oryginalny, B szybszy w nowszych DLL (od 310.9.16). Domyślny to wybór samego DLL. Zmiana przebudowuje DLSS-NR: krótkie zacięcie.
en = Local tone
pl = Ton lokalny
en = The strength of the model’s local contrast and lighting changes.
pl = Siła zmian lokalnego kontrastu i oświetlenia przez model.
en = Local structure
pl = Struktura lokalna
en = The strength of the model’s changes to fine structure.
pl = Siła zmian drobnej struktury przez model.
en = Auto mask
pl = Maska automatyczna
en = Lets the model find what it treats differently (skin) by itself.
pl = Pozwala modelowi samemu znaleźć to, co traktuje inaczej (skórę).
en = Runs
pl = Kiedy
en = After DLSS works on the finished, anti-aliased views. Before DLSS works on the views as drawn, before anti-aliasing and upscaling: fewer pixels when the focus views are upscaled, and DLSS then smooths its result.
pl = Po: DLSS pracuje na gotowych, wygładzonych widokach. Przed: DLSS pracuje na widokach tak, jak zostały narysowane, przed wygładzaniem krawędzi i skalowaniem: mniej pikseli, gdy widoki ostrości są skalowane, a DLSS potem wygładza swój wynik.
en = Focus working size
pl = Rozmiar roboczy ostrości
en = What the model works at, a share of the focus view. Lower costs less; the picture keeps its own detail.
pl = W jakim rozmiarze pracuje model, jako część widoku ostrości. Mniejszy kosztuje mniej; obraz zachowuje własne detale.
en = Working size limit
pl = Limit rozmiaru roboczego
en = The most one view’s model works on, in megapixels, whatever the sizes. Each megapixel costs about 2 ms of GPU time and 130 MB of video memory, per view.
pl = Najwięcej, na czym pracuje model jednego widoku, w megapikselach, niezależnie od rozmiarów. Każdy megapiksel kosztuje ok. 2 ms czasu GPU i 130 MB pamięci wideo, na widok.
en = Edge blend
pl = Przejście krawędzi
en = The band over which the processed area fades into what isn’t processed around it.
pl = Pas, na którym przetworzony obszar przechodzi w nieprzetworzone otoczenie.
en = Periphery too
pl = Także peryferia
en = Off, only the focus views are processed: where you look. On, the periphery too, at its own working size and coverage. It adds about 2 ms of GPU time per eye at least, however small you make it.
pl = Wyłączone: przetwarzane są tylko widoki ostrości, tam, gdzie patrzysz. Włączone: także peryferia, z własnym rozmiarem roboczym i pokryciem. Dodaje co najmniej ok. 2 ms czasu GPU na oko, nawet przy małych ustawieniach.
en = Periphery working size
pl = Rozmiar roboczy peryferii
en = As the focus working size, for the periphery.
pl = Jak rozmiar roboczy ostrości, dla peryferii.
en = Periphery covered
pl = Pokrycie peryferii
en = How much of each eye’s view the model covers, around the focus area.
pl = Jaką część widoku każdego oka pokrywa model, wokół obszaru ostrości.
en = Foveated DLSS
pl = Foveated DLSS
en = Off leaves the game’s own DLSS on every view.
pl = Wyłączone zostawia własne DLSS gry na każdym widoku.
en = Outer preset
pl = Ustawienie zewnętrzne
en = The DLSS preset of the outer views’ own pass (Cheaper outer views).
pl = Ustawienie wstępne DLSS dla osobnego przebiegu widoków zewnętrznych (Tańsze widoki zewnętrzne).
en = Fix motion-vector blur
pl = Usuń rozmycie wektorów ruchu
en = Cheeky’s workaround for smearing with some presets. Adds GPU work.
pl = Obejście Cheeky na rozmazywanie przy niektórych ustawieniach. Dodaje pracy GPU.
en = DLSS-NR
pl = DLSS-NR
en = NVIDIA’s DLSS-NR (DLSS 5) on the focus views. Needs nvngx_dlssnr.dll next to the game.
pl = DLSS-NR od NVIDIA (DLSS 5) na widokach ostrości. Wymaga nvngx_dlssnr.dll obok gry.
en = DLSS-NR passes
pl = Przebiegi DLSS-NR
en = Each extra DLSS-NR pass costs about one more NR evaluation.
pl = Każdy dodatkowy przebieg DLSS-NR kosztuje mniej więcej jedno obliczenie NR więcej.
en = Multiplier
pl = Mnożnik
en = Frames shown per frame the game renders: 2x adds one generated frame between each two of the game’s.
pl = Klatki wyświetlane na każdą klatkę renderowaną przez grę: 2x dodaje jedną wygenerowaną klatkę między każdymi dwiema klatkami gry.
en = Center FG scale
pl = Skala FG środka
en = Frame generation’s resolution in the center region. Lower uses less GPU time and memory.
pl = Rozdzielczość generowania klatek w obszarze środkowym. Niższa zużywa mniej czasu GPU i pamięci.
en = Periphery FG scale
pl = Skala FG peryferii
en = Frame generation’s resolution around the center region. Lower uses less GPU time and memory.
pl = Rozdzielczość generowania klatek wokół obszaru środkowego. Niższa zużywa mniej czasu GPU i pamięci.
en = Release game
pl = Zwolnienie gry
en = When the game starts its next frame. Never: CPU and GPU overlap (most frames). Capture: after the GPU finishes. Generated: after the generated frame.
pl = Kiedy gra zaczyna następną klatkę. Nigdy: CPU i GPU pracują równolegle (większość klatek). Przechwycona: po zakończeniu pracy GPU. Wygenerowana: po wygenerowanej klatce.
en = Show the center region
pl = Pokaż obszar środkowy
en = Outlines the region in the headset, to check that it follows your eyes.
pl = Obrysowuje obszar w goglach, by sprawdzić, czy podąża za oczami.
en = Rim
pl = Obrzeże
en = How far the helmet’s padding reaches into the view.
pl = Jak daleko wyściółka kasku sięga w widok.
en = Corners
pl = Narożniki
en = Rounds the helmet’s visor opening.
pl = Zaokrągla otwór wizjera kasku.
en = Lighting
pl = Oświetlenie
en = How much the scene lights the helmet.
pl = Jak mocno scena oświetla kask.
en = Visor
pl = Wizjer
en = Your own images only: closed, half or open. Ctrl+Alt+V in the game steps it.
pl = Tylko własne obrazy: zamknięty, w połowie lub otwarty. Ctrl+Alt+V w grze go przełącza.
en = Depth
pl = Głębia
en = Your own images only: how far in front of your eyes, in cm. 0 is far away, with no depth.
pl = Tylko własne obrazy: jak daleko przed oczami, w cm. 0 to daleko, bez głębi.
en = Detail
pl = Szczegółowość
en = Your own images only: Detail (4096) is sharper, Performance (2048) costs less GPU time and memory.
pl = Tylko własne obrazy: Szczegółowość (4096) jest ostrzejsza, Wydajność (2048) kosztuje mniej czasu GPU i pamięci.
en = Degrees right of straight ahead. Negative is left. Drag it in Placement, or move it in the headset.
pl = Stopnie w prawo od kierunku na wprost. Ujemne to w lewo. Przeciągnij w Położeniu albo przesuń w goglach.
en = Degrees above eye level. Negative is below. Drag it in Placement, or move it in the headset.
pl = Stopnie powyżej poziomu oczu. Ujemne to poniżej. Przeciągnij w Położeniu albo przesuń w goglach.
en = How wide it is, in degrees of your view.
pl = Jak jest szeroki, w stopniach twojego pola widzenia.
en = A line under the headset menu with the in-game hotkeys (overlay, visor, CPU capture) and their wheel buttons, as set in Hotkeys. Also on the menu’s Headset page.
pl = Wiersz pod menu w goglach ze skrótami w grze (nakładka, wizjer, przechwytywanie CPU) i ich przyciskami na kierownicy, jak ustawiono w Skrótach klawiszowych. Także na stronie Gogle w menu.
en = Open or close
pl = Otwórz lub zamknij
en = Opens the headset menu, or closes it.
pl = Otwiera menu w goglach lub je zamyka.
en = Up
pl = W górę
en = Selects the line above in the headset menu.
pl = Wybiera wiersz powyżej w menu w goglach.
en = Down
pl = W dół
en = Selects the line below in the headset menu.
pl = Wybiera wiersz poniżej w menu w goglach.
en = Left
pl = Lewo
en = Lowers the selected value in the headset menu.
pl = Zmniejsza wybraną wartość w menu w goglach.
en = Right
pl = Prawo
en = Raises the selected value in the headset menu.
pl = Zwiększa wybraną wartość w menu w goglach.
en = Overlay
pl = Nakładka
en = Turns the performance overlay on or off.
pl = Włącza lub wyłącza nakładkę wydajności.
en = Helmet visor
pl = Wizjer kasku
en = Steps the helmet’s visor: closed, half, open.
pl = Przełącza wizjer kasku: zamknięty, w połowie, otwarty.
en = Helmet images
