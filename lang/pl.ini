en = Custom corners pulls each corner of the focus area in, e.g. the top ones for a trapezoid
pl = Własne narożniki przesuwają każdy narożnik obszaru ostrości do środka, np. górne dla trapezu
en = The cut corners aren't rendered: the shape saves pixels too
pl = Ucięte narożniki nie są renderowane: kształt też oszczędza piksele
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High. The switches below stay as you set them. Low costs about half the GPU time of High and looks a little grainier; the periphery always runs one step below the focus area, where it's least seen.
pl = Jak dokładnie liczone są efekty: na Niskiej mniej próbek i kroków dla cieni, okluzji i wygładzania, na Wysokiej wszystkie. Przełączniki poniżej zostają tak, jak je ustawisz. Niska kosztuje mniej więcej połowę czasu GPU Wysokiej i wygląda nieco ziarniściej; peryferia zawsze działają o stopień niżej niż obszar ostrości, gdzie najmniej je widać.
en = Quality sets how finely each effect is worked out, not which are on: Low costs about half the GPU time of High. Night car lighting itself starts at the next launch; everything else changes while you drive.
pl = Jakość określa, jak dokładnie liczony jest każdy efekt, a nie które są włączone: Niska kosztuje mniej więcej połowę czasu GPU Wysokiej. Samo nocne oświetlenie aut zaczyna działać przy następnym uruchomieniu; wszystko inne zmienia się podczas jazdy.
en = Sets the switches below by their GPU cost: Low keeps paint detail, lacquer reflections and headlight highlights, Medium adds shadows on the ground, High adds floodlight shadows. Night vision color isn't part of it. Changing any switch yourself shows no preset selected.
pl = Ustawia przełączniki poniżej według kosztu GPU: Niska zachowuje detal lakieru, odbicia lakieru i połyski świateł, Średnia dodaje cienie na podłożu, Wysoka dodaje cienie reflektorów. Kolor widzenia nocnego nie jest jej częścią. Gdy sam zmienisz przełącznik, żaden preset nie jest zaznaczony.
en = Custom: the switches below don’t match a preset.
pl = Własne: przełączniki poniżej nie pasują do żadnego presetu.
en = Low, Medium and High set the switches by their GPU cost; night vision is left as you set it. Night car lighting itself starts at the next launch; everything else changes while you drive.
pl = Niska, Średnia i Wysoka ustawiają przełączniki według kosztu GPU; widzenie nocne zostaje tak, jak je ustawisz. Samo nocne oświetlenie aut startuje od następnego uruchomienia; wszystko inne zmienia się podczas jazdy.
