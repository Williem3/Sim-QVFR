; No longer in Sim-QVFR (kept to reuse; ignored where the English isn't shown any more):
en = The focus area renders in full detail only along the road ahead: about 10 m either side of the road and 3.5 m above it, following its hills and bends. Trees, grandstands, hills and the sky beside and above that come from the periphery’s image, as does the cockpit; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. Turn it off if something beside the road looks softer than you want. Changes while you drive.
pl = Obszar ostrości jest renderowany w pełnej szczegółowości tylko wzdłuż drogi przed tobą: około 10 m po obu stronach drogi i 3,5 m nad nią, zgodnie z jej wzniesieniami i zakrętami. Drzewa, trybuny, wzgórza i niebo obok i powyżej pochodzą z obrazu peryferii, podobnie jak kokpit; tam, gdzie patrzysz podczas jazdy, nie powinieneś widzieć różnicy. Oszczędza czas GPU, tym więcej, im większy obszar ostrości. Wyłącz, jeśli coś obok drogi wygląda dla ciebie zbyt miękko. Zmienia się w trakcie jazdy.
en = DLAA on the road only
pl = DLAA tylko na drodze
en = With Road focus and Sim-QVFR’s DLSS on: the focus area’s DLAA runs only over the rows the road covers, the rest takes the periphery’s DLAA. It saves more GPU time. Turn it off if you see a soft strip above or below the road for a moment when you look up or down quickly. Changes while you drive.
pl = Z włączoną ostrością na drodze i DLSS Sim-QVFR: DLAA obszaru ostrości działa tylko na wierszach, które zajmuje droga, reszta bierze DLAA peryferii. Oszczędza jeszcze więcej czasu GPU. Wyłącz, jeśli przy szybkim spojrzeniu w górę lub w dół przez chwilę widzisz miękki pas nad drogą lub pod nią. Zmienia się w trakcie jazdy.
en = Full detail along the road ahead; the scenery beside and above it from the periphery.
pl = Pełna szczegółowość wzdłuż drogi przed tobą; otoczenie obok i powyżej z peryferii.
en = With Sim-QVFR’s DLSS on: the focus area’s DLAA over the road’s rows alone.
pl = Z włączonym DLSS Sim-QVFR: DLAA obszaru ostrości tylko na wierszach drogi.
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom corners: each corner moved in on its own; pull the top corners in for a trapezoid, more of the dash sharp at the same cost. To hide the area’s edge, raise Feather.
pl = Kształt ostrego obszaru. Prostokąt: zaokrąglony przez Promień narożników. Własne narożniki: każdy narożnik przesuwany osobno; przyciągnij górne do środka, by uzyskać trapez, więcej ostrej deski za ten sam koszt. Aby ukryć brzeg obszaru, zwiększ Wygładzenie krawędzi.
