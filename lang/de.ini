en = With the runtime composing the views (Pimax, Varjo), the focus area shows only inside its own focus region; past it, the outer resolution shows. Make the runtime's focus area larger (Pimax Play, Varjo Base), or Sim-QVFR's no larger than it, in Resolution.
de = Setzt die Runtime die Ansichten zusammen (Pimax, Varjo), erscheint der Fokusbereich nur innerhalb ihres eigenen Fokusbereichs; darüber hinaus zeigt sich die äußere Auflösung. Vergrößere den Fokusbereich der Runtime (Pimax Play, Varjo Base) oder mach den von Sim-QVFR unter Auflösung nicht größer.
en = VRAM was nearly full ({percent}% of what Windows allows the game)
de = VRAM war fast voll ({percent}% dessen, was Windows dem Spiel erlaubt)
en = Stutter and hitches follow when it runs out. Lower the outer resolution or the focus density, or the game's texture quality.
de = Läuft er voll, folgen Ruckler und Hänger. Senke die äußere Auflösung, die Fokusdichte oder die Texturqualität des Spiels.
en = OpenXR Toolkit is loaded under Sim-QVFR
de = OpenXR Toolkit ist unter Sim-QVFR geladen
en = It adds about 0.8 ms to every frame's submission. If you don't use it for this game, switch it off in OpenXR layers.
de = Es kostet etwa 0,8 ms bei der Übergabe jedes Frames. Wenn du es für dieses Spiel nicht nutzt, schalte es unter OpenXR-Layer aus.
en = The GPU was busy all the time ({percent}%)
de = Die GPU war ständig ausgelastet ({percent}%)
en = This is the GPU's limit. Lower the outer resolution or the focus density, or the game's graphics settings.
de = Das ist die Grenze der GPU. Senke die äußere Auflösung, die Fokusdichte oder die Grafikeinstellungen des Spiels.
en = The game's CPU work limited the frame rate
de = Die CPU-Last des Spiels begrenzte die Bildrate
en = QVFR lowers the GPU's work, not the CPU's. Lower the game's CPU-heavy settings (opponents, mirrors, shadows).
de = QVFR senkt die Last der GPU, nicht die der CPU. Senke die CPU-lastigen Einstellungen des Spiels (Gegner, Spiegel, Schatten).
en = The headset runtime ran the game at half rate for {percent}% of the session
de = Die Headset-Runtime ließ das Spiel {percent}% der Sitzung mit halber Rate laufen
en = When frames come close to the budget, the runtime's motion smoothing halves the frame rate for a few seconds (Varjo does this). Turn motion smoothing off in the runtime's software (Varjo Base) to compare, and give the CPU room: lower the game's CPU-heavy settings (opponents, mirrors, shadows).
de = Kommen die Frames nah ans Zeitbudget, halbiert die Bewegungsglättung der Runtime die Bildrate für einige Sekunden (Varjo macht das). Schalte die Bewegungsglättung zum Vergleich in der Software der Runtime (Varjo Base) aus und gib der CPU Luft: Senke die CPU-lastigen Einstellungen des Spiels (Gegner, Spiegel, Schatten).
en = {percent}% of frames were late with neither the CPU nor the GPU full
de = {percent}% der Frames kamen zu spät, obwohl weder CPU noch GPU ausgelastet waren
en = Often something else in the chain: another OpenXR layer, an overlay, or the runtime's motion smoothing. Try with them off.
de = Oft liegt es an etwas anderem in der Kette: einem weiteren OpenXR-Layer, einem Overlay oder der Bewegungsglättung der Runtime. Probier es ohne sie.

