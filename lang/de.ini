; src/launcher/ui/help.cpp
en = Rendering method
de = Rendermethode
en = Quad View Foveated Rendering draws the outer and focus views in one game frame: the lightest on the CPU, and the one with every feature. Two-loop (legacy) draws two whole game frames per headset frame: about twice the CPU work per frame, and no frame generation.
de = Quad View Foveated Rendering zeichnet die äußeren Ansichten und die Fokusansichten in einem Spiel-Frame: am leichtesten für die CPU und mit allen Funktionen. Two-loop (alt) zeichnet zwei ganze Spiel-Frames pro Headset-Frame: etwa doppelte CPU-Last pro Frame und keine Frame Generation.
en = Foveated mode
de = Foveation-Modus
en = Eye tracked: the sharp area follows your eyes, so it can be small and dense; it needs a headset with eye tracking. Fixed: the area stays in the centre, so make it larger, since your eyes move off it.
de = Mit Eye-Tracking: Der scharfe Bereich folgt deinen Augen, kann also klein und dicht sein; das braucht ein Headset mit Eye-Tracking. Fest: Der Bereich bleibt in der Mitte, also mach ihn größer, da deine Augen ihn verlassen.
en = Periphery resolution
de = Auflösung der Peripherie
en = The wide view around the focus area, a share of the headset’s recommended resolution. It covers most of the view but you see it with your side vision, so it is the first to lower: it saves GPU time and VRAM roughly with its pixels. The preview’s Pixels per frame shows the total.
de = Die weite Ansicht um den Fokusbereich, als Anteil der empfohlenen Auflösung des Headsets. Sie deckt den Großteil der Sicht ab, aber du siehst sie aus dem Augenwinkel, also senkst du sie zuerst: Sie spart GPU-Zeit und VRAM etwa im Verhältnis ihrer Pixel. „Pixel pro Frame“ in der Vorschau zeigt die Summe.
en = Focus density
de = Fokusdichte
en = Pixel density inside the focus area, a share of the headset’s native density. Above 100% it renders more pixels than the headset shows where you look: sharper text and edges. Its cost grows with the area’s size, so a small area can take a high density cheaply. Dragging moves it in 5% steps; the arrow keys move it by 1%.
de = Pixeldichte im Fokusbereich, als Anteil der nativen Dichte des Headsets. Über 100% rendert es dort, wo du hinsiehst, mehr Pixel, als das Headset zeigt: schärfere Schrift und Kanten. Die Kosten wachsen mit der Größe des Bereichs, ein kleiner Bereich verträgt also günstig eine hohe Dichte. Ziehen ändert sie in 5%-Schritten, die Pfeiltasten um 1%.
en = Object detail
de = Objektdetails
en = How detailed trees and objects are, and how far away they are still drawn. At 100% they are as sharp in the focus region as its pixel density shows them; lower settings move toward the game’s own detail for the periphery resolution. It costs CPU, not GPU: more detail means more objects for X-Plane’s main thread to prepare every frame, often what limits the frame rate with QVFR. Lower it if frames stutter in dense scenery; the focus region shows coarser trees.
de = Wie detailliert Bäume und Objekte sind und wie weit entfernt sie noch gezeichnet werden. Bei 100% sind sie im Fokusbereich so scharf, wie seine Pixeldichte sie zeigt; niedrigere Werte nähern sich dem eigenen Detail des Spiels für die Auflösung der Peripherie. Das kostet CPU, nicht GPU: Mehr Details bedeuten mehr Objekte, die der Hauptthread von X-Plane jeden Frame vorbereiten muss, was mit QVFR oft die Bildrate begrenzt. Senke es, wenn es in dichter Szenerie ruckelt; der Fokusbereich zeigt dann gröbere Bäume.
en = For a player who sees with one eye. The eye you choose shows black in the headset, and the game draws no focus view for it, renders only a few pixels of its scene and skips DLSS on it, so the GPU does much less. The game still prepares that eye’s frame, so the CPU saves little. With both eyes seeing, a black eye is uncomfortable: leave it at None.
de = Für Spieler, die mit einem Auge sehen. Das gewählte Auge zeigt im Headset Schwarz, und das Spiel zeichnet dafür keine Fokusansicht, rendert nur wenige Pixel seiner Szene und lässt DLSS dafür weg, die GPU hat also viel weniger zu tun. Das Spiel bereitet den Frame dieses Auges trotzdem vor, die CPU spart also wenig. Wer mit beiden Augen sieht, empfindet ein schwarzes Auge als unangenehm: Lass es auf „Keine“.
en = Sharpening
de = Schärfung
en = Crisper edges and text in the focus area; too much makes it shimmer. Raise it a little if the view looks soft (0% is off); it costs a little GPU time and changes while you drive. How: AMD FidelityFX Contrast Adaptive Sharpening, applied as Sim-QVFR resamples the focus view for the headset. Each pixel is sharpened by how much contrast room it has, so soft detail gains the most and edges already sharp gain little. The percentage is CAS’s own sharpness, as other CAS sharpeners show it: any setting above 0% already sharpens. Only the focus area is sharpened, fading out across its feather so its edge stays even: your side vision sees shimmer more than detail. 0% is off; it changes while you drive.
de = Schärfere Kanten und Schrift im Fokusbereich; zu viel lässt ihn flimmern. Erhöhe sie etwas, wenn die Sicht weich wirkt (0% ist aus); sie kostet etwas GPU-Zeit und ändert sich während der Fahrt. So geht es: AMD FidelityFX Contrast Adaptive Sharpening, angewendet, wenn Sim-QVFR die Fokusansicht für das Headset neu abtastet. Jeder Pixel wird danach geschärft, wie viel Kontrastspielraum er hat, weiche Details gewinnen also am meisten und schon scharfe Kanten wenig. Der Prozentwert ist die Schärfe von CAS selbst, wie andere CAS-Schärfer sie anzeigen: Jeder Wert über 0% schärft bereits. Nur der Fokusbereich wird geschärft, auslaufend über seine weiche Kante, damit sein Rand gleichmäßig bleibt: Aus dem Augenwinkel siehst du Flimmern eher als Details. 0% ist aus; sie ändert sich während der Fahrt.
en = Periphery texture match
de = Texturangleich der Peripherie
en = Makes fences, nets and other see-through surfaces look the same in your side vision as in the focus area. At the periphery’s lower resolution the game blends them into a light solid shade, so the focus area looked darker behind them. At 100% the periphery reads its textures at the same detail level as the focus area; lower it if distant textures shimmer in your side vision. 0% is off (the game’s own); it changes while you drive.
de = Zäune, Netze und andere durchsichtige Flächen sehen im Augenwinkel so aus wie im Fokusbereich. Bei der niedrigeren Auflösung der Peripherie verschmilzt das Spiel sie zu einer hellen, geschlossenen Fläche, sodass der Fokusbereich dahinter dunkler wirkte. Bei 100% liest die Peripherie ihre Texturen in derselben Detailstufe wie der Fokusbereich; verringere den Wert, wenn entfernte Texturen im Augenwinkel flimmern. 0% ist aus (wie im Spiel); er ändert sich während der Fahrt.
en = Night car lighting
de = Nachtbeleuchtung der Autos
en = Adds highlights and shading to the cars at night. Sim-QVFR relights each car after the game draws it, before the game's own post-processing: highlights where the floodlights and headlights reflect off the paint, shading in creases and under the car, and the effects below. The rest of the scene is untouched. It costs about 0.5 to 1 ms of GPU time with everything on. The switch takes effect at the next launch; the values and effects change while you drive.
de = Gibt den Autos nachts Glanzlichter und Schattierung. Sim-QVFR beleuchtet jedes Auto neu, nachdem das Spiel es gezeichnet hat und bevor die eigene Nachbearbeitung des Spiels läuft: Glanzlichter dort, wo sich Flutlicht und Scheinwerfer im Lack spiegeln, Schattierung in Falten und unter dem Auto sowie die Effekte unten. Der Rest der Szene bleibt unberührt. Mit allem an kostet es etwa 0,5 bis 1 ms GPU-Zeit. Der Schalter gilt ab dem nächsten Start; die Werte und Effekte ändern sich während der Fahrt.
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High. The switches below stay as you set them. Low takes about a third less GPU time than High and looks a little grainier; the periphery always runs one step below the focus area, where it's least seen.
de = Wie fein die Effekte berechnet werden: bei Niedrig weniger Abtastungen und Schritte für Schatten, Verdeckung und Glättung, bei Hoch alle. Die Schalter darunter bleiben, wie du sie gesetzt hast. Niedrig braucht etwa ein Drittel weniger GPU-Zeit als Hoch und wirkt etwas körniger; die Peripherie läuft immer eine Stufe unter dem Fokusbereich, wo sie am wenigsten auffällt.
en = Fill light
de = Aufhelllicht
en = How much of the game's own floodlight lighting stays on the cars. Lower makes the shading and highlights stand out more; 100% keeps the game's brightness.
de = Wie viel vom eigenen Flutlicht des Spiels auf den Autos bleibt. Niedriger lässt Schattierung und Glanzlichter stärker hervortreten; 100 % behält die Helligkeit des Spiels.
en = Ambient occlusion
de = Umgebungsverdeckung
en = Darkens creases, wheel arches and the underside, where light reaches less. 0% is off.
de = Dunkelt Falten, Radhäuser und die Unterseite ab, wo weniger Licht hinkommt. 0 % ist aus.
en = Highlights
de = Glanzlichter
en = The strength of the floodlights' and headlights' reflections on the paint. 0% is off; above 100% is brighter than the lights would make it.
de = Die Stärke der Reflexe von Flutlichtern und Scheinwerfern auf dem Lack. 0 % ist aus; über 100 % ist heller, als die Lichter es machen würden.
en = Paint gloss
de = Lackglanz
en = How glossy the lacquer is: higher gives smaller, sharper highlights, lower broad soft ones.
de = Wie glänzend der Lack ist: höher ergibt kleinere, schärfere Glanzlichter, niedriger breite, weiche.
en = Smoothing
de = Glättung
en = Smooths the surface direction over this distance where the game's own normals aren't available, which hides faceted highlights on low-polygon parts. About 15 cm suits most cars; 0 is off.
de = Glättet die Flächenrichtung über diese Distanz, wo die Normalen des Spiels nicht verfügbar sind. Das verbirgt kantige Glanzlichter an Teilen mit wenigen Polygonen. Etwa 15 cm passen für die meisten Autos; 0 ist aus.
en = Floodlight shadows
de = Flutlichtschatten
en = A part of a car hidden from a floodlight, behind a wing or another car, loses that light and its highlight.
de = Ein Teil eines Autos, der vor einem Flutlicht verdeckt ist, etwa hinter einem Flügel oder einem anderen Auto, verliert dieses Licht und seinen Glanzpunkt.
en = Paint detail
de = Lackdetail
en = Uses the paint's fine surface detail, orange peel and the carbon weave, in the highlights.
de = Nutzt in den Glanzlichtern das feine Oberflächendetail des Lacks, die Orangenhaut und das Carbongewebe.
en = Lacquer reflections
de = Lackspiegelungen
en = Mirrors what's around a car in its paint, strongest at shallow angles. Only what's on screen can be reflected, and only where both eyes can see it, so both eyes show the same.
de = Spiegelt die Umgebung eines Autos in seinem Lack, am stärksten in flachen Winkeln. Es kann nur gespiegelt werden, was auf dem Bildschirm ist und nur dort, wo beide Augen es sehen, damit beide Augen dasselbe zeigen.
en = Headlight highlights
de = Scheinwerferlichter
en = Other cars' headlights, and yours in the mirrors, shine on the paint as the floodlights do.
de = Die Scheinwerfer anderer Autos, und deine in den Spiegeln, scheinen auf den Lack wie die Flutlichter.
en = Shadows on the ground
de = Schatten am Boden
en = Darkens the track and walls under and beside the cars, and casts soft floodlight shadows, so the cars sit on the ground.
de = Dunkelt Strecke und Wände unter und neben den Autos ab und wirft weiche Flutlichtschatten, damit die Autos auf dem Boden stehen.
en = Night vision color
de = Nachtsicht-Farbe
en = As eyes do at night, dark areas lose their colour and turn slightly blue while lit areas keep theirs. A matter of taste, off by default.
de = Wie die Augen bei Nacht verlieren dunkle Bereiche ihre Farbe und werden leicht blau, während beleuchtete Bereiche ihre behalten. Geschmackssache, standardmäßig aus.
en = Color correction
de = Farbkorrektur
en = Adjusts the picture in the headset: exposure, brightness, contrast and saturation, for a game that looks too dark, washed out or dull in your headset. Sim-QVFR applies it as it composes the views, the periphery and the focus area alike, so the focus area never stands out; it costs almost no GPU time and changes while you drive. Menus and loading screens show as the game draws them. Off, or every value at 0, leaves the picture as it was.
de = Passt das Bild im Headset an: Belichtung, Helligkeit, Kontrast und Sättigung, für ein Spiel, das in deinem Headset zu dunkel, blass oder fade aussieht. Sim-QVFR wendet es beim Zusammensetzen der Ansichten an, auf Peripherie und Fokusbereich gleichermaßen, sodass der Fokusbereich nie heraussticht; es kostet fast keine GPU-Zeit und ändert sich während der Fahrt. Menüs und Ladebildschirme erscheinen so, wie das Spiel sie zeichnet. Aus oder mit allen Werten auf 0 bleibt das Bild, wie es war.
en = Exposure
de = Belichtung
en = Scales all of the light, in stops (EV): +1.0 EV is twice as bright, -1.0 EV half, up to 3 stops either way. Highlights brighten with the rest and can clip, so raise it a little at a time; Brightness lifts the darks without touching them.
de = Skaliert das gesamte Licht in Blendenstufen (EV): +1,0 EV ist doppelt so hell, -1,0 EV halb so hell, bis zu 3 Stufen in beide Richtungen. Glanzlichter werden mit dem Rest heller und können ausbrennen, also erhöhe es nur etwas auf einmal; Helligkeit hebt die dunklen Töne an, ohne sie zu berühren.
en = Brightness
de = Helligkeit
en = Lightens or darkens the mid tones and shadows while black stays black and white stays white, so an OLED headset keeps its deep blacks: raise it to see into dark cockpits and night stints, lower it for a richer, darker picture.
de = Hellt Mitteltöne und Schatten auf oder dunkelt sie ab, während Schwarz schwarz und Weiß weiß bleibt, sodass ein OLED-Headset sein tiefes Schwarz behält: erhöhe es, um in dunkle Cockpits und Nachtstints hineinzusehen, senke es für ein satteres, dunkleres Bild.
en = Contrast
de = Kontrast
en = Spreads the picture’s tones away from mid grey (above 0) or draws them towards it (below 0), as a gentle S-curve: black and white stay where they are and colours keep their hue. More contrast gives deeper shadows and brighter highlights; less shows more detail in both.
de = Spreizt die Töne des Bildes vom mittleren Grau weg (über 0) oder zieht sie dorthin zusammen (unter 0), als sanfte S-Kurve: Schwarz und Weiß bleiben, wo sie sind, und die Farben behalten ihren Farbton. Mehr Kontrast ergibt tiefere Schatten und hellere Glanzlichter; weniger zeigt in beiden mehr Detail.
en = Saturation
de = Sättigung
en = How strong the colours are: above 0 more vivid, below 0 more muted, -100% grey. Brightness is kept as each colour changes.
de = Wie kräftig die Farben sind: über 0 lebhafter, unter 0 gedämpfter, -100 % grau. Die Helligkeit bleibt erhalten, während sich jede Farbe ändert.
en = Accent brightness
de = Akzenthelligkeit
en = How light or dark the game’s colour is. The wheel picks its hue and how strong it is; the launcher keeps its text and edges readable in light and dark mode.
de = Wie hell oder dunkel die Farbe des Spiels ist. Das Farbrad wählt Farbton und Stärke; der Launcher hält Schrift und Ränder im hellen und dunklen Modus lesbar.
en = Focus width
de = Fokusbreite
en = The focus area’s width, a share of the view. Wider hides the edge between sharp and soft better; its pixels cost density × width × height, so a wide area at a high density costs the most. It changes while you drive; wider than the game started with (at your density) renders less dense until the next launch.
de = Die Breite des Fokusbereichs, als Anteil der Ansicht. Breiter versteckt die Kante zwischen scharf und weich besser; seine Pixel kosten Dichte × Breite × Höhe, ein breiter Bereich mit hoher Dichte kostet also am meisten. Sie ändert sich während der Fahrt; breiter als beim Spielstart (bei deiner Dichte) rendert bis zum nächsten Start weniger dicht.
en = Focus height
de = Fokushöhe
en = The focus area’s height, a share of the view. Taller covers more of the dash and mirrors; it costs pixels as the width does. Taller than the game started with (at your density) renders less dense until the next launch.
de = Die Höhe des Fokusbereichs, als Anteil der Ansicht. Höher deckt mehr vom Armaturenbrett und den Spiegeln ab; sie kostet Pixel wie die Breite. Höher als beim Spielstart (bei deiner Dichte) rendert bis zum nächsten Start weniger dicht.
en = Corner radius
de = Eckenradius
en = Rounds the focus area’s corners, so its edge is harder to spot. No cost: the area renders as a rectangle either way.
de = Rundet die Ecken des Fokusbereichs, damit sein Rand schwerer auffällt. Kostenlos: Der Bereich wird ohnehin als Rechteck gerendert.
en = Feather
de = Weiche Kante
en = The band where the focus area blends into the outer view. Wider hides the edge better; no measurable cost.
de = Der Streifen, in dem der Fokusbereich in die äußere Ansicht übergeht. Breiter versteckt den Rand besser; keine messbaren Kosten.
en = Gaze dead-zone
de = Blick-Totzone
en = How far your eyes move before the focus area follows. A little keeps it still against eye-tracker noise; too much makes it lag when you look around. No GPU cost.
de = Wie weit sich deine Augen bewegen, bevor der Fokusbereich folgt. Etwas davon hält ihn trotz Rauschen des Eye-Trackers ruhig; zu viel lässt ihn beim Umsehen hinterherhinken. Keine GPU-Kosten.
en = Gaze offset
de = Blickversatz
en = Moves the eye-tracked focus area up or down, in degrees, for a tracker that sits a little off. No cost.
de = Verschiebt den Fokusbereich mit Eye-Tracking nach oben oder unten, in Grad, für einen Tracker, der etwas daneben liegt. Kostenlos.
en = Vertical position
de = Vertikale Position
en = Moves the fixed focus area up or down, in degrees: towards the dash and mirrors, or the road. No cost.
de = Verschiebt den festen Fokusbereich nach oben oder unten, in Grad: zum Armaturenbrett und den Spiegeln oder zur Straße. Kostenlos.
en = Crop the view
de = Ansicht beschneiden
en = Cuts the edges a helmet or the lens hides before the game renders them. It saves GPU time and VRAM with the pixels cut; the headset shows black there.
de = Schneidet die Ränder, die ein Helm oder die Linse verdeckt, weg, bevor das Spiel sie rendert. Spart GPU-Zeit und VRAM im Verhältnis der weggeschnittenen Pixel; das Headset zeigt dort Schwarz.
en = Top
de = Oben
en = How much of the top of each eye’s view the game doesn’t render. Saves pixels in proportion.
de = Wie viel vom oberen Rand jeder Augenansicht das Spiel nicht rendert. Spart anteilig Pixel.
en = Bottom
de = Unten
en = How much of the bottom of each eye’s view the game doesn’t render. Saves pixels in proportion.
de = Wie viel vom unteren Rand jeder Augenansicht das Spiel nicht rendert. Spart anteilig Pixel.
en = Outer side (temple)
de = Außenseite (Schläfe)
en = How much of each eye’s temple side the game doesn’t render. Saves pixels in proportion.
de = Wie viel von der Schläfenseite jedes Auges das Spiel nicht rendert. Spart anteilig Pixel.
en = Inner side (nose)
de = Innenseite (Nase)
en = How much of each eye’s nose side the game doesn’t render; the other eye still sees most of it. Saves pixels in proportion.
de = Wie viel von der Nasenseite jedes Auges das Spiel nicht rendert; das andere Auge sieht das meiste davon trotzdem. Spart anteilig Pixel.
en = Show a helmet
de = Helm zeigen
en = Draws a helmet’s visor opening round the view, lit by the scene, in a layer of its own. It costs the headset a layer to composite; nothing for the game.
de = Zeichnet die Visieröffnung eines Helms um die Ansicht, von der Szene beleuchtet, in einer eigenen Ebene. Kostet das Headset eine Ebene beim Zusammensetzen; das Spiel nichts.
en = Road focus
de = Straßenfokus
en = For fixed foveation. The focus area renders in full detail only along the road ahead (Road width either side of it and 3.5 m above it, following its hills and bends) and in your own car: the wheel, dash, displays and mirrors inside the focus area stay sharp. Trees, grandstands, hills and the sky beside and above the road come from the periphery’s image; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. It’s off while the focus follows your eyes. Turn it off if something beside the road looks softer than you want. Changes while you drive.
de = Für feste Foveation. Der Fokusbereich wird nur entlang der Straße vor dir in voller Detailtiefe gerendert (Straßenbreite beiderseits davon und 3,5 m darüber, ihren Kuppen und Kurven folgend) und in deinem eigenen Auto: Lenkrad, Armaturenbrett, Displays und Spiegel im Fokusbereich bleiben scharf. Bäume, Tribünen, Hügel und Himmel neben und über der Straße kommen aus dem Bild der Peripherie; dort, wo du beim Fahren hinsiehst, solltest du keinen Unterschied sehen. Es spart GPU-Zeit, mehr bei einem größeren Fokusbereich. Es ist aus, solange der Fokus deinen Augen folgt. Schalte es aus, wenn dir etwas neben der Straße zu weich aussieht. Ändert sich während der Fahrt.
en = Road width
de = Straßenbreite
en = How far either side of the road’s centre stays in full detail with Road focus on. Lower keeps just the track sharp and saves the most; higher brings the kerbs, run-off and barriers into the focus area and saves less. 10 m suits most circuits. Changes while you drive.
de = Wie weit beiderseits der Straßenmitte bei eingeschaltetem Straßenfokus volle Details bleiben. Niedriger hält nur die Strecke scharf und spart am meisten; höher holt Randsteine, Auslaufzonen und Leitplanken in den Fokusbereich und spart weniger. 10 m passen für die meisten Strecken. Ändert sich während der Fahrt.
en = Cockpit preset
de = Cockpit-Vorlage
en = The focus area’s shape, size and position Road focus sets when you switch it on, or at once when you pick the other one here. A: a large cockpit shape over the windscreen, dash and wheel. B: a smaller one moved down to the road and the dash. Adjust either afterwards as you like; your own shape, size and position come back when you switch Road focus off. When the headset composes the views itself, the size stays inside its own focus region and the position doesn’t apply.
de = Form, Größe und Lage des Fokusbereichs, die der Straßenfokus beim Einschalten setzt, oder sofort, wenn du hier die andere wählst. A: eine große Cockpitform über Windschutzscheibe, Armaturenbrett und Lenkrad. B: eine kleinere, nach unten auf Straße und Armaturenbrett verschoben. Passe danach beide nach Belieben an; deine eigene Form, Größe und Lage kommen zurück, wenn du den Straßenfokus ausschaltest. Wenn das Headset die Ansichten selbst zusammensetzt, bleibt die Größe in seinem eigenen Fokusbereich und die Lage gilt nicht.
en = Road widening
de = Straßenverbreiterung
en = How much Road focus’s sharp road widens with distance, in degrees either side, so a bend curving away far ahead (Eau Rouge, a hairpin, the pit exit) stays in full detail. Lower saves more, but a far bend can turn soft; higher catches tighter bends and brings more of the far scenery into the focus area, saving less. 15° suits most circuits. Changes while you drive.
de = Wie stark sich die scharfe Straße des Straßenfokus mit der Entfernung verbreitert, in Grad zu jeder Seite, damit eine Kurve, die weit vorne abbiegt (Eau Rouge, eine Haarnadel, die Boxenausfahrt), in vollen Details bleibt. Niedriger spart mehr, aber eine ferne Kurve kann unscharf werden; höher erfasst engere Kurven und holt mehr ferne Landschaft in den Fokusbereich, spart also weniger. 15° passen für die meisten Strecken. Ändert sich während der Fahrt.
en = Road edge blend
de = Straßenrand-Übergang
en = How softly Road focus’s full detail fades into the periphery at its edges: this many metres near you, wider in proportion far away so distant edges fade too. Raise it if you notice where the sharp area ends; 0 is a hard edge. Changes while you drive.
de = Wie weich die volle Detailtiefe des Straßenfokus an seinen Rändern in die Peripherie übergeht: so viele Meter in deiner Nähe, in der Ferne entsprechend breiter, damit auch entfernte Ränder auslaufen. Erhöhe ihn, wenn du siehst, wo der scharfe Bereich endet; 0 ist eine harte Kante. Ändert sich während der Fahrt.
en = Show Road focus area
de = Straßenfokus-Bereich zeigen
en = Tints blue, in the headset, everything Road focus takes from the periphery, so you can see exactly what stays in full detail (untinted) as you drive. Road focus works as usual meanwhile. For setting up; turn it off to drive.
de = Färbt im Headset alles blau, was der Straßenfokus aus der Peripherie nimmt, damit du beim Fahren genau siehst, was in voller Detailtiefe bleibt (ungefärbt). Der Straßenfokus arbeitet dabei wie gewohnt. Zum Einrichten; schalte es zum Fahren aus.
en = Road height
de = Straßenhöhe
en = How high above the road stays in full detail with Road focus on. Lower keeps just the road and the cars sharp and saves the most; higher brings signs, gantries and the grandstands’ lower rows into the focus area and saves less. 3.5 m suits most circuits. Changes while you drive.
de = Wie hoch über der Straße bei eingeschaltetem Straßenfokus volle Details bleiben. Niedriger hält nur die Straße und die Autos scharf und spart am meisten; höher holt Schilder, Schilderbrücken und die unteren Tribünenreihen in den Fokusbereich und spart weniger. 3,5 m passen für die meisten Strecken. Ändert sich während der Fahrt.
en = Show focus outline
de = Fokusumriss zeigen
en = Draws the focus area’s edge, to see where it is and how it follows your eyes. For setting up; turn it off to drive.
de = Zeichnet den Rand des Fokusbereichs, damit du siehst, wo er liegt und wie er deinen Augen folgt. Zum Einrichten; schalte ihn zum Fahren aus.
en = Use Cheeky Foveated DLSS
de = Cheeky Foveated DLSS nutzen
en = Runs Cheeky Foveated DLSS inside the game, for the DLSS options below. Needs an NVIDIA RTX GPU, DLSS on in the game, and Cheeky’s download. Applies at the next launch.
de = Führt Cheeky Foveated DLSS im Spiel aus, für die DLSS-Optionen unten. Braucht eine NVIDIA-RTX-GPU, DLSS im Spiel an und den Cheeky-Download. Gilt ab dem nächsten Start.
en = Cheaper outer views
de = Günstigere äußere Ansichten
en = The outer views get Cheeky’s DLAA at a lower resolution instead of the game’s DLSS: GPU time saved on the views you see least.
de = Die äußeren Ansichten bekommen Cheekys DLAA in niedrigerer Auflösung statt des DLSS des Spiels: GPU-Zeit gespart bei den Ansichten, die du am wenigsten siehst.
en = Outer DLAA scale
de = Äußere DLAA-Skalierung
en = The resolution of that cheaper pass. Lower saves more GPU time and softens the side view.
de = Die Auflösung dieses günstigeren Durchgangs. Niedriger spart mehr GPU-Zeit und macht die Seitensicht weicher.
en = Focus supersampling
de = Fokus-Supersampling
en = Renders the focus views above their size before DLSS: a sharper centre, for more GPU time.
de = Rendert die Fokusansichten vor DLSS über ihrer Größe: eine schärfere Mitte, für mehr GPU-Zeit.
en = Frame generation
de = Frame Generation
en = Cheeky’s DLSS frame generation adds frames between the game’s: smoother motion when the game can’t hold the refresh rate, for some GPU time and latency. Turn OpenXR Toolkit’s Turbo mode off with it, and run no other frame generator.
de = Cheekys DLSS Frame Generation fügt Frames zwischen denen des Spiels ein: flüssigere Bewegung, wenn das Spiel die Bildwiederholrate nicht hält, für etwas GPU-Zeit und Latenz. Schalte dazu den Turbo-Modus von OpenXR Toolkit aus und nutze keine andere Frame Generation.
en = Center region
de = Mittelbereich
en = The part of the view frame generation makes at full quality (it follows your eyes when eye tracked). Larger looks better and costs more GPU time.
de = Der Teil der Ansicht, den die Frame Generation in voller Qualität erzeugt (mit Eye-Tracking folgt er deinen Augen). Größer sieht besser aus und kostet mehr GPU-Zeit.
en = Load order
de = Ladereihenfolge
en = Nearest the game first. Each launch loads these below the Sim-QVFR layer in this order; a layer off in Windows can still be loaded for the game alone. Locked switches keep the mod and the game working.
de = Der dem Spiel nächste zuerst. Jeder Start lädt diese in dieser Reihenfolge unter dem Sim-QVFR-Layer; ein in Windows ausgeschalteter Layer lässt sich trotzdem nur für das Spiel laden. Gesperrte Schalter halten Mod und Spiel funktionsfähig.
en = Describe the problem
de = Beschreib das Problem
en = Zips the logs and the game’s crash reports from those sessions (names and account IDs taken out) into the logs folder, then opens a new issue on GitHub with what you wrote, your settings, the last session and your PC filled in. Add the steps there, and drag in the zip (it shows below) and any screenshots.
de = Packt die Protokolle und die Absturzberichte des Spiels aus diesen Sitzungen (ohne Namen und Konto-IDs) als ZIP in den Protokollordner und öffnet dann ein neues Issue auf GitHub, ausgefüllt mit deinem Text, deinen Einstellungen, der letzten Sitzung und deinem PC. Ergänze dort die Schritte und zieh die ZIP (sie erscheint unten) und Screenshots hinein.
en = Busiest threads
de = Ausgelastetste Threads
en = Each thread is a share of ONE core. A thread near 100% can hold the frame rate back even when Windows shows the whole CPU at 15%; a thread that spins by design looks busy whatever limits it.
de = Jeder Thread ist ein Anteil EINES Kerns. Ein Thread nahe 100% kann die Bildrate bremsen, selbst wenn Windows die ganze CPU bei 15% zeigt; ein Thread, der absichtlich wartend kreist, wirkt immer ausgelastet, egal was begrenzt.
en = Frame rate
de = Bildrate
en = The last session’s average against the headset’s refresh rate, the frame rate it asks for. Below it, the runtime fills the gaps (motion smoothing or reprojection), which shows as wobble on moving edges.
de = Der Durchschnitt der letzten Sitzung gegenüber der Bildwiederholrate des Headsets, also der Bildrate, die es verlangt. Darunter füllt die Runtime die Lücken (Bewegungsglättung oder Reprojektion), was sich als Wabern an bewegten Kanten zeigt.
en = Slow frames
de = Langsame Frames
en = How long your slowest frames take: lower is smoother. One frame in ten took at least this long (the 90th percentile). Above the frame’s budget (1000 ms divided by the headset’s refresh rate: 11.1 ms at 90 Hz) those frames miss the headset, and you feel stutter even when the average frame rate looks fine.
de = Wie lange deine langsamsten Frames dauern: niedriger ist flüssiger. Jeder zehnte Frame dauerte mindestens so lange (das 90. Perzentil). Über dem Zeitbudget pro Frame (1000 ms geteilt durch die Bildwiederholrate des Headsets: 11,1 ms bei 90 Hz) verpassen diese Frames das Headset, und du spürst Ruckeln, selbst wenn die durchschnittliche Bildrate gut aussieht.
en = Limited by
de = Begrenzt durch
en = What held the frame back most of the time: the game’s render thread on the CPU, the GPU, or nothing (the headset’s refresh). Lowering resolution helps only when the GPU limits it.
de = Was den Frame die meiste Zeit gebremst hat: der Render-Thread des Spiels auf der CPU, die GPU oder nichts (die Bildwiederholung des Headsets). Eine niedrigere Auflösung hilft nur, wenn die GPU begrenzt.
en = Previous session
de = Vorherige Sitzung
en = The session before the last one for this game, and the settings changed in between, so you can see what a change did. A change while you drive (here or in the headset menu) starts a new stint, kept as its own entry; each covers the whole stint, with the moments the headset menu was open left out. Compare runs on the same track and car for a fair difference.
de = Die vorletzte Sitzung für dieses Spiel und die dazwischen geänderten Einstellungen, damit du siehst, was eine Änderung bewirkt hat. Eine Änderung während der Fahrt (hier oder im Headset-Menü) beginnt einen neuen Stint mit eigenem Eintrag; jeder umfasst den ganzen Stint, ohne die Momente, in denen das Headset-Menü offen war. Vergleiche Fahrten auf derselben Strecke mit demselben Auto für einen fairen Unterschied.
en = Run with anti-cheat
de = Mit Anti-Cheat starten
en = Starts the game through its anti-cheat (Easy Anti-Cheat), as Steam does, with Sim-QVFR running, so you can join online servers. Sim-QVFR runs inside the game, and the anti-cheat may kick you or ban your account for it. Sim-QVFR and its developer aren’t responsible for kicks or bans: turning it on asks you to accept that risk. Off starts the game without its anti-cheat, for offline sessions only.
de = Startet das Spiel über sein Anti-Cheat (Easy Anti-Cheat), wie Steam es tut, mit laufendem Sim-QVFR, damit du Online-Servern beitreten kannst. Sim-QVFR läuft im Spiel, und das Anti-Cheat kann dich deshalb kicken oder dein Konto sperren. Sim-QVFR und sein Entwickler sind für Kicks oder Sperren nicht verantwortlich: Beim Einschalten musst du dieses Risiko akzeptieren. Aus startet das Spiel ohne Anti-Cheat, nur für Offline-Sitzungen.
en = Layers for
de = Layer für
en = Launches from here: the VR add-ons (OpenXR layers) a launch from this launcher loads, below Sim-QVFR, in an order of its own; nothing else changes. Every app: Windows’ own list, which every other app uses (and the game started from Steam), saved in the registry when you apply, with a backup in the logs folder first.
de = Starts von hier: die VR-Add-ons (OpenXR-Layer), die ein Start aus diesem Launcher unter Sim-QVFR lädt, in eigener Reihenfolge; sonst ändert sich nichts. Alle Apps: die Liste von Windows selbst, die jede andere App nutzt (auch das über Steam gestartete Spiel), beim Übernehmen in der Registry gespeichert, vorher mit einer Sicherung im Protokollordner.
en = CPU capture
de = CPU-Aufzeichnung
en = At the next launch, the CPU capture hotkey (Ctrl+Alt+C) while driving records for 20 s where the game’s busiest threads spend their time, into a cpu-profile file in the logs folder. The headset menu shows when it starts and ends; the game may stutter slightly while it records.
de = Ab dem nächsten Start zeichnet das Tastenkürzel für die CPU-Aufzeichnung (Ctrl+Alt+C) während der Fahrt 20 s lang auf, wo die ausgelastetsten Threads des Spiels ihre Zeit verbringen, in eine cpu-profile-Datei im Protokollordner. Das Headset-Menü zeigt Anfang und Ende; das Spiel kann während der Aufzeichnung leicht ruckeln.
en = Frame capture
de = Frame-Aufnahme
en = Saves the game’s own image and the composed output, as PNG files in the captures folder inside the logs folder. Each press saves one more frame, to compare the views where something looks wrong. In X-Plane 12, Assetto Corsa Competizione and Le Mans Ultimate.
de = Speichert das eigene Bild des Spiels und die zusammengesetzte Ausgabe als PNG-Dateien im Ordner captures im Protokollordner. Jeder Druck speichert einen weiteren Frame, um die Ansichten zu vergleichen, wo etwas falsch aussieht. In X-Plane 12, Assetto Corsa Competizione und Le Mans Ultimate.
en = Next launch without QVFR
de = Nächster Start ohne QVFR
en = Starts the game once with its own two views and QVFR off, still measuring, so Diagnostics can compare the same race with and without QVFR. It turns itself off after that launch; the next one has QVFR again. The performance overlay works in it, the headset menu does not.
de = Startet das Spiel einmal mit seinen eigenen zwei Ansichten und ohne QVFR, misst aber weiter, damit die Diagnose dasselbe Rennen mit und ohne QVFR vergleichen kann. Nach diesem Start schaltet es sich aus; der nächste hat wieder QVFR. Das Leistungs-Overlay funktioniert dabei, das Headset-Menü nicht.
en = Detailed logs
de = Ausführliche Protokolle
en = Normal logs say what Sim-QVFR set up, decided and measured. Detailed logs add every step behind that, for a bug report when the developer asks for one. They last three launches and then turn themselves off, so the logs stay small. Send them with Report an issue, or Save the logs as a zip.
de = Normale Protokolle sagen, was Sim-QVFR eingerichtet, entschieden und gemessen hat. Ausführliche Protokolle ergänzen jeden Schritt dahinter, für einen Fehlerbericht, wenn der Entwickler danach fragt. Sie gelten drei Starts lang und schalten sich dann aus, damit die Protokolle klein bleiben. Schick sie mit „Problem melden“ oder speichere sie als ZIP.
en = Logs folder
de = Protokollordner
en = Each launch adds a session log and a small run folder. The launcher keeps the newest 30 sessions and removes older ones at each launch, and the newest 10 CPU captures. Frame captures and game image dumps stay until you clear them: Clear captures moves them to the Recycle Bin.
de = Jeder Start fügt ein Sitzungsprotokoll und einen kleinen Laufordner hinzu. Der Launcher behält die neuesten 30 Sitzungen, entfernt ältere bei jedem Start, und behält die neuesten 10 CPU-Aufzeichnungen. Frame-Aufnahmen und Bild-Dumps des Spiels bleiben, bis du sie löschst: „Aufnahmen löschen“ verschiebt sie in den Papierkorb.
en = Presets for eye tracked foveation
de = Voreinstellungen für Foveation mit Eye-Tracking
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Eye tracked, the area follows your eyes, so it can be small and very sharp. They set the resolution only and keep everything else.
de = Ausgangspunkte, die die Pixel in die Mitte legen: niedrige äußere Ansichten und ein dichter Fokusbereich. Mit Eye-Tracking folgt der Bereich deinen Augen, kann also klein und sehr scharf sein. Sie setzen nur die Auflösung und lassen alles andere, wie es ist.
en = Presets for fixed foveation
de = Voreinstellungen für feste Foveation
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Fixed, your eyes move off the centre, so the area is larger and a little less dense. They set the resolution only and keep everything else.
de = Ausgangspunkte, die die Pixel in die Mitte legen: niedrige äußere Ansichten und ein dichter Fokusbereich. Fest verlassen deine Augen die Mitte, der Bereich ist also größer und etwas weniger dicht. Sie setzen nur die Auflösung und lassen alles andere, wie es ist.
en = Your profiles
de = Deine Profile
en = A profile holds every setting of the picture: resolution, foveation and the focus overlay, and where the game has them the view crop, the helmet and Foveated DLSS. Not the menu’s and overlay’s places, the hotkeys or the OpenXR layers. Share copies one as a line of text to paste in a chat; Paste adds one from the clipboard. The headset menu’s Profile line switches between them while you drive.
de = Ein Profil enthält jede Bildeinstellung: Auflösung, Foveation und Fokus-Overlay und, wo das Spiel sie hat, Ansichtsbeschnitt, Helm und Foveated DLSS. Nicht die Positionen von Menü und Overlay, die Tastenkürzel oder die OpenXR-Layer. „Teilen“ kopiert eins als Textzeile zum Einfügen in einen Chat; „Einfügen“ fügt eins aus der Zwischenablage hinzu. Die Zeile „Profil“ im Headset-Menü wechselt während der Fahrt zwischen ihnen.
en = A key’s first press also opens the menu. A wheel’s directions act only while the menu shows, so a switch the game also uses doesn’t open it: use Open or close first.
de = Der erste Druck einer Taste öffnet auch das Menü. Die Richtungen am Lenkrad wirken nur, solange das Menü sichtbar ist, ein Schalter, den auch das Spiel nutzt, öffnet es also nicht: Nimm zuerst „Öffnen oder schließen“.
en = Keys work while the game window has focus; wheel, button box and controller buttons work whenever the game runs.
de = Tasten wirken, wenn das Spielfenster den Fokus hat; Lenkrad-, Buttonbox- und Controllertasten, solange das Spiel läuft.
en = Field of view crop
de = Sichtfeld-Beschnitt
en = The outer view keeps its sharpness and the focus region its size. Changes reach a running game at once; with DLSS on, or with less crop than at launch, the pixel count follows at the next launch.
de = Die äußere Ansicht behält ihre Schärfe und der Fokusbereich seine Größe. Änderungen erreichen ein laufendes Spiel sofort; mit DLSS an oder mit weniger Beschnitt als beim Start folgt die Pixelzahl beim nächsten Start.
en = Helmet overlay
de = Helm-Overlay
en = Built in, the visor opening follows the crop (Rim and Corners). Your own helmet: top.png, bottom.png and visor.png with alpha in the helmet folder next to the layer; the log suggests the crop that matches them.
de = Eingebaut folgt die Visieröffnung dem Beschnitt (Rand und Ecken). Eigener Helm: top.png, bottom.png und visor.png mit Alpha im Ordner helmet neben dem Layer; das Protokoll schlägt den passenden Beschnitt vor.
en = Focus shape
de = Fokusform
en = Each corner moves toward the middle of the focus region, percent of its width (in) or height (down, up). Pull the top corners in for a trapezoid: more of the dash sharp, less of the far field. The focus view still renders the whole box, so the cost stays the same.
de = Jede Ecke rückt zur Mitte des Fokusbereichs, in Prozent seiner Breite (nach innen) oder Höhe (nach unten, oben). Zieh die oberen Ecken für ein Trapez nach innen: mehr vom Armaturenbrett scharf, weniger vom Fernfeld. Die Fokusansicht rendert trotzdem das ganze Rechteck, die Kosten bleiben also gleich.
en = Cheeky Foveated DLSS
de = Cheeky Foveated DLSS
en = No Cheeky loader goes in the game folder: Sim-QVFR loads Cheeky’s runtime into the game itself.
de = Kein Cheeky-Loader gehört in den Spielordner: Sim-QVFR lädt Cheekys Runtime selbst ins Spiel.
en = Frame generation (experimental)
de = Frame Generation (experimentell)
en = Outside the center region frames are warped with the game’s motion. Lower scales use less GPU time and memory. With an eye-tracked focus (the Foveation card) the region follows your eyes too, through Cheeky’s OpenXR layer.
de = Außerhalb des Mittelbereichs werden Frames mit der Bewegung des Spiels verzerrt. Niedrigere Skalierungen brauchen weniger GPU-Zeit und Speicher. Mit Fokus per Eye-Tracking (Karte Foveation) folgt der Bereich über Cheekys OpenXR-Layer auch deinen Augen.
en = The settings menu stays 0.8 m in front of your head, wherever you look.
de = Das Einstellungsmenü bleibt 0,8 m vor deinem Kopf, wohin du auch schaust.
en = Use DLSS
de = DLSS nutzen
en = Sim-QVFR evaluates NVIDIA’s DLSS on each view, with depth and motion it works out from the game’s own frames, before the game’s post-processing. Needs an NVIDIA RTX graphics card. Sim-QVFR includes NVIDIA’s nvngx_dlss.dll; Choose… takes another (a newer one from a game), Use included goes back.
de = Sim-QVFR wendet NVIDIAs DLSS auf jede Ansicht an, mit Tiefe und Bewegung, die es aus den eigenen Frames des Spiels ermittelt, vor dem Post-Processing des Spiels. Braucht eine NVIDIA-RTX-Grafikkarte. Sim-QVFR liefert NVIDIAs nvngx_dlss.dll mit; „Wählen…“ nimmt eine andere (eine neuere aus einem Spiel), „Mitgelieferte nutzen“ geht zurück.
en = Use FSR
de = FSR nutzen
en = Experimental. On a PC without an NVIDIA RTX graphics card, Sim-QVFR evaluates AMD FSR on each view in DLSS’s place, with the same depth and motion: FSR 4 where AMD’s software offers it for your card (Radeon RX 9000, and newer drivers on RX 7000 and 6000), FSR 3.1 elsewhere. Sim-QVFR includes AMD’s FSR files. Tested only as FSR 3.1 on an NVIDIA card so far: tell us how it runs on yours.
de = Experimentell. Auf einem PC ohne NVIDIA-RTX-Grafikkarte wendet Sim-QVFR statt DLSS AMD FSR auf jede Ansicht an, mit derselben Tiefe und Bewegung: FSR 4, wo AMDs Software es für deine Karte anbietet (Radeon RX 9000 und mit neueren Treibern RX 7000 und 6000), sonst FSR 3.1. Sim-QVFR liefert AMDs FSR-Dateien mit. Bisher nur als FSR 3.1 auf einer NVIDIA-Karte getestet: Sag uns, wie es auf deiner läuft.
en = Periphery preset
de = Peripherie-Preset
en = Steadier or cheaper DLSS outside the focus area. K: a steadier picture, at a higher cost. F: about half the cost, a little more flicker on edges. With eye tracking you rarely look there, so F is usually fine; with a fixed focus, K.
de = Ruhigeres oder günstigeres DLSS außerhalb des Fokusbereichs. K: ein ruhigeres Bild, zu höheren Kosten. F: etwa die halben Kosten, etwas mehr Flimmern an Kanten. Mit Eye-Tracking schaust du selten dorthin, F reicht also meist; mit festem Fokus K.
en = Texture sharpening
de = Texturschärfung
en = DLSS rebuilds detail from frames drawn at a lower resolution, so textures are best sampled a step sharper while it runs. Sim-QVFR does that through copies of the game’s shaders, in the focus area alone or in the periphery too. Measured gains are modest (most in the periphery and on distant textures). Off at launch, nothing is installed for it; turned on then, it starts at the next launch. Fine patterns may shimmer: then a step lower.
de = DLSS rekonstruiert Details aus Frames, die in niedrigerer Auflösung gezeichnet wurden, daher werden Texturen dabei am besten eine Stufe schärfer abgetastet. Sim-QVFR macht das über Kopien der Shader des Spiels, nur im Fokusbereich oder auch in der Peripherie. Die gemessenen Gewinne sind bescheiden (am meisten in der Peripherie und bei entfernten Texturen). Beim Start aus wird dafür nichts installiert; dann eingeschaltet, startet es beim nächsten Start. Feine Muster können flimmern: dann eine Stufe niedriger.
en = Updates
de = Updates
en = Install downloads the release from GitHub, checks it against the SHA-256 GitHub gives, replaces the program files and restarts the launcher; your settings, profiles and changed files stay, and the version you had is kept in the update folder. Download opens the release’s page instead.
de = „Installieren“ lädt das Release von GitHub herunter, prüft es gegen den SHA-256 von GitHub, ersetzt die Programmdateien und startet den Launcher neu; deine Einstellungen, Profile und geänderten Dateien bleiben, und deine bisherige Version wird im Ordner update aufbewahrt. „Herunterladen“ öffnet stattdessen die Seite des Releases.
en = These settings reach the game while it runs, as soon as you change them. Without the game running, they apply when it starts.
de = Diese Einstellungen erreichen das laufende Spiel, sobald du sie änderst. Läuft das Spiel nicht, gelten sie beim Start.
en = Lowering it reaches a running game at once, and so does raising it back up to what the game started with. Above that, it takes effect at the next launch. With DLSS on in the game, the views keep their launch sizes until the next launch.
de = Senken erreicht ein laufendes Spiel sofort, ebenso das Anheben bis zum Wert beim Spielstart. Darüber wirkt es ab dem nächsten Start. Mit DLSS im Spiel behalten die Ansichten ihre Startgrößen bis zum nächsten Start.
en = These settings take effect the next time the game starts from the launcher. A running game keeps what it started with.
de = Diese Einstellungen wirken beim nächsten Spielstart aus dem Launcher. Ein laufendes Spiel behält die Werte, mit denen es gestartet ist.
en = The local time on a small card in the headset, apart from the performance overlay: on or off and moved live, here or from the headset menu. It costs next to nothing; it redraws once a minute.
de = Die Ortszeit auf einer kleinen Karte im Headset, getrennt vom Leistungs-Overlay: live ein- und ausschaltbar und verschiebbar, hier oder im Headset-Menü. Kostet so gut wie nichts; sie wird einmal pro Minute neu gezeichnet.
en = The performance overlay in the headset: frame rate, CPU and GPU time and what limits the frame. A little CPU time while it shows.
de = Das Leistungs-Overlay im Headset: Bildrate, CPU- und GPU-Zeit und was den Frame begrenzt. Etwas CPU-Zeit, solange es sichtbar ist.
en = Shape
de = Form
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom shape: an outline of up to 10 points you draw on the preview (click the area to add a point, drag one to move it, right-click one to remove it); trace your windscreen, say, then place it with Vertical and Horizontal position. To hide the area’s edge, raise Feather.
de = Die Form des scharfen Bereichs. Rechteck: abgerundet per Eckenradius. Eigene Form: ein Umriss aus bis zu 10 Punkten, den du in der Vorschau zeichnest (Klick in den Bereich fügt einen Punkt hinzu, Ziehen verschiebt ihn, Rechtsklick entfernt ihn); zeichne etwa deine Windschutzscheibe nach und platziere sie dann mit Vertikaler und Horizontaler Position. Um den Rand des Bereichs zu verstecken, erhöhe die weiche Kante.
en = Outline color
de = Umrissfarbe
en = The outline’s colour in the headset. It shows while Show focus outline is on.
de = Die Farbe des Umrisses im Headset. Er erscheint, solange „Fokusumriss zeigen“ an ist.
en = nvngx_dlss.dll
de = nvngx_dlss.dll
en = The DLSS Sim-QVFR uses: the one it includes (NVIDIA’s), or another you choose, a newer one from a game, say (DLSS 310 or newer). Use included goes back. Applies at the next launch.
de = Das DLSS, das Sim-QVFR nutzt: das mitgelieferte (von NVIDIA) oder ein anderes deiner Wahl, etwa ein neueres aus einem Spiel (DLSS 310 oder neuer). „Mitgelieferte nutzen“ geht zurück. Gilt ab dem nächsten Start.
en = Focus views
de = Fokusansichten
en = DLAA draws them at their size. Ultra quality, Quality, Balanced and Performance draw them at 77, 67, 58 or 50% each way and upscale them: less GPU time, softer distant textures. DLSS has no ultra quality model of its own: 77% runs its quality one.
de = DLAA zeichnet sie in ihrer Größe. Ultra-Qualität, Qualität, Ausgewogen und Leistung zeichnen sie mit 77, 67, 58 oder 50% je Richtung und skalieren sie hoch: weniger GPU-Zeit, weichere entfernte Texturen. DLSS hat kein eigenes Ultra-Qualität-Modell: 77% nutzt das Qualität-Modell.
en = Focus preset
de = Fokus-Preset
en = The DLSS preset for the sharp focus views. With Sim-QVFR’s DLSS, Default is NVIDIA’s choice for the mode: K, and M at Performance, which costs more. With Cheeky, Game default keeps the game’s.
de = Das DLSS-Preset für die scharfen Fokusansichten. Mit dem DLSS von Sim-QVFR ist „Standard“ NVIDIAs Wahl für den Modus: K, und M bei Leistung, was mehr kostet. Mit Cheeky behält „Spielstandard“ das des Spiels.
en = Other cars’ motion
de = Bewegung anderer Autos
en = Gives DLSS each other car’s own motion, so cars passing, alongside or ahead stay clean instead of smearing. Turn it off for more headroom: in a field of cars it costs about 0.5 ms of CPU and 0.2 to 0.5 ms of GPU a frame. Applies at the next launch, with DLSS on at launch; with DLSS off it costs nothing.
de = Gibt DLSS die eigene Bewegung jedes anderen Autos, damit überholende, danebenfahrende oder vorausfahrende Autos sauber bleiben statt zu verschmieren. Schalte es für mehr Reserve aus: In einem Feld voller Autos kostet es pro Frame etwa 0,5 ms CPU und 0,2 bis 0,5 ms GPU. Gilt ab dem nächsten Start, wenn DLSS beim Start an ist; mit DLSS aus kostet es nichts.
en = nvngx_dlssnr.dll
de = nvngx_dlssnr.dll
en = NVIDIA’s DLSS neural rendering runtime. Sim-QVFR includes none: it is NVIDIA’s, and comes only with games that ship DLSS-NR. Choose the one in such a game’s folder. Applies at the next launch.
de = NVIDIAs Runtime für DLSS Neural Rendering. Sim-QVFR liefert keine mit: Sie gehört NVIDIA und kommt nur mit Spielen, die DLSS-NR enthalten. Wähle die aus dem Ordner eines solchen Spiels. Gilt ab dem nächsten Start.
en = Use DLSS-NR
de = DLSS-NR nutzen
en = NVIDIA’s DLSS neural rendering on the views: its model reworks lighting and materials from the picture, its depth and its motion. Experimental, and heavy: about 2 ms of GPU time and 130 MB of video memory for every million pixels it works on, per view (RTX 5070 Ti). It turns itself off if frames fall under 10 a second with it on.
de = NVIDIAs DLSS Neural Rendering auf den Ansichten: Sein Modell überarbeitet Beleuchtung und Materialien aus dem Bild, seiner Tiefe und seiner Bewegung. Experimentell und aufwendig: etwa 2 ms GPU-Zeit und 130 MB Videospeicher pro Million bearbeiteter Pixel, je Ansicht (RTX 5070 Ti). Es schaltet sich aus, wenn die Frames damit unter 10 pro Sekunde fallen.
en = Intensity
de = Intensität
en = How much of the model’s change you get: 0% is the picture as it came.
de = Wie viel von der Änderung des Modells du bekommst: 0% ist das Bild, wie es kam.
en = Style
de = Stil
en = The look the model aims for.
de = Der Look, den das Modell anstrebt.
en = Preset
de = Preset
en = The model: A is the original, B a faster one in newer DLLs (310.9.16 on). Default is the DLL’s own choice. A change rebuilds DLSS-NR: a short stutter.
de = Das Modell: A ist das Original, B ein schnelleres in neueren DLLs (ab 310.9.16). „Standard“ ist die Wahl der DLL. Eine Änderung baut DLSS-NR neu auf: ein kurzes Ruckeln.
en = Local tone
de = Lokaler Ton
en = The strength of the model’s local contrast and lighting changes.
de = Die Stärke der lokalen Kontrast- und Lichtänderungen des Modells.
en = Local structure
de = Lokale Struktur
en = The strength of the model’s changes to fine structure.
de = Die Stärke der Änderungen des Modells an feinen Strukturen.
en = Auto mask
de = Automaske
en = Lets the model find what it treats differently (skin) by itself.
de = Lässt das Modell selbst finden, was es anders behandelt (Haut).
en = Runs
de = Läuft
en = After DLSS works on the finished, anti-aliased views. Before DLSS works on the views as drawn, before anti-aliasing and upscaling: fewer pixels when the focus views are upscaled, and DLSS then smooths its result.
de = „Nach DLSS“ bearbeitet die fertigen, geglätteten Ansichten. „Vor DLSS“ bearbeitet die Ansichten wie gezeichnet, vor Kantenglättung und Hochskalierung: weniger Pixel, wenn die Fokusansichten hochskaliert werden, und DLSS glättet danach sein Ergebnis.
en = Focus working size
de = Fokus-Arbeitsgröße
en = What the model works at, a share of the focus view. Lower costs less; the picture keeps its own detail.
de = Die Größe, in der das Modell arbeitet, als Anteil der Fokusansicht. Niedriger kostet weniger; das Bild behält seine eigenen Details.
en = Working size limit
de = Grenze der Arbeitsgröße
en = The most one view’s model works on, in megapixels, whatever the sizes. Each megapixel costs about 2 ms of GPU time and 130 MB of video memory, per view.
de = Das Maximum, das das Modell einer Ansicht bearbeitet, in Megapixeln, unabhängig von den Größen. Jedes Megapixel kostet je Ansicht etwa 2 ms GPU-Zeit und 130 MB Videospeicher.
en = Edge blend
de = Randübergang
en = The band over which the processed area fades into what isn’t processed around it.
de = Der Streifen, über den der bearbeitete Bereich in das Unbearbeitete um ihn herum übergeht.
en = Periphery too
de = Auch Peripherie
en = Off, only the focus views are processed: where you look. On, the periphery too, at its own working size and coverage. It adds about 2 ms of GPU time per eye at least, however small you make it.
de = Aus: nur die Fokusansichten werden bearbeitet, also wo du hinsiehst. An: auch die Peripherie, mit eigener Arbeitsgröße und Abdeckung. Das kostet je Auge mindestens etwa 2 ms GPU-Zeit, egal wie klein du sie machst.
en = Periphery working size
de = Peripherie-Arbeitsgröße
en = As the focus working size, for the periphery.
de = Wie die Fokus-Arbeitsgröße, für die Peripherie.
en = Periphery covered
de = Peripherie-Abdeckung
en = How much of each eye’s view the model covers, around the focus area.
de = Wie viel jeder Augenansicht das Modell um den Fokusbereich herum abdeckt.
en = Foveated DLSS
de = Foveated DLSS
en = Off leaves the game’s own DLSS on every view.
de = Aus lässt das eigene DLSS des Spiels auf jeder Ansicht.
en = Outer preset
de = Äußeres Preset
en = The DLSS preset of the outer views’ own pass (Cheaper outer views).
de = Das DLSS-Preset des eigenen Durchgangs der äußeren Ansichten (Günstigere äußere Ansichten).
en = Fix motion-vector blur
de = Bewegungsvektor-Unschärfe beheben
en = Cheeky’s workaround for smearing with some presets. Adds GPU work.
de = Cheekys Workaround gegen Verschmieren bei manchen Presets. Kostet GPU-Last.
en = DLSS-NR
de = DLSS-NR
en = NVIDIA’s DLSS-NR (DLSS 5) on the focus views. Needs nvngx_dlssnr.dll next to the game.
de = NVIDIAs DLSS-NR (DLSS 5) auf den Fokusansichten. Braucht nvngx_dlssnr.dll neben dem Spiel.
en = DLSS-NR passes
de = DLSS-NR-Durchgänge
en = Each extra DLSS-NR pass costs about one more NR evaluation.
de = Jeder zusätzliche DLSS-NR-Durchgang kostet etwa eine weitere NR-Auswertung.
en = Multiplier
de = Faktor
en = Frames shown per frame the game renders: 2x adds one generated frame between each two of the game’s.
de = Angezeigte Frames pro gerendertem Spiel-Frame: 2x fügt zwischen je zwei Frames des Spiels einen erzeugten ein.
en = Center FG scale
de = FG-Skalierung Mitte
en = Frame generation’s resolution in the center region. Lower uses less GPU time and memory.
de = Die Auflösung der Frame Generation im Mittelbereich. Niedriger braucht weniger GPU-Zeit und Speicher.
en = Periphery FG scale
de = FG-Skalierung Peripherie
en = Frame generation’s resolution around the center region. Lower uses less GPU time and memory.
de = Die Auflösung der Frame Generation um den Mittelbereich. Niedriger braucht weniger GPU-Zeit und Speicher.
en = Release game
de = Spiel freigeben
en = When the game starts its next frame. Never: CPU and GPU overlap (most frames). Capture: after the GPU finishes. Generated: after the generated frame.
de = Wann das Spiel seinen nächsten Frame beginnt. Nie: CPU und GPU überlappen (die meisten Frames). Erfassung: nachdem die GPU fertig ist. Erzeugt: nach dem erzeugten Frame.
en = Show the center region
de = Mittelbereich zeigen
en = Outlines the region in the headset, to check that it follows your eyes.
de = Umrandet den Bereich im Headset, um zu prüfen, ob er deinen Augen folgt.
en = Rim
de = Rand
en = How far the helmet’s padding reaches into the view.
de = Wie weit die Polsterung des Helms in die Sicht reicht.
en = Corners
de = Ecken
en = Rounds the helmet’s visor opening.
de = Rundet die Visieröffnung des Helms ab.
en = Lighting
de = Beleuchtung
en = How much the scene lights the helmet.
de = Wie stark die Szene den Helm beleuchtet.
en = Visor
de = Visier
en = Your own images only: closed, half or open. Ctrl+Alt+V in the game steps it.
de = Nur eigene Bilder: geschlossen, halb oder offen. Ctrl+Alt+V im Spiel schaltet weiter.
en = Depth
de = Tiefe
en = Your own images only: how far in front of your eyes, in cm. 0 is far away, with no depth.
de = Nur eigene Bilder: wie weit vor deinen Augen, in cm. 0 ist weit weg, ohne Tiefe.
en = Your own images only: Detail (4096) is sharper, Performance (2048) costs less GPU time and memory.
de = Nur eigene Bilder: Detail (4096) ist schärfer, Leistung (2048) kostet weniger GPU-Zeit und Speicher.
en = Degrees right of straight ahead. Negative is left. Drag it in Placement, or move it in the headset.
de = Grad rechts von geradeaus. Negativ ist links. Zieh es unter Platzierung oder verschieb es im Headset.
en = Degrees above eye level. Negative is below. Drag it in Placement, or move it in the headset.
de = Grad über Augenhöhe. Negativ ist darunter. Zieh es unter Platzierung oder verschieb es im Headset.
en = How wide it is, in degrees of your view.
de = Wie breit es ist, in Grad deiner Sicht.
en = A line under the headset menu with the in-game hotkeys (overlay, visor, CPU capture) and their wheel buttons, as set in Hotkeys. Also on the menu’s Headset page.
de = Eine Zeile unter dem Headset-Menü mit den Tastenkürzeln im Spiel (Overlay, Visier, CPU-Aufzeichnung) und ihren Lenkradtasten, wie unter Tastenkürzel festgelegt. Auch auf der Seite „Headset“ des Menüs.
en = Open or close
de = Öffnen oder schließen
en = Opens the headset menu, or closes it.
de = Öffnet das Headset-Menü oder schließt es.
en = Up
de = Hoch
en = Selects the line above in the headset menu.
de = Wählt im Headset-Menü die Zeile darüber.
en = Down
de = Runter
en = Selects the line below in the headset menu.
de = Wählt im Headset-Menü die Zeile darunter.
en = Left
de = Links
en = Lowers the selected value in the headset menu.
de = Senkt im Headset-Menü den gewählten Wert.
en = Right
de = Rechts
en = Raises the selected value in the headset menu.
de = Erhöht im Headset-Menü den gewählten Wert.
en = Overlay
de = Overlay
en = Turns the performance overlay on or off.
de = Schaltet das Leistungs-Overlay ein oder aus.
en = Helmet visor
de = Helmvisier
en = Steps the helmet’s visor: closed, half, open.
de = Schaltet das Helmvisier weiter: geschlossen, halb, offen.
en = Helmet images
de = Helmbilder
en = Your own helmet: top.png, bottom.png and visor.png in the helmet folder next to the layer. Size and Height place them (degrees of view, and above straight ahead).
de = Eigener Helm: top.png, bottom.png und visor.png im Ordner helmet neben dem Layer. Größe und Höhe platzieren sie (Grad der Sicht und über geradeaus).
en = From the periphery
de = Aus der Peripherie

; src/launcher/ui/input.cpp
en = Diagnostics
de = Diagnose
en = Back to {name}.
de = Zurück zu {name}.
en = Updated {name} with the settings you have now.
de = {name} mit deinen aktuellen Einstellungen aktualisiert.
en = Couldn’t update {name}.
de = {name} ließ sich nicht aktualisieren.
en = Copied {name} to the clipboard: paste it in a chat or a post.
de = {name} in die Zwischenablage kopiert: Füg es in einen Chat oder Beitrag ein.
en = Couldn’t copy to the clipboard.
de = Kopieren in die Zwischenablage fehlgeschlagen.
en = Delete {name}?
de = {name} löschen?
en = It goes from Your profiles. The settings you have now stay as they are.
de = Es verschwindet aus „Deine Profile“. Deine aktuellen Einstellungen bleiben, wie sie sind.
en = Delete
de = Löschen
en = Deleted {name}.
de = {name} gelöscht.
en = Run {game} with its anti-cheat?
de = {game} mit Anti-Cheat starten?
en = This lets you join online servers with Sim-QVFR running. The game’s anti-cheat can kick you, or ban your account, for using Sim-QVFR.\n\nSim-QVFR and its developer are not responsible for any kick or ban. By turning this on, you accept that risk and the responsibility for it.
de = So kannst du mit laufendem Sim-QVFR Online-Servern beitreten. Das Anti-Cheat des Spiels kann dich wegen Sim-QVFR kicken oder dein Konto sperren.\n\nSim-QVFR und sein Entwickler sind für Kicks oder Sperren nicht verantwortlich. Mit dem Einschalten akzeptierst du dieses Risiko und die Verantwortung dafür.
en = I accept the risk
de = Ich akzeptiere das Risiko

