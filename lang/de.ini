; No longer in Sim-QVFR (kept to reuse; ignored where the English isn't shown any more):
en = The focus area renders in full detail only along the road ahead: about 10 m either side of the road and 3.5 m above it, following its hills and bends. Trees, grandstands, hills and the sky beside and above that come from the periphery’s image, as does the cockpit; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. Turn it off if something beside the road looks softer than you want. Changes while you drive.
de = Der Fokusbereich wird nur entlang der Straße vor dir in voller Detailtiefe gerendert: etwa 10 m beiderseits der Straße und 3,5 m darüber, ihren Kuppen und Kurven folgend. Bäume, Tribünen, Hügel und Himmel daneben und darüber kommen aus dem Bild der Peripherie, ebenso das Cockpit; dort, wo du beim Fahren hinsiehst, solltest du keinen Unterschied sehen. Es spart GPU-Zeit, mehr bei einem größeren Fokusbereich. Schalte es aus, wenn dir etwas neben der Straße zu weich aussieht. Ändert sich während der Fahrt.
en = DLAA on the road only
de = DLAA nur auf der Straße
en = With Road focus and Sim-QVFR’s DLSS on: the focus area’s DLAA runs only over the rows the road covers, the rest takes the periphery’s DLAA. It saves more GPU time. Turn it off if you see a soft strip above or below the road for a moment when you look up or down quickly. Changes while you drive.
de = Mit Straßenfokus und eingeschaltetem DLSS von Sim-QVFR: Das DLAA des Fokusbereichs läuft nur über die Zeilen, die die Straße einnimmt, der Rest übernimmt das DLAA der Peripherie. Es spart noch mehr GPU-Zeit. Schalte es aus, wenn du über oder unter der Straße kurz einen weichen Streifen siehst, wenn du schnell nach oben oder unten schaust. Ändert sich während der Fahrt.
en = Full detail along the road ahead; the scenery beside and above it from the periphery.
de = Volle Details entlang der Straße vor dir; die Umgebung daneben und darüber aus der Peripherie.
en = With Sim-QVFR’s DLSS on: the focus area’s DLAA over the road’s rows alone.
de = Mit eingeschaltetem DLSS von Sim-QVFR: das DLAA des Fokusbereichs nur über den Zeilen der Straße.
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom corners: each corner moved in on its own; pull the top corners in for a trapezoid, more of the dash sharp at the same cost. To hide the area’s edge, raise Feather.
de = Die Form des scharfen Bereichs. Rechteck: abgerundet per Eckenradius. Eigene Ecken: jede Ecke einzeln nach innen gerückt; zieh die oberen Ecken für ein Trapez nach innen, mehr vom Armaturenbrett scharf bei gleichen Kosten. Um den Rand des Bereichs zu verstecken, erhöhe die weiche Kante.
en = Custom corners
de = Eigene Ecken
en = Top left in
de = Oben links innen
en = Top right in
de = Oben rechts innen
en = Bottom left in
de = Unten links innen
en = Bottom right in
de = Unten rechts innen
en = Top left down
de = Oben links runter
en = Top right down
de = Oben rechts runter
en = Bottom left up
de = Unten links hoch
en = Bottom right up
de = Unten rechts hoch
en = Custom corners pulls each corner of the focus area in, e.g. the top ones for a trapezoid
de = „Eigene Ecken“ zieht jede Ecke des Fokusbereichs ein, z. B. die oberen für ein Trapez
en = The cut corners aren't rendered: the shape saves pixels too
de = Die abgeschnittenen Ecken werden nicht gerendert: Die Form spart auch Pixel
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High. The switches below stay as you set them. Low costs about half the GPU time of High and looks a little grainier; the periphery always runs one step below the focus area, where it's least seen.
de = Wie fein die Effekte berechnet werden: bei Niedrig weniger Abtastungen und Schritte für Schatten, Verdeckung und Glättung, bei Hoch alle. Die Schalter darunter bleiben, wie du sie gesetzt hast. Niedrig kostet etwa die Hälfte der GPU-Zeit von Hoch und wirkt etwas körniger; die Peripherie läuft immer eine Stufe unter dem Fokusbereich, wo sie am wenigsten auffällt.
en = Quality sets how finely each effect is worked out, not which are on: Low costs about half the GPU time of High. Night car lighting itself starts at the next launch; everything else changes while you drive.
de = Die Qualität bestimmt, wie fein jeder Effekt berechnet wird, nicht welche an sind: Niedrig kostet etwa die Hälfte der GPU-Zeit von Hoch. Die Nachtbeleuchtung der Autos selbst startet beim nächsten Start; alles andere ändert sich während der Fahrt.
en = Sets the switches below by their GPU cost: Low keeps paint detail, lacquer reflections and headlight highlights, Medium adds shadows on the ground, High adds floodlight shadows. Night vision color isn't part of it. Changing any switch yourself shows no preset selected.
de = Stellt die Schalter unten nach ihren GPU-Kosten ein: Niedrig behält Lackdetail, Lackspiegelungen und Scheinwerferlichter, Mittel fügt Schatten am Boden hinzu, Hoch fügt Flutlichtschatten hinzu. Die Nachtsicht-Farbe gehört nicht dazu. Wenn du einen Schalter selbst änderst, ist keine Voreinstellung mehr gewählt.
en = Custom: the switches below don’t match a preset.
de = Benutzerdefiniert: Die Schalter unten passen zu keiner Voreinstellung.
en = Low, Medium and High set the switches by their GPU cost; night vision is left as you set it. Night car lighting itself starts at the next launch; everything else changes while you drive.
de = Niedrig, Mittel und Hoch stellen die Schalter nach ihren GPU-Kosten ein; die Nachtsicht bleibt, wie du sie eingestellt hast. Die Nachtbeleuchtung selbst startet beim nächsten Start; alles andere ändert sich während der Fahrt.
