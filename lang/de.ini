en = Install keeps your settings, profiles and changed files; Download opens the release’s page.
de = Installieren behält deine Einstellungen, Profile und geänderten Dateien; Herunterladen öffnet die Seite der Version.
en = Sim-QVFR is not made, approved or sanctioned by Kunos Simulazioni or the developers of the games it supports. It hooks the game's code and changes how it renders, so a game update can break it, and it can crash the game. Use it in offline sessions only, and please don't report problems you see while using it to the game's developers.
de = Sim-QVFR wird weder von Kunos Simulazioni noch von den Entwicklern der unterstützten Spiele erstellt, genehmigt oder gebilligt. Es greift in den Code des Spiels ein und ändert, wie es rendert; ein Spiel-Update kann es daher unbrauchbar machen, und es kann das Spiel abstürzen lassen. Nutze es nur in Offline-Sitzungen und melde Probleme, die du dabei siehst, bitte nicht den Entwicklern des Spiels.
en = Experimental and unofficial. Use at your own risk.
de = Experimentell und inoffiziell. Nutzung auf eigene Gefahr.

