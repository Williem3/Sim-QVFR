; src/launcher/ui/help.cpp
en = Foveated mode
it = Modalità foveale
en = Eye tracked: the sharp area follows your eyes, so it can be small and dense; it needs a headset with eye tracking. Fixed: the area stays in the centre, so make it larger, since your eyes move off it.
it = Con eye tracking: l’area nitida segue i tuoi occhi, quindi può essere piccola e densa; serve un visore con eye tracking. Fisso: l’area resta al centro, quindi rendila più grande, perché gli occhi se ne allontanano.
en = Periphery resolution
it = Risoluzione della periferia
en = The wide view around the focus area, a share of the headset’s recommended resolution. It covers most of the view but you see it with your side vision, so it is the first to lower: it saves GPU time and VRAM roughly with its pixels. The preview’s Pixels per frame shows the total.
it = L’ampia vista attorno all’area di fuoco, una quota della risoluzione consigliata del visore. Copre gran parte della vista ma la vedi con la visione laterale, quindi è la prima da abbassare: fa risparmiare tempo GPU e VRAM più o meno in proporzione ai suoi pixel. Pixel per frame nell’anteprima mostra il totale.
en = Focus density
it = Densità di fuoco
en = Pixel density inside the focus area, a share of the headset’s native density. Above 100% it renders more pixels than the headset shows where you look: sharper text and edges. Its cost grows with the area’s size, so a small area can take a high density cheaply. Dragging moves it in 5% steps; the arrow keys move it by 1%.
it = Densità di pixel dentro l’area di fuoco, una quota della densità nativa del visore. Sopra il 100% renderizza più pixel di quanti il visore ne mostri dove guardi: testo e bordi più nitidi. Il costo cresce con la dimensione dell’area, quindi un’area piccola può avere una densità alta a basso costo. Trascinando si muove a passi del 5%; i tasti freccia la spostano dell’1%.
en = Object detail
it = Dettaglio oggetti
en = How detailed trees and objects are, and how far away they are still drawn. At 100% they are as sharp in the focus region as its pixel density shows them; lower settings move toward the game’s own detail for the periphery resolution. It costs CPU, not GPU: more detail means more objects for X-Plane’s main thread to prepare every frame, often what limits the frame rate with QVFR. Lower it if frames stutter in dense scenery; the focus region shows coarser trees.
it = Quanto sono dettagliati alberi e oggetti, e fino a che distanza vengono ancora disegnati. Al 100% sono nitidi nella regione di fuoco quanto la sua densità di pixel li mostra; valori più bassi si avvicinano al dettaglio del gioco per la risoluzione della periferia. Costa CPU, non GPU: più dettaglio significa più oggetti da preparare ogni frame per il thread principale di X-Plane, spesso ciò che limita il frame rate con QVFR. Abbassalo se i frame scattano in scenari densi; la regione di fuoco mostra alberi più grossolani.
en = For a player who sees with one eye. The eye you choose shows black in the headset, and the game draws no focus view for it, renders only a few pixels of its scene and skips DLSS on it, so the GPU does much less. The game still prepares that eye’s frame, so the CPU saves little. With both eyes seeing, a black eye is uncomfortable: leave it at None.
it = Per chi vede con un solo occhio. L’occhio che scegli diventa nero nel visore e il gioco non disegna nessuna vista di fuoco per esso, ne renderizza solo pochi pixel della scena e salta il DLSS, quindi la GPU lavora molto meno. Il gioco prepara comunque il frame di quell’occhio, quindi la CPU risparmia poco. Se vedi con entrambi gli occhi, un occhio nero è scomodo: lascialo su Nessuno.
en = Sharpening
it = Nitidezza
en = Crisper edges and text in the focus area; too much makes it shimmer. Raise it a little if the view looks soft (0% is off); it costs a little GPU time and changes while you drive. How: AMD FidelityFX Contrast Adaptive Sharpening, applied as Sim-QVFR resamples the focus view for the headset. Each pixel is sharpened by how much contrast room it has, so soft detail gains the most and edges already sharp gain little. The percentage is CAS’s own sharpness, as other CAS sharpeners show it: any setting above 0% already sharpens. Only the focus area is sharpened, fading out across its feather so its edge stays even: your side vision sees shimmer more than detail. 0% is off; it changes while you drive.
it = Bordi e testo più nitidi nell’area di fuoco; troppa la fa sfarfallare. Alzala un po’ se la vista sembra morbida (0% è spento); costa un po’ di tempo GPU e cambia mentre guidi. Come: AMD FidelityFX Contrast Adaptive Sharpening, applicato mentre Sim-QVFR ricampiona la vista di fuoco per il visore. Ogni pixel viene reso più nitido in base al margine di contrasto che ha, quindi i dettagli morbidi guadagnano di più e i bordi già nitidi poco. La percentuale è la nitidezza di CAS stesso, come la mostrano altri filtri CAS: qualsiasi valore sopra lo 0% rende già più nitido. Solo l’area di fuoco viene resa più nitida, sfumando lungo la sua sfumatura perché il bordo resti uniforme: la visione laterale nota lo sfarfallio più del dettaglio. 0% è spento; cambia mentre guidi.
en = Periphery texture match
it = Allineamento texture della periferia
en = Makes fences, nets and other see-through surfaces look the same in your side vision as in the focus area. At the periphery’s lower resolution the game blends them into a light solid shade, so the focus area looked darker behind them. At 100% the periphery reads its textures at the same detail level as the focus area; lower it if distant textures shimmer in your side vision. 0% is off (the game’s own); it changes while you drive.
it = Recinzioni, reti e altre superfici traforate appaiono nella visione laterale come nell’area di fuoco. Alla risoluzione più bassa della periferia il gioco le fonde in una tinta chiara e piena, per cui l’area di fuoco dietro di esse sembrava più scura. Al 100% la periferia legge le texture allo stesso livello di dettaglio dell’area di fuoco; abbassalo se le texture lontane sfarfallano nella visione laterale. 0% è spento (come nel gioco); cambia mentre guidi.
en = Game Lighting Enhancement
it = Illuminazione di gioco migliorata
en = Adds highlights and shading to the cars at night. Sim-QVFR relights each car after the game draws it, before the game's own post-processing: highlights where the floodlights and headlights reflect off the paint, shading in creases and under the car, and the effects below. The rest of the scene is untouched. Measured on an RTX 5070 Ti with everything on at High: about 1 ms of GPU time in a quiet scene, 2 to 3.7 ms in race traffic, and 0.4 to 0.9 ms of CPU time; none of the switches below adds measurable CPU time. The switch takes effect at the next launch; the values and effects change while you drive.
it = Aggiunge riflessi di luce e ombreggiatura alle auto di notte. Sim-QVFR riillumina ogni auto dopo che il gioco l’ha disegnata, prima della post-elaborazione del gioco: riflessi di luce dove riflettori e fari si specchiano sulla vernice, ombreggiatura nelle pieghe e sotto l’auto, e gli effetti qui sotto. Il resto della scena non viene toccato. Misurato su una RTX 5070 Ti con tutto attivo in Alta: circa 1 ms di GPU in una scena tranquilla, da 2 a 3,7 ms nel traffico di gara e da 0,4 a 0,9 ms di CPU; nessuno degli interruttori qui sotto aggiunge tempo CPU misurabile. L’interruttore si applica al prossimo avvio; i valori e gli effetti cambiano mentre guidi.
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High; the reflections keep all theirs at every tier. The switches below stay as you set them, and the periphery always runs one step below the focus area, where it's least seen. Measured in a night race on an RTX 5070 Ti with everything on: High 1.35 to 1.55 ms of GPU time, Medium 1.10 to 1.30 ms, Low 1.00 to 1.10 ms, a quarter to a third less than High. In testing Low looked a little grainier than High, its floodlight shadows almost unchanged.
it = Con quale finezza vengono calcolati gli effetti: meno campioni e passi per ombre, occlusione e smussatura in Bassa, tutti in Alta; i riflessi mantengono tutti i loro a ogni livello. Gli interruttori qui sotto restano come li hai impostati, e la periferia gira sempre un livello sotto l’area di focus, dove si nota meno. Misurato in una gara notturna su una RTX 5070 Ti con tutto attivo: Alta da 1,35 a 1,55 ms di GPU, Media da 1,10 a 1,30 ms, Bassa da 1,00 a 1,10 ms, da un quarto a un terzo in meno di Alta. Nei test Bassa appariva un po’ più granulosa di Alta, con le ombre dei riflettori quasi invariate.
en = Fill light
it = Luce di riempimento
en = How much of the game's own floodlight lighting stays on the cars. Lower makes the shading and highlights stand out more; 100% keeps the game's brightness. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
it = Quanta dell’illuminazione dei riflettori del gioco resta sulle auto. Più basso fa risaltare di più ombreggiatura e riflessi di luce; 100% mantiene la luminosità del gioco. Fa parte della riilluminazione di base, circa 0,4 ms di GPU in una scena tranquilla e 1 ms nel traffico di gara (misurato in Alta su una RTX 5070 Ti), e costa uguale a qualsiasi valore.
en = Ambient occlusion
it = Occlusione ambientale
en = Darkens creases, wheel arches and the underside, where light reaches less. 0% is off. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
it = Scurisce le pieghe, i passaruota e la parte inferiore, dove arriva meno luce. 0% è spento. Fa parte della riilluminazione di base, circa 0,4 ms di GPU in una scena tranquilla e 1 ms nel traffico di gara (misurato in Alta su una RTX 5070 Ti), e costa uguale a qualsiasi valore.
en = Highlights
it = Lucentezze
en = The strength of the floodlights' and headlights' reflections on the paint. 0% is off; above 100% is brighter than the lights would make it. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
it = L’intensità dei riflessi di riflettori e fari sulla vernice. 0% è spento; oltre 100% è più luminoso di quanto farebbero le luci. Fa parte della riilluminazione di base, circa 0,4 ms di GPU in una scena tranquilla e 1 ms nel traffico di gara (misurato in Alta su una RTX 5070 Ti), e costa uguale a qualsiasi valore.
en = Paint gloss
it = Lucidità vernice
en = How glossy the lacquer is: higher gives smaller, sharper highlights, lower broad soft ones. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
it = Quanto è lucida la vernice: più alto dà riflessi di luce più piccoli e netti, più basso ampi e morbidi. Fa parte della riilluminazione di base, circa 0,4 ms di GPU in una scena tranquilla e 1 ms nel traffico di gara (misurato in Alta su una RTX 5070 Ti), e costa uguale a qualsiasi valore.
en = Smoothing
it = Smussatura
en = Smooths the surface direction over this distance where the game's own normals aren't available, which hides faceted highlights on low-polygon parts. About 15 cm suits most cars; 0 is off.
it = Leviga la direzione della superficie su questa distanza dove le normali del gioco non sono disponibili, nascondendo i riflessi sfaccettati sulle parti con pochi poligoni. Circa 15 cm vanno bene per la maggior parte delle auto; 0 è spento.
en = Floodlight shadows
it = Ombre dei riflettori
en = A part of a car hidden from a floodlight, behind a wing or another car, loses that light and its highlight. Measured at High on an RTX 5070 Ti: about 0.2 ms of GPU time in a quiet scene, 0.5 ms in race traffic.
it = Una parte di un’auto nascosta a un riflettore, dietro un alettone o un’altra auto, perde quella luce e il suo riflesso. Misurato in Alta su una RTX 5070 Ti: circa 0,2 ms di GPU in una scena tranquilla, 0,5 ms nel traffico di gara.
en = Paint detail
it = Dettaglio vernice
en = Uses the paint's fine surface detail, orange peel and the carbon weave, in the highlights. Measured at High on an RTX 5070 Ti: about 0.1 ms of GPU time in race traffic, too little to measure in a quiet scene.
it = Usa nei riflessi di luce il fine dettaglio della superficie della vernice, la buccia d’arancia e la trama del carbonio. Misurato in Alta su una RTX 5070 Ti: circa 0,1 ms di GPU nel traffico di gara, troppo poco da misurare in una scena tranquilla.
en = Lacquer reflections
it = Riflessi della vernice
en = Mirrors what's around a car in its paint, strongest at shallow angles. Only what's on screen can be reflected, and only where both eyes can see it, so both eyes show the same. Measured on an RTX 5070 Ti: about 0.02 ms of GPU time in a quiet scene, 0.15 ms in race traffic.
it = Specchia nella vernice ciò che circonda l’auto, soprattutto ad angoli radenti. Si può riflettere solo ciò che è sullo schermo e solo dove lo vedono entrambi gli occhi, così i due occhi mostrano la stessa cosa. Misurato su una RTX 5070 Ti: circa 0,02 ms di GPU in una scena tranquilla, 0,15 ms nel traffico di gara.
en = Headlight highlights
it = Lucentezze dei fari
en = Other cars' headlights, and yours in the mirrors, shine on the paint as the floodlights do. Measured on an RTX 5070 Ti: about 0.03 to 0.05 ms of GPU time.
it = I fari delle altre auto, e i tuoi negli specchietti, illuminano la vernice come i riflettori. Misurato su una RTX 5070 Ti: circa 0,03-0,05 ms di GPU.
en = Shadows on the ground
it = Ombre a terra
en = Darkens the track and walls under and beside the cars, and casts soft floodlight shadows, so the cars sit on the ground. Measured at High on an RTX 5070 Ti: about 0.2 ms of GPU time in a quiet scene, 0.55 ms in race traffic.
it = Scurisce la pista e i muri sotto e accanto alle auto, e proietta morbide ombre dei riflettori, così le auto poggiano a terra. Misurato in Alta su una RTX 5070 Ti: circa 0,2 ms di GPU in una scena tranquilla, 0,55 ms nel traffico di gara.
en = Night vision color
it = Colore visione notturna
en = As eyes do at night, dark areas lose their colour and turn slightly blue while lit areas keep theirs. A matter of taste, off by default. Measured on an RTX 5070 Ti: about 0.03 ms of GPU time.
it = Come gli occhi di notte, le zone scure perdono colore e virano leggermente al blu mentre quelle illuminate mantengono il loro. Questione di gusti, spento di default. Misurato su una RTX 5070 Ti: circa 0,03 ms di GPU.
en = Color correction
it = Correzione colore
en = Adjusts the picture in the headset: exposure, brightness, contrast and saturation, for a game that looks too dark, washed out or dull in your headset. Sim-QVFR applies it as it composes the views, the periphery and the focus area alike, so the focus area never stands out; it costs almost no GPU time and changes while you drive. Menus and loading screens show as the game draws them. Off, or every value at 0, leaves the picture as it was.
it = Regola l’immagine nel visore: esposizione, luminosità, contrasto e saturazione, per un gioco che nel tuo visore sembra troppo scuro, slavato o spento. Sim-QVFR la applica mentre compone le viste, sulla periferia e sull’area di fuoco allo stesso modo, così l’area di fuoco non si nota mai; costa quasi nulla di GPU e cambia mentre guidi. Menu e schermate di caricamento appaiono come li disegna il gioco. Spenta, o con tutti i valori a 0, l’immagine resta com’era.
en = Exposure
it = Esposizione
en = Scales all of the light, in stops (EV): +1.0 EV is twice as bright, -1.0 EV half, up to 3 stops either way. Highlights brighten with the rest and can clip, so raise it a little at a time; Brightness lifts the darks without touching them.
it = Scala tutta la luce, in stop (EV): +1,0 EV è il doppio più luminoso, -1,0 EV la metà, fino a 3 stop in entrambe le direzioni. Le alte luci si schiariscono con il resto e possono bruciarsi, quindi alzala un po’ alla volta; la luminosità alza gli scuri senza toccarli.
en = Brightness
it = Luminosità
en = Lightens or darkens the mid tones and shadows while black stays black and white stays white, so an OLED headset keeps its deep blacks: raise it to see into dark cockpits and night stints, lower it for a richer, darker picture.
it = Schiarisce o scurisce i mezzitoni e le ombre mentre il nero resta nero e il bianco resta bianco, così un visore OLED mantiene i suoi neri profondi: alzala per vedere negli abitacoli scuri e nei turni notturni, abbassala per un’immagine più ricca e scura.
en = Contrast
it = Contrasto
en = Spreads the picture’s tones away from mid grey (above 0) or draws them towards it (below 0), as a gentle S-curve: black and white stay where they are and colours keep their hue. More contrast gives deeper shadows and brighter highlights; less shows more detail in both.
it = Allontana i toni dell’immagine dal grigio medio (sopra 0) o li avvicina (sotto 0), come una dolce curva a S: nero e bianco restano dove sono e i colori mantengono la tinta. Più contrasto dà ombre più profonde e luci più brillanti; meno mostra più dettaglio in entrambe.
en = Saturation
it = Saturazione
en = How strong the colours are: above 0 more vivid, below 0 more muted, -100% grey. Brightness is kept as each colour changes.
it = Quanto sono intensi i colori: sopra 0 più vivaci, sotto 0 più spenti, -100% grigio. La luminosità resta mentre ogni colore cambia.
en = Accent brightness
it = Luminosità dell’accento
en = How light or dark the game’s colour is. The wheel picks its hue and how strong it is; the launcher keeps its text and edges readable in light and dark mode.
it = Quanto è chiaro o scuro il colore del gioco. La ruota sceglie la tinta e la sua intensità; il launcher mantiene leggibili testo e bordi in modalità chiara e scura.
en = Focus width
it = Larghezza del fuoco
en = The focus area’s width, a share of the view. Wider hides the edge between sharp and soft better; its pixels cost density × width × height, so a wide area at a high density costs the most. It changes while you drive; wider than the game started with (at your density) renders less dense until the next launch.
it = La larghezza dell’area di fuoco, una quota della vista. Più larga nasconde meglio il confine tra nitido e morbido; i suoi pixel costano densità × larghezza × altezza, quindi un’area larga a densità alta costa di più. Cambia mentre guidi; più larga di quella con cui è partito il gioco (alla tua densità) viene renderizzata meno densa fino al prossimo avvio.
en = Focus height
it = Altezza del fuoco
en = The focus area’s height, a share of the view. Taller covers more of the dash and mirrors; it costs pixels as the width does. Taller than the game started with (at your density) renders less dense until the next launch.
it = L’altezza dell’area di fuoco, una quota della vista. Più alta copre più cruscotto e specchietti; costa pixel come la larghezza. Più alta di quella con cui è partito il gioco (alla tua densità) viene renderizzata meno densa fino al prossimo avvio.
en = Corner radius
it = Raggio degli angoli
en = Rounds the focus area’s corners, so its edge is harder to spot. No cost: the area renders as a rectangle either way.
it = Arrotonda gli angoli dell’area di fuoco, così il bordo si nota meno. Nessun costo: l’area viene renderizzata comunque come rettangolo.
en = Feather
it = Sfumatura
en = The band where the focus area blends into the outer view. Wider hides the edge better; no measurable cost.
it = La fascia in cui l’area di fuoco si fonde con la vista esterna. Più larga nasconde meglio il bordo; nessun costo misurabile.
en = Regulate focus density
it = 
en = Takes Focus density down 1% at a time while the GPU time per frame stays over Lower above, and back up while it stays under Raise below. The density you set is the most it uses; it is never written over. It stops at 50%.
it = 
en = Regulate periphery resolution
it = 
en = Takes Periphery resolution down 1% at a time while the GPU time per frame stays over Lower above, and back up while it stays under Raise below. The resolution you set is the most it uses; it is never written over. It stops at 20%.
it = 
en = Require high GPU load
it = 
en = Requires at least 90% GPU load before lowering resolution. Turn it off to react to GPU frame time alone.
it = 
en = Lower above
it = 
en = The GPU time per frame, in ms, over which the regulator lowers what it regulates. It is the time the layer measures on the GPU for the eye passes (the log’s scene span), not the overlay’s GPU number. At 90 Hz a frame has 11.1 ms; frames start to miss a little under that, so 10 ms is a start.
it = 
en = Raise below
it = 
en = The GPU time per frame, in ms, under which the regulator raises what it regulates again. Keep it a ms or more under Lower above, so it does not go up and down: between the two limits nothing changes.
it = 
en = Frames before lowering
it = 
en = How many frames in a row must run over Lower above before the regulator takes a 1% step down (1-50). Keep it low to react quickly: at 90 Hz, 10 frames is about a tenth of a second per step. A frame under Raise below starts the count again.
it = 
en = Frames before raising
it = 
en = How many frames in a row must run under Raise below before the regulator takes a 1% step back up (50-300). Keep it high to come back slowly: at 90 Hz, 300 frames is about three seconds per step. A frame over Lower above starts the count again.
it = 
en = Gaze dead-zone
it = Zona morta dello sguardo
en = How far your eyes move before the focus area follows. A little keeps it still against eye-tracker noise; too much makes it lag when you look around. No GPU cost.
it = Quanto devono muoversi gli occhi prima che l’area di fuoco li segua. Un po’ la tiene ferma contro il rumore dell’eye tracker; troppa la fa ritardare quando ti guardi intorno. Nessun costo GPU.
en = Gaze offset
it = Offset dello sguardo
en = Moves the eye-tracked focus area up or down, in degrees, for a tracker that sits a little off. No cost.
it = Sposta l’area di fuoco con eye tracking in su o in giù, in gradi, per un tracker leggermente disallineato. Nessun costo.
en = Vertical position
it = Posizione verticale
en = Moves the fixed focus area up or down, in degrees: towards the dash and mirrors, or the road. No cost.
it = Sposta l’area di fuoco fissa in su o in giù, in gradi: verso cruscotto e specchietti, o verso la strada. Nessun costo.
en = Crop the view
it = Ritaglia la vista
en = Cuts the edges a helmet or the lens hides before the game renders them. It saves GPU time and VRAM with the pixels cut; the headset shows black there.
it = Taglia i bordi che un casco o la lente nascondono prima che il gioco li renderizzi. Fa risparmiare tempo GPU e VRAM in base ai pixel tagliati; lì il visore mostra nero.
en = Top
it = Sopra
en = How much of the top of each eye’s view the game doesn’t render. Saves pixels in proportion.
it = Quanta parte superiore della vista di ogni occhio il gioco non renderizza. Fa risparmiare pixel in proporzione.
en = Bottom
it = Sotto
en = How much of the bottom of each eye’s view the game doesn’t render. Saves pixels in proportion.
it = Quanta parte inferiore della vista di ogni occhio il gioco non renderizza. Fa risparmiare pixel in proporzione.
en = Outer side (temple)
it = Lato esterno (tempia)
en = How much of each eye’s temple side the game doesn’t render. Saves pixels in proportion.
it = Quanta parte del lato tempia di ogni occhio il gioco non renderizza. Fa risparmiare pixel in proporzione.
en = Inner side (nose)
it = Lato interno (naso)
en = How much of each eye’s nose side the game doesn’t render; the other eye still sees most of it. Saves pixels in proportion.
it = Quanta parte del lato naso di ogni occhio il gioco non renderizza; l’altro occhio ne vede comunque la maggior parte. Fa risparmiare pixel in proporzione.
en = Show a helmet
it = Mostra un casco
en = Draws a helmet’s visor opening round the view, lit by the scene, in a layer of its own. It costs the headset a layer to composite; nothing for the game.
it = Disegna l’apertura della visiera di un casco attorno alla vista, illuminata dalla scena, in un layer tutto suo. Al visore costa un layer da comporre; al gioco niente.
en = Road focus
it = Focus sulla strada
en = For fixed foveation. The focus area renders in full detail only along the road ahead (Road width either side of it and 3.5 m above it, following its hills and bends) and in your own car: the wheel, dash, displays and mirrors inside the focus area stay sharp. Trees, grandstands, hills and the sky beside and above the road come from the periphery’s image; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. It’s off while the focus follows your eyes. Turn it off if something beside the road looks softer than you want. Changes while you drive.
it = Per la foveazione fissa. L’area di focus viene renderizzata con pieno dettaglio solo lungo la strada davanti a te (la larghezza della strada per lato e 3,5 m sopra, seguendo dossi e curve) e nella tua auto: volante, cruscotto, display e specchietti nell’area di focus restano nitidi. Alberi, tribune, colline e cielo accanto e sopra la strada arrivano dall’immagine della periferia; dove guardi mentre guidi non dovresti notare differenze. Fa risparmiare tempo GPU, di più con un’area di focus più grande. È disattivato mentre il focus segue i tuoi occhi. Disattivalo se qualcosa a bordo strada ti sembra troppo morbido. Cambia mentre guidi.
en = Road width
it = Larghezza della strada
en = How far either side of the road’s centre stays in full detail with Road focus on. Lower keeps just the track sharp and saves the most; higher brings the kerbs, run-off and barriers into the focus area and saves less. 10 m suits most circuits. Changes while you drive.
it = Fin dove, ai lati del centro della strada, resta il pieno dettaglio con il focus sulla strada attivo. Più basso tiene nitida solo la pista e fa risparmiare di più; più alto porta cordoli, vie di fuga e barriere nell’area di focus e fa risparmiare meno. 10 m vanno bene per la maggior parte dei circuiti. Cambia mentre guidi.
en = Cockpit preset
it = Preimpostazione abitacolo
en = The focus area’s shape, size and position Road focus sets when you switch it on, or at once when you pick the other one here. A: a large cockpit shape over the windscreen, dash and wheel. B: a smaller one moved down to the road and the dash. Adjust either afterwards as you like; your own shape, size and position come back when you switch Road focus off. When the headset composes the views itself, the size stays inside its own focus region and the position doesn’t apply.
it = La forma, la dimensione e la posizione dell’area di focus che il focus sulla strada imposta quando lo attivi, o subito quando scegli l’altra qui. A: una forma di abitacolo grande su parabrezza, cruscotto e volante. B: una più piccola, spostata in basso su strada e cruscotto. Regolale poi come preferisci; la tua forma, dimensione e posizione tornano quando disattivi il focus sulla strada. Quando il visore compone da sé le viste, la dimensione resta nella sua area di focus e la posizione non si applica.
en = Road widening
it = Allargamento della strada
en = How much Road focus’s sharp road widens with distance, in degrees either side, so a bend curving away far ahead (Eau Rouge, a hairpin, the pit exit) stays in full detail. Lower saves more, but a far bend can turn soft; higher catches tighter bends and brings more of the far scenery into the focus area, saving less. 15° suits most circuits. Changes while you drive.
it = Quanto si allarga con la distanza la strada nitida del focus sulla strada, in gradi per lato, perché una curva che si allontana lontano davanti (l’Eau Rouge, un tornante, l’uscita dei box) resti nel pieno dettaglio. Più basso fa risparmiare di più, ma una curva lontana può diventare sfocata; più alto prende curve più strette e porta più paesaggio lontano nell’area di focus, quindi fa risparmiare meno. 15° vanno bene per la maggior parte dei circuiti. Cambia mentre guidi.
en = Road edge blend
it = Sfumatura dei bordi della strada
en = How softly Road focus’s full detail fades into the periphery at its edges: this many metres near you, wider in proportion far away so distant edges fade too. Raise it if you notice where the sharp area ends; 0 is a hard edge. Changes while you drive.
it = Quanto morbidamente il pieno dettaglio del focus sulla strada sfuma nella periferia ai bordi: tanti metri vicino a te, più largo in proporzione in lontananza così sfumano anche i bordi lontani. Alzala se noti dove finisce l’area nitida; 0 è un bordo netto. Cambia mentre guidi.
en = Show Road focus area
it = Mostra l’area del focus sulla strada
en = Tints blue, in the headset, everything Road focus takes from the periphery, so you can see exactly what stays in full detail (untinted) as you drive. Road focus works as usual meanwhile. For setting up; turn it off to drive.
it = Colora di blu, nel visore, tutto ciò che il focus sulla strada prende dalla periferia, così vedi esattamente cosa resta a pieno dettaglio (non colorato) mentre guidi. Il focus sulla strada intanto funziona come sempre. Per la regolazione; disattivalo per guidare.
en = Road height
it = Altezza della strada
en = How high above the road stays in full detail with Road focus on. Lower keeps just the road and the cars sharp and saves the most; higher brings signs, gantries and the grandstands’ lower rows into the focus area and saves less. 3.5 m suits most circuits. Changes while you drive.
it = Fino a che altezza sopra la strada resta il pieno dettaglio con il focus sulla strada attivo. Più basso tiene nitidi solo la strada e le auto e fa risparmiare di più; più alto porta cartelli, portali e le prime file delle tribune nell’area di focus e fa risparmiare meno. 3,5 m vanno bene per la maggior parte dei circuiti. Cambia mentre guidi.
en = Show focus outline
it = Mostra contorno del fuoco
en = Draws the focus area’s edge, to see where it is and how it follows your eyes. For setting up; turn it off to drive.
it = Disegna il bordo dell’area di fuoco, per vedere dov’è e come segue i tuoi occhi. Serve per la configurazione; spegnilo per guidare.
en = Use Cheeky Foveated DLSS
it = Usa Cheeky Foveated DLSS
en = Runs Cheeky Foveated DLSS inside the game, for the DLSS options below. Needs an NVIDIA RTX GPU, DLSS on in the game, and Cheeky’s download. Applies at the next launch.
it = Esegue Cheeky Foveated DLSS dentro il gioco, per le opzioni DLSS qui sotto. Richiede una GPU NVIDIA RTX, DLSS attivo nel gioco e il download di Cheeky. Si applica al prossimo avvio.
en = Cheaper outer views
it = Viste esterne più leggere
en = The outer views get Cheeky’s DLAA at a lower resolution instead of the game’s DLSS: GPU time saved on the views you see least.
it = Le viste esterne ricevono il DLAA di Cheeky a risoluzione più bassa invece del DLSS del gioco: tempo GPU risparmiato sulle viste che guardi meno.
en = Outer DLAA scale
it = Scala DLAA esterna
en = The resolution of that cheaper pass. Lower saves more GPU time and softens the side view.
it = La risoluzione di quel passaggio più leggero. Più bassa fa risparmiare più tempo GPU e ammorbidisce la vista laterale.
en = Focus supersampling
it = Supersampling del fuoco
en = Renders the focus views above their size before DLSS: a sharper centre, for more GPU time.
it = Renderizza le viste di fuoco oltre la loro dimensione prima del DLSS: un centro più nitido, in cambio di più tempo GPU.
en = Frame generation
it = Generazione dei frame
en = Cheeky’s DLSS frame generation adds frames between the game’s: smoother motion when the game can’t hold the refresh rate, for some GPU time and latency. Turn OpenXR Toolkit’s Turbo mode off with it, and run no other frame generator.
it = La generazione dei frame DLSS di Cheeky aggiunge frame tra quelli del gioco: movimento più fluido quando il gioco non regge la frequenza di aggiornamento, al costo di un po’ di tempo GPU e latenza. Disattiva insieme la modalità Turbo di OpenXR Toolkit e non usare altri generatori di frame.
en = Center region
it = Regione centrale
en = The part of the view frame generation makes at full quality (it follows your eyes when eye tracked). Larger looks better and costs more GPU time.
it = La parte della vista che la generazione dei frame crea a piena qualità (segue i tuoi occhi con eye tracking). Più grande è più bella e costa più tempo GPU.
en = Load order
it = Ordine di caricamento
en = Nearest the game first. Each launch loads these below the Sim-QVFR layer in this order; a layer off in Windows can still be loaded for the game alone. Locked switches keep the mod and the game working.
it = Il più vicino al gioco per primo. Ogni avvio li carica sotto il layer di Sim-QVFR in quest’ordine; un layer spento in Windows può comunque essere caricato solo per il gioco. Gli interruttori bloccati mantengono funzionanti la mod e il gioco.
en = Describe the problem
it = Descrivi il problema
en = Zips the logs and the game’s crash reports from those sessions (names and account IDs taken out) into the logs folder, then opens a new issue on GitHub with what you wrote, your settings, the last session and your PC filled in. Add the steps there, and drag in the zip (it shows below) and any screenshots.
it = Comprime in uno zip i log e i crash report del gioco di quelle sessioni (senza nomi e ID account) nella cartella dei log, poi apre una nuova segnalazione su GitHub con ciò che hai scritto, le tue impostazioni, l’ultima sessione e il tuo PC già compilati. Aggiungi lì i passaggi e trascina lo zip (appare qui sotto) ed eventuali screenshot.
en = Busiest threads
it = Thread più occupati
en = Each thread is a share of ONE core. A thread near 100% can hold the frame rate back even when Windows shows the whole CPU at 15%; a thread that spins by design looks busy whatever limits it.
it = Ogni thread è una quota di UN core. Un thread vicino al 100% può frenare il frame rate anche quando Windows mostra l’intera CPU al 15%; un thread che gira a vuoto per scelta sembra occupato qualunque cosa lo limiti.
en = Frame rate
it = Frame rate
en = The last session’s average against the headset’s refresh rate, the frame rate it asks for. Below it, the runtime fills the gaps (motion smoothing or reprojection), which shows as wobble on moving edges.
it = La media dell’ultima sessione rispetto alla frequenza di aggiornamento del visore, il frame rate che richiede. Sotto, il runtime riempie i vuoti (motion smoothing o riproiezione), che si vede come tremolio sui bordi in movimento.
en = Slow frames
it = Frame lenti
en = How long your slowest frames take: lower is smoother. One frame in ten took at least this long (the 90th percentile). Above the frame’s budget (1000 ms divided by the headset’s refresh rate: 11.1 ms at 90 Hz) those frames miss the headset, and you feel stutter even when the average frame rate looks fine.
it = Quanto durano i tuoi frame più lenti: più basso è più fluido. Un frame su dieci ha impiegato almeno questo tempo (il 90° percentile). Oltre il budget del frame (1000 ms divisi per la frequenza del visore: 11,1 ms a 90 Hz) quei frame mancano il visore e senti scatti anche quando il frame rate medio sembra buono.
en = Limited by
it = Limitato da
en = What held the frame back most of the time: the game’s render thread on the CPU, the GPU, or nothing (the headset’s refresh). Lowering resolution helps only when the GPU limits it.
it = Cosa ha frenato il frame la maggior parte del tempo: il thread di rendering del gioco sulla CPU, la GPU o niente (la frequenza del visore). Abbassare la risoluzione aiuta solo quando il limite è la GPU.
en = Previous session
it = Sessione precedente
en = The session before the last one for this game, and the settings changed in between, so you can see what a change did. A change while you drive (here or in the headset menu) starts a new stint, kept as its own entry; each covers the whole stint, with the moments the headset menu was open left out. Compare runs on the same track and car for a fair difference.
it = La sessione prima dell’ultima per questo gioco, e le impostazioni cambiate nel frattempo, così vedi l’effetto di una modifica. Una modifica mentre guidi (qui o nel menu del visore) avvia un nuovo stint, salvato come voce a sé; ognuna copre l’intero stint, esclusi i momenti con il menu del visore aperto. Confronta giri sulla stessa pista e auto per una differenza onesta.
en = Run with anti-cheat
it = Avvia con anti-cheat
en = Starts the game through its anti-cheat (Easy Anti-Cheat), as Steam does, with Sim-QVFR running, so you can join online servers. Sim-QVFR runs inside the game, and the anti-cheat may kick you or ban your account for it. Sim-QVFR and its developer aren’t responsible for kicks or bans: turning it on asks you to accept that risk. Off starts the game without its anti-cheat, for offline sessions only.
it = Avvia il gioco tramite il suo anti-cheat (Easy Anti-Cheat), come fa Steam, con Sim-QVFR attivo, così puoi entrare nei server online. Sim-QVFR gira dentro il gioco e l’anti-cheat potrebbe espellerti o bannare il tuo account per questo. Sim-QVFR e il suo sviluppatore non sono responsabili di espulsioni o ban: attivandolo accetti questo rischio. Spento, il gioco parte senza anti-cheat, solo per sessioni offline.
en = Layers for
it = Layer per
en = Launches from here: the VR add-ons (OpenXR layers) a launch from this launcher loads, below Sim-QVFR, in an order of its own; nothing else changes. Every app: Windows’ own list, which every other app uses (and the game started from Steam), saved in the registry when you apply, with a backup in the logs folder first.
it = Avvii da qui: i componenti VR (layer OpenXR) che un avvio da questo launcher carica, sotto Sim-QVFR, in un ordine tutto suo; nient’altro cambia. Tutte le app: l’elenco di Windows, usato da ogni altra app (e dal gioco avviato da Steam), salvato nel registro quando applichi, con prima un backup nella cartella dei log.
en = CPU capture
it = Cattura CPU
en = At the next launch, the CPU capture hotkey (Ctrl+Alt+C) while driving records for 20 s where the game’s busiest threads spend their time, into a cpu-profile file in the logs folder. The headset menu shows when it starts and ends; the game may stutter slightly while it records.
it = Al prossimo avvio, la scorciatoia di cattura CPU (Ctrl+Alt+C) durante la guida registra per 20 s dove i thread più occupati del gioco passano il tempo, in un file cpu-profile nella cartella dei log. Il menu del visore mostra quando inizia e finisce; il gioco può scattare leggermente durante la registrazione.
en = Frame capture
it = Cattura frame
en = Saves the game’s own image and the composed output, as PNG files in the captures folder inside the logs folder. Each press saves one more frame, to compare the views where something looks wrong. In X-Plane 12, Assetto Corsa Competizione and Le Mans Ultimate.
it = Salva l’immagine del gioco e l’uscita composta, come file PNG nella cartella captures dentro la cartella dei log. Ogni pressione salva un frame in più, per confrontare le viste dove qualcosa sembra sbagliato. In X-Plane 12, Assetto Corsa Competizione e Le Mans Ultimate.
en = Next launch without QVFR
it = Prossimo avvio senza QVFR
en = Starts the game once with its own two views and QVFR off, still measuring, so Diagnostics can compare the same race with and without QVFR. It turns itself off after that launch; the next one has QVFR again. The performance overlay works in it, the headset menu does not.
it = Avvia il gioco una volta con le sue due viste e QVFR spento, continuando a misurare, così Diagnostica può confrontare la stessa gara con e senza QVFR. Si disattiva da solo dopo quell’avvio; il successivo ha di nuovo QVFR. L’overlay prestazioni funziona, il menu del visore no.
en = Detailed logs
it = Log dettagliati
en = Normal logs say what Sim-QVFR set up, decided and measured. Detailed logs add every step behind that, for a bug report when the developer asks for one. They last three launches and then turn themselves off, so the logs stay small. Send them with Report an issue, or Save the logs as a zip.
it = I log normali dicono cosa Sim-QVFR ha impostato, deciso e misurato. I log dettagliati aggiungono ogni passaggio dietro a questo, per una segnalazione di bug quando lo sviluppatore la chiede. Durano tre avvii e poi si disattivano, così i log restano piccoli. Inviali con Segnala un problema, o Salva i log come zip.
en = Logs folder
it = Cartella dei log
en = Each launch adds a session log and a small run folder. The launcher keeps the newest 30 sessions and removes older ones at each launch, and the newest 10 CPU captures. Frame captures and game image dumps stay until you clear them: Clear captures moves them to the Recycle Bin.
it = Ogni avvio aggiunge un log di sessione e una piccola cartella di esecuzione. Il launcher tiene le 30 sessioni più recenti e rimuove le più vecchie a ogni avvio, e le 10 catture CPU più recenti. Le catture dei frame e i dump delle immagini del gioco restano finché non li cancelli: Cancella catture li sposta nel Cestino.
en = Presets for eye tracked foveation
it = Preset per la foveazione con eye tracking
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Eye tracked, the area follows your eyes, so it can be small and very sharp. They set the resolution only and keep everything else.
it = Punti di partenza che mettono i pixel al centro: viste esterne basse e un’area di fuoco densa. Con eye tracking l’area segue i tuoi occhi, quindi può essere piccola e molto nitida. Impostano solo la risoluzione e lasciano tutto il resto.
en = Presets for fixed foveation
it = Preset per la foveazione fissa
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Fixed, your eyes move off the centre, so the area is larger and a little less dense. They set the resolution only and keep everything else.
it = Punti di partenza che mettono i pixel al centro: viste esterne basse e un’area di fuoco densa. Con il fisso gli occhi si spostano dal centro, quindi l’area è più grande e un po’ meno densa. Impostano solo la risoluzione e lasciano tutto il resto.
en = Your profiles
it = I tuoi profili
en = A profile holds every setting of the picture: resolution, foveation and the focus overlay, and where the game has them the view crop, the helmet and Foveated DLSS. Not the menu’s and overlay’s places, the hotkeys or the OpenXR layers. Share copies one as a line of text to paste in a chat; Paste adds one from the clipboard. The headset menu’s Profile line switches between them while you drive.
it = Un profilo contiene ogni impostazione dell’immagine: risoluzione, foveazione e il contorno del fuoco, e dove il gioco li ha il ritaglio della vista, il casco e Foveated DLSS. Non le posizioni di menu e overlay, le scorciatoie o i layer OpenXR. Condividi ne copia uno come riga di testo da incollare in una chat; Incolla ne aggiunge uno dagli appunti. La riga Profilo del menu del visore passa dall’uno all’altro mentre guidi.
en = A key’s first press also opens the menu. A wheel’s directions act only while the menu shows, so a switch the game also uses doesn’t open it: use Open or close first.
it = La prima pressione di un tasto apre anche il menu. Le direzioni del volante agiscono solo mentre il menu è visibile, quindi un comando usato anche dal gioco non lo apre: usa prima Apri o chiudi.
en = Keys work while the game window has focus; wheel, button box and controller buttons work whenever the game runs.
it = I tasti funzionano quando la finestra del gioco è in primo piano; i pulsanti di volante, button box e controller funzionano finché il gioco è in esecuzione.
en = Field of view crop
it = Ritaglio del campo visivo
en = The outer view keeps its sharpness and the focus region its size. Changes reach a running game at once; with DLSS on, or with less crop than at launch, the pixel count follows at the next launch.
it = La vista esterna mantiene la sua nitidezza e la regione di fuoco la sua dimensione. Le modifiche arrivano subito a un gioco in esecuzione; con DLSS attivo, o con meno ritaglio che all’avvio, il numero di pixel si aggiorna al prossimo avvio.
en = Helmet overlay
it = Overlay del casco
en = Built in, the visor opening follows the crop (Rim and Corners). Your own helmet: top.png, bottom.png and visor.png with alpha in the helmet folder next to the layer; the log suggests the crop that matches them.
it = Con quello integrato, l’apertura della visiera segue il ritaglio (Bordo e Angoli). Il tuo casco: top.png, bottom.png e visor.png con alfa nella cartella helmet accanto al layer; il log suggerisce il ritaglio adatto.
en = Focus shape
it = Forma del fuoco
en = Each corner moves toward the middle of the focus region, percent of its width (in) or height (down, up). Pull the top corners in for a trapezoid: more of the dash sharp, less of the far field. The focus view still renders the whole box, so the cost stays the same.
it = Ogni angolo si sposta verso il centro della regione di fuoco, in percentuale della larghezza (dentro) o dell’altezza (giù, su). Porta dentro gli angoli superiori per un trapezio: più cruscotto nitido, meno campo lontano. La vista di fuoco renderizza comunque l’intero riquadro, quindi il costo non cambia.
en = Cheeky Foveated DLSS
it = Cheeky Foveated DLSS
en = No Cheeky loader goes in the game folder: Sim-QVFR loads Cheeky’s runtime into the game itself.
it = Nessun loader di Cheeky va nella cartella del gioco: Sim-QVFR carica il runtime di Cheeky direttamente nel gioco.
en = Frame generation (experimental)
it = Generazione dei frame (sperimentale)
en = Outside the center region frames are warped with the game’s motion. Lower scales use less GPU time and memory. With an eye-tracked focus (the Foveation card) the region follows your eyes too, through Cheeky’s OpenXR layer.
it = Fuori dalla regione centrale i frame vengono deformati con il movimento del gioco. Scale più basse usano meno tempo GPU e memoria. Con un fuoco con eye tracking (la scheda Foveazione) anche la regione segue i tuoi occhi, tramite il layer OpenXR di Cheeky.
en = The settings menu stays 0.8 m in front of your head, wherever you look.
it = Il menu delle impostazioni resta 0,8 m davanti alla tua testa, ovunque guardi.
en = Use DLSS
it = Usa DLSS
en = Sim-QVFR evaluates NVIDIA’s DLSS on each view, with depth and motion it works out from the game’s own frames, before the game’s post-processing. Needs an NVIDIA RTX graphics card. Sim-QVFR includes NVIDIA’s nvngx_dlss.dll; Choose… takes another (a newer one from a game), Use included goes back.
it = Sim-QVFR esegue il DLSS di NVIDIA su ogni vista, con profondità e movimento ricavati dai frame del gioco, prima della post-elaborazione del gioco. Richiede una scheda video NVIDIA RTX. Sim-QVFR include nvngx_dlss.dll di NVIDIA; Scegli… ne prende un altro (uno più recente da un gioco), Usa incluso torna indietro.
en = Use FSR
it = Usa FSR
en = Experimental. On a PC without an NVIDIA RTX graphics card, Sim-QVFR evaluates AMD FSR on each view in DLSS’s place, with the same depth and motion: FSR 4 where AMD’s software offers it for your card (Radeon RX 9000, and newer drivers on RX 7000 and 6000), FSR 3.1 elsewhere. Sim-QVFR includes AMD’s FSR files. Tested only as FSR 3.1 on an NVIDIA card so far: tell us how it runs on yours.
it = Sperimentale. Su un PC senza scheda video NVIDIA RTX, Sim-QVFR esegue AMD FSR su ogni vista al posto del DLSS, con la stessa profondità e lo stesso movimento: FSR 4 dove il software AMD lo offre per la tua scheda (Radeon RX 9000, e driver più recenti su RX 7000 e 6000), FSR 3.1 altrove. Sim-QVFR include i file FSR di AMD. Finora testato solo come FSR 3.1 su una scheda NVIDIA: facci sapere come va sulla tua.
en = Periphery preset
it = Preset periferia
en = Steadier or cheaper DLSS outside the focus area. K: a steadier picture, at a higher cost. F: about half the cost, a little more flicker on edges. With eye tracking you rarely look there, so F is usually fine; with a fixed focus, K.
it = DLSS più stabile o più leggero fuori dall’area di fuoco. K: un’immagine più stabile, a un costo maggiore. F: circa metà del costo, un po’ più di sfarfallio sui bordi. Con eye tracking guardi raramente lì, quindi F di solito va bene; con un fuoco fisso, K.
en = Texture sharpening
it = Nitidezza delle texture
en = DLSS rebuilds detail from frames drawn at a lower resolution, so textures are best sampled a step sharper while it runs. Sim-QVFR does that through copies of the game’s shaders, in the focus area alone or in the periphery too. Measured gains are modest (most in the periphery and on distant textures). Off at launch, nothing is installed for it; turned on then, it starts at the next launch. Fine patterns may shimmer: then a step lower.
it = DLSS ricostruisce il dettaglio da frame disegnati a risoluzione più bassa, quindi è meglio campionare le texture un gradino più nitide mentre è attivo. Sim-QVFR lo fa tramite copie degli shader del gioco, solo nell’area di fuoco o anche nella periferia. I guadagni misurati sono modesti (soprattutto in periferia e sulle texture lontane). Spento all’avvio, non viene installato nulla; se lo attivi allora, parte al prossimo avvio. I motivi fini possono sfarfallare: in quel caso un gradino più basso.
en = Light glow
it = Bagliore delle luci
en = At night DLSS takes very bright lights (distant headlights, floodlights) for noise and smooths them away, so the game’s bloom fades. Light glow lowers the exposure DLSS works at, so it keeps them: some at Low, more at High. Nothing is added to the picture, so the lights don’t flicker or smear. Very bright edges may get a faint halo: then Low or Off. NVIDIA DLSS only. Experimental.
it = Di notte DLSS scambia le luci molto intense (fari lontani, riflettori) per rumore e le smussa, così il bagliore del gioco svanisce. Bagliore delle luci abbassa l’esposizione con cui lavora DLSS, così le conserva: un po’ su Bassa, di più su Alta. Nell’immagine non si aggiunge nulla, quindi le luci non sfarfallano né lasciano scie. I bordi molto luminosi possono avere un lieve alone: allora Bassa o Off. Solo NVIDIA DLSS. Sperimentale.
en = Updates
it = Aggiornamenti
en = Install downloads the release from GitHub, checks it against the SHA-256 GitHub gives, replaces the program files and restarts the launcher; your settings, profiles and changed files stay, and the version you had is kept in the update folder. Download opens the release’s page instead.
it = Installa scarica la release da GitHub, la verifica con lo SHA-256 fornito da GitHub, sostituisce i file del programma e riavvia il launcher; impostazioni, profili e file modificati restano, e la versione che avevi viene conservata nella cartella update. Scarica apre invece la pagina della release.
en = These settings reach the game while it runs, as soon as you change them. Without the game running, they apply when it starts.
it = Queste impostazioni arrivano al gioco mentre gira, appena le cambi. Senza il gioco in esecuzione, si applicano al suo avvio.
en = Lowering it reaches a running game at once, and so does raising it back up to what the game started with. Above that, it takes effect at the next launch. With DLSS on in the game, the views keep their launch sizes until the next launch.
it = Abbassarla arriva subito a un gioco in esecuzione, e così riportarla al valore con cui è partito il gioco. Oltre quello, ha effetto al prossimo avvio. Con DLSS attivo nel gioco, le viste mantengono le dimensioni dell’avvio fino al prossimo avvio.
en = These settings take effect the next time the game starts from the launcher. A running game keeps what it started with.
it = Queste impostazioni hanno effetto al prossimo avvio del gioco dal launcher. Un gioco in esecuzione mantiene quelle con cui è partito.
en = The local time on a small card in the headset, apart from the performance overlay: on or off and moved live, here or from the headset menu. It costs next to nothing; it redraws once a minute.
it = L’ora locale su una piccola scheda nel visore, separata dall’overlay prestazioni: si attiva, disattiva e sposta dal vivo, qui o dal menu del visore. Non costa quasi nulla; si ridisegna una volta al minuto.
en = The performance overlay in the headset: frame rate, CPU and GPU time and what limits the frame. A little CPU time while it shows.
it = L’overlay prestazioni nel visore: frame rate, tempo CPU e GPU e cosa limita il frame. Un po’ di tempo CPU mentre è visibile.
en = Shape
it = Forma
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom shape: an outline of up to 10 points you draw on the preview (click the area to add a point, drag one to move it, right-click one to remove it); trace your windscreen, say, then place it with Vertical and Horizontal position. To hide the area’s edge, raise Feather.
it = La forma dell’area nitida. Rettangolo: arrotondato dal Raggio degli angoli. Forma personalizzata: un contorno fino a 10 punti che disegni sull’anteprima (clic nell’area per aggiungere un punto, trascinalo per spostarlo, clic destro per rimuoverlo); ricalca il parabrezza, per esempio, poi posizionalo con Posizione verticale e Posizione orizzontale. Per nascondere il bordo dell’area, alza la Sfumatura.
en = Outline color
it = Colore del contorno
en = The outline’s colour in the headset. It shows while Show focus outline is on.
it = Il colore del contorno nel visore. Appare mentre Mostra contorno del fuoco è attivo.
en = nvngx_dlss.dll
it = nvngx_dlss.dll
en = The DLSS Sim-QVFR uses: the one it includes (NVIDIA’s), or another you choose, a newer one from a game, say (DLSS 310 or newer). Use included goes back. Applies at the next launch.
it = Il DLSS usato da Sim-QVFR: quello incluso (di NVIDIA), o un altro che scegli, per esempio uno più recente da un gioco (DLSS 310 o più recente). Usa incluso torna indietro. Si applica al prossimo avvio.
en = Focus views
it = Viste di fuoco
en = DLAA draws them at their size. Ultra quality, Quality, Balanced and Performance draw them at 77, 67, 58 or 50% each way and upscale them: less GPU time, softer distant textures. DLSS has no ultra quality model of its own: 77% runs its quality one.
it = DLAA le disegna alla loro dimensione. Ultra qualità, Qualità, Bilanciato e Prestazioni le disegnano al 77, 67, 58 o 50% per lato e le scalano: meno tempo GPU, texture lontane più morbide. DLSS non ha un modello ultra qualità suo: il 77% usa quello qualità.
en = Focus preset
it = Preset del fuoco
en = The DLSS preset for the sharp focus views. With Sim-QVFR’s DLSS, Default is NVIDIA’s choice for the mode: K, and M at Performance, which costs more. With Cheeky, Game default keeps the game’s.
it = Il preset DLSS per le viste di fuoco nitide. Con il DLSS di Sim-QVFR, Predefinito è la scelta di NVIDIA per la modalità: K, e M in Prestazioni, che costa di più. Con Cheeky, Predefinito del gioco mantiene quello del gioco.
en = Other cars’ motion
it = Movimento delle altre auto
en = Gives DLSS each other car’s own motion, so cars passing, alongside or ahead stay clean instead of smearing. Turn it off for more headroom: in a field of cars it costs about 0.5 ms of CPU and 0.2 to 0.5 ms of GPU a frame. Applies at the next launch, with DLSS on at launch; with DLSS off it costs nothing.
it = Fornisce al DLSS il movimento di ogni altra auto, così le auto che sorpassano, affiancano o stanno davanti restano pulite invece di sbavare. Spegnilo per avere più margine: in un gruppo di auto costa circa 0,5 ms di CPU e da 0,2 a 0,5 ms di GPU per frame. Si applica al prossimo avvio, con DLSS attivo all’avvio; con DLSS spento non costa nulla.
en = nvngx_dlssnr.dll
it = nvngx_dlssnr.dll
en = NVIDIA’s DLSS neural rendering runtime. Sim-QVFR includes none: it is NVIDIA’s, and comes only with games that ship DLSS-NR. Choose the one in such a game’s folder. Applies at the next launch.
it = Il runtime del rendering neurale DLSS di NVIDIA. Sim-QVFR non lo include: è di NVIDIA e arriva solo con i giochi che hanno DLSS-NR. Scegli quello nella cartella di uno di questi giochi. Si applica al prossimo avvio.
en = Use DLSS-NR
it = Usa DLSS-NR
en = NVIDIA’s DLSS neural rendering on the views: its model reworks lighting and materials from the picture, its depth and its motion. Experimental, and heavy: about 2 ms of GPU time and 130 MB of video memory for every million pixels it works on, per view (RTX 5070 Ti). It turns itself off if frames fall under 10 a second with it on.
it = Il rendering neurale DLSS di NVIDIA sulle viste: il suo modello rielabora luci e materiali a partire dall’immagine, dalla sua profondità e dal suo movimento. Sperimentale e pesante: circa 2 ms di tempo GPU e 130 MB di memoria video per ogni milione di pixel elaborato, per vista (RTX 5070 Ti). Si disattiva da solo se i frame scendono sotto i 10 al secondo.
en = Intensity
it = Intensità
en = How much of the model’s change you get: 0% is the picture as it came.
it = Quanto della modifica del modello ottieni: 0% è l’immagine così com’è arrivata.
en = Style
it = Stile
en = The look the model aims for.
it = L’aspetto a cui punta il modello.
en = Preset
it = Preset
en = The model: A is the original, B a faster one in newer DLLs (310.9.16 on). Default is the DLL’s own choice. A change rebuilds DLSS-NR: a short stutter.
it = Il modello: A è l’originale, B uno più veloce nelle DLL più recenti (dalla 310.9.16). Predefinito è la scelta della DLL. Una modifica ricostruisce DLSS-NR: un breve scatto.
en = Local tone
it = Tono locale
en = The strength of the model’s local contrast and lighting changes.
it = L’intensità delle modifiche del modello a contrasto e luce locali.
en = Local structure
it = Struttura locale
en = The strength of the model’s changes to fine structure.
it = L’intensità delle modifiche del modello alla struttura fine.
en = Auto mask
it = Maschera automatica
en = Lets the model find what it treats differently (skin) by itself.
it = Lascia che il modello trovi da solo ciò che tratta diversamente (la pelle).
en = Runs
it = Esecuzione
en = After DLSS works on the finished, anti-aliased views. Before DLSS works on the views as drawn, before anti-aliasing and upscaling: fewer pixels when the focus views are upscaled, and DLSS then smooths its result.
it = Dopo DLSS lavora sulle viste finite e con anti-aliasing. Prima di DLSS lavora sulle viste così come sono disegnate, prima di anti-aliasing e upscaling: meno pixel quando le viste di fuoco sono scalate, e poi DLSS ne ammorbidisce il risultato.
en = Focus working size
it = Dimensione di lavoro del fuoco
en = What the model works at, a share of the focus view. Lower costs less; the picture keeps its own detail.
it = La dimensione a cui lavora il modello, una quota della vista di fuoco. Più bassa costa meno; l’immagine mantiene il suo dettaglio.
en = Working size limit
it = Limite dimensione di lavoro
en = The most one view’s model works on, in megapixels, whatever the sizes. Each megapixel costs about 2 ms of GPU time and 130 MB of video memory, per view.
it = Il massimo su cui lavora il modello di una vista, in megapixel, qualunque siano le dimensioni. Ogni megapixel costa circa 2 ms di tempo GPU e 130 MB di memoria video, per vista.
en = Edge blend
it = Fusione dei bordi
en = The band over which the processed area fades into what isn’t processed around it.
it = La fascia in cui l’area elaborata sfuma in ciò che le sta attorno non elaborato.
en = Periphery too
it = Anche la periferia
en = Off, only the focus views are processed: where you look. On, the periphery too, at its own working size and coverage. It adds about 2 ms of GPU time per eye at least, however small you make it.
it = Spento, vengono elaborate solo le viste di fuoco: dove guardi. Acceso, anche la periferia, con dimensione di lavoro e copertura proprie. Aggiunge almeno circa 2 ms di tempo GPU per occhio, per quanto la rendi piccola.
en = Periphery working size
it = Dimensione di lavoro della periferia
en = As the focus working size, for the periphery.
it = Come la dimensione di lavoro del fuoco, per la periferia.
en = Periphery covered
it = Periferia coperta
en = How much of each eye’s view the model covers, around the focus area.
it = Quanta parte della vista di ogni occhio copre il modello, attorno all’area di fuoco.
en = Foveated DLSS
it = Foveated DLSS
en = Off leaves the game’s own DLSS on every view.
it = Spento lascia il DLSS del gioco su ogni vista.
en = Outer preset
it = Preset esterno
en = The DLSS preset of the outer views’ own pass (Cheaper outer views).
it = Il preset DLSS del passaggio delle viste esterne (Viste esterne più leggere).
en = Fix motion-vector blur
it = Correggi sfocatura dei motion vector
en = Cheeky’s workaround for smearing with some presets. Adds GPU work.
it = Il rimedio di Cheeky alle sbavature con alcuni preset. Aggiunge lavoro alla GPU.
en = DLSS-NR
it = DLSS-NR
en = NVIDIA’s DLSS-NR (DLSS 5) on the focus views. Needs nvngx_dlssnr.dll next to the game.
it = DLSS-NR di NVIDIA (DLSS 5) sulle viste di fuoco. Richiede nvngx_dlssnr.dll accanto al gioco.
en = DLSS-NR passes
it = Passaggi DLSS-NR
en = Each extra DLSS-NR pass costs about one more NR evaluation.
it = Ogni passaggio DLSS-NR in più costa circa un’elaborazione NR in più.
en = Multiplier
it = Moltiplicatore
en = Frames shown per frame the game renders: 2x adds one generated frame between each two of the game’s.
it = Frame mostrati per ogni frame renderizzato dal gioco: 2x aggiunge un frame generato tra ogni due frame del gioco.
en = Center FG scale
it = Scala FG centro
en = Frame generation’s resolution in the center region. Lower uses less GPU time and memory.
it = La risoluzione della generazione dei frame nella regione centrale. Più bassa usa meno tempo GPU e memoria.
en = Periphery FG scale
it = Scala FG periferia
en = Frame generation’s resolution around the center region. Lower uses less GPU time and memory.
it = La risoluzione della generazione dei frame attorno alla regione centrale. Più bassa usa meno tempo GPU e memoria.
en = Release game
it = Rilascio del gioco
en = When the game starts its next frame. Never: CPU and GPU overlap (most frames). Capture: after the GPU finishes. Generated: after the generated frame.
it = Quando il gioco inizia il frame successivo. Mai: CPU e GPU si sovrappongono (la maggior parte dei frame). Cattura: dopo che la GPU ha finito. Generati: dopo il frame generato.
en = Show the center region
it = Mostra la regione centrale
en = Outlines the region in the headset, to check that it follows your eyes.
it = Contorna la regione nel visore, per verificare che segua i tuoi occhi.
