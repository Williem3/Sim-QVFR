it = La modalità Turbo di Sim-QVFR e quella di OpenXR Toolkit tolgono entrambe l’attesa del frame a {game}: ne basta una, e insieme possono disturbare il ritmo dei frame. Disattivare quella di Toolkit cambia la sua impostazione solo per {game}.
