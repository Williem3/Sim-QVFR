it = Cambia la visiera del casco: chiusa, a metà, aperta.
en = Helmet images
it = Immagini del casco
en = Your own helmet: top.png, bottom.png and visor.png in the helmet folder next to the layer. Size and Height place them (degrees of view, and above straight ahead).
it = Il tuo casco: top.png, bottom.png e visor.png nella cartella helmet accanto al layer. Dimensione e Altezza li posizionano (gradi di vista, e sopra il dritto davanti).
