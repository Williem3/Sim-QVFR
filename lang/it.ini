en = Percent of the headset’s {width} × {height} per eye; the periphery and the focus are set apart.
it = Percentuale dei {width} × {height} per occhio del visore; periferia e fuoco si impostano separatamente.
en = Percent of the headset’s resolution; pixel sizes appear after the first launch.
it = Percentuale della risoluzione del visore; le dimensioni in pixel appaiono dopo il primo avvio.
en = Changes apply while you drive, inside the game’s own render size: the focus and the periphery share it, so a large focus at a high Focus density leaves less room for the periphery.
it = Le modifiche si applicano mentre guidi, entro la dimensione di rendering del gioco: fuoco e periferia la condividono, quindi un fuoco grande con Densità di fuoco alta lascia meno spazio alla periferia.
en = This launch allows up to Periphery resolution {periphery} and Focus density {density} at this focus size. Higher applies at the next launch.
it = Questo avvio consente fino a Risoluzione della periferia {periphery} e Densità di fuoco {density} con questa dimensione del fuoco. Valori più alti si applicano al prossimo avvio.
en = Live changes go down from what you launch with, and back up to it: launch with your highest settings, then lower them in the headset.
it = Le modifiche dal vivo scendono dal valore di avvio e risalgono fino a esso: avvia con le impostazioni più alte, poi abbassale nel visore.
en = In the headset, Auto-fit to headset rate sets these and the focus size to fill your GPU’s frame budget while you drive (Right starts it, Left undoes it).
it = Nel visore, Adatta alla frequenza imposta questi valori e la dimensione del fuoco per riempire il budget del frame della tua GPU mentre guidi (Destra lo avvia, Sinistra lo annulla).
