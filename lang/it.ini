en = The cut corners aren't rendered: the shape saves pixels too
it = Gli angoli tagliati non vengono renderizzati: la forma fa risparmiare anche pixel
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High. The switches below stay as you set them. Low costs about half the GPU time of High and looks a little grainier; the periphery always runs one step below the focus area, where it's least seen.
it = Con quale finezza vengono calcolati gli effetti: meno campioni e passi per ombre, occlusione e smussatura in Bassa, tutti in Alta. Gli interruttori qui sotto restano come li hai impostati. Bassa costa circa metà del tempo GPU di Alta e appare un po’ più granulosa; la periferia gira sempre un livello sotto l’area di focus, dove si nota meno.
en = Quality sets how finely each effect is worked out, not which are on: Low costs about half the GPU time of High. Night car lighting itself starts at the next launch; everything else changes while you drive.
it = La qualità imposta la finezza di ogni effetto, non quali sono attivi: Bassa costa circa metà del tempo GPU di Alta. L’illuminazione notturna delle auto vera e propria parte al prossimo avvio; tutto il resto cambia mentre guidi.
en = Sets the switches below by their GPU cost: Low keeps paint detail, lacquer reflections and headlight highlights, Medium adds shadows on the ground, High adds floodlight shadows. Night vision color isn't part of it. Changing any switch yourself shows no preset selected.
it = Imposta gli interruttori qui sotto in base al loro costo GPU: Bassa mantiene il dettaglio della vernice, i riflessi della vernice e le luci dei fari, Media aggiunge le ombre a terra, Alta aggiunge le ombre dei riflettori. Il colore visione notturna non ne fa parte. Se cambi un interruttore tu stesso, nessun preset risulta selezionato.
en = Custom: the switches below don’t match a preset.
it = Personalizzato: gli interruttori qui sotto non corrispondono a un preset.
en = Low, Medium and High set the switches by their GPU cost; night vision is left as you set it. Night car lighting itself starts at the next launch; everything else changes while you drive.
it = Bassa, Media e Alta impostano gli interruttori in base al loro costo GPU; la visione notturna resta come l’hai impostata. L’illuminazione notturna stessa parte al prossimo avvio; tutto il resto cambia mentre guidi.
