en = Your own images only: Detail (4096) is sharper, Performance (2048) costs less GPU time and memory.
it = Solo con le tue immagini: Dettaglio (4096) è più nitido, Prestazioni (2048) costa meno tempo GPU e memoria.
en = Degrees right of straight ahead. Negative is left. Drag it in Placement, or move it in the headset.
