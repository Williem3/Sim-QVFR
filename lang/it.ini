en = {game} has DLSS {version}. Foveated DLSS needs DLSS 310 or newer (DLSS 4): with an older one Cheeky can’t make its own periphery pass, and the game’s DLSS runs as it is. Replace nvngx_dlss.dll with a newer one (a tool such as DLSS Swapper does it, or the NVIDIA app’s DLSS override); Steam’s file check puts the original back.
it = {game} ha DLSS {version}. Foveated DLSS richiede DLSS 310 o più recente (DLSS 4): con uno più vecchio Cheeky non può fare il suo passaggio per la periferia, e il DLSS del gioco funziona così com’è. Sostituisci nvngx_dlss.dll con uno più recente (lo fa uno strumento come DLSS Swapper, o l’override DLSS dell’app NVIDIA); la verifica dei file di Steam rimette l’originale.
