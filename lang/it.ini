en = Headset menu · Two-loop (legacy)
it = Menu del visore · Two-loop (legacy)
en = The focus area renders in full detail only along the road ahead: about 10 m either side of the road and 3.5 m above it, following its hills and bends. Trees, grandstands, hills and the sky beside and above that come from the periphery’s image, as does the cockpit; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. Turn it off if something beside the road looks softer than you want. Changes while you drive.
it = L’area di focus viene renderizzata con pieno dettaglio solo lungo la strada davanti a te: circa 10 m per lato e 3,5 m sopra, seguendo dossi e curve. Alberi, tribune, colline e cielo ai lati e sopra arrivano dall’immagine della periferia, come l’abitacolo; dove guardi mentre guidi non dovresti notare differenze. Fa risparmiare tempo GPU, di più con un’area di focus più grande. Disattivalo se qualcosa a bordo strada ti sembra troppo morbido. Cambia mentre guidi.
en = DLAA on the road only
it = DLAA solo sulla strada
en = With Road focus and Sim-QVFR’s DLSS on: the focus area’s DLAA runs only over the rows the road covers, the rest takes the periphery’s DLAA. It saves more GPU time. Turn it off if you see a soft strip above or below the road for a moment when you look up or down quickly. Changes while you drive.
it = Con il focus sulla strada e il DLSS di Sim-QVFR attivi: il DLAA dell’area di focus passa solo sulle righe occupate dalla strada, il resto prende il DLAA della periferia. Fa risparmiare ancora tempo GPU. Disattivalo se per un attimo vedi una fascia morbida sopra o sotto la strada quando guardi in fretta in alto o in basso. Cambia mentre guidi.
en = Full detail along the road ahead; the scenery beside and above it from the periphery.
it = Pieno dettaglio lungo la strada davanti; il paesaggio ai lati e sopra dalla periferia.
en = With Sim-QVFR’s DLSS on: the focus area’s DLAA over the road’s rows alone.
it = Con il DLSS di Sim-QVFR attivo: il DLAA dell’area di focus solo sulle righe della strada.
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom corners: each corner moved in on its own; pull the top corners in for a trapezoid, more of the dash sharp at the same cost. To hide the area’s edge, raise Feather.
it = La forma dell’area nitida. Rettangolo: arrotondato da Raggio degli angoli. Angoli personalizzati: ogni angolo spostato dentro per conto suo; porta dentro gli angoli superiori per un trapezio, più cruscotto nitido allo stesso costo. Per nascondere il bordo dell’area, alza Sfumatura.
