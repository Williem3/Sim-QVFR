en = In Two-loop the focus density ({density}) follows from Periphery resolution and the focus size. Focus density, sharpening and object detail are set in Quad View Foveated Rendering.
it = In Two-loop la densità di fuoco ({density}) deriva da Risoluzione della periferia e dalla dimensione del fuoco. Densità di fuoco, nitidezza e dettaglio oggetti si impostano in Quad View Foveated Rendering.
