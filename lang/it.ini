it = Gradi sopra il livello degli occhi. Negativo è sotto. Trascinalo in Posizione, o spostalo nel visore.
en = How wide it is, in degrees of your view.
it = Quanto è largo, in gradi della tua vista.
en = A line under the headset menu with the in-game hotkeys (overlay, visor, CPU capture) and their wheel buttons, as set in Hotkeys. Also on the menu’s Headset page.
it = Una riga sotto il menu del visore con le scorciatoie in gioco (overlay, visiera, cattura CPU) e i relativi pulsanti del volante, come impostati in Scorciatoie. Anche nella pagina Visore del menu.
