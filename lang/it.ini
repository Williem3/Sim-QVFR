it = {game} si blocca con la modalità Turbo insieme alla generazione dei frame di Cheeky. Disattivarla cambia l’impostazione di Toolkit solo per {game}.
en = Turn off
it = Disattiva
en = Turbo mode stays off with frame generation
it = La modalità Turbo resta disattivata con la generazione dei frame
en = {game} can crash with a Turbo mode and Cheeky’s frame generation together, so Sim-QVFR keeps its Turbo mode off while frame generation is on.
it = {game} può bloccarsi con una modalità Turbo e la generazione dei frame di Cheeky insieme, quindi Sim-QVFR tiene disattivata la sua modalità Turbo finché la generazione dei frame è attiva.
en = Turbo mode stays off with VectorXR
it = La modalità Turbo resta disattivata con VectorXR
en = VectorXR’s frame generation is loaded for this launch, so Sim-QVFR keeps its Turbo mode off. Turn VectorXR off for the game to use Turbo mode.
it = La generazione dei frame di VectorXR è caricata per questo avvio, quindi Sim-QVFR tiene disattivata la sua modalità Turbo. Disattiva VectorXR per far usare la modalità Turbo al gioco.
