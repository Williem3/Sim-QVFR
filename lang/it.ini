it = Spento (predefinito): i thread del gioco condividono tutti i core, come li distribuisce Windows.
en = Only the game’s own threads move: no Windows setting or other program changes. It applies on CPUs with 6 or more cores and two threads per core, and stays off if another tool (such as Process Lasso) already set the game’s CPU sets or affinity. Try it on and watch your frames; the headset menu’s Game page changes it too.
it = Si spostano solo i thread del gioco: nessuna impostazione di Windows o altro programma cambia. Si applica su CPU con 6 o più core e due thread per core, e resta spento se un altro strumento (come Process Lasso) ha già impostato i CPU set o l’affinità del gioco. Provalo e osserva i frame; anche la pagina Gioco del menu del visore lo cambia.
en = Turbo mode
it = Modalità Turbo
en = On: the game doesn’t wait for the headset at the start of each frame. It starts its next frame’s work while the headset runtime waits for its display slot, for more frames when the CPU limits them.
it = Attiva: il gioco non aspetta il visore all’inizio di ogni frame. Inizia il lavoro del frame successivo mentre il runtime del visore attende il suo slot di visualizzazione, per più frame quando è la CPU a limitarli.
en = Off (the default): the game waits for the headset at the start of each frame, as it normally does.
it = Disattivata (predefinito): il gioco aspetta il visore all’inizio di ogni frame, come fa normalmente.
en = Turbo mode stays off while Cheeky’s frame generation is on: the game can crash with both.
it = La modalità Turbo resta disattivata finché la generazione dei frame di Cheeky è attiva: il gioco può bloccarsi con entrambe.
en = Don’t turn on OpenXR Toolkit’s Turbo mode as well: one is enough. It may add a little latency; try it on and watch your frames. The headset menu’s Game page changes it too.
it = Non attivare anche la modalità Turbo di OpenXR Toolkit: ne basta una. Può aggiungere un po’ di latenza; provala attiva e osserva i tuoi frame. Anche la pagina Gioco del menu del visore la cambia.

