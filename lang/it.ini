it = La vista è più grande di quanto permette il runtime del visore
en = Lower the outer resolution or the focus density in Resolution.
it = Abbassa la risoluzione esterna o la densità di fuoco in Risoluzione.
en = The focus area ({width}% × {height}%) is larger than the runtime's own focus region ({runtime_width}% × {runtime_height}%)
it = L’area di fuoco ({width}% × {height}%) è più grande della regione di fuoco del runtime ({runtime_width}% × {runtime_height}%)
en = With the runtime composing the views (Pimax, Varjo), the focus area shows only inside its own focus region; past it, the outer resolution shows. Make the runtime's focus area larger (Pimax Play, Varjo Base), or Sim-QVFR's no larger than it, in Resolution.
it = Quando è il runtime a comporre le viste (Pimax, Varjo), l’area di fuoco appare solo dentro la sua regione di fuoco; oltre, si vede la risoluzione esterna. Ingrandisci l’area di fuoco del runtime (Pimax Play, Varjo Base), o rendi quella di Sim-QVFR non più grande, in Risoluzione.
en = VRAM was nearly full ({percent}% of what Windows allows the game)
it = La VRAM era quasi piena ({percent}% di quanto Windows concede al gioco)
en = Stutter and hitches follow when it runs out. Lower the outer resolution or the focus density, or the game's texture quality.
it = Quando si esaurisce arrivano stutter e scatti. Abbassa la risoluzione esterna o la densità di fuoco, o la qualità delle texture del gioco.
en = OpenXR Toolkit is loaded under Sim-QVFR
it = OpenXR Toolkit è caricato sotto Sim-QVFR
en = It adds about 0.8 ms to every frame's submission. If you don't use it for this game, switch it off in OpenXR layers.
it = Aggiunge circa 0,8 ms all’invio di ogni frame. Se non lo usi per questo gioco, disattivalo in Layer OpenXR.
en = The GPU was busy all the time ({percent}%)
it = La GPU era sempre occupata ({percent}%)
en = This is the GPU's limit. Lower the outer resolution or the focus density, or the game's graphics settings.
it = È il limite della GPU. Abbassa la risoluzione esterna o la densità di fuoco, o le impostazioni grafiche del gioco.
en = The game's CPU work limited the frame rate
it = Il lavoro CPU del gioco ha limitato il frame rate
en = QVFR lowers the GPU's work, not the CPU's. Lower the game's CPU-heavy settings (opponents, mirrors, shadows).
it = QVFR riduce il lavoro della GPU, non della CPU. Abbassa le impostazioni del gioco pesanti per la CPU (avversari, specchietti, ombre).
en = The headset runtime ran the game at half rate for {percent}% of the session
it = Il runtime del visore ha fatto girare il gioco a metà frequenza per il {percent}% della sessione
en = When frames come close to the budget, the runtime's motion smoothing halves the frame rate for a few seconds (Varjo does this). Turn motion smoothing off in the runtime's software (Varjo Base) to compare, and give the CPU room: lower the game's CPU-heavy settings (opponents, mirrors, shadows).
it = Quando i frame si avvicinano al budget, il motion smoothing del runtime dimezza il frame rate per qualche secondo (Varjo lo fa). Disattiva il motion smoothing nel software del runtime (Varjo Base) per confrontare, e lascia margine alla CPU: abbassa le impostazioni del gioco pesanti per la CPU (avversari, specchietti, ombre).
en = {percent}% of frames were late with neither the CPU nor the GPU full
it = Il {percent}% dei frame è arrivato in ritardo senza che CPU o GPU fossero al limite
en = Often something else in the chain: another OpenXR layer, an overlay, or the runtime's motion smoothing. Try with them off.
it = Spesso è qualcos’altro nella catena: un altro layer OpenXR, un overlay o il motion smoothing del runtime. Prova a disattivarli.

