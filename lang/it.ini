en = Rendering method
it = Metodo di rendering
en = Quad View Foveated Rendering draws the outer and focus views in one game frame: the lightest on the CPU, and the one with every feature. Two-loop (legacy) draws two whole game frames per headset frame: about twice the CPU work per frame, and no frame generation.
it = Quad View Foveated Rendering disegna le viste esterne e di fuoco in un solo frame di gioco: il più leggero per la CPU, e quello con tutte le funzioni. Two-loop (legacy) disegna due frame di gioco interi per ogni frame del visore: circa il doppio del lavoro CPU per frame, e niente generazione dei frame.
