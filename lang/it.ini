en = On: the game thread that finishes each frame runs alone on one core, and the game’s other threads (its physics among them) use the rest, so none slows it down by sharing that core.
it = Attivo: il thread del gioco che completa ogni frame gira da solo su un core, e gli altri thread del gioco (tra cui la fisica) usano il resto, così nessuno lo rallenta condividendo quel core.
