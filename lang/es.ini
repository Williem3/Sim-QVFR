en = Give the main thread a core of its own
es = Dar al hilo principal un núcleo propio
en = On: the game thread that finishes each frame runs alone on one core, and the game’s other threads (its physics among them) use the rest, so none slows it down by sharing that core.
es = Activado: el hilo del juego que termina cada fotograma se ejecuta solo en un núcleo, y los demás hilos del juego (entre ellos su física) usan el resto, para que ninguno lo frene compartiendo ese núcleo.
en = Off (the default): the game’s threads share every core, as Windows places them.
es = Desactivado (predeterminado): los hilos del juego comparten todos los núcleos, como los reparte Windows.
en = Only the game’s own threads move: no Windows setting or other program changes. It applies on CPUs with 6 or more cores and two threads per core, and stays off if another tool (such as Process Lasso) already set the game’s CPU sets or affinity. Try it on and watch your frames; the headset menu’s Game page changes it too.
es = Solo se mueven los hilos propios del juego: no cambia ningún ajuste de Windows ni otro programa. Se aplica en CPU con 6 o más núcleos y dos hilos por núcleo, y queda desactivado si otra herramienta (como Process Lasso) ya fijó los conjuntos de CPU o la afinidad del juego. Actívalo y observa tus fotogramas; el apartado CPU de la página Juego del menú del visor también lo cambia.
en = Turbo mode
es = Modo Turbo
en = On: the game doesn’t wait for the headset at the start of each frame. It starts its next frame’s work while the headset runtime waits for its display slot, for more frames when the CPU limits them.
es = Activado: el juego no espera al visor al comienzo de cada fotograma. Empieza el trabajo del siguiente fotograma mientras el runtime del visor espera su turno de pantalla, para más fotogramas cuando la CPU los limita.
en = Off (the default): the game waits for the headset at the start of each frame, as it normally does.
es = Desactivado (predeterminado): el juego espera al visor al comienzo de cada fotograma, como hace normalmente.
en = Turbo mode stays off while Cheeky’s frame generation is on: the game can crash with both.
es = El modo Turbo sigue desactivado mientras la generación de fotogramas de Cheeky esté activada: el juego puede cerrarse inesperadamente con ambos.
en = Don’t turn on OpenXR Toolkit’s Turbo mode as well: one is enough. It may add a little latency; try it on and watch your frames. The headset menu’s Game page changes it too.
es = No actives también el modo Turbo de OpenXR Toolkit: con uno basta. Puede añadir algo de latencia; pruébalo activado y observa tus fotogramas. La página Juego del menú del visor también lo cambia.

