es = Activa o desactiva la superposición de rendimiento.
en = Helmet visor
es = Visera del casco
en = Steps the helmet’s visor: closed, half, open.
es = Cambia la visera del casco: cerrada, a medias, abierta.
en = Helmet images
es = Imágenes del casco
en = Your own helmet: top.png, bottom.png and visor.png in the helmet folder next to the layer. Size and Height place them (degrees of view, and above straight ahead).
es = Tu propio casco: top.png, bottom.png y visor.png en la carpeta helmet junto a la capa. Tamaño y Altura los colocan (grados de vista, y por encima de mirar al frente).
