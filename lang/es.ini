; src/launcher/ui/help.cpp
en = Foveated mode
es = Modo foveado
en = Eye tracked: the sharp area follows your eyes, so it can be small and dense; it needs a headset with eye tracking. Fixed: the area stays in the centre, so make it larger, since your eyes move off it.
es = Con seguimiento ocular: la zona nítida sigue tus ojos, así que puede ser pequeña y densa; necesita un visor con seguimiento ocular. Fijo: la zona se queda en el centro, así que hazla más grande, porque tus ojos se salen de ella.
en = Periphery resolution
es = Resolución de la periferia
en = The wide view around the focus area, a share of the headset’s recommended resolution. It covers most of the view but you see it with your side vision, so it is the first to lower: it saves GPU time and VRAM roughly with its pixels. The preview’s Pixels per frame shows the total.
es = La vista amplia alrededor de la zona de enfoque, como parte de la resolución recomendada del visor. Cubre casi toda la vista, pero la ves con la visión lateral, así que es lo primero que conviene bajar: ahorra tiempo de GPU y VRAM más o menos en proporción a sus píxeles. Píxeles por fotograma, en la vista previa, muestra el total.
en = Focus density
es = Densidad de enfoque
en = Pixel density inside the focus area, a share of the headset’s native density. Above 100% it renders more pixels than the headset shows where you look: sharper text and edges. Its cost grows with the area’s size, so a small area can take a high density cheaply. Dragging moves it in 5% steps; the arrow keys move it by 1%.
es = Densidad de píxeles dentro de la zona de enfoque, como parte de la densidad nativa del visor. Por encima del 100% renderiza más píxeles de los que el visor muestra donde miras: texto y bordes más nítidos. Su coste crece con el tamaño de la zona, así que una zona pequeña admite una densidad alta a bajo coste. Al arrastrar se mueve en pasos del 5%; las flechas la mueven un 1%.
en = Object detail
es = Detalle de objetos
en = How detailed trees and objects are, and how far away they are still drawn. At 100% they are as sharp in the focus region as its pixel density shows them; lower settings move toward the game’s own detail for the periphery resolution. It costs CPU, not GPU: more detail means more objects for X-Plane’s main thread to prepare every frame, often what limits the frame rate with QVFR. Lower it if frames stutter in dense scenery; the focus region shows coarser trees.
es = Lo detallados que son los árboles y objetos, y a qué distancia se siguen dibujando. Al 100% se ven en la región de enfoque tan nítidos como muestra su densidad de píxeles; valores más bajos se acercan al detalle propio del juego para la resolución de la periferia. Cuesta CPU, no GPU: más detalle significa más objetos que el hilo principal de X-Plane debe preparar en cada fotograma, a menudo lo que limita la tasa de fotogramas con QVFR. Bájalo si hay tirones en escenarios densos; la región de enfoque muestra árboles más toscos.
en = For a player who sees with one eye. The eye you choose shows black in the headset, and the game draws no focus view for it, renders only a few pixels of its scene and skips DLSS on it, so the GPU does much less. The game still prepares that eye’s frame, so the CPU saves little. With both eyes seeing, a black eye is uncomfortable: leave it at None.
es = Para quien ve con un solo ojo. El ojo que elijas se ve en negro en el visor, y el juego no dibuja vista de enfoque para él, renderiza solo unos pocos píxeles de su escena y no le aplica DLSS, así que la GPU trabaja mucho menos. El juego sigue preparando el fotograma de ese ojo, así que la CPU ahorra poco. Si ves con los dos ojos, un ojo en negro resulta incómodo: déjalo en Ninguno.
en = Sharpening
es = Nitidez
en = Crisper edges and text in the focus area; too much makes it shimmer. Raise it a little if the view looks soft (0% is off); it costs a little GPU time and changes while you drive. How: AMD FidelityFX Contrast Adaptive Sharpening, applied as Sim-QVFR resamples the focus view for the headset. Each pixel is sharpened by how much contrast room it has, so soft detail gains the most and edges already sharp gain little. The percentage is CAS’s own sharpness, as other CAS sharpeners show it: any setting above 0% already sharpens. Only the focus area is sharpened, fading out across its feather so its edge stays even: your side vision sees shimmer more than detail. 0% is off; it changes while you drive.
es = Bordes y texto más nítidos en la zona de enfoque; demasiada nitidez produce parpadeo. Súbela un poco si la vista se ve suave (0% es desactivado); cuesta algo de tiempo de GPU y cambia mientras conduces. Cómo: AMD FidelityFX Contrast Adaptive Sharpening, aplicado cuando Sim-QVFR reescala la vista de enfoque para el visor. Cada píxel se enfoca según el margen de contraste que tiene, así que el detalle suave gana más y los bordes ya nítidos ganan poco. El porcentaje es la nitidez propia de CAS, tal como la muestran otros filtros CAS: cualquier valor por encima de 0% ya enfoca. Solo se enfoca la zona de enfoque, que se desvanece a lo largo de su difuminado para que su borde quede uniforme: tu visión lateral nota más el parpadeo que el detalle. 0% es desactivado; cambia mientras conduces.
en = Periphery texture match
es = Igualar texturas de la periferia
en = Makes fences, nets and other see-through surfaces look the same in your side vision as in the focus area. At the periphery’s lower resolution the game blends them into a light solid shade, so the focus area looked darker behind them. At 100% the periphery reads its textures at the same detail level as the focus area; lower it if distant textures shimmer in your side vision. 0% is off (the game’s own); it changes while you drive.
es = Hace que vallas, redes y otras superficies translúcidas se vean igual en tu visión lateral que en la zona de enfoque. Con la menor resolución de la periferia, el juego las funde en un tono claro y sólido, por lo que la zona de enfoque se veía más oscura detrás de ellas. Al 100% la periferia lee sus texturas con el mismo nivel de detalle que la zona de enfoque; bájalo si las texturas lejanas parpadean en tu visión lateral. 0% es desactivado (como en el juego); cambia mientras conduces.
en = Game Lighting Enhancement
es = Iluminación del juego mejorada
en = Adds highlights and shading to the cars at night. Sim-QVFR relights each car after the game draws it, before the game's own post-processing: highlights where the floodlights and headlights reflect off the paint, shading in creases and under the car, and the effects below. The rest of the scene is untouched. Measured on an RTX 5070 Ti with everything on at High: about 1 ms of GPU time in a quiet scene, 2 to 3.7 ms in race traffic, and 0.4 to 0.9 ms of CPU time; none of the switches below adds measurable CPU time. The switch takes effect at the next launch; the values and effects change while you drive.
es = Añade brillos y sombreado a los coches de noche. Sim-QVFR reilumina cada coche después de que el juego lo dibuje y antes del posprocesado del propio juego: brillos donde los focos y los faros se reflejan en la pintura, sombreado en los pliegues y bajo el coche, y los efectos de abajo. El resto de la escena no se toca. Medido en una RTX 5070 Ti con todo activado en Alto: alrededor de 1 ms de GPU en una escena tranquila, de 2 a 3,7 ms con tráfico de carrera y de 0,4 a 0,9 ms de CPU; ninguno de los interruptores de abajo añade tiempo de CPU medible. El interruptor se aplica en el próximo inicio; los valores y los efectos cambian mientras conduces.
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High; the reflections keep all theirs at every tier. The switches below stay as you set them, and the periphery always runs one step below the focus area, where it's least seen. Measured in a night race on an RTX 5070 Ti with everything on: High 1.35 to 1.55 ms of GPU time, Medium 1.10 to 1.30 ms, Low 1.00 to 1.10 ms, a quarter to a third less than High. In testing Low looked a little grainier than High, its floodlight shadows almost unchanged.
es = Con qué detalle se calculan los efectos: menos muestras y pasos para las sombras, la oclusión y el suavizado en Bajo, todos en Alto; los reflejos conservan todos los suyos en cada nivel. Los interruptores de abajo quedan como los pusiste, y la periferia siempre va un nivel por debajo del área de enfoque, donde menos se nota. Medido en una carrera nocturna en una RTX 5070 Ti con todo activado: Alto de 1,35 a 1,55 ms de GPU, Medio de 1,10 a 1,30 ms, Bajo de 1,00 a 1,10 ms, entre una cuarta parte y un tercio menos que Alto. En las pruebas, Bajo se vio un poco más granulado que Alto, con las sombras de los focos casi iguales.
en = Fill light
es = Luz de relleno
en = How much of the game's own floodlight lighting stays on the cars. Lower makes the shading and highlights stand out more; 100% keeps the game's brightness. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
es = Cuánta de la iluminación propia del juego procedente de los focos se mantiene en los coches. Más bajo hace que el sombreado y los brillos destaquen más; 100 % mantiene el brillo del juego. Forma parte del reiluminado base, alrededor de 0,4 ms de GPU en una escena tranquila y 1 ms con tráfico de carrera (medido en Alto en una RTX 5070 Ti), y cuesta lo mismo con cualquier valor.
en = Ambient occlusion
es = Oclusión ambiental
en = Darkens creases, wheel arches and the underside, where light reaches less. 0% is off. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
es = Oscurece los pliegues, los pasos de rueda y los bajos, donde llega menos luz. 0 % es desactivado. Forma parte del reiluminado base, alrededor de 0,4 ms de GPU en una escena tranquila y 1 ms con tráfico de carrera (medido en Alto en una RTX 5070 Ti), y cuesta lo mismo con cualquier valor.
en = Highlights
es = Brillos
en = The strength of the floodlights' and headlights' reflections on the paint. 0% is off; above 100% is brighter than the lights would make it. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
es = La intensidad de los reflejos de los focos y los faros en la pintura. 0 % es desactivado; por encima de 100 % es más brillante de lo que harían las luces. Forma parte del reiluminado base, alrededor de 0,4 ms de GPU en una escena tranquila y 1 ms con tráfico de carrera (medido en Alto en una RTX 5070 Ti), y cuesta lo mismo con cualquier valor.
en = Paint gloss
es = Brillo de la pintura
en = How glossy the lacquer is: higher gives smaller, sharper highlights, lower broad soft ones. It is part of the base relight, about 0.4 ms of GPU time in a quiet scene and 1 ms in race traffic (measured at High on an RTX 5070 Ti), and costs the same at any value.
es = Lo brillante que es el barniz: más alto da brillos más pequeños y nítidos, más bajo brillos amplios y suaves. Forma parte del reiluminado base, alrededor de 0,4 ms de GPU en una escena tranquila y 1 ms con tráfico de carrera (medido en Alto en una RTX 5070 Ti), y cuesta lo mismo con cualquier valor.
en = Smoothing
es = Suavizado
en = Smooths the surface direction over this distance where the game's own normals aren't available, which hides faceted highlights on low-polygon parts. About 15 cm suits most cars; 0 is off.
es = Suaviza la dirección de la superficie en esta distancia donde no están disponibles las normales del propio juego, lo que oculta los brillos facetados en piezas de pocos polígonos. Unos 15 cm sirven para la mayoría de los coches; 0 es desactivado.
en = Floodlight shadows
es = Sombras de los focos
en = A part of a car hidden from a floodlight, behind a wing or another car, loses that light and its highlight. Measured at High on an RTX 5070 Ti: about 0.2 ms of GPU time in a quiet scene, 0.5 ms in race traffic.
es = Una parte de un coche oculta de un foco, detrás de un alerón o de otro coche, pierde esa luz y su brillo. Medido en Alto en una RTX 5070 Ti: alrededor de 0,2 ms de GPU en una escena tranquila, 0,5 ms con tráfico de carrera.
en = Paint detail
es = Detalle de pintura
en = Uses the paint's fine surface detail, orange peel and the carbon weave, in the highlights. Measured at High on an RTX 5070 Ti: about 0.1 ms of GPU time in race traffic, too little to measure in a quiet scene.
es = Usa en los brillos el fino detalle de la superficie de la pintura, la piel de naranja y el tejido del carbono. Medido en Alto en una RTX 5070 Ti: alrededor de 0,1 ms de GPU con tráfico de carrera, demasiado poco para medirlo en una escena tranquila.
en = Lacquer reflections
es = Reflejos del barniz
en = Mirrors what's around a car in its paint, strongest at shallow angles. Only what's on screen can be reflected, and only where both eyes can see it, so both eyes show the same. Measured on an RTX 5070 Ti: about 0.02 ms of GPU time in a quiet scene, 0.15 ms in race traffic.
es = Refleja en la pintura lo que rodea al coche, con más fuerza en ángulos rasantes. Solo se puede reflejar lo que está en pantalla y solo donde lo ven ambos ojos, para que los dos ojos muestren lo mismo. Medido en una RTX 5070 Ti: alrededor de 0,02 ms de GPU en una escena tranquila, 0,15 ms con tráfico de carrera.
en = Headlight highlights
es = Brillos de los faros
en = Other cars' headlights, and yours in the mirrors, shine on the paint as the floodlights do. Measured on an RTX 5070 Ti: about 0.03 to 0.05 ms of GPU time.
es = Los faros de otros coches, y los tuyos en los retrovisores, iluminan la pintura como los focos. Medido en una RTX 5070 Ti: alrededor de 0,03 a 0,05 ms de GPU.
en = Shadows on the ground
es = Sombras en el suelo
en = Darkens the track and walls under and beside the cars, and casts soft floodlight shadows, so the cars sit on the ground. Measured at High on an RTX 5070 Ti: about 0.2 ms of GPU time in a quiet scene, 0.55 ms in race traffic.
es = Oscurece la pista y los muros bajo los coches y a su lado, y proyecta suaves sombras de los focos, para que los coches se asienten en el suelo. Medido en Alto en una RTX 5070 Ti: alrededor de 0,2 ms de GPU en una escena tranquila, 0,55 ms con tráfico de carrera.
en = Night vision color
es = Color de visión nocturna
en = As eyes do at night, dark areas lose their colour and turn slightly blue while lit areas keep theirs. A matter of taste, off by default. Measured on an RTX 5070 Ti: about 0.03 ms of GPU time.
es = Como los ojos de noche, las zonas oscuras pierden su color y se vuelven ligeramente azules mientras las zonas iluminadas mantienen el suyo. Cuestión de gustos, desactivado por defecto. Medido en una RTX 5070 Ti: alrededor de 0,03 ms de GPU.
en = Color correction
es = Corrección de color
en = Adjusts the picture in the headset: exposure, brightness, contrast and saturation, for a game that looks too dark, washed out or dull in your headset. Sim-QVFR applies it as it composes the views, the periphery and the focus area alike, so the focus area never stands out; it costs almost no GPU time and changes while you drive. Menus and loading screens show as the game draws them. Off, or every value at 0, leaves the picture as it was.
es = Ajusta la imagen en el visor: exposición, brillo, contraste y saturación, para un juego que se ve demasiado oscuro, apagado o soso en tu visor. Sim-QVFR lo aplica al componer las vistas, por igual en la periferia y en la zona de enfoque, así que la zona de enfoque nunca destaca; casi no cuesta GPU y cambia mientras conduces. Los menús y las pantallas de carga se ven como los dibuja el juego. Desactivada, o con todos los valores en 0, la imagen queda como estaba.
en = Exposure
es = Exposición
en = Scales all of the light, in stops (EV): +1.0 EV is twice as bright, -1.0 EV half, up to 3 stops either way. Highlights brighten with the rest and can clip, so raise it a little at a time; Brightness lifts the darks without touching them.
es = Escala toda la luz, en pasos (EV): +1,0 EV es el doble de brillante, -1,0 EV la mitad, hasta 3 pasos en cada sentido. Las luces altas se aclaran con el resto y pueden quemarse, así que súbela poco a poco; el brillo levanta los oscuros sin tocarlos.
en = Brightness
es = Brillo
en = Lightens or darkens the mid tones and shadows while black stays black and white stays white, so an OLED headset keeps its deep blacks: raise it to see into dark cockpits and night stints, lower it for a richer, darker picture.
es = Aclara u oscurece los tonos medios y las sombras mientras el negro sigue negro y el blanco sigue blanco, así que un visor OLED conserva sus negros profundos: súbelo para ver en cockpits oscuros y tandas nocturnas, bájalo para una imagen más rica y oscura.
en = Contrast
es = Contraste
en = Spreads the picture’s tones away from mid grey (above 0) or draws them towards it (below 0), as a gentle S-curve: black and white stay where they are and colours keep their hue. More contrast gives deeper shadows and brighter highlights; less shows more detail in both.
es = Aleja los tonos de la imagen del gris medio (por encima de 0) o los acerca a él (por debajo de 0), como una suave curva en S: el negro y el blanco se quedan donde están y los colores mantienen su tono. Más contraste da sombras más profundas y luces más brillantes; menos muestra más detalle en ambas.
en = Saturation
es = Saturación
en = How strong the colours are: above 0 more vivid, below 0 more muted, -100% grey. Brightness is kept as each colour changes.
es = Lo intensos que son los colores: por encima de 0 más vivos, por debajo de 0 más apagados, -100 % gris. El brillo se mantiene mientras cambia cada color.
en = Accent brightness
es = Brillo del acento
en = How light or dark the game’s colour is. The wheel picks its hue and how strong it is; the launcher keeps its text and edges readable in light and dark mode.
es = Lo claro u oscuro que es el color del juego. La rueda elige su tono y su intensidad; el lanzador mantiene legibles su texto y sus bordes en modo claro y oscuro.
en = Focus width
es = Anchura de enfoque
en = The focus area’s width, a share of the view. Wider hides the edge between sharp and soft better; its pixels cost density × width × height, so a wide area at a high density costs the most. It changes while you drive; wider than the game started with (at your density) renders less dense until the next launch.
es = La anchura de la zona de enfoque, como parte de la vista. Más ancha disimula mejor el borde entre lo nítido y lo suave; sus píxeles cuestan densidad × anchura × altura, así que una zona ancha con densidad alta es lo que más cuesta. Cambia mientras conduces; más ancha que al iniciar el juego (con tu densidad) se renderiza con menos densidad hasta el próximo inicio.
en = Focus height
es = Altura de enfoque
en = The focus area’s height, a share of the view. Taller covers more of the dash and mirrors; it costs pixels as the width does. Taller than the game started with (at your density) renders less dense until the next launch.
es = La altura de la zona de enfoque, como parte de la vista. Más alta cubre más salpicadero y retrovisores; cuesta píxeles igual que la anchura. Más alta que al iniciar el juego (con tu densidad) se renderiza con menos densidad hasta el próximo inicio.
en = Corner radius
es = Radio de esquinas
en = Rounds the focus area’s corners, so its edge is harder to spot. No cost: the area renders as a rectangle either way.
es = Redondea las esquinas de la zona de enfoque para que su borde se note menos. Sin coste: la zona se renderiza como un rectángulo de todos modos.
en = Feather
es = Difuminado
en = The band where the focus area blends into the outer view. Wider hides the edge better; no measurable cost.
es = La franja en la que la zona de enfoque se funde con la vista exterior. Más ancha disimula mejor el borde; sin coste apreciable.
en = Regulate focus density
es = 
en = Takes Focus density down 1% at a time while the GPU time per frame stays over Lower above, and back up while it stays under Raise below. The density you set is the most it uses; it is never written over. It stops at 50%.
es = 
en = Regulate periphery resolution
es = 
en = Takes Periphery resolution down 1% at a time while the GPU time per frame stays over Lower above, and back up while it stays under Raise below. The resolution you set is the most it uses; it is never written over. It stops at 20%.
es = 
en = Lower above
es = 
en = The GPU time per frame, in ms, over which the regulator lowers what it regulates. It is the time the layer measures on the GPU for the eye passes (the log’s scene span), not the overlay’s GPU number. At 90 Hz a frame has 11.1 ms; frames start to miss a little under that, so 10 ms is a start.
es = 
en = Raise below
es = 
en = The GPU time per frame, in ms, under which the regulator raises what it regulates again. Keep it a ms or more under Lower above, so it does not go up and down: between the two limits nothing changes.
es = 
en = Frames before lowering
es = 
en = How many frames in a row must run over Lower above before the regulator takes a 1% step down (1-50). Keep it low to react quickly: at 90 Hz, 10 frames is about a tenth of a second per step. A frame under Raise below starts the count again.
es = 
en = Frames before raising
es = 
en = How many frames in a row must run under Raise below before the regulator takes a 1% step back up (50-300). Keep it high to come back slowly: at 90 Hz, 300 frames is about three seconds per step. A frame over Lower above starts the count again.
es = 
en = Gaze dead-zone
es = Zona muerta de la mirada
en = How far your eyes move before the focus area follows. A little keeps it still against eye-tracker noise; too much makes it lag when you look around. No GPU cost.
es = Cuánto deben moverse tus ojos antes de que la zona de enfoque los siga. Un poco la mantiene quieta frente al ruido del seguimiento ocular; demasiada hace que se retrase al mirar alrededor. Sin coste de GPU.
en = Gaze offset
es = Desfase de la mirada
en = Moves the eye-tracked focus area up or down, in degrees, for a tracker that sits a little off. No cost.
es = Mueve arriba o abajo la zona de enfoque con seguimiento ocular, en grados, para un sensor algo desviado. Sin coste.
en = Vertical position
es = Posición vertical
en = Moves the fixed focus area up or down, in degrees: towards the dash and mirrors, or the road. No cost.
es = Mueve arriba o abajo la zona de enfoque fija, en grados: hacia el salpicadero y los retrovisores, o hacia la carretera. Sin coste.
en = Crop the view
es = Recortar la vista
en = Cuts the edges a helmet or the lens hides before the game renders them. It saves GPU time and VRAM with the pixels cut; the headset shows black there.
es = Corta los bordes que tapan el casco o la lente antes de que el juego los renderice. Ahorra tiempo de GPU y VRAM según los píxeles recortados; el visor muestra negro ahí.
en = Top
es = Arriba
en = How much of the top of each eye’s view the game doesn’t render. Saves pixels in proportion.
es = Cuánto de la parte superior de la vista de cada ojo no renderiza el juego. Ahorra píxeles en proporción.
en = Bottom
es = Abajo
en = How much of the bottom of each eye’s view the game doesn’t render. Saves pixels in proportion.
es = Cuánto de la parte inferior de la vista de cada ojo no renderiza el juego. Ahorra píxeles en proporción.
en = Outer side (temple)
es = Lado exterior (sien)
en = How much of each eye’s temple side the game doesn’t render. Saves pixels in proportion.
es = Cuánto del lado de la sien de cada ojo no renderiza el juego. Ahorra píxeles en proporción.
en = Inner side (nose)
es = Lado interior (nariz)
en = How much of each eye’s nose side the game doesn’t render; the other eye still sees most of it. Saves pixels in proportion.
es = Cuánto del lado de la nariz de cada ojo no renderiza el juego; el otro ojo sigue viendo casi todo. Ahorra píxeles en proporción.
en = Show a helmet
es = Mostrar un casco
en = Draws a helmet’s visor opening round the view, lit by the scene, in a layer of its own. It costs the headset a layer to composite; nothing for the game.
es = Dibuja la abertura de la visera de un casco alrededor de la vista, iluminada por la escena, en una capa propia. Al visor le cuesta componer una capa; al juego, nada.
en = Road focus
es = Enfoque en la carretera
en = For fixed foveation. The focus area renders in full detail only along the road ahead (Road width either side of it and 3.5 m above it, following its hills and bends) and in your own car: the wheel, dash, displays and mirrors inside the focus area stay sharp. Trees, grandstands, hills and the sky beside and above the road come from the periphery’s image; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. It’s off while the focus follows your eyes. Turn it off if something beside the road looks softer than you want. Changes while you drive.
es = Para la foveación fija. El área de enfoque se renderiza con todo detalle solo a lo largo de la carretera que tienes delante (la anchura de la carretera a cada lado y 3,5 m por encima, siguiendo sus cambios de rasante y sus curvas) y en tu propio coche: el volante, el salpicadero, las pantallas y los retrovisores dentro del área de enfoque siguen nítidos. Los árboles, las gradas, las colinas y el cielo junto a la carretera y por encima salen de la imagen de la periferia; donde miras al conducir no deberías notar diferencia. Ahorra tiempo de GPU, más con un área de enfoque mayor. Está desactivado mientras el enfoque sigue tus ojos. Desactívalo si algo junto a la carretera se ve más suave de lo que quieres. Cambia mientras conduces.
en = Road width
es = Anchura de la carretera
en = How far either side of the road’s centre stays in full detail with Road focus on. Lower keeps just the track sharp and saves the most; higher brings the kerbs, run-off and barriers into the focus area and saves less. 10 m suits most circuits. Changes while you drive.
es = Hasta dónde, a cada lado del centro de la carretera, se mantiene todo el detalle con el enfoque en la carretera activado. Más bajo deja nítida solo la pista y ahorra más; más alto mete los pianos, las escapatorias y las barreras en el área de enfoque y ahorra menos. 10 m va bien en la mayoría de circuitos. Cambia mientras conduces.
en = Cockpit preset
es = Preajuste de cockpit
en = The focus area’s shape, size and position Road focus sets when you switch it on, or at once when you pick the other one here. A: a large cockpit shape over the windscreen, dash and wheel. B: a smaller one moved down to the road and the dash. Adjust either afterwards as you like; your own shape, size and position come back when you switch Road focus off. When the headset composes the views itself, the size stays inside its own focus region and the position doesn’t apply.
es = La forma, el tamaño y la posición del área de enfoque que el enfoque en la carretera aplica al activarlo, o al momento cuando eliges el otro aquí. A: una forma de cockpit grande sobre el parabrisas, el salpicadero y el volante. B: una más pequeña, bajada hacia la carretera y el salpicadero. Ajústalos después a tu gusto; tu propia forma, tamaño y posición vuelven al desactivar el enfoque en la carretera. Cuando el visor compone las vistas por sí mismo, el tamaño se queda dentro de su propia zona de enfoque y la posición no se aplica.
en = Road widening
es = Ensanchamiento de la carretera
en = How much Road focus’s sharp road widens with distance, in degrees either side, so a bend curving away far ahead (Eau Rouge, a hairpin, the pit exit) stays in full detail. Lower saves more, but a far bend can turn soft; higher catches tighter bends and brings more of the far scenery into the focus area, saving less. 15° suits most circuits. Changes while you drive.
es = Cuánto se ensancha con la distancia la carretera nítida del enfoque en la carretera, en grados a cada lado, para que una curva que se aleja a lo lejos (Eau Rouge, una horquilla, la salida de boxes) mantenga todo el detalle. Más bajo ahorra más, pero una curva lejana puede verse borrosa; más alto abarca curvas más cerradas y mete más paisaje lejano en el área de enfoque, así que ahorra menos. 15° va bien en la mayoría de circuitos. Cambia mientras conduces.
en = Road edge blend
es = Fundido del borde de la carretera
en = How softly Road focus’s full detail fades into the periphery at its edges: this many metres near you, wider in proportion far away so distant edges fade too. Raise it if you notice where the sharp area ends; 0 is a hard edge. Changes while you drive.
es = Lo suave que el detalle completo del enfoque en la carretera se funde con la periferia en sus bordes: tantos metros cerca de ti, más ancho en proporción a lo lejos para que los bordes lejanos también se fundan. Súbelo si notas dónde termina la zona nítida; 0 es un borde duro. Cambia mientras conduces.
en = Show Road focus area
es = Mostrar el área del enfoque en la carretera
en = Tints blue, in the headset, everything Road focus takes from the periphery, so you can see exactly what stays in full detail (untinted) as you drive. Road focus works as usual meanwhile. For setting up; turn it off to drive.
es = Tiñe de azul, en el visor, todo lo que el enfoque en la carretera toma de la periferia, para que veas exactamente qué queda con todo el detalle (sin teñir) mientras conduces. El enfoque en la carretera funciona como siempre mientras tanto. Para ajustar; desactívalo para conducir.
en = Road height
es = Altura de la carretera
en = How high above the road stays in full detail with Road focus on. Lower keeps just the road and the cars sharp and saves the most; higher brings signs, gantries and the grandstands’ lower rows into the focus area and saves less. 3.5 m suits most circuits. Changes while you drive.
es = Hasta qué altura sobre la carretera se mantiene todo el detalle con el enfoque en la carretera activado. Más bajo deja nítidos solo la carretera y los coches y ahorra más; más alto mete los carteles, los pórticos y las primeras filas de las gradas en el área de enfoque y ahorra menos. 3,5 m va bien en la mayoría de circuitos. Cambia mientras conduces.
en = Show focus outline
es = Mostrar contorno de enfoque
en = Draws the focus area’s edge, to see where it is and how it follows your eyes. For setting up; turn it off to drive.
es = Dibuja el borde de la zona de enfoque, para ver dónde está y cómo sigue tus ojos. Para configurar; desactívalo para conducir.
en = Use Cheeky Foveated DLSS
es = Usar Cheeky Foveated DLSS
en = Runs Cheeky Foveated DLSS inside the game, for the DLSS options below. Needs an NVIDIA RTX GPU, DLSS on in the game, and Cheeky’s download. Applies at the next launch.
es = Ejecuta Cheeky Foveated DLSS dentro del juego, para las opciones de DLSS de abajo. Necesita una GPU NVIDIA RTX, DLSS activado en el juego y la descarga de Cheeky. Se aplica en el próximo inicio.
en = Cheaper outer views
es = Vistas exteriores más baratas
en = The outer views get Cheeky’s DLAA at a lower resolution instead of the game’s DLSS: GPU time saved on the views you see least.
es = Las vistas exteriores reciben el DLAA de Cheeky a menor resolución en lugar del DLSS del juego: tiempo de GPU ahorrado en las vistas que menos ves.
en = Outer DLAA scale
es = Escala del DLAA exterior
en = The resolution of that cheaper pass. Lower saves more GPU time and softens the side view.
es = La resolución de esa pasada más barata. Más baja ahorra más tiempo de GPU y suaviza la vista lateral.
en = Focus supersampling
es = Supermuestreo de enfoque
en = Renders the focus views above their size before DLSS: a sharper centre, for more GPU time.
es = Renderiza las vistas de enfoque por encima de su tamaño antes de DLSS: un centro más nítido, a cambio de más tiempo de GPU.
en = Frame generation
es = Generación de fotogramas
en = Cheeky’s DLSS frame generation adds frames between the game’s: smoother motion when the game can’t hold the refresh rate, for some GPU time and latency. Turn OpenXR Toolkit’s Turbo mode off with it, and run no other frame generator.
es = La generación de fotogramas DLSS de Cheeky añade fotogramas entre los del juego: movimiento más fluido cuando el juego no mantiene la frecuencia de refresco, a cambio de algo de tiempo de GPU y latencia. Desactiva con ella el modo Turbo de OpenXR Toolkit y no uses ningún otro generador de fotogramas.
en = Center region
es = Región central
en = The part of the view frame generation makes at full quality (it follows your eyes when eye tracked). Larger looks better and costs more GPU time.
es = La parte de la vista que la generación de fotogramas crea con calidad completa (sigue tus ojos con seguimiento ocular). Más grande se ve mejor y cuesta más tiempo de GPU.
en = Load order
es = Orden de carga
en = Nearest the game first. Each launch loads these below the Sim-QVFR layer in this order; a layer off in Windows can still be loaded for the game alone. Locked switches keep the mod and the game working.
es = La más cercana al juego primero. Cada inicio las carga por debajo de la capa de Sim-QVFR en este orden; una capa desactivada en Windows puede cargarse igualmente solo para el juego. Los interruptores bloqueados mantienen funcionando el mod y el juego.
en = Describe the problem
es = Describe el problema
en = Zips the logs and the game’s crash reports from those sessions (names and account IDs taken out) into the logs folder, then opens a new issue on GitHub with what you wrote, your settings, the last session and your PC filled in. Add the steps there, and drag in the zip (it shows below) and any screenshots.
es = Comprime en un zip los registros y los informes de errores del juego de esas sesiones (sin nombres ni ID de cuenta) en la carpeta de registros, y abre una nueva incidencia en GitHub con lo que escribiste, tus ajustes, la última sesión y tu PC ya rellenados. Añade ahí los pasos y arrastra el zip (aparece abajo) y las capturas de pantalla.
en = Busiest threads
es = Hilos más ocupados
en = Each thread is a share of ONE core. A thread near 100% can hold the frame rate back even when Windows shows the whole CPU at 15%; a thread that spins by design looks busy whatever limits it.
es = Cada hilo es una parte de UN núcleo. Un hilo cerca del 100% puede frenar la tasa de fotogramas aunque Windows muestre toda la CPU al 15%; un hilo que gira en espera por diseño parece ocupado sea cual sea el límite.
en = Frame rate
es = Tasa de fotogramas
en = The last session’s average against the headset’s refresh rate, the frame rate it asks for. Below it, the runtime fills the gaps (motion smoothing or reprojection), which shows as wobble on moving edges.
es = La media de la última sesión frente a la frecuencia de refresco del visor, la tasa de fotogramas que pide. Por debajo, el runtime rellena los huecos (suavizado de movimiento o reproyección), que se nota como temblor en los bordes en movimiento.
en = Slow frames
es = Fotogramas lentos
en = How long your slowest frames take: lower is smoother. One frame in ten took at least this long (the 90th percentile). Above the frame’s budget (1000 ms divided by the headset’s refresh rate: 11.1 ms at 90 Hz) those frames miss the headset, and you feel stutter even when the average frame rate looks fine.
es = Cuánto tardan tus fotogramas más lentos: menos es más fluido. Uno de cada diez fotogramas tardó al menos esto (el percentil 90). Por encima del presupuesto del fotograma (1000 ms divididos por la frecuencia de refresco del visor: 11,1 ms a 90 Hz) esos fotogramas no llegan al visor y notas tirones aunque la tasa media parezca buena.
en = Limited by
es = Limitado por
en = What held the frame back most of the time: the game’s render thread on the CPU, the GPU, or nothing (the headset’s refresh). Lowering resolution helps only when the GPU limits it.
es = Lo que más frenó el fotograma la mayor parte del tiempo: el hilo de renderizado del juego en la CPU, la GPU o nada (el refresco del visor). Bajar la resolución solo ayuda cuando el límite es la GPU.
en = Previous session
es = Sesión anterior
en = The session before the last one for this game, and the settings changed in between, so you can see what a change did. A change while you drive (here or in the headset menu) starts a new stint, kept as its own entry; each covers the whole stint, with the moments the headset menu was open left out. Compare runs on the same track and car for a fair difference.
es = La sesión anterior a la última de este juego, y los ajustes que cambiaron entre ambas, para ver qué efecto tuvo un cambio. Un cambio mientras conduces (aquí o en el menú del visor) empieza una nueva tanda, guardada como entrada propia; cada una abarca la tanda completa, sin los momentos en que el menú del visor estaba abierto. Compara en el mismo circuito y con el mismo coche para una diferencia justa.
en = Run with anti-cheat
es = Ejecutar con antitrampas
en = Starts the game through its anti-cheat (Easy Anti-Cheat), as Steam does, with Sim-QVFR running, so you can join online servers. Sim-QVFR runs inside the game, and the anti-cheat may kick you or ban your account for it. Sim-QVFR and its developer aren’t responsible for kicks or bans: turning it on asks you to accept that risk. Off starts the game without its anti-cheat, for offline sessions only.
es = Inicia el juego a través de su antitrampas (Easy Anti-Cheat), como hace Steam, con Sim-QVFR en marcha, para que puedas unirte a servidores online. Sim-QVFR se ejecuta dentro del juego, y el antitrampas puede expulsarte o banear tu cuenta por ello. Sim-QVFR y su desarrollador no se hacen responsables de expulsiones ni baneos: al activarlo se te pide que aceptes ese riesgo. Desactivado, el juego se inicia sin su antitrampas, solo para sesiones sin conexión.
en = Layers for
es = Capas para
en = Launches from here: the VR add-ons (OpenXR layers) a launch from this launcher loads, below Sim-QVFR, in an order of its own; nothing else changes. Every app: Windows’ own list, which every other app uses (and the game started from Steam), saved in the registry when you apply, with a backup in the logs folder first.
es = Inicios desde aquí: los complementos VR (capas OpenXR) que carga un inicio desde este lanzador, por debajo de Sim-QVFR, en un orden propio; nada más cambia. Todas las apps: la lista propia de Windows, que usan todas las demás apps (y el juego iniciado desde Steam), guardada en el registro al aplicar, con una copia de seguridad previa en la carpeta de registros.
en = CPU capture
es = Captura de CPU
en = At the next launch, the CPU capture hotkey (Ctrl+Alt+C) while driving records for 20 s where the game’s busiest threads spend their time, into a cpu-profile file in the logs folder. The headset menu shows when it starts and ends; the game may stutter slightly while it records.
es = En el próximo inicio, el atajo de captura de CPU (Ctrl+Alt+C) mientras conduces registra durante 20 s en qué gastan el tiempo los hilos más ocupados del juego, en un archivo cpu-profile de la carpeta de registros. El menú del visor indica cuándo empieza y termina; el juego puede dar algún tirón mientras graba.
en = Frame capture
es = Captura de fotograma
en = Saves the game’s own image and the composed output, as PNG files in the captures folder inside the logs folder. Each press saves one more frame, to compare the views where something looks wrong. In X-Plane 12, Assetto Corsa Competizione and Le Mans Ultimate.
es = Guarda la imagen propia del juego y la salida compuesta como archivos PNG en la carpeta captures, dentro de la carpeta de registros. Cada pulsación guarda un fotograma más, para comparar las vistas donde algo se ve mal. En X-Plane 12, Assetto Corsa Competizione y Le Mans Ultimate.
en = Next launch without QVFR
es = Próximo inicio sin QVFR
en = Starts the game once with its own two views and QVFR off, still measuring, so Diagnostics can compare the same race with and without QVFR. It turns itself off after that launch; the next one has QVFR again. The performance overlay works in it, the headset menu does not.
es = Inicia el juego una vez con sus propias dos vistas y QVFR desactivado, sin dejar de medir, para que Diagnóstico pueda comparar la misma carrera con y sin QVFR. Se desactiva solo tras ese inicio; el siguiente vuelve a tener QVFR. La superposición de rendimiento funciona en él; el menú del visor, no.
en = Detailed logs
es = Registros detallados
en = Normal logs say what Sim-QVFR set up, decided and measured. Detailed logs add every step behind that, for a bug report when the developer asks for one. They last three launches and then turn themselves off, so the logs stay small. Send them with Report an issue, or Save the logs as a zip.
es = Los registros normales dicen qué configuró, decidió y midió Sim-QVFR. Los detallados añaden cada paso detrás de eso, para un informe de error cuando el desarrollador lo pida. Duran tres inicios y luego se desactivan solos, para que los registros sigan siendo pequeños. Envíalos con Informar de un problema, o con Guardar los registros en un zip.
en = Logs folder
es = Carpeta de registros
en = Each launch adds a session log and a small run folder. The launcher keeps the newest 30 sessions and removes older ones at each launch, and the newest 10 CPU captures. Frame captures and game image dumps stay until you clear them: Clear captures moves them to the Recycle Bin.
es = Cada inicio añade un registro de sesión y una pequeña carpeta de ejecución. El lanzador conserva las 30 sesiones más recientes y borra las anteriores en cada inicio, y las 10 capturas de CPU más recientes. Las capturas de fotogramas y los volcados de imagen del juego se quedan hasta que los borres: Borrar capturas los envía a la Papelera de reciclaje.
en = Presets for eye tracked foveation
es = Preajustes para foveación con seguimiento ocular
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Eye tracked, the area follows your eyes, so it can be small and very sharp. They set the resolution only and keep everything else.
es = Puntos de partida que concentran los píxeles en el centro: vistas exteriores bajas y una zona de enfoque densa. Con seguimiento ocular, la zona sigue tus ojos, así que puede ser pequeña y muy nítida. Solo fijan la resolución y mantienen todo lo demás.
en = Presets for fixed foveation
es = Preajustes para foveación fija
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Fixed, your eyes move off the centre, so the area is larger and a little less dense. They set the resolution only and keep everything else.
es = Puntos de partida que concentran los píxeles en el centro: vistas exteriores bajas y una zona de enfoque densa. Con foveación fija, tus ojos se salen del centro, así que la zona es mayor y algo menos densa. Solo fijan la resolución y mantienen todo lo demás.
en = Your profiles
es = Tus perfiles
en = A profile holds every setting of the picture: resolution, foveation and the focus overlay, and where the game has them the view crop, the helmet and Foveated DLSS. Not the menu’s and overlay’s places, the hotkeys or the OpenXR layers. Share copies one as a line of text to paste in a chat; Paste adds one from the clipboard. The headset menu’s Profile line switches between them while you drive.
es = Un perfil guarda todos los ajustes de la imagen: resolución, foveación y la superposición de enfoque, y, donde el juego los tiene, el recorte de la vista, el casco y Foveated DLSS. No las posiciones del menú y de la superposición, los atajos ni las capas OpenXR. Compartir copia uno como una línea de texto para pegarla en un chat; Pegar añade uno desde el portapapeles. La línea Perfil del menú del visor cambia entre ellos mientras conduces.
en = A key’s first press also opens the menu. A wheel’s directions act only while the menu shows, so a switch the game also uses doesn’t open it: use Open or close first.
es = La primera pulsación de una tecla también abre el menú. Las direcciones del volante solo actúan mientras se ve el menú, así que un control que el juego también usa no lo abre: usa primero Abrir o cerrar.
en = Keys work while the game window has focus; wheel, button box and controller buttons work whenever the game runs.
es = Las teclas funcionan mientras la ventana del juego tiene el foco; los botones del volante, de la caja de botones y del mando funcionan siempre que el juego está en marcha.
en = Field of view crop
es = Recorte del campo de visión
en = The outer view keeps its sharpness and the focus region its size. Changes reach a running game at once; with DLSS on, or with less crop than at launch, the pixel count follows at the next launch.
es = La vista exterior mantiene su nitidez y la región de enfoque su tamaño. Los cambios llegan al instante a un juego en marcha; con DLSS activado, o con menos recorte que al iniciar, el número de píxeles se ajusta en el próximo inicio.
en = Helmet overlay
es = Superposición de casco
en = Built in, the visor opening follows the crop (Rim and Corners). Your own helmet: top.png, bottom.png and visor.png with alpha in the helmet folder next to the layer; the log suggests the crop that matches them.
es = Con el integrado, la abertura de la visera sigue el recorte (Borde y Esquinas). Tu propio casco: top.png, bottom.png y visor.png con alfa en la carpeta helmet junto a la capa; el registro sugiere el recorte que encaja con ellos.
en = Focus shape
es = Forma del enfoque
en = Each corner moves toward the middle of the focus region, percent of its width (in) or height (down, up). Pull the top corners in for a trapezoid: more of the dash sharp, less of the far field. The focus view still renders the whole box, so the cost stays the same.
es = Cada esquina se mueve hacia el centro de la región de enfoque, en porcentaje de su anchura (hacia dentro) o de su altura (abajo, arriba). Mete las esquinas superiores para un trapecio: más salpicadero nítido y menos campo lejano. La vista de enfoque sigue renderizando el rectángulo completo, así que el coste no cambia.
en = Cheeky Foveated DLSS
es = Cheeky Foveated DLSS
en = No Cheeky loader goes in the game folder: Sim-QVFR loads Cheeky’s runtime into the game itself.
es = No hay que poner ningún cargador de Cheeky en la carpeta del juego: Sim-QVFR carga el runtime de Cheeky en el propio juego.
en = Frame generation (experimental)
es = Generación de fotogramas (experimental)
en = Outside the center region frames are warped with the game’s motion. Lower scales use less GPU time and memory. With an eye-tracked focus (the Foveation card) the region follows your eyes too, through Cheeky’s OpenXR layer.
es = Fuera de la región central, los fotogramas se deforman con el movimiento del juego. Las escalas más bajas usan menos tiempo de GPU y memoria. Con un enfoque con seguimiento ocular (la tarjeta Foveación), la región también sigue tus ojos, a través de la capa OpenXR de Cheeky.
en = The settings menu stays 0.8 m in front of your head, wherever you look.
es = El menú de ajustes se queda a 0,8 m delante de tu cabeza, mires donde mires.
en = Use DLSS
es = Usar DLSS
en = Sim-QVFR evaluates NVIDIA’s DLSS on each view, with depth and motion it works out from the game’s own frames, before the game’s post-processing. Needs an NVIDIA RTX graphics card. Sim-QVFR includes NVIDIA’s nvngx_dlss.dll; Choose… takes another (a newer one from a game), Use included goes back.
es = Sim-QVFR aplica el DLSS de NVIDIA en cada vista, con la profundidad y el movimiento que calcula a partir de los propios fotogramas del juego, antes del posprocesado del juego. Necesita una tarjeta gráfica NVIDIA RTX. Sim-QVFR incluye el nvngx_dlss.dll de NVIDIA; Elegir… usa otro (uno más reciente de un juego), Usar el incluido vuelve al original.
en = Use FSR
es = Usar FSR
en = Experimental. On a PC without an NVIDIA RTX graphics card, Sim-QVFR evaluates AMD FSR on each view in DLSS’s place, with the same depth and motion: FSR 4 where AMD’s software offers it for your card (Radeon RX 9000, and newer drivers on RX 7000 and 6000), FSR 3.1 elsewhere. Sim-QVFR includes AMD’s FSR files. Tested only as FSR 3.1 on an NVIDIA card so far: tell us how it runs on yours.
es = Experimental. En un PC sin tarjeta gráfica NVIDIA RTX, Sim-QVFR aplica FSR de AMD en cada vista en lugar de DLSS, con la misma profundidad y movimiento: FSR 4 donde el software de AMD lo ofrece para tu tarjeta (Radeon RX 9000, y controladores recientes en RX 7000 y 6000), FSR 3.1 en el resto. Sim-QVFR incluye los archivos de FSR de AMD. Por ahora solo se ha probado como FSR 3.1 en una tarjeta NVIDIA: cuéntanos cómo funciona en la tuya.
en = Periphery preset
es = Preajuste de periferia
en = Steadier or cheaper DLSS outside the focus area. K: a steadier picture, at a higher cost. F: about half the cost, a little more flicker on edges. With eye tracking you rarely look there, so F is usually fine; with a fixed focus, K.
es = DLSS más estable o más barato fuera de la zona de enfoque. K: una imagen más estable, a mayor coste. F: aproximadamente la mitad de coste, algo más de parpadeo en los bordes. Con seguimiento ocular casi nunca miras ahí, así que F suele bastar; con enfoque fijo, K.
en = Texture sharpening
es = Nitidez de texturas
en = DLSS rebuilds detail from frames drawn at a lower resolution, so textures are best sampled a step sharper while it runs. Sim-QVFR does that through copies of the game’s shaders, in the focus area alone or in the periphery too. Measured gains are modest (most in the periphery and on distant textures). Off at launch, nothing is installed for it; turned on then, it starts at the next launch. Fine patterns may shimmer: then a step lower.
es = DLSS reconstruye el detalle a partir de fotogramas dibujados a menor resolución, así que conviene muestrear las texturas un paso más nítidas mientras funciona. Sim-QVFR lo hace mediante copias de los shaders del juego, solo en la zona de enfoque o también en la periferia. Las mejoras medidas son modestas (sobre todo en la periferia y en texturas lejanas). Si está desactivado al iniciar, no se instala nada para ello; si lo activas entonces, empieza en el próximo inicio. Los patrones finos pueden parpadear: en ese caso, un paso menos.
en = Light glow
es = Brillo de luces
en = At night DLSS takes very bright lights (distant headlights, floodlights) for noise and smooths them away, so the game’s bloom fades. Light glow lowers the exposure DLSS works at, so it keeps them: some at Low, more at High. Nothing is added to the picture, so the lights don’t flicker or smear. Very bright edges may get a faint halo: then Low or Off. NVIDIA DLSS only. Experimental.
es = De noche, DLSS toma las luces muy brillantes (faros lejanos, focos) por ruido y las suaviza, así que el resplandor del juego se apaga. Brillo de luces baja la exposición con la que trabaja DLSS para que las conserve: algo en Bajo, más en Alto. No se añade nada a la imagen, así que las luces no parpadean ni dejan estelas. Los bordes muy brillantes pueden tener un leve halo: entonces Bajo o No. Solo NVIDIA DLSS. Experimental.
en = Updates
es = Actualizaciones
en = Install downloads the release from GitHub, checks it against the SHA-256 GitHub gives, replaces the program files and restarts the launcher; your settings, profiles and changed files stay, and the version you had is kept in the update folder. Download opens the release’s page instead.
es = Instalar descarga la versión desde GitHub, la comprueba con el SHA-256 que da GitHub, sustituye los archivos del programa y reinicia el lanzador; tus ajustes, perfiles y archivos modificados se mantienen, y la versión que tenías se guarda en la carpeta update. Descargar abre en su lugar la página de la versión.
en = These settings reach the game while it runs, as soon as you change them. Without the game running, they apply when it starts.
es = Estos ajustes llegan al juego mientras se ejecuta, en cuanto los cambias. Si el juego no está en marcha, se aplican al iniciarlo.
en = Lowering it reaches a running game at once, and so does raising it back up to what the game started with. Above that, it takes effect at the next launch. With DLSS on in the game, the views keep their launch sizes until the next launch.
es = Bajarlo llega al instante a un juego en marcha, y también volver a subirlo hasta el valor con el que se inició el juego. Por encima de eso, se aplica en el próximo inicio. Con DLSS activado en el juego, las vistas mantienen su tamaño de inicio hasta el próximo inicio.
en = These settings take effect the next time the game starts from the launcher. A running game keeps what it started with.
es = Estos ajustes se aplican la próxima vez que el juego se inicie desde el lanzador. Un juego en marcha mantiene los que tenía al iniciarse.
en = The local time on a small card in the headset, apart from the performance overlay: on or off and moved live, here or from the headset menu. It costs next to nothing; it redraws once a minute.
es = La hora local en una pequeña tarjeta en el visor, aparte de la superposición de rendimiento: se activa, desactiva y mueve en directo, aquí o desde el menú del visor. Apenas cuesta nada; se redibuja una vez por minuto.
en = The performance overlay in the headset: frame rate, CPU and GPU time and what limits the frame. A little CPU time while it shows.
es = La superposición de rendimiento en el visor: tasa de fotogramas, tiempo de CPU y GPU y qué limita el fotograma. Un poco de tiempo de CPU mientras se muestra.
en = Shape
es = Forma
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom shape: an outline of up to 10 points you draw on the preview (click the area to add a point, drag one to move it, right-click one to remove it); trace your windscreen, say, then place it with Vertical and Horizontal position. To hide the area’s edge, raise Feather.
es = La forma de la zona nítida. Rectángulo: redondeado por Radio de esquinas. Forma personalizada: un contorno de hasta 10 puntos que dibujas en la vista previa (haz clic en la zona para añadir un punto, arrástralo para moverlo, clic derecho para quitarlo); calca tu parabrisas, por ejemplo, y colócalo con Posición vertical y Posición horizontal. Para ocultar el borde de la zona, sube el Difuminado.
en = Outline color
es = Color del contorno
en = The outline’s colour in the headset. It shows while Show focus outline is on.
es = El color del contorno en el visor. Se ve mientras Mostrar contorno de enfoque está activado.
en = nvngx_dlss.dll
es = nvngx_dlss.dll
en = The DLSS Sim-QVFR uses: the one it includes (NVIDIA’s), or another you choose, a newer one from a game, say (DLSS 310 or newer). Use included goes back. Applies at the next launch.
es = El DLSS que usa Sim-QVFR: el que incluye (el de NVIDIA), u otro que elijas, por ejemplo uno más reciente de un juego (DLSS 310 o posterior). Usar el incluido vuelve al original. Se aplica en el próximo inicio.
en = Focus views
es = Vistas de enfoque
en = DLAA draws them at their size. Ultra quality, Quality, Balanced and Performance draw them at 77, 67, 58 or 50% each way and upscale them: less GPU time, softer distant textures. DLSS has no ultra quality model of its own: 77% runs its quality one.
es = DLAA las dibuja a su tamaño. Ultra calidad, Calidad, Equilibrado y Rendimiento las dibujan al 77, 67, 58 o 50% en cada dirección y las reescalan: menos tiempo de GPU, texturas lejanas más suaves. DLSS no tiene modelo propio de ultra calidad: el 77% usa el de calidad.
en = Focus preset
es = Preajuste de enfoque
en = The DLSS preset for the sharp focus views. With Sim-QVFR’s DLSS, Default is NVIDIA’s choice for the mode: K, and M at Performance, which costs more. With Cheeky, Game default keeps the game’s.
es = El preajuste de DLSS para las vistas de enfoque nítidas. Con el DLSS de Sim-QVFR, Predeterminado es la elección de NVIDIA para el modo: K, y M en Rendimiento, que cuesta más. Con Cheeky, Del juego mantiene el del juego.
en = Other cars’ motion
es = Movimiento de otros coches
en = Gives DLSS each other car’s own motion, so cars passing, alongside or ahead stay clean instead of smearing. Turn it off for more headroom: in a field of cars it costs about 0.5 ms of CPU and 0.2 to 0.5 ms of GPU a frame. Applies at the next launch, with DLSS on at launch; with DLSS off it costs nothing.
es = Da a DLSS el movimiento propio de cada coche, para que los coches que adelantan, van al lado o delante se vean limpios en lugar de emborronados. Desactívalo para tener más margen: en una parrilla llena cuesta unos 0,5 ms de CPU y de 0,2 a 0,5 ms de GPU por fotograma. Se aplica en el próximo inicio, con DLSS activado al iniciar; con DLSS desactivado no cuesta nada.
en = nvngx_dlssnr.dll
es = nvngx_dlssnr.dll
en = NVIDIA’s DLSS neural rendering runtime. Sim-QVFR includes none: it is NVIDIA’s, and comes only with games that ship DLSS-NR. Choose the one in such a game’s folder. Applies at the next launch.
es = El runtime de renderizado neuronal DLSS de NVIDIA. Sim-QVFR no lo incluye: es de NVIDIA y solo viene con juegos que traen DLSS-NR. Elige el de la carpeta de uno de esos juegos. Se aplica en el próximo inicio.
en = Use DLSS-NR
es = Usar DLSS-NR
en = NVIDIA’s DLSS neural rendering on the views: its model reworks lighting and materials from the picture, its depth and its motion. Experimental, and heavy: about 2 ms of GPU time and 130 MB of video memory for every million pixels it works on, per view (RTX 5070 Ti). It turns itself off if frames fall under 10 a second with it on.
es = El renderizado neuronal DLSS de NVIDIA en las vistas: su modelo rehace la iluminación y los materiales a partir de la imagen, su profundidad y su movimiento. Experimental y exigente: unos 2 ms de tiempo de GPU y 130 MB de memoria de vídeo por cada millón de píxeles que procesa, por vista (RTX 5070 Ti). Se desactiva solo si los fotogramas bajan de 10 por segundo con él activado.
en = Intensity
es = Intensidad
en = How much of the model’s change you get: 0% is the picture as it came.
es = Cuánto del cambio del modelo recibes: 0% es la imagen tal como llegó.
en = Style
es = Estilo
en = The look the model aims for.
es = El aspecto que busca el modelo.
en = Preset
es = Preajuste
en = The model: A is the original, B a faster one in newer DLLs (310.9.16 on). Default is the DLL’s own choice. A change rebuilds DLSS-NR: a short stutter.
es = El modelo: A es el original, B uno más rápido de las DLL más recientes (desde la 310.9.16). Predeterminado es la elección de la propia DLL. Un cambio reconstruye DLSS-NR: un breve tirón.
en = Local tone
es = Tono local
en = The strength of the model’s local contrast and lighting changes.
es = La intensidad de los cambios del modelo en el contraste y la iluminación locales.
en = Local structure
es = Estructura local
en = The strength of the model’s changes to fine structure.
es = La intensidad de los cambios del modelo en la estructura fina.
en = Auto mask
es = Máscara automática
en = Lets the model find what it treats differently (skin) by itself.
es = Deja que el modelo encuentre por sí mismo lo que trata de forma distinta (la piel).
en = Runs
es = Se ejecuta
en = After DLSS works on the finished, anti-aliased views. Before DLSS works on the views as drawn, before anti-aliasing and upscaling: fewer pixels when the focus views are upscaled, and DLSS then smooths its result.
es = Después de DLSS trabaja sobre las vistas terminadas y con antialiasing. Antes de DLSS trabaja sobre las vistas tal como se dibujaron, antes del antialiasing y el reescalado: menos píxeles cuando las vistas de enfoque se reescalan, y DLSS suaviza luego su resultado.
en = Focus working size
es = Tamaño de trabajo del enfoque
en = What the model works at, a share of the focus view. Lower costs less; the picture keeps its own detail.
es = La resolución a la que trabaja el modelo, como parte de la vista de enfoque. Más bajo cuesta menos; la imagen conserva su propio detalle.
en = Working size limit
es = Límite del tamaño de trabajo
en = The most one view’s model works on, in megapixels, whatever the sizes. Each megapixel costs about 2 ms of GPU time and 130 MB of video memory, per view.
es = El máximo que procesa el modelo de una vista, en megapíxeles, sean cuales sean los tamaños. Cada megapíxel cuesta unos 2 ms de tiempo de GPU y 130 MB de memoria de vídeo, por vista.
en = Edge blend
es = Fundido del borde
en = The band over which the processed area fades into what isn’t processed around it.
es = La franja en la que la zona procesada se funde con lo que no se procesa a su alrededor.
en = Periphery too
es = También la periferia
en = Off, only the focus views are processed: where you look. On, the periphery too, at its own working size and coverage. It adds about 2 ms of GPU time per eye at least, however small you make it.
es = Desactivado, solo se procesan las vistas de enfoque: donde miras. Activado, también la periferia, con su propio tamaño de trabajo y cobertura. Añade al menos unos 2 ms de tiempo de GPU por ojo, por pequeño que lo hagas.
en = Periphery working size
es = Tamaño de trabajo de la periferia
en = As the focus working size, for the periphery.
es = Como el tamaño de trabajo del enfoque, para la periferia.
en = Periphery covered
es = Periferia cubierta
en = How much of each eye’s view the model covers, around the focus area.
es = Cuánto de la vista de cada ojo cubre el modelo, alrededor de la zona de enfoque.
en = Foveated DLSS
es = Foveated DLSS
en = Off leaves the game’s own DLSS on every view.
es = Desactivado deja el DLSS propio del juego en todas las vistas.
en = Outer preset
es = Preajuste exterior
en = The DLSS preset of the outer views’ own pass (Cheaper outer views).
es = El preajuste de DLSS de la pasada propia de las vistas exteriores (Vistas exteriores más baratas).
en = Fix motion-vector blur
es = Corregir el desenfoque de vectores de movimiento
en = Cheeky’s workaround for smearing with some presets. Adds GPU work.
es = El apaño de Cheeky para el emborronado con algunos preajustes. Añade trabajo a la GPU.
en = DLSS-NR
es = DLSS-NR
en = NVIDIA’s DLSS-NR (DLSS 5) on the focus views. Needs nvngx_dlssnr.dll next to the game.
es = DLSS-NR (DLSS 5) de NVIDIA en las vistas de enfoque. Necesita nvngx_dlssnr.dll junto al juego.
en = DLSS-NR passes
es = Pasadas de DLSS-NR
en = Each extra DLSS-NR pass costs about one more NR evaluation.
es = Cada pasada extra de DLSS-NR cuesta aproximadamente una evaluación de NR más.
en = Multiplier
es = Multiplicador
en = Frames shown per frame the game renders: 2x adds one generated frame between each two of the game’s.
es = Fotogramas mostrados por cada fotograma que renderiza el juego: 2x añade un fotograma generado entre cada dos del juego.
en = Center FG scale
es = Escala de FG central
en = Frame generation’s resolution in the center region. Lower uses less GPU time and memory.
es = La resolución de la generación de fotogramas en la región central. Más baja usa menos tiempo de GPU y memoria.
en = Periphery FG scale
es = Escala de FG periférica
en = Frame generation’s resolution around the center region. Lower uses less GPU time and memory.
es = La resolución de la generación de fotogramas alrededor de la región central. Más baja usa menos tiempo de GPU y memoria.
en = Release game
es = Liberar el juego
en = When the game starts its next frame. Never: CPU and GPU overlap (most frames). Capture: after the GPU finishes. Generated: after the generated frame.
es = Cuándo empieza el juego su siguiente fotograma. Nunca: la CPU y la GPU se solapan (la mayoría de los fotogramas). Captura: cuando termina la GPU. Generado: después del fotograma generado.
en = Show the center region
es = Mostrar la región central
en = Outlines the region in the headset, to check that it follows your eyes.
es = Marca el contorno de la región en el visor, para comprobar que sigue tus ojos.
en = Rim
es = Borde
en = How far the helmet’s padding reaches into the view.
es = Cuánto entra en la vista el acolchado del casco.
en = Corners
es = Esquinas
en = Rounds the helmet’s visor opening.
es = Redondea la abertura de la visera del casco.
en = Lighting
es = Iluminación
en = How much the scene lights the helmet.
es = Cuánto ilumina la escena el casco.
en = Visor
es = Visera
en = Your own images only: closed, half or open. Ctrl+Alt+V in the game steps it.
es = Solo con tus propias imágenes: cerrada, a medias o abierta. Ctrl+Alt+V en el juego la cambia.
en = Depth
es = Profundidad
en = Your own images only: how far in front of your eyes, in cm. 0 is far away, with no depth.
es = Solo con tus propias imágenes: a qué distancia delante de tus ojos, en cm. 0 es lejos, sin profundidad.
en = Your own images only: Detail (4096) is sharper, Performance (2048) costs less GPU time and memory.
es = Solo con tus propias imágenes: Detalle (4096) es más nítido, Rendimiento (2048) cuesta menos tiempo de GPU y memoria.
en = Degrees right of straight ahead. Negative is left. Drag it in Placement, or move it in the headset.
es = Grados a la derecha de mirar al frente. Negativo es a la izquierda. Arrástralo en Colocación o muévelo en el visor.
en = Degrees above eye level. Negative is below. Drag it in Placement, or move it in the headset.
es = Grados por encima del nivel de los ojos. Negativo es por debajo. Arrástralo en Colocación o muévelo en el visor.
en = How wide it is, in degrees of your view.
es = Su anchura, en grados de tu vista.
en = A line under the headset menu with the in-game hotkeys (overlay, visor, CPU capture) and their wheel buttons, as set in Hotkeys. Also on the menu’s Headset page.
es = Una línea bajo el menú del visor con los atajos del juego (superposición, visera, captura de CPU) y sus botones del volante, tal como están en Atajos. También en la página Visor del menú.
en = Open or close
es = Abrir o cerrar
en = Opens the headset menu, or closes it.
es = Abre o cierra el menú del visor.
