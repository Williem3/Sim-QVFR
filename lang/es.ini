en = Custom corners pulls each corner of the focus area in, e.g. the top ones for a trapezoid
es = Esquinas personalizadas mete hacia dentro cada esquina de la zona de enfoque, p. ej. las de arriba para un trapecio
en = The cut corners aren't rendered: the shape saves pixels too
es = Las esquinas recortadas no se renderizan: la forma también ahorra píxeles
en = How finely the effects are worked out: fewer samples and steps for the shadows, occlusion and smoothing at Low, all of them at High. The switches below stay as you set them. Low costs about half the GPU time of High and looks a little grainier; the periphery always runs one step below the focus area, where it's least seen.
es = Con qué detalle se calculan los efectos: menos muestras y pasos para las sombras, la oclusión y el suavizado en Bajo, todos en Alto. Los interruptores de abajo quedan como los pusiste. Bajo cuesta aproximadamente la mitad del tiempo de GPU de Alto y se ve un poco más granulado; la periferia siempre va un nivel por debajo del área de enfoque, donde menos se nota.
en = Quality sets how finely each effect is worked out, not which are on: Low costs about half the GPU time of High. Night car lighting itself starts at the next launch; everything else changes while you drive.
es = La calidad define con qué detalle se calcula cada efecto, no cuáles están activos: Bajo cuesta aproximadamente la mitad del tiempo de GPU de Alto. La iluminación nocturna de los coches en sí empieza en el siguiente inicio; todo lo demás cambia mientras conduces.
en = Sets the switches below by their GPU cost: Low keeps paint detail, lacquer reflections and headlight highlights, Medium adds shadows on the ground, High adds floodlight shadows. Night vision color isn't part of it. Changing any switch yourself shows no preset selected.
es = Ajusta los interruptores de abajo según su coste de GPU: Bajo conserva el detalle de pintura, los reflejos del barniz y los brillos de los faros, Medio añade las sombras en el suelo, Alto añade las sombras de los focos. El color de visión nocturna no forma parte. Si cambias un interruptor tú mismo, no queda ningún ajuste preestablecido seleccionado.
en = Custom: the switches below don’t match a preset.
es = Personalizado: los interruptores de abajo no coinciden con ningún ajuste preestablecido.
en = Low, Medium and High set the switches by their GPU cost; night vision is left as you set it. Night car lighting itself starts at the next launch; everything else changes while you drive.
es = Bajo, Medio y Alto ajustan los interruptores según su coste de GPU; la visión nocturna se queda como la hayas puesto. La iluminación nocturna en sí empieza en el próximo inicio; todo lo demás cambia mientras conduces.
