; No longer in Sim-QVFR (kept to reuse; ignored where the English isn't shown any more):
en = Rendering method
es = Método de renderizado
en = Quad View Foveated Rendering draws the outer and focus views in one game frame: the lightest on the CPU, and the one with every feature. Two-loop (legacy) draws two whole game frames per headset frame: about twice the CPU work per frame, and no frame generation.
es = Quad View Foveated Rendering dibuja las vistas exteriores y de enfoque en un solo fotograma del juego: el más ligero para la CPU y el que tiene todas las funciones. Two-loop (antiguo) dibuja dos fotogramas completos del juego por cada fotograma del visor: aproximadamente el doble de trabajo de CPU por fotograma y sin generación de fotogramas.
en = Two-loop
es = Two-loop
en = In Quad View Foveated Rendering only
es = Solo en Quad View Foveated Rendering
en = Legacy method (Two-loop)
es = Método antiguo (Two-loop)
en = Available in Quad View Foveated Rendering.
es = Disponible en Quad View Foveated Rendering.
en = In Two-loop the focus density ({density}) follows from Periphery resolution and the focus size. Focus density, sharpening and object detail are set in Quad View Foveated Rendering.
es = En Two-loop, la densidad de enfoque ({density}) se deriva de Resolución de la periferia y del tamaño del enfoque. La densidad de enfoque, la nitidez y el detalle de objetos se ajustan en Quad View Foveated Rendering.
en = Quad View Foveated Rendering
es = Quad View Foveated Rendering
en = Color correction is available in Quad View Foveated Rendering.
es = La corrección de color está disponible en Quad View Foveated Rendering.
en = Game Lighting Enhancement is available in Quad View Foveated Rendering.
es = La iluminación del juego mejorada está disponible en Quad View Foveated Rendering.
en = The crop and the helmet are available in Quad View Foveated Rendering.
es = El recorte y el casco están disponibles en Quad View Foveated Rendering.
en = Two-loop renders each headset frame twice. Switch to Quad View Foveated Rendering; Two-loop won’t be offered again.
es = Two-loop renderiza cada fotograma del visor dos veces. Cambia a Quad View Foveated Rendering; Two-loop no volverá a ofrecerse.
en = The focus view is drawn in Quad View Foveated Rendering.
es = La vista de enfoque se dibuja en Quad View Foveated Rendering.
en = Foveation applied live · resolution and method at the next launch
es = Foveación aplicada en directo · resolución y método en el próximo inicio
en = Two-loop Foveated Interlaced (legacy)
es = Two-loop Foveated Interlaced (antiguo)
en = Headset menu · Two-loop (legacy)
es = Menú del visor · Two-loop (antiguo)
en = The focus area renders in full detail only along the road ahead: about 10 m either side of the road and 3.5 m above it, following its hills and bends. Trees, grandstands, hills and the sky beside and above that come from the periphery’s image, as does the cockpit; where you look while you drive you shouldn’t see a difference. It saves GPU time, more with a larger focus area. Turn it off if something beside the road looks softer than you want. Changes while you drive.
es = El área de enfoque se renderiza con todo detalle solo a lo largo de la carretera que tienes delante: unos 10 m a cada lado de la carretera y 3,5 m por encima, siguiendo sus cambios de rasante y sus curvas. Los árboles, las gradas, las colinas y el cielo a los lados y por encima salen de la imagen de la periferia, igual que el cockpit; donde miras al conducir no deberías notar diferencia. Ahorra tiempo de GPU, más con un área de enfoque mayor. Desactívalo si algo junto a la carretera se ve más suave de lo que quieres. Cambia mientras conduces.
en = DLAA on the road only
es = DLAA solo en la carretera
en = With Road focus and Sim-QVFR’s DLSS on: the focus area’s DLAA runs only over the rows the road covers, the rest takes the periphery’s DLAA. It saves more GPU time. Turn it off if you see a soft strip above or below the road for a moment when you look up or down quickly. Changes while you drive.
es = Con el enfoque en la carretera y el DLSS de Sim-QVFR activados: el DLAA del área de enfoque solo pasa por las filas que ocupa la carretera; el resto toma el DLAA de la periferia. Ahorra aún más tiempo de GPU. Desactívalo si ves un momento una franja suave por encima o por debajo de la carretera al mirar rápido arriba o abajo. Cambia mientras conduces.
en = Full detail along the road ahead; the scenery beside and above it from the periphery.
es = Todo el detalle a lo largo de la carretera; el paisaje a los lados y por encima, de la periferia.
en = With Sim-QVFR’s DLSS on: the focus area’s DLAA over the road’s rows alone.
es = Con el DLSS de Sim-QVFR activado: el DLAA del área de enfoque solo sobre las filas de la carretera.
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom corners: each corner moved in on its own; pull the top corners in for a trapezoid, more of the dash sharp at the same cost. To hide the area’s edge, raise Feather.
es = La forma de la zona nítida. Rectángulo: redondeado por Radio de esquinas. Esquinas personalizadas: cada esquina se mueve por separado; mete las esquinas superiores para un trapecio, con más salpicadero nítido al mismo coste. Para disimular el borde de la zona, sube Difuminado.
en = Custom corners
es = Esquinas personalizadas
