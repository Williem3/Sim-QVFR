; src/launcher/report.cpp
en = Eye tracking is on, but the headset runtime never gave the game input focus
es = El seguimiento ocular está activado, pero el runtime del visor nunca dio el foco de entrada al juego
en = OpenXR sends the eye gaze only to the app in focus, so the focus area stayed in the centre. Close the runtime's dashboard and any overlay or gaze app (OSC bridges, gaze viewers) before the game; the session log says "never FOCUSED".
es = OpenXR solo envía la mirada a la app con el foco, así que la zona de enfoque se quedó en el centro. Cierra el panel del runtime y cualquier overlay o app de mirada (puentes OSC, visores de mirada) antes del juego; el registro de la sesión dice "never FOCUSED".
en = Eye tracking is on, but the tracker sent nothing last session
es = El seguimiento ocular está activado, pero el sensor no envió nada en la última sesión
en = The focus area stayed in the centre. Start the headset's eye tracking (and calibrate it) before the game, or choose Fixed in Foveation.
es = La zona de enfoque se quedó en el centro. Activa el seguimiento ocular del visor (y calíbralo) antes de abrir el juego, o elige Fijo en Foveación.
en = Foveated DLSS did not start at the last launch (Cheeky {status})
es = Foveated DLSS no se inició en el último inicio (Cheeky {status})
en = Choose Cheeky's runtime (CheekyFoveatedDLSSRuntime.dll) in Foveated DLSS.
es = Elige el runtime de Cheeky (CheekyFoveatedDLSSRuntime.dll) en Foveated DLSS.
en = Cheeky's runtime refused to load: use the build the README lists, and check the session log.
es = El runtime de Cheeky se negó a cargarse: usa la versión que indica el README y revisa el registro de la sesión.
en = The view is larger than the headset runtime allows
es = La vista es mayor de lo que permite el runtime del visor
en = Lower the outer resolution or the focus density in Resolution.
es = Baja la resolución de la periferia o la densidad de enfoque en Resolución.
en = The focus area ({width}% × {height}%) is larger than the runtime's own focus region ({runtime_width}% × {runtime_height}%)
es = La zona de enfoque ({width}% × {height}%) es mayor que la región de enfoque propia del runtime ({runtime_width}% × {runtime_height}%)
en = With the runtime composing the views (Pimax, Varjo), the focus area shows only inside its own focus region; past it, the outer resolution shows. Make the runtime's focus area larger (Pimax Play, Varjo Base), or Sim-QVFR's no larger than it, in Resolution.
es = Cuando el runtime compone las vistas (Pimax, Varjo), la zona de enfoque solo se ve dentro de su propia región de enfoque; fuera de ella se ve la resolución de la periferia. Agranda la zona de enfoque del runtime (Pimax Play, Varjo Base), o haz la de Sim-QVFR no mayor que ella, en Resolución.
en = VRAM was nearly full ({percent}% of what Windows allows the game)
es = La VRAM estaba casi llena ({percent}% de lo que Windows permite al juego)
en = Stutter and hitches follow when it runs out. Lower the outer resolution or the focus density, or the game's texture quality.
es = Cuando se agota, aparecen tirones y parones. Baja la resolución de la periferia o la densidad de enfoque, o la calidad de texturas del juego.
en = OpenXR Toolkit is loaded under Sim-QVFR
es = OpenXR Toolkit se carga bajo Sim-QVFR
en = It adds about 0.8 ms to every frame's submission. If you don't use it for this game, switch it off in OpenXR layers.
es = Añade unos 0,8 ms al envío de cada fotograma. Si no lo usas en este juego, desactívalo en Capas OpenXR.
en = The GPU was busy all the time ({percent}%)
es = La GPU estuvo ocupada todo el tiempo ({percent}%)
en = This is the GPU's limit. Lower the outer resolution or the focus density, or the game's graphics settings.
es = Es el límite de la GPU. Baja la resolución de la periferia o la densidad de enfoque, o los ajustes gráficos del juego.
en = The game's CPU work limited the frame rate
es = El trabajo de CPU del juego limitó la tasa de fotogramas
en = QVFR lowers the GPU's work, not the CPU's. Lower the game's CPU-heavy settings (opponents, mirrors, shadows).
es = QVFR reduce el trabajo de la GPU, no el de la CPU. Baja los ajustes del juego que más cargan la CPU (rivales, retrovisores, sombras).
en = The headset runtime ran the game at half rate for {percent}% of the session
es = El runtime del visor ejecutó el juego a media tasa durante el {percent}% de la sesión
en = When frames come close to the budget, the runtime's motion smoothing halves the frame rate for a few seconds (Varjo does this). Turn motion smoothing off in the runtime's software (Varjo Base) to compare, and give the CPU room: lower the game's CPU-heavy settings (opponents, mirrors, shadows).
es = Cuando los fotogramas se acercan al presupuesto, el suavizado de movimiento del runtime reduce a la mitad la tasa de fotogramas durante unos segundos (Varjo lo hace). Desactiva el suavizado de movimiento en el software del runtime (Varjo Base) para comparar, y dale margen a la CPU: baja los ajustes del juego que más la cargan (rivales, retrovisores, sombras).
en = {percent}% of frames were late with neither the CPU nor the GPU full
es = El {percent}% de los fotogramas llegaron tarde sin que la CPU ni la GPU estuvieran al límite
en = Often something else in the chain: another OpenXR layer, an overlay, or the runtime's motion smoothing. Try with them off.
es = Suele ser otra cosa de la cadena: otra capa OpenXR, una superposición o el suavizado de movimiento del runtime. Prueba con ellos desactivados.

