; src/launcher/ui/help.cpp
en = Rendering method
ru = Метод рендеринга
en = Quad View Foveated Rendering draws the outer and focus views in one game frame: the lightest on the CPU, and the one with every feature. Two-loop (legacy) draws two whole game frames per headset frame: about twice the CPU work per frame, and no frame generation.
ru = Quad View Foveated Rendering рисует внешние виды и виды фокуса за один игровой кадр: самый лёгкий для CPU и со всеми функциями. Two-loop (устаревший) рисует два полных игровых кадра на каждый кадр шлема: примерно вдвое больше работы CPU на кадр и без генерации кадров.
en = Foveated mode
ru = Фовеальный режим
en = Eye tracked: the sharp area follows your eyes, so it can be small and dense; it needs a headset with eye tracking. Fixed: the area stays in the centre, so make it larger, since your eyes move off it.
ru = С отслеживанием глаз: чёткая область следует за вашим взглядом, поэтому может быть маленькой и плотной; нужен шлем VR с отслеживанием глаз. Фиксированный: область остаётся в центре, поэтому делайте её больше, ведь глаза уходят с неё.
en = Periphery resolution
ru = Разрешение периферии
en = The wide view around the focus area, a share of the headset’s recommended resolution. It covers most of the view but you see it with your side vision, so it is the first to lower: it saves GPU time and VRAM roughly with its pixels. The preview’s Pixels per frame shows the total.
ru = Широкий вид вокруг области фокуса, доля рекомендуемого разрешения шлема VR. Он занимает бóльшую часть обзора, но вы видите его боковым зрением, поэтому его снижают первым: экономия времени GPU и VRAM примерно пропорциональна его пикселям. «Пикселей за кадр» в превью показывает итог.
en = Focus density
ru = Плотность фокуса
en = Pixel density inside the focus area, a share of the headset’s native density. Above 100% it renders more pixels than the headset shows where you look: sharper text and edges. Its cost grows with the area’s size, so a small area can take a high density cheaply. Dragging moves it in 5% steps; the arrow keys move it by 1%.
ru = Плотность пикселей в области фокуса, доля нативной плотности шлема VR. Выше 100% там, куда вы смотрите, рендерится больше пикселей, чем показывает шлем: чётче текст и края. Стоимость растёт с размером области, так что маленькой области высокая плотность обходится дёшево. Перетаскивание меняет её шагом 5%, стрелки — на 1%.
en = Object detail
ru = Детализация объектов
en = How detailed trees and objects are, and how far away they are still drawn. At 100% they are as sharp in the focus region as its pixel density shows them; lower settings move toward the game’s own detail for the periphery resolution. It costs CPU, not GPU: more detail means more objects for X-Plane’s main thread to prepare every frame, often what limits the frame rate with QVFR. Lower it if frames stutter in dense scenery; the focus region shows coarser trees.
ru = Насколько детальны деревья и объекты и на каком расстоянии они ещё рисуются. При 100% они в области фокуса так же чётки, как позволяет её плотность пикселей; меньшие значения приближают к собственной детализации игры для разрешения периферии. Это нагрузка на CPU, а не GPU: больше деталей — больше объектов, которые главный поток X-Plane готовит каждый кадр, а именно он часто ограничивает частоту кадров с QVFR. Снизьте, если в плотной застройке кадры дёргаются; область фокуса покажет деревья грубее.
en = For a player who sees with one eye. The eye you choose shows black in the headset, and the game draws no focus view for it, renders only a few pixels of its scene and skips DLSS on it, so the GPU does much less. The game still prepares that eye’s frame, so the CPU saves little. With both eyes seeing, a black eye is uncomfortable: leave it at None.
ru = Для игрока, который видит одним глазом. Выбранный глаз в шлеме показывает чёрный экран, и игра не рисует для него вид фокуса, рендерит лишь несколько пикселей его сцены и пропускает для него DLSS, так что GPU работает гораздо меньше. Игра всё равно готовит кадр этого глаза, поэтому CPU экономит мало. Если видят оба глаза, чёрный глаз неудобен: оставьте «Нет».
en = Sharpening
ru = Резкость
en = Crisper edges and text in the focus area; too much makes it shimmer. Raise it a little if the view looks soft (0% is off); it costs a little GPU time and changes while you drive. How: AMD FidelityFX Contrast Adaptive Sharpening, applied as Sim-QVFR resamples the focus view for the headset. Each pixel is sharpened by how much contrast room it has, so soft detail gains the most and edges already sharp gain little. The percentage is CAS’s own sharpness, as other CAS sharpeners show it: any setting above 0% already sharpens. Only the focus area is sharpened, fading out across its feather so its edge stays even: your side vision sees shimmer more than detail. 0% is off; it changes while you drive.
ru = Более чёткие края и текст в области фокуса; при избытке появляется мерцание. Немного повысьте, если изображение кажется мягким (0% — выкл.); это стоит немного времени GPU и меняется прямо на ходу. Как: AMD FidelityFX Contrast Adaptive Sharpening, применяемый, когда Sim-QVFR пересчитывает вид фокуса для шлема VR. Каждый пиксель усиливается в меру своего запаса контраста, поэтому мягкие детали выигрывают больше всего, а уже резкие края — мало. Процент — это собственная резкость CAS, как её показывают другие CAS-фильтры: любое значение выше 0% уже добавляет резкость. Резкость добавляется только в области фокуса и плавно сходит на нет по её растушёвке, чтобы край оставался ровным: боковое зрение замечает мерцание сильнее, чем детали. 0% — выкл.; меняется прямо на ходу.
en = Brightness
ru = Яркость
en = How light or dark the game’s colour is. The wheel picks its hue and how strong it is; the launcher keeps its text and edges readable in light and dark mode.
ru = Насколько светлый или тёмный цвет игры. Круг задаёт его оттенок и насыщенность; лаунчер сохраняет читаемость текста и краёв в светлой и тёмной теме.
en = Focus width
ru = Ширина фокуса
en = The focus area’s width, a share of the view. Wider hides the edge between sharp and soft better; its pixels cost density × width × height, so a wide area at a high density costs the most. It changes while you drive; wider than the game started with (at your density) renders less dense until the next launch.
ru = Ширина области фокуса, доля вида. Чем шире, тем лучше скрыта граница между чётким и мягким; её пиксели стоят плотность × ширина × высота, так что широкая область при высокой плотности дороже всего. Меняется прямо на ходу; шире, чем при старте игры (при вашей плотности), рендерится с меньшей плотностью до следующего запуска.
en = Focus height
ru = Высота фокуса
en = The focus area’s height, a share of the view. Taller covers more of the dash and mirrors; it costs pixels as the width does. Taller than the game started with (at your density) renders less dense until the next launch.
ru = Высота области фокуса, доля вида. Чем выше, тем больше охват приборной панели и зеркал; пиксели стоят так же, как для ширины. Выше, чем при старте игры (при вашей плотности), рендерится с меньшей плотностью до следующего запуска.
en = Corner radius
ru = Радиус углов
en = Rounds the focus area’s corners, so its edge is harder to spot. No cost: the area renders as a rectangle either way.
ru = Скругляет углы области фокуса, чтобы её край было труднее заметить. Бесплатно: область в любом случае рендерится прямоугольником.
en = Feather
ru = Растушёвка
en = The band where the focus area blends into the outer view. Wider hides the edge better; no measurable cost.
ru = Полоса, где область фокуса переходит во внешний вид. Чем шире, тем лучше скрыт край; измеримой стоимости нет.
en = Gaze dead-zone
ru = Мёртвая зона взгляда
en = How far your eyes move before the focus area follows. A little keeps it still against eye-tracker noise; too much makes it lag when you look around. No GPU cost.
ru = Насколько далеко должны сместиться глаза, прежде чем область фокуса последует за ними. Немного — и она не дрожит от шума айтрекера; слишком много — и она запаздывает, когда вы оглядываетесь. Без нагрузки на GPU.
en = Gaze offset
ru = Смещение взгляда
en = Moves the eye-tracked focus area up or down, in degrees, for a tracker that sits a little off. No cost.
ru = Сдвигает область фокуса с отслеживанием глаз вверх или вниз, в градусах, для трекера, который немного сбит. Бесплатно.
en = Vertical position
ru = Положение по вертикали
en = Moves the fixed focus area up or down, in degrees: towards the dash and mirrors, or the road. No cost.
ru = Сдвигает фиксированную область фокуса вверх или вниз, в градусах: к приборной панели и зеркалам или к дороге. Бесплатно.
en = Crop the view
ru = Обрезка вида
en = Cuts the edges a helmet or the lens hides before the game renders them. It saves GPU time and VRAM with the pixels cut; the headset shows black there.
ru = Отрезает края, которые скрывают гоночный шлем или линза, до того как игра их отрендерит. Экономит время GPU и VRAM пропорционально обрезанным пикселям; там шлем VR показывает чёрное.
en = Top
ru = Сверху
en = How much of the top of each eye’s view the game doesn’t render. Saves pixels in proportion.
ru = Какую часть верха вида каждого глаза игра не рендерит. Экономит пиксели пропорционально.
en = Bottom
ru = Снизу
en = How much of the bottom of each eye’s view the game doesn’t render. Saves pixels in proportion.
ru = Какую часть низа вида каждого глаза игра не рендерит. Экономит пиксели пропорционально.
en = Outer side (temple)
ru = Внешний край (висок)
en = How much of each eye’s temple side the game doesn’t render. Saves pixels in proportion.
ru = Какую часть вида каждого глаза со стороны виска игра не рендерит. Экономит пиксели пропорционально.
en = Inner side (nose)
ru = Внутренний край (нос)
en = How much of each eye’s nose side the game doesn’t render; the other eye still sees most of it. Saves pixels in proportion.
ru = Какую часть вида каждого глаза со стороны носа игра не рендерит; другой глаз всё равно видит бóльшую её часть. Экономит пиксели пропорционально.
en = Show a helmet
ru = Показывать гоночный шлем
en = Draws a helmet’s visor opening round the view, lit by the scene, in a layer of its own. It costs the headset a layer to composite; nothing for the game.
ru = Рисует вокруг вида проём визора гоночного шлема, освещённый сценой, на отдельном слое. Шлему VR это стоит компоновки одного слоя; игре — ничего.
en = Show focus outline
ru = Показывать контур фокуса
en = Draws the focus area’s edge, to see where it is and how it follows your eyes. For setting up; turn it off to drive.
ru = Рисует край области фокуса, чтобы видеть, где она и как следует за глазами. Для настройки; на время езды выключите.
en = Use Cheeky Foveated DLSS
ru = Использовать Cheeky Foveated DLSS
en = Runs Cheeky Foveated DLSS inside the game, for the DLSS options below. Needs an NVIDIA RTX GPU, DLSS on in the game, and Cheeky’s download. Applies at the next launch.
ru = Запускает Cheeky Foveated DLSS внутри игры для опций DLSS ниже. Нужны видеокарта NVIDIA RTX, включённый в игре DLSS и загрузка Cheeky. Применяется при следующем запуске.
en = Cheaper outer views
ru = Дешёвые внешние виды
en = The outer views get Cheeky’s DLAA at a lower resolution instead of the game’s DLSS: GPU time saved on the views you see least.
ru = Внешние виды получают DLAA от Cheeky в меньшем разрешении вместо DLSS игры: экономия времени GPU на видах, которые вы видите хуже всего.
en = Outer DLAA scale
ru = Масштаб внешнего DLAA
en = The resolution of that cheaper pass. Lower saves more GPU time and softens the side view.
ru = Разрешение этого дешёвого прохода. Ниже — больше экономия GPU и мягче боковой обзор.
en = Focus supersampling
ru = Суперсэмплинг фокуса
en = Renders the focus views above their size before DLSS: a sharper centre, for more GPU time.
ru = Рендерит виды фокуса крупнее их размера перед DLSS: чётче центр, ценой времени GPU.
en = Frame generation
ru = Генерация кадров
en = Cheeky’s DLSS frame generation adds frames between the game’s: smoother motion when the game can’t hold the refresh rate, for some GPU time and latency. Turn OpenXR Toolkit’s Turbo mode off with it, and run no other frame generator.
ru = Генерация кадров DLSS от Cheeky добавляет кадры между кадрами игры: плавнее движение, когда игра не держит частоту обновления, ценой времени GPU и задержки. Вместе с ней выключите режим Turbo в OpenXR Toolkit и не используйте другие генераторы кадров.
en = Center region
ru = Центральная область
en = The part of the view frame generation makes at full quality (it follows your eyes when eye tracked). Larger looks better and costs more GPU time.
ru = Часть вида, которую генерация кадров делает в полном качестве (с отслеживанием глаз следует за взглядом). Больше — лучше выглядит и дороже для GPU.
en = Load order
ru = Порядок загрузки
en = Nearest the game first. Each launch loads these below the Sim-QVFR layer in this order; a layer off in Windows can still be loaded for the game alone. Locked switches keep the mod and the game working.
ru = Ближайший к игре — первым. Каждый запуск загружает их под слоем Sim-QVFR в этом порядке; слой, выключенный в Windows, всё равно можно загрузить только для игры. Заблокированные переключатели сохраняют работу мода и игры.
en = Describe the problem
ru = Опишите проблему
en = Zips the logs and the game’s crash reports from those sessions (names and account IDs taken out) into the logs folder, then opens a new issue on GitHub with what you wrote, your settings, the last session and your PC filled in. Add the steps there, and drag in the zip (it shows below) and any screenshots.
ru = Упаковывает журналы и отчёты о вылетах игры за эти сессии (без имён и ID аккаунтов) в zip в папке журналов, затем открывает новый issue на GitHub с вашим текстом, настройками, последней сессией и данными ПК. Добавьте туда шаги и перетащите zip (он появится ниже) и скриншоты.
en = Busiest threads
ru = Самые загруженные потоки
en = Each thread is a share of ONE core. A thread near 100% can hold the frame rate back even when Windows shows the whole CPU at 15%; a thread that spins by design looks busy whatever limits it.
ru = Каждый поток — доля ОДНОГО ядра. Поток около 100% может сдерживать частоту кадров, даже когда Windows показывает загрузку всего CPU 15%; поток, который крутится по задумке, выглядит занятым, что бы его ни ограничивало.
en = Frame rate
ru = Частота кадров
en = The last session’s average against the headset’s refresh rate, the frame rate it asks for. Below it, the runtime fills the gaps (motion smoothing or reprojection), which shows as wobble on moving edges.
ru = Среднее за последнюю сессию в сравнении с частотой обновления шлема VR, т. е. частотой кадров, которую он требует. Ниже неё среда выполнения заполняет пропуски (сглаживание движения или репроекция), что видно как дрожание движущихся краёв.
en = Slow frames
ru = Медленные кадры
en = How long your slowest frames take: lower is smoother. One frame in ten took at least this long (the 90th percentile). Above the frame’s budget (1000 ms divided by the headset’s refresh rate: 11.1 ms at 90 Hz) those frames miss the headset, and you feel stutter even when the average frame rate looks fine.
ru = Сколько длятся ваши самые медленные кадры: меньше — плавнее. Каждый десятый кадр длился не меньше этого (90-й перцентиль). Сверх бюджета кадра (1000 ms делить на частоту обновления шлема: 11,1 ms при 90 Hz) такие кадры не успевают к шлему, и вы чувствуете статтеры, даже когда средняя частота кадров выглядит нормально.
en = Limited by
ru = Ограничение
en = What held the frame back most of the time: the game’s render thread on the CPU, the GPU, or nothing (the headset’s refresh). Lowering resolution helps only when the GPU limits it.
ru = Что сдерживало кадр бóльшую часть времени: поток рендеринга игры на CPU, GPU или ничего (частота обновления шлема). Снижение разрешения помогает, только когда ограничивает GPU.
en = Previous session
ru = Предыдущая сессия
en = The session before the last one for this game, and the settings changed in between, so you can see what a change did. A change while you drive (here or in the headset menu) starts a new stint, kept as its own entry; each covers the whole stint, with the moments the headset menu was open left out. Compare runs on the same track and car for a fair difference.
ru = Сессия перед последней для этой игры и настройки, изменённые между ними, чтобы видеть эффект изменения. Изменение на ходу (здесь или в меню в шлеме) начинает новый отрезок со своей записью; каждая охватывает весь отрезок, без моментов, когда было открыто меню в шлеме. Для честного сравнения сравнивайте заезды на одной трассе и машине.
en = Run with anti-cheat
ru = Запуск с античитом
en = Starts the game through its anti-cheat (Easy Anti-Cheat), as Steam does, with Sim-QVFR running, so you can join online servers. Sim-QVFR runs inside the game, and the anti-cheat may kick you or ban your account for it. Sim-QVFR and its developer aren’t responsible for kicks or bans: turning it on asks you to accept that risk. Off starts the game without its anti-cheat, for offline sessions only.
ru = Запускает игру через её античит (Easy Anti-Cheat), как это делает Steam, с работающим Sim-QVFR, чтобы можно было заходить на онлайн-серверы. Sim-QVFR работает внутри игры, и античит может за это кикнуть вас или забанить аккаунт. Sim-QVFR и его разработчик не несут ответственности за кики и баны: при включении вас попросят принять этот риск. Выкл. — игра запускается без античита, только офлайн-сессии.
en = Layers for
ru = Слои для
en = Launches from here: the VR add-ons (OpenXR layers) a launch from this launcher loads, below Sim-QVFR, in an order of its own; nothing else changes. Every app: Windows’ own list, which every other app uses (and the game started from Steam), saved in the registry when you apply, with a backup in the logs folder first.
ru = Запуски отсюда: VR-дополнения (слои OpenXR), которые загружает запуск из этого лаунчера, под Sim-QVFR, в собственном порядке; больше ничего не меняется. Все приложения: собственный список Windows, которым пользуются все другие приложения (и игра, запущенная из Steam); сохраняется в реестре при применении, с предварительной резервной копией в папке журналов.
en = CPU capture
ru = Захват CPU
en = At the next launch, the CPU capture hotkey (Ctrl+Alt+C) while driving records for 20 s where the game’s busiest threads spend their time, into a cpu-profile file in the logs folder. The headset menu shows when it starts and ends; the game may stutter slightly while it records.
ru = При следующем запуске горячая клавиша захвата CPU (Ctrl+Alt+C) во время езды 20 с записывает, на что тратят время самые загруженные потоки игры, в файл cpu-profile в папке журналов. Меню в шлеме показывает начало и конец; во время записи игра может слегка подтормаживать.
en = Frame capture
ru = Захват кадра
en = Saves the game’s own image and the composed output, as PNG files in the captures folder inside the logs folder. Each press saves one more frame, to compare the views where something looks wrong. In X-Plane 12, Assetto Corsa Competizione and Le Mans Ultimate.
ru = Сохраняет собственное изображение игры и скомпонованный вывод как PNG-файлы в папке captures внутри папки журналов. Каждое нажатие сохраняет ещё один кадр, чтобы сравнить виды там, где что-то не так. В X-Plane 12, Assetto Corsa Competizione и Le Mans Ultimate.
en = Next launch without QVFR
ru = Следующий запуск без QVFR
en = Starts the game once with its own two views and QVFR off, still measuring, so Diagnostics can compare the same race with and without QVFR. It turns itself off after that launch; the next one has QVFR again. The performance overlay works in it, the headset menu does not.
ru = Один раз запускает игру с её собственными двумя видами и выключенным QVFR, продолжая измерения, чтобы диагностика могла сравнить одну и ту же гонку с QVFR и без. После этого запуска выключается сама; следующий снова будет с QVFR. Оверлей производительности в нём работает, меню в шлеме — нет.
en = Detailed logs
ru = Подробные журналы
en = Normal logs say what Sim-QVFR set up, decided and measured. Detailed logs add every step behind that, for a bug report when the developer asks for one. They last three launches and then turn themselves off, so the logs stay small. Send them with Report an issue, or Save the logs as a zip.
ru = Обычные журналы сообщают, что Sim-QVFR настроил, решил и измерил. Подробные добавляют каждый шаг за этим — для отчёта об ошибке, когда разработчик попросит. Они действуют три запуска и выключаются сами, чтобы журналы оставались небольшими. Отправьте их через «Сообщить о проблеме» или сохраните журналы в zip.
en = Logs folder
ru = Папка журналов
en = Each launch adds a session log and a small run folder. The launcher keeps the newest 30 sessions and removes older ones at each launch, and the newest 10 CPU captures. Frame captures and game image dumps stay until you clear them: Clear captures moves them to the Recycle Bin.
ru = Каждый запуск добавляет журнал сессии и небольшую папку запуска. Лаунчер хранит 30 последних сессий и удаляет более старые при каждом запуске, а также 10 последних захватов CPU. Захваты кадров и дампы изображений игры остаются, пока вы их не очистите: «Очистить захваты» перемещает их в корзину.
en = Presets for eye tracked foveation
ru = Пресеты для фовеации с отслеживанием глаз
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Eye tracked, the area follows your eyes, so it can be small and very sharp. They set the resolution only and keep everything else.
ru = Отправные точки, которые отдают пиксели центру: низкие внешние виды и плотная область фокуса. С отслеживанием глаз область следует за взглядом, поэтому может быть маленькой и очень чёткой. Они задают только разрешение, остальное не трогают.
en = Presets for fixed foveation
ru = Пресеты для фиксированной фовеации
en = Starting points that put the pixels in the centre: low outer views and a dense focus area. Fixed, your eyes move off the centre, so the area is larger and a little less dense. They set the resolution only and keep everything else.
ru = Отправные точки, которые отдают пиксели центру: низкие внешние виды и плотная область фокуса. При фиксированной фовеации глаза уходят из центра, поэтому область больше и чуть менее плотная. Они задают только разрешение, остальное не трогают.
en = Your profiles
ru = Ваши профили
en = A profile holds every setting of the picture: resolution, foveation and the focus overlay, and where the game has them the view crop, the helmet and Foveated DLSS. Not the menu’s and overlay’s places, the hotkeys or the OpenXR layers. Share copies one as a line of text to paste in a chat; Paste adds one from the clipboard. The headset menu’s Profile line switches between them while you drive.
ru = Профиль хранит все настройки изображения: разрешение, фовеацию и контур фокуса, а где игра их поддерживает — обрезку вида, гоночный шлем и Foveated DLSS. Не хранит положение меню и оверлея, горячие клавиши и слои OpenXR. «Поделиться» копирует профиль строкой текста для чата; «Вставить» добавляет профиль из буфера обмена. Строка «Профиль» в меню в шлеме переключает их на ходу.
en = A key’s first press also opens the menu. A wheel’s directions act only while the menu shows, so a switch the game also uses doesn’t open it: use Open or close first.
ru = Первое нажатие клавиши также открывает меню. Направления руля действуют, только пока меню видно, поэтому переключатель, который использует и игра, его не откроет: сначала используйте «Открыть или закрыть».
en = Keys work while the game window has focus; wheel, button box and controller buttons work whenever the game runs.
ru = Клавиши работают, пока окно игры в фокусе; кнопки руля, кнопочной панели и контроллера — всё время, пока идёт игра.
en = Field of view crop
ru = Обрезка поля зрения
en = The outer view keeps its sharpness and the focus region its size. Changes reach a running game at once; with DLSS on, or with less crop than at launch, the pixel count follows at the next launch.
ru = Внешний вид сохраняет чёткость, а область фокуса — размер. Изменения сразу доходят до запущенной игры; с включённым DLSS или при меньшей обрезке, чем при запуске, число пикселей обновится при следующем запуске.
en = Helmet overlay
ru = Оверлей гоночного шлема
en = Built in, the visor opening follows the crop (Rim and Corners). Your own helmet: top.png, bottom.png and visor.png with alpha in the helmet folder next to the layer; the log suggests the crop that matches them.
ru = Во встроенном шлеме проём визора следует за обрезкой («Кант» и «Углы»). Свой шлем: top.png, bottom.png и visor.png с альфа-каналом в папке helmet рядом со слоем; журнал подскажет подходящую обрезку.
en = Focus shape
ru = Форма фокуса
en = Each corner moves toward the middle of the focus region, percent of its width (in) or height (down, up). Pull the top corners in for a trapezoid: more of the dash sharp, less of the far field. The focus view still renders the whole box, so the cost stays the same.
ru = Каждый угол смещается к середине области фокуса, в процентах её ширины (внутрь) или высоты (вниз, вверх). Сведите верхние углы для трапеции: больше приборной панели чётко, меньше дальнего плана. Вид фокуса всё равно рендерит весь прямоугольник, так что стоимость та же.
en = Cheeky Foveated DLSS
ru = Cheeky Foveated DLSS
en = No Cheeky loader goes in the game folder: Sim-QVFR loads Cheeky’s runtime into the game itself.
ru = Загрузчик Cheeky в папку игры не кладётся: Sim-QVFR сам загружает среду выполнения Cheeky в игру.
en = Frame generation (experimental)
ru = Генерация кадров (эксперимент.)
en = Outside the center region frames are warped with the game’s motion. Lower scales use less GPU time and memory. With an eye-tracked focus (the Foveation card) the region follows your eyes too, through Cheeky’s OpenXR layer.
ru = Вне центральной области кадры деформируются по движению игры. Меньший масштаб — меньше времени GPU и памяти. С фокусом по отслеживанию глаз (карточка «Фовеация») область тоже следует за взглядом, через слой OpenXR от Cheeky.
en = The settings menu stays 0.8 m in front of your head, wherever you look.
ru = Меню настроек остаётся в 0,8 м перед головой, куда бы вы ни смотрели.
en = Use DLSS
ru = Использовать DLSS
en = Sim-QVFR evaluates NVIDIA’s DLSS on each view, with depth and motion it works out from the game’s own frames, before the game’s post-processing. Needs an NVIDIA RTX graphics card. Sim-QVFR includes NVIDIA’s nvngx_dlss.dll; Choose… takes another (a newer one from a game), Use included goes back.
ru = Sim-QVFR применяет NVIDIA DLSS к каждому виду, с глубиной и движением, вычисленными из собственных кадров игры, до её постобработки. Нужна видеокарта NVIDIA RTX. Sim-QVFR включает nvngx_dlss.dll от NVIDIA; «Выбрать…» берёт другой (более новый из какой-нибудь игры), «Использовать встроенный» возвращает исходный.
en = Use FSR
ru = Использовать FSR
en = Experimental. On a PC without an NVIDIA RTX graphics card, Sim-QVFR evaluates AMD FSR on each view in DLSS’s place, with the same depth and motion: FSR 4 where AMD’s software offers it for your card (Radeon RX 9000, and newer drivers on RX 7000 and 6000), FSR 3.1 elsewhere. Sim-QVFR includes AMD’s FSR files. Tested only as FSR 3.1 on an NVIDIA card so far: tell us how it runs on yours.
ru = Экспериментально. На ПК без видеокарты NVIDIA RTX Sim-QVFR применяет AMD FSR к каждому виду вместо DLSS, с той же глубиной и движением: FSR 4, где ПО AMD предлагает его для вашей карты (Radeon RX 9000 и новые драйверы на RX 7000 и 6000), FSR 3.1 в остальных случаях. Sim-QVFR включает файлы AMD FSR. Пока проверено только как FSR 3.1 на карте NVIDIA: расскажите, как он работает у вас.
en = Periphery preset
ru = Пресет периферии
en = Steadier or cheaper DLSS outside the focus area. K: a steadier picture, at a higher cost. F: about half the cost, a little more flicker on edges. With eye tracking you rarely look there, so F is usually fine; with a fixed focus, K.
ru = Более стабильный или более дешёвый DLSS вне области фокуса. K: стабильнее картинка, дороже. F: примерно вдвое дешевле, чуть больше мерцания на краях. С отслеживанием глаз вы туда редко смотрите, так что обычно хватает F; с фиксированным фокусом — K.
en = Texture sharpening
ru = Резкость текстур
en = DLSS rebuilds detail from frames drawn at a lower resolution, so textures are best sampled a step sharper while it runs. Sim-QVFR does that through copies of the game’s shaders, in the focus area alone or in the periphery too. Measured gains are modest (most in the periphery and on distant textures). Off at launch, nothing is installed for it; turned on then, it starts at the next launch. Fine patterns may shimmer: then a step lower.
ru = DLSS восстанавливает детали из кадров, отрисованных в меньшем разрешении, поэтому текстуры лучше выбирать на ступень резче, пока он работает. Sim-QVFR делает это через копии шейдеров игры — только в области фокуса или и на периферии. Измеренный выигрыш скромный (больше всего на периферии и на дальних текстурах). Если выключено при запуске, для этого ничего не устанавливается; включённое потом заработает при следующем запуске. Мелкие узоры могут мерцать: тогда на ступень ниже.
en = Updates
ru = Обновления
en = Install downloads the release from GitHub, checks it against the SHA-256 GitHub gives, replaces the program files and restarts the launcher; your settings, profiles and changed files stay, and the version you had is kept in the update folder. Download opens the release’s page instead.
ru = «Установить» скачивает релиз с GitHub, сверяет его с SHA-256 от GitHub, заменяет файлы программы и перезапускает лаунчер; ваши настройки, профили и изменённые файлы остаются, а прежняя версия сохраняется в папке update. «Скачать» вместо этого открывает страницу релиза.
en = These settings reach the game while it runs, as soon as you change them. Without the game running, they apply when it starts.
ru = Эти настройки доходят до запущенной игры сразу после изменения. Если игра не запущена, они применятся при её старте.
en = Lowering it reaches a running game at once, and so does raising it back up to what the game started with. Above that, it takes effect at the next launch. With DLSS on in the game, the views keep their launch sizes until the next launch.
ru = Снижение сразу доходит до запущенной игры, как и повышение обратно до значения при старте игры. Выше — вступает в силу при следующем запуске. С включённым в игре DLSS виды сохраняют стартовые размеры до следующего запуска.
en = These settings take effect the next time the game starts from the launcher. A running game keeps what it started with.
ru = Эти настройки вступают в силу при следующем запуске игры из лаунчера. Запущенная игра сохраняет то, с чем стартовала.
en = The local time on a small card in the headset, apart from the performance overlay: on or off and moved live, here or from the headset menu. It costs next to nothing; it redraws once a minute.
ru = Местное время на небольшой карточке в шлеме VR, отдельно от оверлея производительности: включается и перемещается на ходу, здесь или из меню в шлеме. Почти ничего не стоит; перерисовывается раз в минуту.
en = The performance overlay in the headset: frame rate, CPU and GPU time and what limits the frame. A little CPU time while it shows.
ru = Оверлей производительности в шлеме VR: частота кадров, время CPU и GPU и что ограничивает кадр. Немного времени CPU, пока он виден.
en = Shape
ru = Форма
en = The shape of the sharp area. Rectangle: rounded by Corner radius. Custom corners: each corner moved in on its own; pull the top corners in for a trapezoid, more of the dash sharp at the same cost. To hide the area’s edge, raise Feather.
ru = Форма чёткой области. Прямоугольник: скругление задаёт «Радиус углов». Свои углы: каждый угол смещается отдельно; сведите верхние углы для трапеции — больше приборной панели чётко при той же стоимости. Чтобы скрыть край области, увеличьте растушёвку.
en = Outline color
ru = Цвет контура
en = The outline’s colour in the headset. It shows while Show focus outline is on.
ru = Цвет контура в шлеме VR. Виден, пока включено «Показывать контур фокуса».
en = nvngx_dlss.dll
ru = nvngx_dlss.dll
en = The DLSS Sim-QVFR uses: the one it includes (NVIDIA’s), or another you choose, a newer one from a game, say (DLSS 310 or newer). Use included goes back. Applies at the next launch.
ru = DLSS, который использует Sim-QVFR: встроенный (от NVIDIA) или другой на ваш выбор, например более новый из игры (DLSS 310 или новее). «Использовать встроенный» возвращает исходный. Применяется при следующем запуске.
en = Focus views
ru = Виды фокуса
en = DLAA draws them at their size. Ultra quality, Quality, Balanced and Performance draw them at 77, 67, 58 or 50% each way and upscale them: less GPU time, softer distant textures. DLSS has no ultra quality model of its own: 77% runs its quality one.
ru = DLAA рисует их в их размере. Ультра качество, Качество, Баланс и Производительность рисуют их на 77, 67, 58 или 50% по каждой оси и масштабируют: меньше времени GPU, мягче дальние текстуры. У DLSS нет своей модели ультра качества: 77% использует модель качества.
en = Focus preset
ru = Пресет фокуса
en = The DLSS preset for the sharp focus views. With Sim-QVFR’s DLSS, Default is NVIDIA’s choice for the mode: K, and M at Performance, which costs more. With Cheeky, Game default keeps the game’s.
ru = Пресет DLSS для чётких видов фокуса. С DLSS от Sim-QVFR «По умолчанию» — выбор NVIDIA для режима: K, а в режиме Производительность — M, который дороже. С Cheeky «Как в игре» сохраняет пресет игры.
en = Other cars’ motion
ru = Движение других машин
en = Gives DLSS each other car’s own motion, so cars passing, alongside or ahead stay clean instead of smearing. Turn it off for more headroom: in a field of cars it costs about 0.5 ms of CPU and 0.2 to 0.5 ms of GPU a frame. Applies at the next launch, with DLSS on at launch; with DLSS off it costs nothing.
ru = Передаёт DLSS собственное движение каждой машины, чтобы обгоняющие, идущие рядом и впереди машины оставались чёткими, а не размазывались. Выключите для запаса: в плотном трафике это стоит около 0,5 ms CPU и 0,2–0,5 ms GPU за кадр. Применяется при следующем запуске, с DLSS, включённым при запуске; с выключенным DLSS ничего не стоит.
en = nvngx_dlssnr.dll
ru = nvngx_dlssnr.dll
en = NVIDIA’s DLSS neural rendering runtime. Sim-QVFR includes none: it is NVIDIA’s, and comes only with games that ship DLSS-NR. Choose the one in such a game’s folder. Applies at the next launch.
ru = Среда выполнения нейронного рендеринга NVIDIA DLSS. Sim-QVFR её не включает: она принадлежит NVIDIA и поставляется только с играми с DLSS-NR. Выберите файл из папки такой игры. Применяется при следующем запуске.
en = Use DLSS-NR
ru = Использовать DLSS-NR
en = NVIDIA’s DLSS neural rendering on the views: its model reworks lighting and materials from the picture, its depth and its motion. Experimental, and heavy: about 2 ms of GPU time and 130 MB of video memory for every million pixels it works on, per view (RTX 5070 Ti). It turns itself off if frames fall under 10 a second with it on.
ru = Нейронный рендеринг NVIDIA DLSS на видах: его модель перерабатывает освещение и материалы по картинке, её глубине и движению. Экспериментально и тяжело: около 2 ms времени GPU и 130 MB видеопамяти на каждый обрабатываемый миллион пикселей, на вид (RTX 5070 Ti). Выключается сам, если с ним кадров меньше 10 в секунду.
en = Intensity
ru = Интенсивность
en = How much of the model’s change you get: 0% is the picture as it came.
ru = Какую долю изменений модели вы получаете: 0% — картинка как есть.
en = Style
ru = Стиль
en = The look the model aims for.
ru = Облик, к которому стремится модель.
en = Preset
ru = Пресет
en = The model: A is the original, B a faster one in newer DLLs (310.9.16 on). Default is the DLL’s own choice. A change rebuilds DLSS-NR: a short stutter.
ru = Модель: A — исходная, B — более быстрая в новых DLL (с 310.9.16). «По умолчанию» — выбор самой DLL. Изменение пересоздаёт DLSS-NR: короткое подтормаживание.
en = Local tone
ru = Локальный тон
en = The strength of the model’s local contrast and lighting changes.
ru = Сила изменений локального контраста и освещения.
en = Local structure
ru = Локальная структура
en = The strength of the model’s changes to fine structure.
ru = Сила изменений мелкой структуры.
en = Auto mask
ru = Автомаска
en = Lets the model find what it treats differently (skin) by itself.
ru = Модель сама находит то, что обрабатывает иначе (кожу).
en = Runs
ru = Выполняется
en = After DLSS works on the finished, anti-aliased views. Before DLSS works on the views as drawn, before anti-aliasing and upscaling: fewer pixels when the focus views are upscaled, and DLSS then smooths its result.
ru = После: DLSS работает с готовыми сглаженными видами. До: DLSS работает с видами в исходном виде, до сглаживания и масштабирования: меньше пикселей, когда виды фокуса масштабируются, а DLSS затем сглаживает результат.
en = Focus working size
ru = Рабочий размер фокуса
en = What the model works at, a share of the focus view. Lower costs less; the picture keeps its own detail.
ru = Разрешение, в котором работает модель, доля вида фокуса. Ниже — дешевле; картинка сохраняет свои детали.
en = Working size limit
ru = Предел рабочего размера
en = The most one view’s model works on, in megapixels, whatever the sizes. Each megapixel costs about 2 ms of GPU time and 130 MB of video memory, per view.
ru = Максимум, который модель обрабатывает для одного вида, в мегапикселях, при любых размерах. Каждый мегапиксель стоит около 2 ms времени GPU и 130 MB видеопамяти на вид.
en = Edge blend
ru = Смешивание краёв
en = The band over which the processed area fades into what isn’t processed around it.
ru = Полоса, по которой обработанная область переходит в необработанную вокруг.
en = Periphery too
ru = И периферия
en = Off, only the focus views are processed: where you look. On, the periphery too, at its own working size and coverage. It adds about 2 ms of GPU time per eye at least, however small you make it.
ru = Выкл.: обрабатываются только виды фокуса — там, куда вы смотрите. Вкл.: и периферия, со своими рабочим размером и охватом. Это добавляет минимум около 2 ms времени GPU на глаз, как бы мало вы её ни сделали.
en = Periphery working size
ru = Рабочий размер периферии
en = As the focus working size, for the periphery.
ru = Как рабочий размер фокуса, но для периферии.
en = Periphery covered
ru = Охват периферии
en = How much of each eye’s view the model covers, around the focus area.
ru = Какую часть вида каждого глаза охватывает модель вокруг области фокуса.
en = Foveated DLSS
ru = Foveated DLSS
en = Off leaves the game’s own DLSS on every view.
ru = Выкл. оставляет собственный DLSS игры на всех видах.
en = Outer preset
ru = Внешний пресет
en = The DLSS preset of the outer views’ own pass (Cheaper outer views).
ru = Пресет DLSS для собственного прохода внешних видов («Дешёвые внешние виды»).
en = Fix motion-vector blur
ru = Убрать размытие векторов
en = Cheeky’s workaround for smearing with some presets. Adds GPU work.
ru = Обходное решение Cheeky от размазывания на некоторых пресетах. Добавляет работу GPU.
en = DLSS-NR
ru = DLSS-NR
en = NVIDIA’s DLSS-NR (DLSS 5) on the focus views. Needs nvngx_dlssnr.dll next to the game.
ru = NVIDIA DLSS-NR (DLSS 5) на видах фокуса. Нужен nvngx_dlssnr.dll рядом с игрой.
en = DLSS-NR passes
ru = Проходы DLSS-NR
en = Each extra DLSS-NR pass costs about one more NR evaluation.
ru = Каждый дополнительный проход DLSS-NR стоит примерно ещё одного вычисления NR.
en = Multiplier
ru = Множитель
en = Frames shown per frame the game renders: 2x adds one generated frame between each two of the game’s.
ru = Сколько кадров показывается на каждый кадр игры: 2x добавляет один сгенерированный кадр между каждыми двумя кадрами игры.
en = Center FG scale
ru = Масштаб FG центра
en = Frame generation’s resolution in the center region. Lower uses less GPU time and memory.
ru = Разрешение генерации кадров в центральной области. Ниже — меньше времени GPU и памяти.
en = Periphery FG scale
ru = Масштаб FG периферии
en = Frame generation’s resolution around the center region. Lower uses less GPU time and memory.
ru = Разрешение генерации кадров вокруг центральной области. Ниже — меньше времени GPU и памяти.
en = Release game
ru = Отпуск игры
en = When the game starts its next frame. Never: CPU and GPU overlap (most frames). Capture: after the GPU finishes. Generated: after the generated frame.
ru = Когда игра начинает следующий кадр. Никогда: CPU и GPU перекрываются (большинство кадров). Захват: после того как GPU закончит. Генерация: после сгенерированного кадра.
en = Show the center region
ru = Показывать центральную область
en = Outlines the region in the headset, to check that it follows your eyes.
ru = Обводит область в шлеме VR, чтобы проверить, что она следует за взглядом.
en = Rim
ru = Кант
en = How far the helmet’s padding reaches into the view.
ru = Насколько далеко подкладка гоночного шлема заходит в вид.
en = Corners
ru = Углы
en = Rounds the helmet’s visor opening.
ru = Скругляет проём визора гоночного шлема.
en = Lighting
ru = Освещение
en = How much the scene lights the helmet.
ru = Насколько сцена освещает гоночный шлем.
en = Visor
ru = Визор
en = Your own images only: closed, half or open. Ctrl+Alt+V in the game steps it.
ru = Только свои изображения: закрыт, наполовину или открыт. Ctrl+Alt+V в игре переключает.
en = Depth
ru = Глубина
en = Your own images only: how far in front of your eyes, in cm. 0 is far away, with no depth.
ru = Только свои изображения: насколько далеко перед глазами, в см. 0 — далеко, без глубины.
en = Detail
ru = Детализация
en = Your own images only: Detail (4096) is sharper, Performance (2048) costs less GPU time and memory.
ru = Только свои изображения: «Детализация» (4096) чётче, «Производительность» (2048) требует меньше времени GPU и памяти.
en = Degrees right of straight ahead. Negative is left. Drag it in Placement, or move it in the headset.
ru = Градусы вправо от направления прямо. Отрицательные — влево. Перетащите в «Расположении» или переместите в шлеме.
en = Degrees above eye level. Negative is below. Drag it in Placement, or move it in the headset.
ru = Градусы выше уровня глаз. Отрицательные — ниже. Перетащите в «Расположении» или переместите в шлеме.
en = How wide it is, in degrees of your view.
ru = Ширина, в градусах поля зрения.
en = A line under the headset menu with the in-game hotkeys (overlay, visor, CPU capture) and their wheel buttons, as set in Hotkeys. Also on the menu’s Headset page.
ru = Строка под меню в шлеме с горячими клавишами игры (оверлей, визор, захват CPU) и их кнопками руля, как задано в «Горячих клавишах». Также на странице «Шлем» меню.
en = Open or close
ru = Открыть или закрыть
en = Opens the headset menu, or closes it.
ru = Открывает или закрывает меню в шлеме.
en = Up
ru = Вверх
en = Selects the line above in the headset menu.
ru = Выбирает строку выше в меню в шлеме.
en = Down
ru = Вниз
en = Selects the line below in the headset menu.
ru = Выбирает строку ниже в меню в шлеме.
en = Left
ru = Влево
en = Lowers the selected value in the headset menu.
ru = Уменьшает выбранное значение в меню в шлеме.
en = Right
ru = Вправо
en = Raises the selected value in the headset menu.
ru = Увеличивает выбранное значение в меню в шлеме.
en = Overlay
ru = Оверлей
en = Turns the performance overlay on or off.
ru = Включает или выключает оверлей производительности.
en = Helmet visor
ru = Визор шлема
en = Steps the helmet’s visor: closed, half, open.
ru = Переключает визор гоночного шлема: закрыт, наполовину, открыт.
en = Helmet images
ru = Изображения шлема
en = Your own helmet: top.png, bottom.png and visor.png in the helmet folder next to the layer. Size and Height place them (degrees of view, and above straight ahead).
ru = Свой гоночный шлем: top.png, bottom.png и visor.png в папке helmet рядом со слоем. «Размер» и «Высота» размещают их (в градусах поля зрения и выше направления прямо).

