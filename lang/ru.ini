en = With the runtime composing the views (Pimax, Varjo), the focus area shows only inside its own focus region; past it, the outer resolution shows. Make the runtime's focus area larger (Pimax Play, Varjo Base), or Sim-QVFR's no larger than it, in Resolution.
ru = Когда виды компонует среда выполнения (Pimax, Varjo), область фокуса видна только внутри её собственной области фокуса; за ней видно внешнее разрешение. Увеличьте область фокуса среды выполнения (Pimax Play, Varjo Base) или сделайте область Sim-QVFR не больше неё в разделе «Разрешение».
en = VRAM was nearly full ({percent}% of what Windows allows the game)
ru = VRAM была почти заполнена ({percent}% от того, что Windows выделяет игре)
en = Stutter and hitches follow when it runs out. Lower the outer resolution or the focus density, or the game's texture quality.
ru = Когда она заканчивается, появляются статтеры и подвисания. Снизьте внешнее разрешение, плотность фокуса или качество текстур в игре.
en = OpenXR Toolkit is loaded under Sim-QVFR
ru = OpenXR Toolkit загружен под Sim-QVFR
en = It adds about 0.8 ms to every frame's submission. If you don't use it for this game, switch it off in OpenXR layers.
ru = Он добавляет около 0,8 ms к отправке каждого кадра. Если вы не используете его в этой игре, выключите его в слоях OpenXR.
en = The GPU was busy all the time ({percent}%)
ru = GPU был загружен всё время ({percent}%)
en = This is the GPU's limit. Lower the outer resolution or the focus density, or the game's graphics settings.
ru = Это предел GPU. Снизьте внешнее разрешение, плотность фокуса или графические настройки игры.
en = The game's CPU work limited the frame rate
ru = Частоту кадров ограничивала нагрузка игры на CPU
en = QVFR lowers the GPU's work, not the CPU's. Lower the game's CPU-heavy settings (opponents, mirrors, shadows).
ru = QVFR снижает нагрузку на GPU, а не на CPU. Снизьте тяжёлые для CPU настройки игры (соперники, зеркала, тени).
en = The headset runtime ran the game at half rate for {percent}% of the session
ru = Среда выполнения шлема VR держала игру на половинной частоте {percent}% сессии
en = When frames come close to the budget, the runtime's motion smoothing halves the frame rate for a few seconds (Varjo does this). Turn motion smoothing off in the runtime's software (Varjo Base) to compare, and give the CPU room: lower the game's CPU-heavy settings (opponents, mirrors, shadows).
ru = Когда кадры подходят к пределу бюджета, сглаживание движения среды выполнения на несколько секунд вдвое снижает частоту кадров (так делает Varjo). Для сравнения выключите сглаживание движения в ПО среды выполнения (Varjo Base) и дайте CPU запас: снизьте тяжёлые для CPU настройки игры (соперники, зеркала, тени).
en = {percent}% of frames were late with neither the CPU nor the GPU full
ru = {percent}% кадров опоздали, хотя ни CPU, ни GPU не были загружены полностью
en = Often something else in the chain: another OpenXR layer, an overlay, or the runtime's motion smoothing. Try with them off.
ru = Часто виновато что-то другое в цепочке: другой слой OpenXR, оверлей или сглаживание движения среды выполнения. Попробуйте без них.

