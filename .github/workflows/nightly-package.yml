# Nightly line only (docs/architecture/mod-manager-plan.md "Nightly channel"): every push to feature/mod-manager or
# nightly builds the package on a Windows runner, runs every offline test (package.ps1 does), and keeps the
# sqvfr-nightly-*.zip as a downloadable artifact for 14 days. Nothing is published as a release.
#
# The artifact is NOT signed (the certificate's key stays on the maintainer's PC: sign before publishing) and has
# no DLSS (NVIDIA's SDK is never in this repository: -NoDlss). The Defender scan is skipped (-NoScan): runners
# don't keep Defender's signatures current. load_test is left out (-SkipTest): its live GPU check needs a real GPU's
# engine counters, and a runner has only Microsoft's Basic Render Driver; VERSION.txt in the zip says it was skipped,
# and it still runs on every local build. It never runs for development or main.
name: Nightly package

on:
  push:
    branches: [feature/mod-manager, nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Package (nightly, unsigned, no DLSS)
        shell: powershell
        run: ./package.ps1 -Nightly -NoDlss -NoScan -SkipTest load_test -OutputDirectory "$env:RUNNER_TEMP\dist"

      - name: Upload the nightly zip
        uses: actions/upload-artifact@v4
        with:
          name: sqvfr-nightly-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dist/sqvfr-nightly-*.zip
            ${{ runner.temp }}/dist/sqvfr-mod-*.zip
            ${{ runner.temp }}/dist/sqvfr-sdk-*.zip
          if-no-files-found: error
          retention-days: 14
