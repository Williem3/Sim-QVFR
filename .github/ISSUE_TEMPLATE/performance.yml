# Frame rate, stutter and frame time.
# The launcher's Report an issue (Diagnostics pane) opens this form for "Performance" and fills the fields
# what, files, checks and details by id (src/launcher/report.cpp's issue_fields; kIssueTemplates maps the
# kinds to these files): every template keeps those ids.
name: Performance
description: Low frame rate, stutter, or slower than without QVFR.
title: "[Performance] "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        The quickest way here is the launcher: **Diagnostics → Report an issue** zips your logs and fills in
        your settings, the last session and your PC below.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you notice? A low frame rate, stutter, hitches, judder?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From starting the launcher, the settings you changed, the track and car, and what you did.
      placeholder: |
        1.
        2.
  - type: textarea
    id: when
    attributes:
      label: When does it happen?
      description: Every launch, after some minutes, on one track or car, since an update...
  - type: input
    id: fps
    attributes:
      label: Frame rate
      description: What you get, and what you expect or got before.
      placeholder: e.g. 72 fps, was 90 with v1.2 / without QVFR
  - type: textarea
    id: game
    attributes:
      label: In-game graphics settings
      description: The quality presets or the settings you changed in ACE.
  - type: textarea
    id: files
    attributes:
      label: Screenshots and logs
      description: |
        Drag in screenshots of the launcher's Diagnostics page and the performance overlay, and the report zip
        from the launcher's logs folder (sim-qvfr-report-*.zip).
  - type: textarea
    id: checks
    attributes:
      label: Launcher checks
      description: What the launcher noticed about the last session (filled in by the launcher).
  - type: textarea
    id: details
    attributes:
      label: Collected by the launcher
      description: Version, PC, headset, settings and the last session's numbers (filled in by the launcher).
