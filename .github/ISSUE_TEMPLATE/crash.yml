# Crashes and freezes.
# The launcher's Report an issue (Diagnostics pane) opens this form for "Crash or freeze" and fills the fields
# what, files, checks and details by id (src/launcher/report.cpp's issue_fields; kIssueTemplates maps the
# kinds to these files): every template keeps those ids.
name: Crash or freeze
description: The game closes, freezes or the headset goes grey.
title: "[Crash or freeze] "
labels: ["bug", "crash"]
body:
  - type: markdown
    attributes:
      value: |
        The quickest way here is the launcher: **Diagnostics → Report an issue** zips your logs and fills in
        your settings, the last session and your PC below.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What were you doing when it crashed or froze, and what did you see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From starting the launcher, the settings you changed, the track and car, and what you did.
      placeholder: |
        1.
        2.
  - type: textarea
    id: when
    attributes:
      label: When does it happen?
      description: Every launch, after some minutes, on one track or car, since an update...
  - type: dropdown
    id: stops
    attributes:
      label: How does it stop?
      options:
        - "The game closes"
        - "The game freezes (the window stops responding)"
        - "The headset shows nothing or goes grey"
        - "Something else"
  - type: dropdown
    id: every
    attributes:
      label: Does it happen every time?
      options:
        - "Every time"
        - "Sometimes"
        - "Once so far"
  - type: textarea
    id: files
    attributes:
      label: Screenshots and logs
      description: |
        Drag in the report zip from the launcher's logs folder (ace-quadview-report-*.zip): it has the session's
        logs and any hang dump. Screenshots of an error message help too.
  - type: textarea
    id: checks
    attributes:
      label: Launcher checks
      description: What the launcher noticed about the last session (filled in by the launcher).
  - type: textarea
    id: details
    attributes:
      label: Collected by the launcher
      description: Version, PC, headset, settings and the last session's numbers (filled in by the launcher).
