; ace-quadview experiment switch, read once when Assetto Corsa EVO starts.
;
; mode=off         log-only probes, rendering unchanged (default)
; mode=focus_only  ACE renders only a centred focus box at full eye-buffer resolution; the headset
;                  shows that sharp window with black around it. Proves the layer steers ACE's
;                  eye cameras. Not for driving.
; mode=double_render  ACE renders every frame twice inside one frame. CRASHES ACE (GPU device
;                  removed, round 6); kept only to reproduce that result.
; mode=two_loops   ACE runs two complete frames per headset frame (same view both times); only the
;                  second is shown. Needs VectorXR (or any frame generation) off for ACE.
; mode=quad        the quad pipeline: frame A renders the full view, frame B the focus box
;                  (focus_percent of the FOV, centred straight ahead), both at ACE's eye size
;                  (eye_scale of native). The layer blends B into A at the headset's native size
;                  and submits that. Focus pixel density = eye_scale / focus_percent of native,
;                  e.g. eye_scale=50, focus_percent=35 -> outer 0.50x, focus 1.43x.
;                  Needs VectorXR (or any frame generation) off for ACE.
; mode=views3      single-frame quad views, step 1: ACE's renderer runs its 3-view mode (normally
;                  triple screens) in VR. Logs the view mode, per-view storage and, with probes=1,
;                  every render-target bind and viewport. The third view's camera is unknown: the
;                  image may be wrong or ACE may crash. Not for driving.
; mode=views4      single-frame quad views, stage gate: ACE renders 4 views per VR frame (views 2-3
;                  copy the two eyes) into a target four eyes wide; the headset shows views 0-1.
;                  views4_callers picks which viewCount call sites get 4 views: init (per-view
;                  storage only), draw (the depth/velocity/flags and lighting loops render 4 views),
;                  all, or hex call-site RVAs, e.g. init,draw,0x1db880a.
;                  views4_show_copies=1 shows views 2-3 in the headset instead of 0-1.
;                  With "cameras", views4_compose=1 blends the focus views (focus_percent of each eye,
;                  centred) into the outer views at the headset's native size: quad views. Focus
;                  pixel density = eye_scale / focus_percent of native.
;                  More per-view loops for the focus views (views4_callers tokens): consts (per-view
;                  constants after lighting), fog, lens, final, oitpass (the sun-shadow mask; without it the
;                  focus views get no direct sunlight).
;                  views4_focus_eye_camera=1 (diagnostic): the focus views render the eyes' own
;                  cameras, so the captures' quarters 2/3 should match 0/1; any brightness gap then
;                  comes from the view index, not the focus projection.
;                  fogfold (diagnostic token): keeps fog's 4-view volumetrics but the lighting
;                  passes of views 2/3 read the eyes' volumetric resources.
;                  views4_borrow=6b8,6bc (diagnostic, hex): lighting-pass dwords views 2/3 copy from
;                  their eye's pass (texture indices; bisect which one darkens the focus views).
;                  pass_census=1 (diagnostic): logs, over frames 1500-1509, each pipeline state's draws
;                  per quarter of the four-view target and its compute dispatches (probe/pass_census.h).
;                  views4_mask=0 (default when composing) gives ACE an empty hidden-area mesh, so the
;                  focus views have no black lens-mask corners.
;                  Use eye_scale=50 or lower (the target is 4 eyes wide). Not for driving.
[experiment]
mode=off
focus_percent=35
; b_focus=1        with mode=two_loops: frame B renders the focus box (shown, with black around it)
;                  while frame A renders the full view, so DLSS/TAA history alternates between them.
; eye_scale=50     scales the eye resolution ACE is offered (percent, 25..200; above 100 supersamples).
;                  In mode=quad this is the outer resolution; inner = eye_scale / focus_percent.
b_focus=0
; probes=0         turns off the log-only engine probes and D3D12 trace (the launcher always does).
probes=1
eye_scale=100
views4_callers=init

[quad]
; blend band between the focus box and the outer view, percent of the box (0..50)
feather_percent=10
; debug_border=1   draws a thin green outline round the focus box, to see where it is. In
;                  mode=views4 it outlines the focus cameras' region on the outer views.
debug_border=0
; debug_border_color=magenta   views4 outline colour (green or magenta)
debug_border_color=green
; gaze=1           the focus box follows eye tracking (XR_EXT_eye_gaze_interaction); 0 = fixed straight ahead.
;                  Turn ACE's own in-game foveated rendering off: this replaces it.
gaze=1
; capture_every_s=15  debug: every 15 s (up to 8 times) saves the left eye of frame A, frame B and the
;                  composed output as PNGs in logs/captures. Each capture causes a short hitch. 0 = off.
capture_every_s=0
