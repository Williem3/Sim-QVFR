; ace-quadview experiment switch, read when Assetto Corsa EVO starts. While it runs, the foveation keys
; (focus_percent, focus_height_percent, [quad] feather_percent, corner_radius_percent, debug_border,
; debug_border_color, gaze) reload within a quarter second of saving; the rest apply at the next start.
;
; mode=off         log-only probes, rendering unchanged (default)
; mode=focus_only  ACE renders only a centred focus box at full eye-buffer resolution; the headset
;                  shows that sharp window with black around it. Proves the layer steers ACE's
;                  eye cameras. Not for driving.
; mode=double_render  ACE renders every frame twice inside one frame. CRASHES ACE (GPU device
;                  removed, round 6); kept only to reproduce that result.
; mode=two_loops   ACE runs two complete frames per headset frame (same view both times); only the
;                  second is shown. Needs VectorXR (or any frame generation) off for ACE.
; mode=quad        the quad pipeline: frame A renders the full view, frame B the focus box
;                  (focus_percent of the FOV, centred straight ahead), both at ACE's eye size
;                  (eye_scale of native). The layer blends B into A at the headset's native size
;                  and submits that. Focus pixel density = eye_scale / focus_percent of native,
;                  e.g. eye_scale=50, focus_percent=35 -> outer 0.50x, focus 1.43x.
;                  Needs VectorXR (or any frame generation) off for ACE.
; mode=views3      single-frame quad views, step 1: ACE's renderer runs its 3-view mode (normally
;                  triple screens) in VR. Logs the view mode, per-view storage and, with probes=1,
;                  every render-target bind and viewport. The third view's camera is unknown: the
;                  image may be wrong or ACE may crash. Not for driving.
; mode=views4      single-frame quad views, stage gate: ACE renders 4 views per VR frame (views 2-3
;                  copy the two eyes) into a target four eyes wide; the headset shows views 0-1.
;                  views4_callers picks which viewCount call sites get 4 views: init (per-view
;                  storage only), draw (the depth/velocity/flags and lighting loops render 4 views),
;                  all, or hex call-site RVAs, e.g. init,draw,0x1db880a.
;                  views4_show_copies=1 shows views 2-3 in the headset instead of 0-1.
;                  With "cameras", views4_compose=1 blends the focus views (focus_percent of each eye,
;                  centred) into the outer views at the headset's native size: quad views. Focus
;                  pixel density = eye_scale / focus_percent of native.
;                  More per-view loops for the focus views (views4_callers tokens): consts (per-view
;                  constants after lighting), fog, lens, final, oitpass (the sun-shadow mask; without it the
;                  focus views get no direct sunlight), dlss (one DLSS feature per view; without it, with
;                  final, ACE skips DLSS and the views come out scrambled at its 2/3 render size).
;                  views4_focus_eye_camera=1 (diagnostic): the focus views render the eyes' own
;                  cameras, so the captures' quarters 2/3 should match 0/1; any brightness gap then
;                  comes from the view index, not the focus projection.
;                  fogfold (diagnostic token): keeps fog's 4-view volumetrics but the lighting
;                  passes of views 2/3 read the eyes' volumetric resources.
;                  views4_borrow=6b8,6bc (diagnostic, hex): lighting-pass dwords views 2/3 copy from
;                  their eye's pass (texture indices; bisect which one darkens the focus views).
;                  pass_census=1 (diagnostic): logs, over frames 1500-1509 (pass_census_frame=N starts at
;                  frame N instead, e.g. 9000 for ~100 s in at 90 fps: in a race), each pipeline state's draws
;                  per quarter of the four-view target and its compute dispatches (probe/pass_census.h).
;                  It also logs each quarter's recording cost: direct draws, indirect batches, pipeline
;                  changes and the CPU time between consecutive draws. pass_census_watch=<pipeline
;                  names, comma-separated; a trailing * matches a prefix, e.g. material_pipeline_id:*>
;                  logs the call stacks of those pipelines' first draws, each distinct stack once.
;                  With views4 the log also has 'views4 cpu:' lines every 900 frames (xrEndFrame,
;                  xrLocateViews and the composition: layer and below-layer time; fill_focus_cameras).
;                  gpu_frame_timing=1 (diagnostic): D3D12 timestamps on ACE's queue time each frame's GPU
;                  work (xrBeginFrame to eye-image release, an upper bound) and the composition, as
;                  'views4 gpu:' lines next to the 'views4 cpu:' ones.
;                  views4_focus_cull=1 (needs "cameras"; experimental, nothing is skipped yet): the
;                  focus views are to skip draws outside their own frustum. For now it only builds
;                  each frame's focus frusta; the draw-loop hook comes after the measurement run.
;                  views4_focus_cull_margin_percent=25 widens the cull box beyond the focus box and
;                  its feather band (percent of the focus extent), for gaze latency and history.
;                  views4_mask=0 (default when composing) gives ACE an empty hidden-area mesh, so the
;                  focus views have no black lens-mask corners.
;                  Resolution (views4): three independent knobs. periphery_scale=40 renders the outer
;                  (full-FOV) views at 40% of the headset's native eye size (percent, 10..200).
;                  focus_height_percent sets the box's height separately (default: focus_percent,
;                  which then is the width).
;                  focus_density=100 renders the focus views at 100% of native pixel density (percent,
;                  25..400). focus_percent sizes the box. Changing one leaves the other two alone: a
;                  bigger box keeps its sharpness and costs more pixels, a sharper periphery leaves the
;                  focus views as they are. Unset, both follow eye_scale (periphery = eye_scale, focus
;                  density = eye_scale / focus_percent: the old equal quarters).
;                  ACE's target is 2 x (periphery_scale + focus_density x focus_percent) native eyes wide
;                  and must stay within the runtime's 8192 px: on a 4036-wide headset keep
;                  periphery_scale + focus_density x focus_percent under about 1.0 (e.g. 40 + 100 x 0.31).
;                  Not for driving.
[experiment]
mode=views4
views4_callers=init,draw,tiles,slots,cameras,fog,consts,final,oitpass,dlss
views4_show_copies=0
views4_compose=1
; pix_capture_frame=N (diagnostic): PIX GPU capture of xrEndFrame N..N+2 into logs\pix (needs PIX installed).
pix_capture_frame=0
; d3d12_debug=1 enables the D3D12 debug layer, 2 adds GPU-based validation (very slow). dred=1 records
; DRED breadcrumbs so a GPU hang names its last pass; it costs GPU and CPU time on every command list,
; so it is off unless a crash is being diagnosed.
d3d12_debug=0
dred=0
focus_percent=31
; b_focus=1        with mode=two_loops: frame B renders the focus box (shown, with black around it)
;                  while frame A renders the full view, so DLSS/TAA history alternates between them.
; eye_scale=50     scales the eye resolution ACE is offered (percent, 10..200; above 100 supersamples).
;                  In mode=quad this is the outer resolution; inner = eye_scale / focus_percent.
;                  In mode=views4 periphery_scale and focus_density (above) replace it when set.
b_focus=0
; probes=0         turns off the log-only engine probes and D3D12 trace (the launcher always does).
probes=0
; batch_watch=0    turns off the log-only watch on ACE's instance visibility batch (lines "batch: ...").
eye_scale=40

[quad]
; blend band between the focus box and the outer view, percent of the box (0..50)
feather_percent=20
; corner_radius_percent=0  rounds the focus box's corners: radius as a percent of half its shorter side
;                  (0 = square, 100 = fully round ends). Only the blend shape changes, not the rendering cost.
corner_radius_percent=0
; debug_border=1   draws a thin green outline round the focus box, to see where it is. In
;                  mode=views4 it outlines the focus cameras' region on the outer views.
debug_border=0
; debug_border_color=magenta   outline colour: green, magenta or teal (both modes)
debug_border_color=magenta
; gaze=1           the focus box follows eye tracking (XR_EXT_eye_gaze_interaction); 0 = fixed straight ahead.
;                  Turn ACE's own in-game foveated rendering off: this replaces it.
gaze=1
; capture_every_s=15  debug: every 15 s (up to 8 times) saves the left eye of frame A, frame B and the
;                  composed output as PNGs in logs/captures. Each capture causes a short hitch. 0 = off.
capture_every_s=0

[launcher]
; Read by ace-quadview-launcher.exe only (the layer ignores it).
; game_dir=        folder holding AssettoCorsaEVO.exe; empty = found through Steam
; off_layers=      comma-separated OpenXR layer names to turn off for ACE, e.g. XR_APILAYER_MBUCCHIA_toolkit.
;                  Every other enabled implicit layer that can be switched off per launch is loaded below
;                  ace-quadview (so it cannot change what ACE renders behind the layer's back).
game_dir=
off_layers=
