; ace-quadview experiment switch, read when Assetto Corsa EVO starts. While it runs, the foveation keys
; (focus_percent, focus_height_percent, [quad] feather_percent, corner_radius_percent, focus_shape and its
; corners, debug_border, debug_border_color, gaze) reload within a quarter second of saving; the rest apply at the next start.
;
; mode=off         log-only probes, rendering unchanged (default)
; mode=focus_only  ACE renders only a centred focus box at full eye-buffer resolution; the headset
;                  shows that sharp window with black around it. Proves the layer steers ACE's
;                  eye cameras. Not for driving.
; mode=double_render  ACE renders every frame twice inside one frame. CRASHES ACE (GPU device
;                  removed, round 6); kept only to reproduce that result.
; mode=two_loops   ACE runs two complete frames per headset frame (same view both times); only the
;                  second is shown. Needs VectorXR (or any frame generation) off for ACE.
; mode=quad        LEGACY (Two-loop; the launcher no longer offers it, use views4 / QVFR). Still runs:
;                  the quad pipeline: frame A renders the full view, frame B the focus box
;                  (focus_percent of the FOV, centred straight ahead), both at ACE's eye size
;                  (eye_scale of native). The layer blends B into A at the headset's native size
;                  and submits that. Focus pixel density = eye_scale / focus_percent of native,
;                  e.g. eye_scale=50, focus_percent=35 -> outer 0.50x, focus 1.43x.
;                  Needs VectorXR (or any frame generation) off for ACE.
; mode=views3      single-frame quad views, step 1: ACE's renderer runs its 3-view mode (normally
;                  triple screens) in VR. Logs the view mode, per-view storage and, with probes=1,
;                  every render-target bind and viewport. The third view's camera is unknown: the
;                  image may be wrong or ACE may crash. Not for driving.
; mode=views4      single-frame quad views, stage gate: ACE renders 4 views per VR frame (views 2-3
;                  copy the two eyes) into a target four eyes wide; the headset shows views 0-1.
;                  views4_callers picks which viewCount call sites get 4 views: init (per-view
;                  storage only), draw (the depth/velocity/flags and lighting loops render 4 views),
;                  all, or hex call-site RVAs, e.g. init,draw,0x1db880a.
;                  views4_show_copies=1 shows views 2-3 in the headset instead of 0-1.
;                  With "cameras", views4_compose=1 blends the focus views (focus_percent of each eye,
;                  centred) into the outer views at the headset's native size: quad views. Focus
;                  pixel density = eye_scale / focus_percent of native.
;                  More per-view loops for the focus views (views4_callers tokens): consts (per-view
;                  constants after lighting), fog, lens, final, oitpass (the sun-shadow mask; without it the
;                  focus views get no direct sunlight), dlss (one DLSS feature per view; without it, with
;                  final, ACE skips DLSS and the views come out scrambled at its 2/3 render size).
;                  views4_focus_eye_camera=1 (diagnostic): the focus views render the eyes' own
;                  cameras, so the captures' quarters 2/3 should match 0/1; any brightness gap then
;                  comes from the view index, not the focus projection.
;                  fogfold (diagnostic token): keeps fog's 4-view volumetrics but the lighting
;                  passes of views 2/3 read the eyes' volumetric resources.
;                  views4_borrow=6b8,6bc (diagnostic, hex): lighting-pass dwords views 2/3 copy from
;                  their eye's pass (texture indices; bisect which one darkens the focus views).
;                  pass_census=1 (diagnostic): logs, over frames 1500-1509 (pass_census_frame=N starts at
;                  frame N instead, e.g. 9000 for ~100 s in at 90 fps: in a race), each pipeline state's draws
;                  per quarter of the four-view target and its compute dispatches (probe/pass_census.h).
;                  It also logs each quarter's recording cost: direct draws, indirect batches, pipeline
;                  changes and the CPU time between consecutive draws. pass_census_watch=<pipeline
;                  names, comma-separated; a trailing * matches a prefix, e.g. material_pipeline_id:*>
;                  logs the call stacks of those pipelines' first draws, each distinct stack once.
;                  With views4 the log also has 'views4 cpu:' lines every 900 frames (xrEndFrame,
;                  xrLocateViews and the composition: layer and below-layer time; fill_focus_cameras), and
;                  'views4 pacing:' lines: the display period, ACE's frame interval (p50, p90, max, fps),
;                  its time in xrWaitFrame and outside it, and how many frames took 1, 2, 3 or 4+
;                  display periods (a frame that misses its slot waits a whole extra period).
;                  gpu_frame_timing=1 (diagnostic): D3D12 timestamps on ACE's queue time each frame's GPU
;                  work (xrBeginFrame to eye-image release, an upper bound) and the composition (with the
;                  helmet's layer), as 'views4 gpu:' lines next to the 'views4 cpu:' ones. The performance
;                  overlay ([osd]) turns the timestamps on too, and the lines are logged with it on.
;                  Next to them, 'views4 threads:' lines list ACE's busy threads by name, each as a share of ONE
;                  core: a thread near 100% limits the frame however idle the other cores are (Task Manager's
;                  total CPU can read 15% then). Any mode with views4.
;                  cpu_profile=1 (diagnostic; the launcher's Diagnostics pane has the switch): Ctrl+Alt+C (while ACE has
;                  focus) samples ACE's busiest threads
;                  (the render thread, GameThread and Physics, and cpu_profile_threads=4 more) every 2 ms for
;                  cpu_profile_seconds=20,
;                  and writes logs\cpu-profile-<time>.txt: per thread its load and the functions that use its CPU
;                  time, by self time (where it ran) and total time (with what they called), by module too.
;                  measure=1 writes these reports in any mode (they are always on in views4).
;                  baseline=1 runs as mode=off whatever mode says (the launcher writes its own mode at each
;                  launch), with measure on: ACE's own two views, to compare what the four views cost the CPU.
;                  cpu_profile_frame=N also starts one at frame N (e.g. 9000: ~100 s in at 90 fps). Each sample
;                  pauses a thread for a few tens of microseconds, so frame times dip a little while it runs.
;                  views4_focus_cull=1 (needs "cameras"; experimental, nothing is skipped yet): the
;                  focus views are to skip draws outside their own frustum. For now it only builds
;                  each frame's focus frusta; the draw-loop hook comes after the measurement run.
;                  views4_focus_cull_margin_percent=25 widens the cull box beyond the focus box and
;                  its feather band (percent of the focus extent), for gaze latency and history.
;                  views4_mask=0 (default when composing) gives ACE an empty hidden-area mesh, so the
;                  focus views have no black lens-mask corners.
;                  Resolution (views4): three independent knobs. periphery_scale=40 renders the outer
;                  (full-FOV) views at 40% of the headset's native eye size (percent, 10..200).
;                  focus_height_percent sets the box's height separately (default: focus_percent,
;                  which then is the width).
;                  focus_density=100 renders the focus views at 100% of native pixel density (percent,
;                  25..400). focus_percent sizes the box. Changing one leaves the other two alone: a
;                  bigger box keeps its sharpness and costs more pixels, a sharper periphery leaves the
;                  focus views as they are. Unset, both follow eye_scale (periphery = eye_scale, focus
;                  density = eye_scale / focus_percent: the old equal quarters).
;                  ACE's target is 2 x (periphery_scale + focus_density x focus_percent) native eyes wide
;                  and must stay within the runtime's 8192 px: on a 4036-wide headset keep
;                  periphery_scale + focus_density x focus_percent under about 1.0 (e.g. 40 + 100 x 0.31).
;                  Live, periphery_scale and focus_density resize the views up to their launch sizes, with
;                  ACE's DLSS on too: views4_dlss_live=1 (the default) renders the views at the live sizes and
;                  DLSS upscales them into its output, which keeps the launch layout (DLSS dynamic resolution:
;                  a smaller input to the same output). Passes on a target of the output's size take the
;                  output layout; the log's 'views4 dlss-live:' lines say which layout each target got.
;                  Not with DLAA (render and output the same size: the views keep their launch sizes).
;                  views4_dlss_live=0: with DLSS the views keep their launch sizes until the next launch.
;                  Not for driving.
[experiment]
mode=views4
views4_callers=init,draw,tiles,slots,cameras,fog,consts,final,oitpass,dlss
views4_show_copies=0
views4_compose=1
views4_dlss_live=1
; pix_capture_frame=N (diagnostic): PIX GPU capture of xrEndFrame N..N+2 into logs\pix (needs PIX installed).
pix_capture_frame=0
; d3d11_capture_frame=N (diagnostic, D3D11 games such as ACC): from xrEndFrame N, each swapchain's image once
;                  as PNG in logs\captures (what the game submitted, next to the rects in the log).
d3d11_capture_frame=0
; acc_ssr_share=0, acc_ao_share=0 (ACC): each focus view computes its own screen-space reflections, ambient
;                  occlusion, instead of taking its eye's (which shows as a rim round the focus area and a box
;                  of another brightness; src/games/acc/view_share.h). Default 1.
acc_ssr_share=1
acc_ao_share=1
; d3d12_debug=1 enables the D3D12 debug layer, 2 adds GPU-based validation (very slow). dred=1 records
; DRED breadcrumbs so a GPU hang names its last pass; it costs GPU and CPU time on every command list,
; so it is off unless a crash is being diagnosed.
d3d12_debug=0
dred=0
focus_percent=31
; b_focus=1        with mode=two_loops: frame B renders the focus box (shown, with black around it)
;                  while frame A renders the full view, so DLSS/TAA history alternates between them.
; eye_scale=50     scales the eye resolution ACE is offered (percent, 10..200; above 100 supersamples).
;                  In mode=quad this is the outer resolution; inner = eye_scale / focus_percent.
;                  In mode=views4 periphery_scale and focus_density (above) replace it when set.
b_focus=0
; probes=0         turns off the log-only engine probes and D3D12 trace (the launcher always does).
probes=0
; batch_watch=0    turns off the log-only watch on ACE's instance visibility batch (lines "batch: ...").
; hang_watch_s=30  if ACE sends no frame this many seconds after xrCreateSession, logs the loaded modules
;                  and writes logs\hang-<time>.dmp (every thread's stack). 0 = off.
eye_scale=40

[quad]
; blend band between the focus box and the outer view, percent of the box (0..50)
feather_percent=20
; corner_radius_percent=0  rounds the focus box's corners: radius as a percent of half its shorter side
;                  (0 = square, 100 = fully round ends). Only the blend shape changes, not the rendering cost.
corner_radius_percent=0
; focus_shape=box  box: the rectangle above (rounded by corner_radius_percent). corners: each corner of the focus
;                  area moves in on its own (corner_radius_percent is not used), e.g. a trapezoid with the top
;                  corners pulled in: more of the dash and the near road sharp, less of the far field, for fixed
;                  foveation (with fixed_offset_y below). The focus views still render the whole box, so only
;                  what is sharp changes, not the cost. Reloads live; the headset menu's Focus shape page sets it.
; shape_top_left_in=0, shape_top_left_down=0 ... shape_bottom_right_up=0  each corner's move toward the middle,
;                  percent of the box's width (in) or height (down for the top corners, up for the bottom), 0..45.
focus_shape=box
shape_top_left_in=0
shape_top_left_down=0
shape_top_right_in=0
shape_top_right_down=0
shape_bottom_right_in=0
shape_bottom_right_up=0
shape_bottom_left_in=0
shape_bottom_left_up=0
; debug_border=1   draws a thin green outline round the focus box, to see where it is. In
;                  mode=views4 it outlines the focus cameras' region on the outer views.
debug_border=0
; debug_border_color=magenta   outline colour: green, magenta or teal (both modes)
debug_border_color=magenta
; gaze=1           the focus box follows eye tracking (XR_EXT_eye_gaze_interaction); 0 = fixed straight ahead.
;                  Turn ACE's own in-game foveated rendering off: this replaces it.
gaze=1
; gaze_thread=1    the gaze is looked up on the layer's own thread, gaze_poll_hz=250 times a second, and ACE's
;                  xrLocateViews only reads the latest (a lookup took ~1.5 ms of ACE's render thread every frame
;                  on the Pimax runtime). The log's 'gaze thread:' lines give the lookups' time. 0 = looked up
;                  inside xrLocateViews, as before. Needs ACE to sync actions (it does); else as 0.
gaze_thread=1
gaze_poll_hz=250
; gaze_deadzone=1.5  degrees (0..5): the focus box holds still while the gaze stays this close to where it aims,
;                  and jumps to the gaze when it moves further. Eye trackers jitter a little even on a steady
;                  gaze; turning the focus cameras with it made the box shimmer with MSAA (DLSS smoothed it
;                  over). 0 = follow every sample, as before. Reloads live.
gaze_deadzone=1.5
; fixed_offset_y=0  moves the focus box up (+) or down (-), degrees (-20..20), while it is fixed (gaze=0, or eye
;                  tracking lost): what stays sharp without eye tracking, e.g. -8 toward the road and the dash.
; gaze_offset_y=0   the same, added to a tracked gaze: for an eye tracker that reads high or low.
;                  Both reload live; each mode keeps its own value.
fixed_offset_y=0
gaze_offset_y=0
; capture_every_s=15  debug: every 15 s (up to 8 times) saves the left eye of frame A, frame B and the
;                  composed output as PNGs in logs/captures. Each capture causes a short hitch. 0 = off.
capture_every_s=0

[crop]
; Field-of-view crop (mode=views4 only; reloads live, and the headset menu's View crop page sets it).
; The view crops at once; the outer views' pixels follow live only without DLSS and up to their launch
; size (with DLSS on, or less crop than at launch, at the next launch). Each eye's FOV loses these shares
; of its tangent extent before ACE sees it, so ACE never renders what a helmet (for example a helmet mod's
; visor) covers; the headset shows black there. The outer views shrink with the crop and keep their pixel
; density (periphery_scale), and the focus box keeps its size (focus_percent is of the uncropped eye).
; The four sides are independent, percent 0..40 each:
; top, bottom      of the eye's height.
; outer            the temple side (left for the left eye, right for the right eye); inner the nose side.
; Pixels saved in the outer views: 1 - (100 - top - bottom)/100 x (100 - outer - inner)/100,
; e.g. top=15 bottom=5 outer=10 -> 80% x 90% = 72% of the pixels.
enabled=0
top=0
bottom=0
outer=0
inner=0

[helmet]
; Helmet overlay (mode=views4 with views4_compose=1; reloads live, and the headset menu's Helmet page
; sets it). Your images are drawn into a head-locked layer of their own, which the headset composites over
; the scene after any frame generation: the scene keeps the FOV ACE rendered, so frame generation's depth and
; motion still match it. Lit by the frame: each side of the eye takes the light of the rendered image along it (its
; bright parts count most), smoothed over about half a second.
; enabled=0        1 draws it.
; light=70         how much the frame lights it, percent (0: the images as drawn / a fixed dim grey).
; Your own helmet: three PNGs with alpha, each one picture of the whole face from inside the helmet (the
; same size), relative to the layer's folder. A missing file is left out; with none, the built-in look.
; top_image=helmet\top.png        the brow, drawn last (over everything).
; bottom_image=helmet\bottom.png  the chin bar.
; visor_image=helmet\visor.png    the visor, drawn first, so it slides up behind the brow.
; size=110         the images' width in degrees of view (40..160); they are fixed to the head, and each eye
;                  looks through them in its own direction. Their edges extend outward.
; height=0         their centre, degrees above straight ahead (-30..30).
; depth=0          how far in front of your eyes they sit, cm (3..150): each eye looks at them from its own
;                  position (your headset's eye spacing), so nearer gives them more stereo depth, like a real
;                  visor a few cm away. 0 = far (10 m: no depth to speak of). Size stays the angle they cover.
; detail=0         the helmet layer's resolution: 0 performance (2048 x 2048, a quarter of the GPU work and
;                  memory), 1 detail (4096 x 4096, sharper). Either way only the bands the pieces draw on are
;                  rendered and composited: with the visor open, the clear middle of the view costs nothing
;                  (the log says how much: "helmet: layer drawn and submitted over ..."). Applies live.
; visor=closed     closed (as drawn), half or open; it slides there in 0.3 s. Its hotkey ([hotkeys] visor, Ctrl+Alt+V) steps it.
; visor_travel=40  how far open slides the visor up, percent of the image's height (half: half of it).
; visor_blend=auto tint: the visor is glass, the scene filtered by its colour (white clear, a dark strip
;                  tints like sunglasses; its brightest 1% counts as clear), with a faint reflection of the
;                  frame's light. alpha: blended as drawn, by its transparency. auto: tint when the image has
;                  no transparency. Above and below its image there is no visor.
; The log suggests the [crop] top and bottom that meet the images' opening ("helmet: pieces at size ...").
; Built in (no images): the [crop] rectangle with rounded corners as the visor opening; its padded lip
; reaches into the rendered view, and beyond the crop is black.
; rim=6            how far the padded lip reaches into the rendered view, percent of the eye's height (0..20).
; corners=40       the opening's corner radius, percent of half its shorter side (0..100).
; debug_light=0    1 shows the frame's light itself where the helmet is, to check it follows the scene
;                  (brighter under a bright sky, darker in a tunnel), in the pieces' shapes when they are
;                  loaded; the headset menu's Show helmet light. Off, the pieces are lit by it.
enabled=0
light=70
top_image=helmet\top.png
bottom_image=helmet\bottom.png
visor_image=helmet\visor.png
size=110
height=0
depth=0
detail=0
visor=closed
visor_travel=40
visor_blend=auto
rim=6
corners=40
debug_light=0

[cheeky]
; Experimental: Cheeky Foveated DLSS run by the layer (no Cheeky dxgi.dll loader in the game folder).
; enabled=1        loads Cheeky's CheekyFoveatedDLSSRuntime.dll (GPL v3; from a Cheeky release or build)
;                  at OpenXR start and hands it ACE's D3D12 device each frame. Remove Cheeky's
;                  dxgi.dll/version.dll loader from the game folder first: a second Cheeky is refused.
; config_dir=      Cheeky's settings (CheekyFoveatedDLSS.ini) and log, relative to the layer's folder.
;                  Default CheekyFoveatedDLSS.
; runtime=         the runtime DLL, relative to the layer's folder. Default <config_dir>\CheekyFoveatedDLSSRuntime.dll.
; report_s=10      every N seconds logs each DLSS view Cheeky sees (sizes, evaluations per frame) and
;                  writes logs\cheeky-snapshot.json. 0 = off.
; Cheeky's settings the layer applies at start and live (the launcher's Foveated DLSS pane and the
; headset menu's second page set them); in QVFR it also sets Cheeky's quad view roles.
; processing=1     Cheeky's processing (Enabled); 0 leaves ACE's own DLSS on every view.
; outer_dlaa=1     the outer views get Cheeky's own cheaper DLAA pass (PeripheralDlaa).
; outer_scale=75   that pass's resolution, percent of ACE's render size (20..100).
; outer_preset=5   its DLSS preset: 5 E, 10 J, 11 K, 12 L, 13 M.
; focus_preset=0   the focus views' preset: 0 the game's, or as outer_preset.
; Experimental, the focus views only:
; center_supersampling=100  their DLSS above their size, percent (100..200), for sharpness at a GPU cost.
; fix_motion_blur=0         Cheeky's workaround for smearing with some presets (FixMotionBlur).
; nr=0             NVIDIA's DLSS-NR (DLSS 5); needs nvngx_dlssnr.dll next to the game.
; nr_preset=0      0 Default, 1 A (Original), 2 B (Faster; NR 310.9.16 or newer).
; nr_passes=1      1..3 NR passes; each extra one costs about one more NR evaluation.
; Frame generation (experimental): Cheeky's DLSS-G between ACE's frames, guided by the outer views' depth
; and motion; a centre region at full quality, warped around it. Turn OpenXR Toolkit's Turbo mode and
; other frame generation (VectorXR's) off.
; fg=0             on/off.
; fg_multiplier=2  2..4 (one to three generated frames per ACE frame).
; fg_size=30       the centre region, percent of each eye (10..100).
; fg_scale=50      its FG resolution: 25, 50, 75 or 100 percent. fg_periphery=50 the periphery's.
; fg_border=0      outlines the centre region (it follows the eyes with an eye-tracked focus).
; fg_release=8     when Cheeky lets ACE start its next frame (its FgReleasePoint; live): 5 never held (ACE's CPU
;                  and the GPU overlap: the most frames, about a frame more latency), 8 once the GPU has captured
;                  the previous frame (they take turns: ACE ran 43-44 of 45 fps where the GPU had room), 3 once the
;                  generated frame is submitted (Cheeky's default: tightest pacing, fewest frames). The log's
;                  'views4 pacing:' lines show each one's frame rate; 'cheeky: settings applied' marks a switch.
; Needs Cheeky's OpenXR layer (CheekyOpenXRSetup.exe from Cheeky's release) for its quad view tracking.
enabled=0
processing=1
outer_dlaa=1
outer_scale=75
outer_preset=5
focus_preset=0
center_supersampling=100
fix_motion_blur=0
nr=0
nr_preset=0
nr_passes=1
fg=0
fg_multiplier=2
fg_size=30
fg_scale=50
fg_periphery=50
fg_border=0
fg_release=8

[osd]
; The performance overlay: a card in the headset view with ACE's frame rate and pacing (a
; graph of the recent frame times against the frame budget), its CPU and GPU time with their headroom
; and which one limits the frame, the frame time's p90 and 1% low, the GPU's time by who used it, ACE's
; busiest thread, the render thread's busy and blocked time, VRAM, frame generation and eye tracking.
; Reloads live; its hotkey ([hotkeys] overlay, Ctrl+Alt+P) turns it on and off, and the headset menu's Overlay and
; menu page turns it on and off and moves it. With frame generation the budget is the headset's refresh
; period (from Cheeky) times its multiplier; Cheeky's layer already gives ACE that multiplied period.
; GPU (QVFR): the whole GPU, from Windows' GPU engine counters (as Task Manager): its busiest 3D or compute
;                  engine, every process (the runtime's compositor and frame generation too), times the
;                  frame time. Split into ACE's queue (D3D12 timestamps, an upper bound), frame generation
;                  (Cheeky's own time), the layer's composition and the rest (mostly the compositor).
; CPU: the longer of the render thread's work (from xrWaitFrame's return to xrEndFrame: busy, and blocked
;                  on ACE's other threads or the GPU) and ACE's busiest thread's share of a core over the frame.
; Limited by: GPU at 95% busy; CPU with a thread at a full core, or frames over budget with ACE barely
;                  held in xrWaitFrame; Pacing when frames are over budget with neither, or ACE is held in
;                  xrWaitFrame and still more than 1% past its budget (the runtime or frame generation sets its
;                  pace); else Neither. Late: frames more than 5% over budget. The GPU's and the threads' load are
;                  averaged over the card's half second.
; The log has the same as a 'views4 load:' line every 900 frames.
; enabled=0        1 shows it.
; yaw=0, pitch=18 where it floats: degrees right of straight ahead and above eye level (-35..35, -30..30),
;                  0.8 m in front of your head, as the settings menu's [menu] yaw and pitch.
; width=26         its width in degrees of the view (12..45).
enabled=0
yaw=0
pitch=18
width=26

[menu]
; The headset settings menu (the launcher's Headset menu pane sets these; reloads live).
; yaw=0, pitch=-4  where it floats: degrees right of straight ahead and above eye level (-35..35, -30..30).
; width=33         its width in degrees of the view (20..60).
; hotkey_footer=1  a line under the menu with the in-game hotkeys ([hotkeys]) and their wheel buttons; 0 hides it.

[hotkeys]
; The layer's hotkeys (the launcher's Hotkeys pane sets them; reloads live): for each action a keyboard
; combination, held while ACE has focus, and a wheel, button box or controller button (DirectInput), read
; whenever the game runs. A wheel's menu directions act only while the menu shows: menu_toggle opens it.
; Keys: Ctrl+, Alt+ and Shift+ before a key name (A..Z, 0..9, F1..F24, Up, Down, Left, Right, Home, End,
; Page Up, Page Down, Insert, Delete, Space, Num 0..Num 9, ...), exactly those modifiers; empty: none.
; Wheel buttons (<action>_pad): device:control:name, the device as its USB vendor_product (hex), the
; control as button1..button128 (numbered as Windows' controller panel shows them) or hat1up..hat4left,
; e.g. 1234_ABCD:button13:My Wheel (the pane writes the real one); empty: none.
; menu_toggle=      opens or closes the headset menu (none by default: a menu key's first press opens it)
; menu_up=Ctrl+Alt+Up, menu_down=Ctrl+Alt+Down, menu_left=Ctrl+Alt+Left, menu_right=Ctrl+Alt+Right
;                   the menu: select a line, lower or raise its value
; overlay=Ctrl+Alt+P the performance overlay on or off ([osd])
; visor=Ctrl+Alt+V   steps the helmet's visor ([helmet])
; cpu_capture=Ctrl+Alt+C records a CPU capture (with cpu_profile=1)

[profiles]
; The profile last used (the launcher's Profiles pane, or the headset menu's Profile line): a preset
; (Performance, Balanced, Quality) or one saved in the profiles folder next to this ini. Shown as changed once
; a setting differs from it. Empty: none.
current=

[optimize]
; The headset menu's "Optimize for frame rate" (QVFR, last on the QVFR settings page): Right runs it while
; you drive (or stops a run), Left undoes it. It measures ACE's GPU time for a couple of seconds, picks the
; periphery, focus density and focus box that keep it just under the frame budget, applies them, measures
; again and refines, a few times over (about 10-15 s). Lowering, the periphery gives first, then the focus
; density, then the box; with headroom the focus density rises first, then the periphery, up to the launch
; size (the box never grows). When the CPU limits the frame it changes nothing: resolution won't help.
; It needs the views to resize live, as they do with ACE's DLSS on by default ([experiment] views4_dlss_live=1;
; with DLAA, or views4_dlss_live=0, DLSS holds them at their launch sizes and it does not start). The GPU time is the whole GPU's per ACE
; frame (frame generation and the compositor too); the budget is the frame period the runtime gives ACE,
; with frame generation the multiplied one. Run it on track, where the frame is as busy as racing.
; target_percent=88  the GPU time to aim for, percent of the frame budget (50..98): the rest is room for
;                  busier moments (a full grid, rain).
; min_periphery=25, min_density=80, min_focus=25  the least it lowers the periphery, the focus density and
;                  the focus box's width and height to (percent; your own lower values are kept).
target_percent=88
min_periphery=25
min_density=80
min_focus=25

[launcher]
; Read by ace-quadview-launcher.exe only (the layer ignores it).
; game_dir=        folder holding AssettoCorsaEVO.exe; empty = found through Steam
; update_check=0  1: the launcher asks GitHub for the newest release when it starts (its About pane); nothing
;                  else is sent.
; off_layers=      comma-separated OpenXR layer names to turn off for ACE, e.g. XR_APILAYER_MBUCCHIA_toolkit.
;                  Every other enabled implicit layer that can be switched off per launch is loaded below
;                  ace-quadview (so it cannot change what ACE renders behind the layer's back).
;                  The launcher's OpenXR layers pane sets these three:
; layer_order=     the layers' order below ace-quadview, nearest the game first (unlisted ones follow, in
;                  Windows' order).
; on_layers=       layers switched off in Windows to load for ACE all the same.
;                  Locked whatever these say: ace-quadview first; VectorXR off in Two-loop or with Cheeky's frame
;                  generation; Cheeky's layer on while Cheeky is enabled.
game_dir=
off_layers=
