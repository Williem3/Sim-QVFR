<!doctype html>
<html>
<head><meta charset="utf-8"><title>Checkbox preview</title>
<style>body{margin:0;background:var(--window-bg);} #root{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;}</style>
</head>
<body>
<div id="root" class="qv-root"></div>
<script>
  var Q = window.QVFR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}},h(Q.Checkbox,{label:'Show focus outline',description:'Draws a colored border around the focus region.',defaultChecked:true}),h(Q.Checkbox,{label:'Focus edge blend',description:'Cross-fades the focus and outer views across a narrow band.'}),h(Q.Checkbox,{label:'Feather',description:'Softens the edge of the focus region.',disabled:true})));
</script>
</body>
</html>
